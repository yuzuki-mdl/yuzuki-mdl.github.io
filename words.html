<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>words</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a10;overflow:hidden;font-family:ui-monospace,monospace}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
  #hint{position:fixed;left:12px;bottom:10px;color:#4a4158;font-size:.7rem;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">move to stir the words · click to scatter</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
resize();addEventListener('resize',resize);

// little pool of words. they drift, and when one leaves the edge it wraps.
const POOL=['almost','remember','soft','static','again','the','light','between','fold','drift','here','never','warm','echo','small','still','if','then','gone','slow','salt','glass','morning','forget','maybe','close','open','quiet'];
const COLORS=['#c8b6ff','#9ad1ff','#ffc2e2','#b6ffd9','#ffe6a6'];

const N=70;
const words=[];
function makeWord(){
  return {
    x:Math.random()*W, y:Math.random()*H,
    vx:(Math.random()-.5)*0.25, vy:(Math.random()-.5)*0.25,
    text:POOL[Math.floor(Math.random()*POOL.length)],
    size:11+Math.random()*10,
    col:COLORS[Math.floor(Math.random()*COLORS.length)],
    a:0.25+Math.random()*0.5,
    ox:0, oy:0 // offset from being pushed
  };
}
for(let i=0;i<N;i++)words.push(makeWord());

let mx=-9999,my=-9999;
c.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
c.addEventListener('pointerleave',()=>{mx=-9999;my=-9999;});
c.addEventListener('pointerdown',e=>{
  for(const w of words){
    const dx=w.x-e.clientX, dy=w.y-e.clientY;
    const d=Math.hypot(dx,dy)||1;
    if(d<220){const f=(220-d)/220*14; w.ox+=dx/d*f; w.oy+=dy/d*f;}
  }
});

let t=0;
function frame(){
  t+=0.01;
  ctx.fillStyle='rgba(11,10,16,0.18)';
  ctx.fillRect(0,0,W,H);

  for(const w of words){
    // gentle flow field
    const ang=Math.sin(w.x*0.004+t)*1.4+Math.cos(w.y*0.005-t*0.7)*1.4;
    w.vx+=Math.cos(ang)*0.01;
    w.vy+=Math.sin(ang)*0.01;

    // cursor repulsion
    if(mx>-9999){
      const dx=w.x-mx, dy=w.y-my, d=Math.hypot(dx,dy)||1;
      if(d<140){const f=(140-d)/140*0.6; w.vx+=dx/d*f; w.vy+=dy/d*f;}
    }
    // spring back the push offset
    w.ox*=0.9; w.oy*=0.9;

    // damping
    w.vx*=0.94; w.vy*=0.94;
    w.x+=w.vx; w.y+=w.vy;

    // wrap
    const m=40;
    if(w.x<-m)w.x=W+m; if(w.x>W+m)w.x=-m;
    if(w.y<-m)w.y=H+m; if(w.y>H+m)w.y=-m;

    // draw
    ctx.font=w.size+'px ui-monospace,monospace';
    ctx.fillStyle=w.col;
    ctx.globalAlpha=w.a;
    ctx.fillText(w.text,w.x+w.ox,w.y+w.oy);
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
