<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>slime mould maze</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #08090c; color: #cfd3dc;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 20px;
  }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin: 0; color: #8fe3b0; }
  p.sub { margin: 0; color: #5a6070; font-size: 11.5px; letter-spacing: .04em; }
  canvas { display: block; border-radius: 6px; box-shadow: 0 0 0 1px #1b1f28, 0 18px 60px -20px #000; image-rendering: pixelated; max-width: 100%; height: auto; touch-action: none; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button {
    font: inherit; font-size: 12px; padding: 7px 14px; border-radius: 6px; cursor: pointer;
    background: #12161e; color: #cfd3dc; border: 1px solid #232a36; transition: .15s;
  }
  button:hover { background: #181e29; border-color: #33405a; color: #fff; }
  button.on { background: #16241c; border-color: #2f6b46; color: #8fe3b0; }
  .stat { color: #5a6070; font-size: 11.5px; min-width: 130px; text-align: center; }
  a { color: #6f7d99; text-decoration: none; font-size: 11.5px; }
  a:hover { color: #8fe3b0; }
</style>
</head>
<body>
<h1>slime mould maze</h1>
<p class="sub">physarum agents, no brain. they find the exit anyway.</p>
<canvas id="c"></canvas>
<div class="bar">
  <button id="new">new maze</button>
  <button id="pause" class="on">pause</button>
  <span class="stat" id="stat">step 0</span>
</div>
<a href="./">&larr; back</a>

<script>
(() => {
  const CELL = 6;
  const COLS = 41, ROWS = 25;
  const WALL = 1, PATH = 0;

  const DEPOSIT = 0.02, DECAY = 0.97, FOOD = 0.6;
  const SENSOR_ANGLE = Math.PI / 4, SENSOR_DIST = 2.0;
  const TURN = Math.PI / 6, SPEED = 0.7;
  const N_AGENTS = 120;

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  cv.width = COLS * CELL;
  cv.height = ROWS * CELL;

  let grid, pher, sol, agents, stepCount, running = false, raf = null;

  // --- maze gen (recursive backtracker, matches the python one) ---
  function gen(w, h) {
    const g = Array.from({length: h}, () => new Array(w).fill(WALL));
    const stack = [[1, 1]];
    g[1][1] = PATH;
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const dirs = [[2,0],[-2,0],[0,2],[0,-2]].sort(() => Math.random() - 0.5);
      let moved = false;
      for (const [dx, dy] of dirs) {
        const nx = x + dx, ny = y + dy;
        if (nx > 0 && nx < w - 1 && ny > 0 && ny < h - 1 && g[ny][nx] === WALL) {
          g[ny][nx] = PATH;
          g[y + dy/2][x + dx/2] = PATH;
          stack.push([nx, ny]);
          moved = true;
          break;
        }
      }
      if (!moved) stack.pop();
    }
    // entrance + exit
    g[0][1] = PATH; g[1][1] = PATH;
    g[h-1][w-2] = PATH; g[h-2][w-2] = PATH;
    // connect (w-2,h-2) to maze via BFS
    const start = [w-2, h-2];
    const prev = new Map(); prev.set(start.join(','), null);
    const q = [start]; let target = null;
    while (q.length) {
      const [x, y] = q.shift();
      if (!(x === start[0] && y === start[1]) && g[y][x] === PATH) { target = [x, y]; break; }
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nx = x + dx, ny = y + dy;
        const k = nx + ',' + ny;
        if (nx > 0 && nx < w - 1 && ny > 0 && ny < h - 1 && !prev.has(k)) {
          prev.set(k, [x, y]); q.push([nx, ny]);
        }
      }
    }
    if (target) {
      let cur = target;
      while (cur) {
        g[cur[1]][cur[0]] = PATH;
        cur = prev.get(cur.join(','));
      }
    }
    return g;
  }

  function solve(g) {
    const h = g.length, w = g[0].length;
    const seen = Array.from({length: h}, () => new Array(w).fill(false));
    const prev = Array.from({length: h}, () => new Array(w).fill(null));
    const q = [[1, 1]]; seen[1][1] = true;
    const goal = [w - 2, h - 1];
    let found = false;
    while (q.length) {
      const [x, y] = q.shift();
      if (x === goal[0] && y === goal[1]) { found = true; break; }
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < w && ny >= 0 && ny < h && !seen[ny][nx] && g[ny][nx] === PATH) {
          seen[ny][nx] = true; prev[ny][nx] = [x, y]; q.push([nx, ny]);
        }
      }
    }
    const path = Array.from({length: h}, () => new Array(w).fill(false));
    if (!found) return path;
    let cur = goal;
    while (cur) { path[cur[1]][cur[0]] = true; cur = prev[cur[1]][cur[0]]; }
    return path;
  }

  function reset() {
    grid = gen(COLS, ROWS);
    sol = solve(grid);
    pher = Array.from({length: ROWS}, () => new Array(COLS).fill(0));
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (sol[y][x]) pher[y][x] = 0.05;
    agents = [];
    for (let i = 0; i < N_AGENTS; i++)
      agents.push([1, 1, Math.random() * Math.PI * 2]);
    stepCount = 0;
    draw();
  }

  function walkable(x, y) {
    const ix = Math.round(x), iy = Math.round(y);
    if (ix < 0 || ix >= COLS || iy < 0 || iy >= ROWS) return false;
    return grid[iy][ix] === PATH;
  }

  function sense(x, y, ang) {
    const sample = (a) => {
      const nx = x + Math.cos(a) * SENSOR_DIST;
      const ny = y + Math.sin(a) * SENSOR_DIST;
      const ix = Math.round(nx), iy = Math.round(ny);
      if (ix < 0 || ix >= COLS || iy < 0 || iy >= ROWS) return -1;
      if (grid[iy][ix] !== PATH) return -1;
      return pher[iy][ix];
    };
    return [sample(ang + SENSOR_ANGLE), sample(ang), sample(ang - SENSOR_ANGLE)];
  }

  function step() {
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++) {
        pher[y][x] *= DECAY;
        if (sol[y][x] && pher[y][x] < 0.08) pher[y][x] = 0.08;
      }
    pher[ROWS-1][COLS-2] = 1.0;

    for (const ag of agents) {
      let [x, y, ang] = ag;
      const [sl, sc, sr] = sense(x, y, ang);
      if (sc >= sl && sc >= sr) { /* straight */ }
      else if (sl > sr) ang += TURN;
      else if (sr > sl) ang -= TURN;
      else ang += (Math.random() * 2 - 1) * TURN;

      let nx = x + Math.cos(ang) * SPEED;
      let ny = y + Math.sin(ang) * SPEED;
      if (walkable(nx, ny)) { x = nx; y = ny; }
      else {
        for (let k = 0; k < 4; k++) {
          ang += (Math.random() * 2 - 1) * Math.PI;
          nx = x + Math.cos(ang) * SPEED;
          ny = y + Math.sin(ang) * SPEED;
          if (walkable(nx, ny)) { x = nx; y = ny; break; }
        }
      }
      const ix = Math.round(x), iy = Math.round(y);
      if (ix >= 0 && ix < COLS && iy >= 0 && iy < ROWS && grid[iy][ix] === PATH)
        pher[iy][ix] += DEPOSIT;
      ag[0] = x; ag[1] = y; ag[2] = ang;
    }
    stepCount++;
  }

  function draw() {
    let mx = 0;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (pher[y][x] > mx) mx = pher[y][x];
    if (mx === 0) mx = 1;

    ctx.fillStyle = '#08090c';
    ctx.fillRect(0, 0, cv.width, cv.height);

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (grid[y][x] === WALL) {
          ctx.fillStyle = '#161a22';
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        } else {
          const v = Math.min(1, pher[y][x] / mx);
          if (v > 0.02) {
            const g = Math.floor(90 + v * 165);
            const r = Math.floor(40 + v * 90);
            const b = Math.floor(70 + v * 110);
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
          }
        }
      }
    }
    // exit glow
    ctx.fillStyle = '#8fe3b0';
    ctx.fillRect((COLS-2) * CELL + 1, (ROWS-1) * CELL + 1, CELL - 2, CELL - 2);
  }

  const stat = document.getElementById('stat');
  const pauseBtn = document.getElementById('pause');

  function loop() {
    if (!running) return;
    for (let i = 0; i < 2; i++) step();
    draw();
    stat.textContent = 'step ' + stepCount;
    raf = requestAnimationFrame(loop);
  }

  document.getElementById('new').onclick = () => { reset(); };
  pauseBtn.onclick = () => {
    running = !running;
    pauseBtn.textContent = running ? 'pause' : 'play';
    pauseBtn.classList.toggle('on', running);
    if (running) loop(); else if (raf) cancelAnimationFrame(raf);
  };

  reset();
  running = true;
  pauseBtn.textContent = 'pause';
  loop();
})();
</script>
</body>
</html>
