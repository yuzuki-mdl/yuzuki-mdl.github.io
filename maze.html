", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "##", "  ", "##"]];

let grid, W, H, px, py, exitX, exitY, moves, done;
const board = document.getElementById('board');
const hud = document.getElementById('hud');

async function load() {
  grid = MAZE;
  H = grid.length; W = grid[0].length;
  px = 1; py = 1;
  exitX = W - 2; exitY = H - 2;
  moves = 0; done = false;
  render();
}

function render() {
  board.style.gridTemplateColumns = `repeat(${W}, 16px)`;
  board.innerHTML = '';
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const d = document.createElement('div');
      d.className = 'c ' + (grid[y][x] === '##' ? 'wall' : 'path');
      if (x === exitX && y === exitY) d.className = 'c exit';
      if (x === px && y === py) d.className = 'c you';
      board.appendChild(d);
    }
  }
  hud.innerHTML = done
    ? '<span class="win">made it in ' + moves + ' moves</span>'
    : 'arrows / wasd &middot; reach the <b>exit</b> &middot; ' + moves + ' moves';
}

function move(dx, dy) {
  if (done) return;
  const nx = px + dx, ny = py + dy;
  if (nx < 0 || ny < 0 || nx >= W || ny >= H) return;
  if (grid[ny][nx] === '##') return;
  px = nx; py = ny; moves++;
  if (px === exitX && py === exitY) done = true;
  render();
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') move(0, -1);
  else if (k === 'arrowdown' || k === 's') move(0, 1);
  else if (k === 'arrowleft' || k === 'a') move(-1, 0);
  else if (k === 'arrowright' || k === 'd') move(1, 0);
  else return;
  e.preventDefault();
});

load();
setInterval(() => { if (!done) {} }, 1000);
