  grid = MAZE;
  H = grid.length; W = grid[0].length;
  gridCopy = grid.map(r => r.slice());
  px = 1; py = 1;
  exitX = W - 2; exitY = H - 2;
  moves = 0; done = false; breaks = 3;
  visited = new Set(['1,1']);
  const cell = Math.max(6, Math.floor(Math.min(16, (innerWidth - 40) / W, (innerHeight - 140) / H)));
  document.documentElement.style.setProperty('--cell', cell + 'px');
  render();
}

function render() {
  board.style.gridTemplateColumns = `repeat(${W}, var(--cell,16px))`;
  board.innerHTML = '';
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const d = document.createElement('div');
      const t = grid[y][x];
      d.className = 'c ' + (t === '##' ? 'wall' : t === '::' ? 'weak' : 'path');
      if (visited.has(x + ',' + y) && !(x === px && y === py) && !(x === exitX && y === exitY)) d.classList.add('trail');
      if (x === exitX && y === exitY) d.className = 'c exit';
      if (x === px && y === py) d.className = 'c you';
      if (fogOn && Math.abs(x - px) + Math.abs(y - py) > VISION) d.classList.add('fog');
      board.appendChild(d);
    }
  }
  hud.innerHTML = done
    ? '<span class="win">made it in ' + moves + ' moves</span>'
    : 'arrows / wasd &middot; reach the <b>exit</b> &middot; ' + moves + ' moves &middot; breaks <b>' + breaks + '</b> &middot; r restarts &middot; v ' + (fogOn ? 'fog ON' : 'fog off');
}

function restart() {
  grid = gridCopy.map(r => r.slice());
  px = 1; py = 1; moves = 0; done = false; breaks = 3;
  visited = new Set(['1,1']);
  board.classList.remove('won');
  render();
}

function move(dx, dy) {
  if (done) return;
  const nx = px + dx, ny = py + dy;
  if (nx < 0 || ny < 0 || nx >= W || ny >= H) return;
  if (grid[ny][nx] === '##') return;
  if (grid[ny][nx] === '::') {
    if (breaks <= 0) return;
    grid[ny][nx] = '  '; breaks--;
  }
  px = nx; py = ny; moves++;
  visited.add(px + ',' + py);
  if (px === exitX && py === exitY) { done = true; board.classList.add('won'); }
  render();
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') move(0, -1);
  else if (k === 'arrowdown' || k === 's') move(0, 1);
  else if (k === 'arrowleft' || k === 'a') move(-1, 0);
  else if (k === 'arrowright' || k === 'd') move(1, 0);
  else if (k === 'm') { toggleMute(); e.preventDefault(); return; }
  else if (k === 'r') { restart(); e.preventDefault(); return; }
  else if (k === 'v') { fogOn = !fogOn; render(); e.preventDefault(); return; }
  else return;
  e.preventDefault();
});

// --- ambient drone (no files, pure web audio) ---
let actx, master, muted = false;
function startAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain();
  master.gain.value = 0.0;
  master.connect(actx.destination);
  // slow fade in
  master.gain.linearRampToValueAtTime(0.12, actx.currentTime + 4);

  // a soft minor pad: a few detuned sines + lowpass + slow LFO
  const filt = actx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = 700;
  filt.Q.value = 0.7;
  filt.connect(master);

  const notes = [110, 130.81, 164.81, 196, 220]; // A minor-ish
  notes.forEach((f, i) => {
    const o = actx.createOscillator();
    o.type = i % 2 ? 'triangle' : 'sine';
    o.frequency.value = f * (1 + (i - 2) * 0.0008);
    const g = actx.createGain();
    g.gain.value = 0.5 / notes.length;
    o.connect(g); g.connect(filt);
    o.start();
    // slow breathing LFO per voice
    const lfo = actx.createOscillator();
    lfo.frequency.value = 0.05 + i * 0.013;
    const lg = actx.createGain();
    lg.gain.value = 0.18 / notes.length;
    lfo.connect(lg); lg.connect(g.gain);
    lfo.start();
  });

  // faint filtered noise = air
  const buf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
  const noise = actx.createBufferSource();
  noise.buffer = buf; noise.loop = true;
  const nf = actx.createBiquadFilter();
  nf.type = 'bandpass'; nf.frequency.value = 400; nf.Q.value = 0.5;
  const ng = actx.createGain(); ng.gain.value = 0.015;
  noise.connect(nf); nf.connect(ng); ng.connect(master);
  noise.start();
}
function toggleMute() {
  if (!actx) return;
  muted = !muted;
  master.gain.cancelScheduledValues(actx.currentTime);
  master.gain.linearRampToValueAtTime(muted ? 0 : 0.12, actx.currentTime + 0.4);
}

addEventListener('keydown', () => startAudio(), { once: true });
addEventListener('pointerdown', () => startAudio(), { once: true });

load();
</script>
