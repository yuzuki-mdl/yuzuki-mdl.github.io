<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>slime mould</title>
<style>
  :root{--bg:#0a0d10;--ink:#d6e2e6;--dim:#5b6b73;--acc:#7fe0c3}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;overflow:hidden}
  #c{display:block;width:100vw;height:100vh;image-rendering:pixelated;cursor:crosshair;touch-action:none}
  #ui{position:fixed;left:12px;top:12px;background:rgba(10,13,16,.82);border:1px solid #1d262b;border-radius:10px;padding:10px 12px;backdrop-filter:blur(4px);max-width:260px}
  #ui h1{margin:0 0 8px;font-size:13px;letter-spacing:.5px;color:var(--acc);font-weight:600}
  .row{display:flex;align-items:center;gap:8px;margin:5px 0}
  .row label{flex:0 0 74px;color:var(--dim);font-size:11px}
  input[type=range]{flex:1;accent-color:var(--acc);height:3px}
  .val{flex:0 0 34px;text-align:right;font-size:11px;color:var(--ink)}
  .btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  button{background:#131a1e;color:var(--ink);border:1px solid #243038;border-radius:6px;padding:5px 9px;font:inherit;font-size:11px;cursor:pointer}
  button:hover{border-color:var(--acc);color:var(--acc)}
  button.on{background:var(--acc);color:#0a0d10;border-color:var(--acc)}
  #hint{position:fixed;right:12px;bottom:12px;color:var(--dim);font-size:11px;text-align:right;pointer-events:none}
  #fps{position:fixed;right:12px;top:12px;color:var(--dim);font-size:11px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>physarum</h1>
  <div class="row"><label>agents</label><input id="agents" type="range" min="500" max="20000" step="500" value="8000"><span class="val" id="agentsV">8000</span></div>
  <div class="row"><label>sense ang</label><input id="sa" type="range" min="0.1" max="1.6" step="0.05" value="0.6"><span class="val" id="saV">0.6</span></div>
  <div class="row"><label>sense dist</label><input id="sd" type="range" min="2" max="30" step="1" value="12"><span class="val" id="sdV">12</span></div>
  <div class="row"><label>turn</label><input id="ta" type="range" min="0.05" max="1.2" step="0.05" value="0.5"><span class="val" id="taV">0.5</span></div>
  <div class="row"><label>speed</label><input id="sp" type="range" min="0.3" max="2" step="0.1" value="1"><span class="val" id="spV">1</span></div>
  <div class="row"><label>decay</label><input id="dk" type="range" min="0.8" max="0.995" step="0.005" value="0.94"><span class="val" id="dkV">0.94</span></div>
  <div class="btns">
    <button id="pause">pause</button>
    <button id="reset">reset</button>
    <button id="clear">clear</button>
    <button id="preset">presets</button>
  </div>
</div>
<div id="fps"></div>
<div id="hint">drag to seed · space pause · r reset</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
let W=0,H=0,SCALE=2;
let trail,agents=[],running=true;
const P={n:8000,sa:0.6,sd:12,ta:0.5,sp:1,dk:0.94};
let cols,rows;

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  W=cv.width=Math.floor(innerWidth/SCALE);
  H=cv.height=Math.floor(innerHeight/SCALE);
  cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
  cols=W;rows=H;
  trail=new Float32Array(W*H);
  ctx.imageSmoothingEnabled=false;
}

function seedAgents(n){
  agents=[];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    agents.push({x:Math.random()*W,y:Math.random()*H,a});
  }
}

function sense(x,y,a){
  const step=P.sd;
  const sx=x+Math.cos(a)*step, sy=y+Math.sin(a)*step;
  let ix=Math.floor(sx),iy=Math.floor(sy);
  if(ix<0)ix+=W; if(ix>=W)ix-=W; if(iy<0)iy+=H; if(iy>=H)iy-=H;
  if(ix<0||ix>=W||iy<0||iy>=H)return 0;
  return trail[iy*W+ix];
}

function step(){
  const sp=P.sp, sa=P.sa, ta=P.ta;
  for(let i=0;i<agents.length;i++){
    const ag=agents[i];
    const sC=sense(ag.x,ag.y,ag.a);
    const sL=sense(ag.x,ag.y,ag.a-sa);
    const sR=sense(ag.x,ag.y,ag.a+sa);
    if(sC>sL&&sC>sR){
      // straight
    } else if(sL>sR){
      ag.a-=ta*Math.random();
    } else if(sR>sL){
      ag.a+=ta*Math.random();
    } else {
      ag.a+=(Math.random()-0.5)*ta;
    }
    ag.x+=Math.cos(ag.a)*sp;
    ag.y+=Math.sin(ag.a)*sp;
    if(ag.x<0)ag.x+=W; if(ag.x>=W)ag.x-=W;
    if(ag.y<0)ag.y+=H; if(ag.y>=H)ag.y-=H;
    const ix=Math.floor(ag.x),iy=Math.floor(ag.y);
    if(ix>=0&&ix<W&&iy>=0&&iy<H) trail[iy*W+ix]+=1;
  }
  // diffuse + decay
  const dk=P.dk;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const i=y*W+x;
      let v=trail[i]*dk;
      // simple box blur with neighbours
      let sum=v;
      let cnt=1;
      if(x>0){sum+=trail[i-1]*dk;cnt++}
      if(x<W-1){sum+=trail[i+1]*dk;cnt++}
      if(y>0){sum+=trail[i-W]*dk;cnt++}
      if(y<H-1){sum+=trail[i+W]*dk;cnt++}
      trail[i]=sum/cnt;
    }
  }
}

const img=ctx.createImageData(1,1);
let imgData;
function render(){
  if(!imgData||imgData.width!==W||imgData.height!==H){
    imgData=ctx.createImageData(W,H);
  }
  const d=imgData.data;
  for(let i=0;i<W*H;i++){
    let v=trail[i];
    v=v>1?1:v;
    const p=i*4;
    // teal→warm ramp
    const r=Math.floor(v*255*0.55);
    const g=Math.floor(Math.pow(v,0.7)*255);
    const b=Math.floor(Math.pow(v,1.3)*255*0.7+20);
    d[p]=r; d[p+1]=g; d[p+2]=b; d[p+3]=255;
  }
  ctx.putImageData(imgData,0,0);
}

let last=performance.now(),frames=0,acc=0;
function loop(now){
  const dt=now-last;last=now;acc+=dt;frames++;
  if(acc>500){document.getElementById('fps').textContent=Math.round(frames*1000/acc)+' fps · '+agents.length+' agents';frames=0;acc=0;}
  if(running){ step(); render(); }
  requestAnimationFrame(loop);
}

// controls
function bind(id,key,fmt){
  const el=document.getElementById(id),v=document.getElementById(id+'V');
  el.oninput=()=>{P[key]=parseFloat(el.value);v.textContent=fmt?fmt(P[key]):el.value;if(key==='n'){seedAgents(P.n);}};
}
bind('agents','n');bind('sa','sa');bind('sd','sd');bind('ta','ta');bind('sp','sp');bind('dk','dk');

document.getElementById('pause').onclick=e=>{running=!running;e.target.classList.toggle('on',!running);e.target.textContent=running?'pause':'play';};
document.getElementById('reset').onclick=()=>{trail.fill(0);seedAgents(P.n);};
document.getElementById('clear').onclick=()=>{trail.fill(0);};

const presets=[
  {n:8000,sa:0.6,sd:12,ta:0.5,sp:1,dk:0.94},
  {n:12000,sa:0.4,sd:8,ta:0.3,sp:1,dk:0.96},
  {n:5000,sa:1.0,sd:20,ta:0.8,sp:1,dk:0.9},
  {n:15000,sa:0.5,sd:6,ta:0.4,sp:1.2,dk:0.97},
];
let pIdx=0;
document.getElementById('preset').onclick=()=>{
  pIdx=(pIdx+1)%presets.length;
  const p=presets[pIdx];
  Object.assign(P,p);
  for(const [id,key] of [['agents','n'],['sa','sa'],['sd','sd'],['ta','ta'],['sp','sp'],['dk','dk']]){
    const el=document.getElementById(id);el.value=p[key];document.getElementById(id+'V').textContent=p[key];
  }
  trail.fill(0);seedAgents(P.n);
};

// drag to seed
let dragging=false;
cv.addEventListener('pointerdown',e=>{dragging=true;seedAt(e);});
cv.addEventListener('pointermove',e=>{if(dragging)seedAt(e);});
addEventListener('pointerup',()=>dragging=false);
function seedAt(e){
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)/SCALE, y=(e.clientY-rect.top)/SCALE;
  for(let i=0;i<200;i++){
    const ang=Math.random()*Math.PI*2;
    agents.push({x:x+(Math.random()-0.5)*20,y:y+(Math.random()-0.5)*20,a:ang});
  }
}

addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();document.getElementById('pause').click();}
  if(e.key==='r'||e.key==='R'){trail.fill(0);seedAgents(P.n);}
});
addEventListener('resize',()=>{resize();trail.fill(0);seedAgents(P.n);});

resize();seedAgents(P.n);
requestAnimationFrame(loop);
</script>
</body>
</html>
