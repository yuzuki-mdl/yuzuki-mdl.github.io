<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>langton's loops</title>
<style>
  :root { --bg:#0a0c10; --fg:#c9d4e0; --dim:#5a6675; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  body { display:flex; flex-direction:column; align-items:center; }
  header { padding:18px 16px 6px; text-align:center; max-width:640px; }
  h1 { margin:0 0 6px; font-size:17px; font-weight:600; letter-spacing:.5px; }
  p { margin:0; color:var(--dim); font-size:12.5px; }
  .wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:8px; width:100%; }
  canvas { image-rendering:pixelated; max-width:100%; max-height:calc(100vh - 150px);
    width:auto; height:auto; border:1px solid #1a2029; border-radius:4px; cursor:crosshair; }
  footer { display:flex; gap:14px; align-items:center; padding:10px 16px 18px;
    flex-wrap:wrap; justify-content:center; font-size:12px; }
  button { background:#161c25; color:var(--fg); border:1px solid #253040; border-radius:5px;
    padding:6px 12px; font:inherit; font-size:12px; cursor:pointer; }
  button:hover { background:#1e2733; }
  label { color:var(--dim); }
  input[type=range] { width:110px; vertical-align:middle; accent-color:#4a7; }
  .stat { color:var(--dim); font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>langton's loops</h1>
  <p>an 8-state cellular automaton that copies itself. a loop of cells carries a small
     genome around its ring; the genes make it grow an arm, build a child, and hand the
     genome over. no rules about loops, just 219 local rules. the loops come out anyway.</p>
</header>
<div class="wrap"><canvas id="c"></canvas></div>
<footer>
  <button id="play">pause</button>
  <label>speed <input id="speed" type="range" min="1" max="30" value="12"></label>
  <button id="reset">reset</button>
  <span class="stat" id="stat"></span>
</footer>
<script>
const RULES = `000000 000012 000020 000030 000050 000063 000071 000112 000122 000132 000212 000220 000230 000262 000272 000320 000525 000622 000722 001022 001120 002020 002030 002050 002125 002220 002322 005222 012321 012421 012525 012621 012721 012751 014221 014321 014421 014721 016251 017221 017255 017521 017621 017721 025271 100011 100061 100077 100111 100121 100211 100244 100277 100511 101011 101111 101244 101277 102026 102121 102211 102244 102263 102277 102327 102424 102626 102644 102677 102710 102727 105427 111121 111221 111244 111251 111261 111277 111522 112121 112221 112244 112251 112277 112321 112424 112621 112727 113221 122244 122277 122434 122547 123244 123277 124255 124267 125275 200012 200022 200042 200071 200122 200152 200212 200222 200232 200242 200250 200262 200272 200326 200423 200517 200522 200575 200722 201022 201122 201222 201422 201722 202022 202032 202052 202073 202122 202152 202212 202222 202272 202321 202422 202452 202520 202552 202622 202722 203122 203216 203226 203422 204222 205122 205212 205222 205521 205725 206222 206722 207122 207222 207422 207722 211222 211261 212222 212242 212262 212272 214222 215222 216222 217222 222272 222442 222462 222762 222772 300013 300022 300041 300076 300123 300421 300622 301021 301220 302511 401120 401220 401250 402120 402221 402326 402520 403221 500022 500215 500225 500232 500272 500520 502022 502122 502152 502220 502244 502722 512122 512220 512422 512722 600011 600021 602120 612125 612131 612225 700077 701120 701220 701250 702120 702221 702251 702321 702525 702720`.split(/\s+/).map(s=>s.split('').map(Number));

const table = new Map();
for (const [o,n,e,s,w,nw] of RULES) {
  for (const [a,b,c,d] of [[n,e,s,w],[e,s,w,n],[s,w,n,e],[w,n,e,s]])
    table.set(`${o}${a}${b}${c}${d}`, nw);
}

const SEED = [
  '02222222200000','21701401420000','20222222020000','27200002120000',
  '21200002120000','20200002120000','27200002120000','21222222122222',
  '20710710711111','02222222222222'
];

const W = 200, H = 200;
const COLORS = ['#0a0c10','#2b6cb0','#c0392b','#27ae60','#d4ac0d','#e87ba8','#e8e8e8','#2ec4b6'];

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = 720; cv.height = 720;
let grid = new Uint8Array(W*H);
let running = true, speed = 12, gen = 0;

function seed() {
  grid = new Uint8Array(W*H);
  SEED.forEach((line,y) => {
    for (let x=0;x<line.length;x++) grid[(80+y)*W + (80+x)] = +line[x];
  });
  gen = 0;
  draw();
}

function step() {
  const next = new Uint8Array(W*H);
  for (let y=0;y<H;y++) {
    const ym = ((y-1+H)%H)*W, yp = ((y+1)%H)*W, y0 = y*W;
    for (let x=0;x<W;x++) {
      const o = grid[y0+x];
      const n = grid[ym+x], e = grid[y0+((x+1)%W)];
      const s = grid[yp+x], w = grid[y0+((x-1+W)%W)];
      const k = `${o}${n}${e}${s}${w}`;
      next[y0+x] = table.has(k) ? table.get(k) : o;
    }
  }
  grid = next;
  gen++;
}

const rgb = COLORS.map(h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const VIEW = 90; // cells shown across the canvas
function draw() {
  // bounding box of live cells
  let minx=W,miny=H,maxx=0,maxy=0;
  for (let y=0;y<H;y++) for (let x=0;x<W;x++) if (grid[y*W+x]) {
    if (x<minx)minx=x; if (x>maxx)maxx=x; if (y<miny)miny=y; if (y>maxy)maxy=y;
  }
  if (maxx<minx) { minx=miny=90; maxx=minx+10; maxy=miny+10; }
  const cx=(minx+maxx)/2, cy=(miny+maxy)/2;
  const half=Math.max(VIEW/2, (maxx-minx)/2+6, (maxy-miny)/2+6);
  const x0=Math.round(cx-half), y0=Math.round(cy-half);
  const span=Math.round(half*2);
  const scale=cv.width/span;
  ctx.fillStyle='#0a0c10'; ctx.fillRect(0,0,cv.width,cv.height);
  for (let y=0;y<span;y++) for (let x=0;x<span;x++) {
    const gx=((x0+x)%W+W)%W, gy=((y0+y)%H+H)%H;
    const v=grid[gy*W+gx];
    if (!v) continue;
    const c=rgb[v];
    ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.fillRect(Math.floor(x*scale),Math.floor(y*scale),Math.ceil(scale),Math.ceil(scale));
  }
}

let acc = 0, last = performance.now();
function loop(t) {
  const dt = t - last; last = t;
  if (running) {
    acc += dt;
    const interval = 1000/speed;
    let n = 0;
    while (acc >= interval && n < 30) { step(); acc -= interval; n++; }
    if (n) { draw(); updateStat(); }
  }
  requestAnimationFrame(loop);
}

let alive = 0;
function updateStat() {
  if (gen % 5 === 0) {
    alive = 0; for (let i=0;i<W*H;i++) if (grid[i]) alive++;
    document.getElementById('stat').textContent = `gen ${gen} · ${alive} cells`;
  }
}

document.getElementById('play').onclick = e => {
  running = !running;
  e.target.textContent = running ? 'pause' : 'play';
};
document.getElementById('speed').oninput = e => speed = +e.target.value;
document.getElementById('reset').onclick = seed;

seed(); updateStat(); requestAnimationFrame(loop);
</script>
</body>
</html>
