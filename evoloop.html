<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>evoloop</title>
<style>
  html,body{margin:0;height:100%;background:#07080c;overflow:hidden;font-family:ui-monospace,Menlo,monospace;color:#cfd3dc;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:14px;top:12px;font-size:12px;line-height:1.7;opacity:.7;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud b{color:#7be0a0;font-weight:600}
  #hud .s{color:#8fa}
  #bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font-size:12px;opacity:.85}
  #bar button{background:#151922;color:#cfd3dc;border:1px solid #2a3140;border-radius:7px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}
  #bar button:hover{border-color:#3d4a5e;background:#1b2230}

<body>
<canvas id="c"></canvas>
<div id="hud"><b>evoloop</b> — sayama's self-replicating loops<br>gen <b id="gen">0</b> · loops <b id="loops">1</b> · sheath <b id="sh">0</b></div>
<div id="bar">
  <button id="pp">pause</button>
  <button id="sp">speed 1×</button>
  <button id="reset">reset</button>
</div>
<div id="hint">von neumann 9-state CA<br>loops eat space, split, mutate, dissolve<br>click empty space to drop a loop</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,DPR,CS; // cell size in px
const N=170; // grid NxN
let grid=new Uint8Array(N*N);

// ---- rule table ----
const raw=`(0,0,0,0,1)2 (1,0,2,0,2)1 (1,1,2,7,2)7 (2,0,1,7,2)2 (2,1,3,2,2)2 (4,0,1,2,5)0 (0,0,0,0,4)3 (1,0,2,1,1)1 (1,1,2,7,3)5 (2,0,2,0,2)2 (2,1,4,2,2)2 (4,0,1,6,2)0 (0,0,0,1,2)2 (1,0,2,1,2)1 (1,1,3,2,2)1 (2,0,2,0,3)2 (2,1,6,2,2)2 (4,0,2,1,2)0 (0,0,0,1,5)2 (1,0,2,1,3)1 (1,1,3,3,2)1 (2,0,2,0,5)2 (2,1,7,2,2)2 (4,0,2,1,5)0 (0,0,0,2,1)2 (1,0,2,2,1)1 (1,1,5,4,2)4 (2,0,2,0,6)5 (2,2,2,2,4)2 (4,0,2,2,2)1 (0,0,0,2,4)2 (1,0,2,2,4)4 (1,1,5,7,2)7 (2,0,2,0,7)3 (2,2,2,2,7)2 (4,0,2,3,2)1 (0,0,0,4,2)2 (1,0,2,2,7)7 (1,1,6,2,4)4 (2,0,2,1,2)2 (2,2,2,3,4)2 (4,0,2,6,2)6 (0,0,0,4,5)2 (1,0,2,3,2)4 (1,1,6,2,7)7 (2,0,2,1,5)2 (2,2,2,3,7)2 (4,0,3,1,2)0 (0,0,0,7,5)2 (1,0,2,4,1)4 (1,2,2,2,4)4 (2,0,2,2,1)2 (2,2,2,4,3)2 (4,0,3,2,2)1 (0,0,1,0,2)2 (1,0,2,4,2)4 (1,2,2,2,7)7 (2,0,2,2,2)2 (2,2,2,4,4)2 (5,0,0,0,2)5 (0,0,2,1,4)1 (1,0,2,4,3)4 (1,2,2,4,3)4 (2,0,2,2,3)2 (2,2,2,7,3)2 (5,0,0,1,2)5 (0,0,2,1,7)1 (1,0,2,5,1)1 (1,2,2,7,3)7 (2,0,2,3,2)3 (2,2,2,7,7)2 (5,0,0,2,1)5 (0,0,2,3,2)2 (1,0,2,5,2)7 (1,2,3,2,4)4 (2,0,2,4,2)2 (2,2,3,2,4)3 (5,0,0,2,3)2 (0,1,1,2,2)1 (1,0,2,5,4)3 (1,2,3,2,7)7 (2,0,2,4,5)2 (2,2,3,2,7)3 (5,0,0,2,4)5 (0,1,2,1,2)1 (1,0,2,5,7)7 (1,2,4,2,6)6 (2,0,2,5,2)5 (3,0,0,0,1)3 (5,0,0,2,7)5 (0,1,2,3,2)1 (1,0,2,7,1)7 (1,2,4,3,3)3 (2,0,2,6,2)0 (3,0,0,0,2)2 (5,0,0,4,2)5 (0,1,2,4,2)1 (1,0,2,7,2)7 (1,2,6,2,7)6 (2,0,2,6,5)0 (3,0,0,0,3)2 (5,0,0,7,2)5 (0,1,2,4,5)1 (1,0,2,7,3)5 (2,0,0,0,1)2 (2,0,2,7,2)2 (3,0,0,0,4)3 (5,0,2,0,2)2 (0,1,2,5,2)6 (1,0,5,1,2)1 (2,0,0,0,2)2 (2,0,2,7,5)2 (3,0,0,0,7)4 (5,0,2,0,5)2 (0,1,2,6,2)6 (1,0,5,4,2)4 (2,0,0,0,4)2 (2,0,3,1,2)2 (3,0,0,1,2)3 (5,0,2,1,2)5 (0,1,2,7,2)1 (1,0,5,7,2)7 (2,0,0,0,5)2 (2,0,3,2,2)2 (3,0,0,3,2)2 (5,0,2,1,5)2 (0,1,2,7,5)1 (1,0,6,2,1)1 (2,0,0,0,6)0 (2,0,3,4,2)2 (3,0,0,4,2)1 (5,0,2,4,2)5 (0,1,3,4,2)1 (1,0,6,2,4)4 (2,0,0,0,7)1 (2,0,3,4,5)2 (3,0,1,0,2)1 (5,0,2,7,2)5 (0,1,3,7,2)1 (1,0,6,2,7)7 (2,0,0,1,2)2 (2,0,3,7,2)2 (3,0,1,2,5)0 (5,0,3,1,2)0 (0,1,4,2,2)1 (1,1,1,1,2)1 (2,0,0,1,5)2 (2,0,4,1,2)2 (3,0,2,1,2)3 (6,0,2,0,2)2 (0,1,4,2,5)1 (1,1,1,2,2)1 (2,0,0,2,1)2 (2,0,4,2,2)2 (3,0,2,4,2)3 (6,0,2,1,2)2 (0,1,4,3,2)1 (1,1,1,2,4)4 (2,0,0,2,2)2 (2,0,4,4,2)2 (3,0,2,5,2)1 (6,0,2,2,2)0 (0,1,4,3,5)1 (1,1,1,2,5)1 (2,0,0,2,3)2 (2,0,5,1,2)2 (3,0,2,7,2)3 (6,0,2,4,2)2 (0,1,4,4,2)1 (1,1,1,2,7)7 (2,0,0,2,4)2 (2,0,5,4,2)5 (3,0,3,3,2)1 (6,0,2,7,2)2 (0,1,4,6,2)1 (1,1,1,6,2)1 (2,0,0,2,6)0 (2,0,5,7,2)5 (3,1,2,1,2)3 (6,1,2,2,2)0 (0,1,7,2,2)1 (1,1,2,1,2)1 (2,0,0,2,7)2 (2,0,6,1,2)5 (3,1,2,4,2)3 (6,2,2,2,4)0 (0,1,7,2,5)1 (1,1,2,1,3)1 (2,0,0,3,2)4 (2,0,6,2,1)2 (3,1,2,5,2)1 (6,2,2,2,7)0 (0,1,7,5,6)1 (1,1,2,1,5)1 (2,0,0,4,2)3 (2,0,6,4,2)5 (3,1,2,7,2)3 (7,0,1,0,2)0 (0,1,7,6,2)1 (1,1,2,2,2)1 (2,0,0,4,5)2 (2,0,6,7,2)5 (3,2,4,2,4)3 (7,0,1,1,2)0 (0,1,7,7,2)1 (1,1,2,2,4)4 (2,0,0,5,4)5 (2,0,7,1,2)2 (3,2,4,2,5)1 (7,0,1,2,2)0 (1,0,0,0,1)1 (1,1,2,2,7)7 (2,0,0,5,7)5 (2,0,7,2,2)2 (3,2,4,2,7)3 (7,0,1,2,5)0 (1,0,0,1,2)1 (1,1,2,3,2)1 (2,0,0,6,2)0 (2,0,7,7,2)2 (3,2,5,2,7)1 (7,0,1,6,2)0 (1,0,0,2,1)1 (1,1,2,4,2)4 (2,0,0,7,2)2 (2,1,1,2,2)2 (3,2,7,2,7)3 (7,0,2,1,2)0 (1,0,0,2,4)4 (1,1,2,4,3)4 (2,0,0,7,5)2 (2,1,2,2,2)2 (4,0,0,0,0)1 (7,0,2,1,5)0 (1,0,0,2,7)7 (1,1,2,5,2)7 (2,0,1,0,2)2 (2,1,2,2,3)2 (4,0,0,0,2)1 (7,0,2,2,2)1 (1,0,1,2,1)1 (1,1,2,5,4)3 (2,0,1,1,2)2 (2,1,2,2,4)2 (4,0,1,0,2)0 (7,0,2,3,2)0 (1,0,1,2,4)4 (1,1,2,5,7)7 (2,0,1,2,2)2 (2,1,2,2,7)2 (4,0,1,1,2)0 (7,0,2,6,2)6 (1,0,1,2,7)7 (1,1,2,6,2)6 (2,0,1,4,2)2 (2,1,2,3,2)3 (4,0,1,2,2)0 (7,0,3,1,2)0`;
const RULES=new Map();
for(const tok of raw.split(' ')){
  const m=tok.match(/^\((\d),(\d),(\d),(\d),(\d)\)(\d)$/);
  if(m) RULES.set(m[1]+m[2]+m[3]+m[4]+m[5], +m[6]);
}

function lookup(c,t,r,b,l){
  // try center,T,R,B,L and its 4 rotations
  let k=c+''+t+r+b+l, v=RULES.get(k); if(v!==undefined) return v;
  k=c+''+r+b+l+t; v=RULES.get(k); if(v!==undefined) return v;
  k=c+''+b+l+t+r; v=RULES.get(k); if(v!==undefined) return v;
  k=c+''+l+t+r+b; v=RULES.get(k); if(v!==undefined) return v;
  // fallback
  if(c===8) return 0;
  if(t===8||r===8||b===8||l===8){
    const any=(t>=2&&t<=7)||(r>=2&&r<=7)||(b>=2&&b<=7)||(l>=2&&l<=7);
    if(c===0||c===1) return any?8:c;
    if(c===2||c===3||c===5) return 0;
    if(c===4||c===6||c===7) return 1;
  }
  if(c===0) return 0;
  return 8;
}

// ---- seed species 13 ----
function dropLoop(ox,oy){
  const R=17,C=31; const g=[];for(let i=0;i<R;i++)g.push(new Uint8Array(C));
  const set=(r,c,v)=>{if(r>=0&&r<R&&c>=0&&c<C)g[r][c]=v;};
  for(let c=1;c<=15;c++) set(0,c,2);
  [2,0,1,7,0,1,7,0,1,7,0,1,4,0,1,4,2].forEach((v,i)=>set(1,i,v));
  set(2,0,2);set(2,1,7);for(let c=2;c<=14;c++)set(2,c,2);set(2,15,0);set(2,16,2);
  const xs=[1,0,7,1,0,7,1,0,7,1,0];
  for(let i=0;i<11;i++){const r=3+i;set(r,0,2);set(r,1,xs[i]);set(r,2,2);set(r,14,2);set(r,15,1);set(r,16,2);}
  set(14,0,2);set(14,1,7);for(let c=2;c<=14;c++)set(14,c,2);set(14,15,1);set(14,16,2);for(let c=17;c<=29;c++)set(14,c,2);
  [2,1,0,7,1,0,7,1,0,7,1,0,7,1,0,7,1].forEach((v,i)=>set(15,i,v));
  for(let c=17;c<=29;c++)set(15,c,1);set(15,30,2);
  for(let c=1;c<=29;c++)set(16,c,2);
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    const gx=((ox+x)%N+N)%N, gy=((oy+y)%N+N)%N;
    if(g[y][x]) grid[gy*N+gx]=g[y][x];
  }
}

function step(){
  const out=new Uint8Array(N*N);
  for(let y=0;y<N;y++){
    const ym=((y-1+N)%N)*N, yp=((y+1)%N)*N, yc=y*N;
    for(let x=0;x<N;x++){
      const xm=(x-1+N)%N, xp=(x+1)%N;
      const c=grid[yc+x], t=grid[ym+x], r=grid[yc+xp], b=grid[yp+x], l=grid[yc+xm];
      out[yc+x]=lookup(c,t,r,b,l);
    }
  }
  grid=out;
}

// ---- render ----
const COL=[null,'#3a6df0','#1f8a5b','#b06bd8','#e0a020','#d84a6a','#4ad0c0','#e8e8f0','#5a6472'];
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);CS=Math.floor(Math.min(W,H)/N);}
resize();addEventListener('resize',resize);

let gen=0, running=true, speed=1, acc=0, last=performance.now();
function draw(){
  cx.fillStyle='#07080c';cx.fillRect(0,0,W,H);
  const ox=(W-CS*N)/2, oy=(H-CS*N)/2;
  let sh=0, loops=0;
  // count cores (state1) roughly as loops
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const v=grid[y*N+x]; if(!v) continue;
    if(v===2) sh++;
    cx.fillStyle=COL[v]||'#555';
    cx.fillRect(ox+x*CS, oy+y*CS, CS, CS);
  }
  document.getElementById('gen').textContent=gen;
  document.getElementById('sh').textContent=sh;
  document.getElementById('loops').textContent=Math.round(sh/130);
}
function loop(now){
  const dt=now-last; last=now;
  if(running){ acc+=dt; const interval=Math.max(16, 90/speed);
    let guard=0;
    while(acc>=interval && guard<8){ step(); gen++; acc-=interval; guard++; }
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// controls
document.getElementById('pp').onclick=e=>{running=!running; e.target.textContent=running?'pause':'play';};
const speeds=[1,2,4,8]; let si=0;
document.getElementById('sp').onclick=e=>{si=(si+1)%speeds.length; speed=speeds[si]; e.target.textContent='speed '+speed+'×';};
document.getElementById('reset').onclick=()=>{grid=new Uint8Array(N*N); gen=0; dropLoop(Math.floor(N/2)-8, Math.floor(N/2)-8);};
cv.addEventListener('pointerdown',e=>{
  const ox=(W-CS*N)/2, oy=(H-CS*N)/2;
  const gx=Math.floor((e.clientX-ox)/CS), gy=Math.floor((e.clientY-oy)/CS);
  dropLoop(gx-8, gy-8);
});

dropLoop(Math.floor(N/2)-8, Math.floor(N/2)-8);
</script>
