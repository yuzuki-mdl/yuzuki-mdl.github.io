<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>one curve, a hundred ways</title>
<style>
  html,body{margin:0;height:100%;background:#0d0d10;color:#c9c9cf;font:13px/1.5 ui-monospace,monospace}
  #wrap{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;padding:2px;height:100vh;box-sizing:border-box}
  canvas{width:100%;height:100%;display:block;background:#15151a;border-radius:2px}
  header{position:fixed;left:12px;bottom:10px;opacity:.5;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"></div>
<header>one cubic bezier · fixed endpoints · control points land on a 5×5 lattice · nothing else varies</header>
<script>
// one rule: draw the SAME cubic bezier. endpoints are fixed. the only
// freedom is where the two control points sit, and they can only sit on a
// 5x5 lattice. same lattice for every cell, same curve for every cell.
const A=[0.15,0.5], B=[0.85,0.5];           // fixed endpoints
const LAT=[-0.3,-0.15,0,0.15,0.3];          // lattice offsets (5x5)

function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const N=100, wrap=document.getElementById('wrap');
for(let i=0;i<N;i++){
  const c=document.createElement('canvas');
  c.width=c.height=140; wrap.appendChild(c);
  const g=c.getContext('2d');
  const rnd=mulberry(i*2654435761>>>0);
  const c1=[A[0]+LAT[Math.floor(rnd()*5)], A[1]+LAT[Math.floor(rnd()*5)]];
  const c2=[B[0]+LAT[Math.floor(rnd()*5)], B[1]+LAT[Math.floor(rnd()*5)]];
  g.translate(70,70); g.scale(70*0.8,70*0.8);
  g.beginPath();
  g.moveTo(A[0],A[1]);
  g.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],B[0],B[1]);
  g.strokeStyle='#d6a87f'; g.lineWidth=0.05; g.lineJoin='round'; g.stroke();
  // the two control points, faint, same rule everywhere
  g.fillStyle='#c9c9cf'; g.globalAlpha=0.25;
  for(const p of [c1,c2]){ g.beginPath(); g.arc(p[0],p[1],0.025,0,7); g.fill(); }
  g.globalAlpha=1;
}
</script>
</body>
</html>
