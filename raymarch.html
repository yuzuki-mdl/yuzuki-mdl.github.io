<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ascii raymarcher</title>
<style>
  :root{--bg:#0b0d10;--fg:#c8f7d4;--dim:#3a4a44;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
  body{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:hidden}
  #screen{white-space:pre;font-size:12px;line-height:1;letter-spacing:0;color:var(--fg);text-shadow:0 0 6px rgba(120,255,170,.25);user-select:none}
  .bar{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:12px;color:#8fb3a4}
  .bar label{display:flex;gap:6px;align-items:center}
  input[type=range]{width:110px;accent-color:#6fe39a}
  .hint{font-size:11px;color:var(--dim);max-width:520px;text-align:center;line-height:1.5}
  a{color:#6fe39a}
</style>
</head>
<body>
<div id="screen"></div>
<div class="bar">
  <label>cols <input id="cols" type="range" min="40" max="160" value="100"></label>
  <label>spin <input id="spin" type="range" min="0" max="100" value="30"></label>
  <label><input id="shade" type="checkbox" checked> shade</label>
</div>
<div class="hint">a tiny raymarcher rendered as text. drag to orbit. <a href="index.html">back</a></div>
<script>
// ---------- ascii raymarcher ----------
const screenEl = document.getElementById('screen');
const colsEl = document.getElementById('cols');
const spinEl = document.getElementById('spin');
const shadeEl = document.getElementById('shade');

// luminance ramp dark -> bright
const RAMP = ' .:-=+*#%@';
const RAMP2 = " .'`^\",:;Il!i~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

let W = 100, H = 44;
let yaw = 0.6, pitch = 0.35, dragging = false, lastX = 0, lastY = 0;
let autoSpin = 0.3;
let useShade = true;

// ---------- scene: signed distance field ----------
// a bouncing metaball-ish scene: 3 spheres orbiting + a ground plane + a torus
function sdSphere(px,py,pz, cx,cy,cz, r){const dx=px-cx,dy=py-cy,dz=pz-cz;return Math.sqrt(dx*dx+dy*dy+dz*dz)-r;}
function sdPlane(px,py,pz){return py+1.0;} // ground at y=-1
function sdTorus(px,py,pz, R, r){
  const qx=Math.sqrt(px*px+pz*pz)-R;
  return Math.sqrt(qx*qx+py*py)-r;
}
function smin(a,b,k){const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*0.25;}

function map(px,py,pz,t){
  // ground
  let d = sdPlane(px,py,pz);
  // three orbiting spheres
  const a1=t*0.9, a2=t*1.3+2.1, a3=t*0.7+4.2;
  const s1=sdSphere(px,py,pz, Math.cos(a1)*0.9, 0.15+Math.sin(t*1.7)*0.25, Math.sin(a1)*0.9, 0.42);
  const s2=sdSphere(px,py,pz, Math.cos(a2)*0.7, 0.35, Math.sin(a2)*0.7, 0.32);
  const s3=sdSphere(px,py,pz, Math.cos(a3)*1.1, 0.05+Math.cos(t*1.1)*0.3, Math.sin(a3)*1.1, 0.5);
  let balls = smin(s1,s2,0.35);
  balls = smin(balls,s3,0.35);
  // a spinning torus above
  const ca=Math.cos(t*0.5), sa=Math.sin(t*0.5);
  const rx = px*ca - pz*sa, rz = px*sa + pz*ca;
  const tor = sdTorus(rx, py-1.15, rz, 0.75, 0.16);
  d = Math.min(d, balls);
  d = Math.min(d, tor);
  return d;
}

function normal(px,py,pz,t){
  const e=0.001;
  const dx=map(px+e,py,pz,t)-map(px-e,py,pz,t);
  const dy=map(px,py+e,pz,t)-map(px,py-e,pz,t);
  const dz=map(px,py,pz+e,t)-map(px,py,pz-e,t);
  const l=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
  return [dx/l,dy/l,dz/l];
}

// camera rays
function render(t){
  const out = [];
  const aspect = (W*0.5)/H; // chars are ~2x tall
  const fov = 1.2;
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  // camera at distance 4.2 looking at origin-ish
  const camDist = 4.2;
  const camX = 0, camY = 0.6, camZ = camDist;
  // rotate world by yaw/pitch instead of moving cam (easier)
  for(let j=0;j<H;j++){
    let line='';
    for(let i=0;i<W;i++){
      // screen coords centered
      let sx = (i/W*2-1)*aspect;
      let sy2 = -(j/H*2-1);
      // ray dir in camera space (cam looks down -z)
      let rx = sx*fov, ry = sy2*fov, rz = -1;
      // apply pitch (around x) then yaw (around y)
      let y1 = ry*cp - rz*sp;
      let z1 = ry*sp + rz*cp;
      let x2 = rx*cy + z1*sy;
      let z2 = -rx*sy + z1*cy;
      rx = x2; ry = y1; rz = z2;
      const l = Math.sqrt(rx*rx+ry*ry+rz*rz); rx/=l; ry/=l; rz/=l;
      // march
      let px=camX, py=camY, pz=camZ;
      let hit=false, glow=0;
      for(let s=0;s<64;s++){
        const d = map(px,py,pz,t);
        if(d<0.001){hit=true;break;}
        if(d>20){break;}
        px+=rx*d; py+=ry*d; pz+=rz*d;
        glow += 0.02/(1+d*d*4);
      }
      if(hit){
        const n = normal(px,py,pz,t);
        // light
        const L=[-0.4,0.9,-0.3]; const Ll=Math.sqrt(L[0]*L[0]+L[1]*L[1]+L[2]*L[2]);
        let diff = (n[0]*L[0]+n[1]*L[1]+n[2]*L[2])/Ll;
        diff = Math.max(0,diff);
        // ambient + soft
        let lum = 0.18 + diff*0.82;
        lum += glow*0.5;
        // fog: fade with distance from camera
        const dist = Math.sqrt((px-camX)**2+(py-camY)**2+(pz-camZ)**2);
        lum *= Math.max(0.15, 1 - dist/14);
        // ground is boring: dim it and add a subtle checker
        if(py < -0.95){
          const chk = (Math.floor(px*1.5)+Math.floor(pz*1.5))&1;
          lum *= chk ? 0.55 : 0.35;
        }
        lum = Math.min(1,lum);
        if(useShade){
          const idx = Math.min(RAMP.length-1, Math.floor(lum*(RAMP.length-1)));
          line += RAMP[idx];
        } else {
          line += lum>0.4?'#':' ';
        }
      } else {
        // background: faint stars / gradient
        let bg = glow*0.6;
        bg = Math.min(1,bg);
        const idx = Math.floor(bg*(RAMP.length-1)*0.6);
        line += idx>0 ? RAMP[idx] : ' ';
      }
    }
    out.push(line);
  }
  return out.join('\n');
}

let start = performance.now();
function frame(){
  const t = (performance.now()-start)/1000;
  if(!dragging) yaw += autoSpin*0.016;
  screenEl.textContent = render(t*0.7);
  requestAnimationFrame(frame);
}

// ---------- input ----------
screenEl.addEventListener('pointerdown', e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;screenEl.setPointerCapture(e.pointerId);});
screenEl.addEventListener('pointerup', e=>{dragging=false;});
screenEl.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  yaw += dx*0.01;
  pitch = Math.max(-1.2, Math.min(1.2, pitch + dy*0.01));
});

function resize(){
  W = parseInt(colsEl.value,10);
  // keep roughly square pixels: chars ~2x tall
  H = Math.max(20, Math.round(W*0.44));
  // fit font size so it fills
  const fs = Math.min( (window.innerWidth-40)/W*1.9, (window.innerHeight-140)/H );
  screenEl.style.fontSize = Math.max(4, Math.min(16, fs)) + 'px';
}
colsEl.addEventListener('input', resize);
spinEl.addEventListener('input', ()=>{autoSpin = parseInt(spinEl.value,10)/100;});
shadeEl.addEventListener('change', ()=>{useShade = shadeEl.checked;});
window.addEventListener('resize', resize);
resize();
frame();
</script>
</body>
</html>
