<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dungeon</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b12;color:#cdd;font-family:ui-monospace,monospace;overflow:hidden}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px}
  canvas{background:#0b0b12;image-rendering:pixelated;border:1px solid #23233a;box-shadow:0 0 40px #000 inset}
  #hud{display:flex;gap:18px;font-size:14px;letter-spacing:.5px;color:#8f9}
  #hud .dim{color:#556}
  #msg{height:18px;font-size:13px;color:#fc6}
  .key{color:#fd5}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>hp <span id="hp">10</span></span>
    <span>floor <span id="fl">1</span>/5</span>
    <span class="key">keys <span id="ky">0</span></span>
    <span class="dim">kills <span id="kl">0</span></span>
    <span class="dim">wasd / arrows &middot; bump to attack</span>
  </div>
  <canvas id="c"></canvas>
  <div id="msg"></div>
</div>
<script>
// ---- dungeon crawler ----
const W=22, H=16, T=32;
const cv=document.getElementById('c');
cv.width=W*T; cv.height=H*T;
const cx=cv.getContext('2d');

const WALL=0, FLOOR=1, DOOR=2, STAIRS=3, KEY=4, POTION=5;
let grid, player, enemies, keys, potions, kills, floorNum, msgT;
const MAXFLOOR=5;

function rnd(a,b){return Math.floor(a+Math.random()*(b-a));}

function genFloor(f){
  grid=[]; for(let y=0;y<H;y++){grid.push(new Array(W).fill(WALL));}
  const rooms=[];
  const nrooms=4+rnd(0,3);
  for(let i=0;i<nrooms;i++){
    let w=rnd(3,6), h=rnd(3,5);
    let x=rnd(1,W-w-1), y=rnd(1,H-h-1);
    let ok=true;
    for(const r of rooms){ if(x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y){ok=false;break;} }
    if(!ok) continue;
    for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)grid[yy][xx]=FLOOR;
    rooms.push({x,y,w,h,cx:Math.floor(x+w/2),cy:Math.floor(y+h/2)});
  }
  // connect rooms in order w/ L corridors
  for(let i=1;i<rooms.length;i++){
    let a=rooms[i-1], b=rooms[i];
    let x=a.cx, y=a.cy;
    while(x!==b.cx){grid[y][x]=FLOOR; x+= x<b.cx?1:-1;}
    while(y!==b.cy){grid[y][x]=FLOOR; y+= y<b.cy?1:-1;}
    grid[y][x]=FLOOR;
  }
  if(rooms.length<2){ // fallback tiny
    for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++)grid[y][x]=FLOOR;
    rooms.push({x:2,y:2,w:W-4,h:H-4,cx:3,cy:3});
  }
  const start=rooms[0];
  player={x:start.cx,y:start.cy,hp:10,maxhp:10};

  // stairs in last room
  const last=rooms[rooms.length-1];
  grid[last.cy][last.cx]=STAIRS;

  // keys: place f+1 doors on corridors, keys in other rooms
  keys=[]; enemies=[]; potions=[];
  const nkeys=Math.min(rooms.length-1, 1+Math.floor(f/2));
  const placedDoors=[];
  for(let i=0;i<nkeys;i++){
    // door: pick a floor tile not start/stairs
    let tries=0, dx,dy;
    do{ dx=rnd(1,W-1); dy=rnd(1,H-1); tries++; }while(grid[dy][dx]!==FLOOR && tries<100);
    if(grid[dy][dx]===FLOOR){ grid[dy][dx]=DOOR; placedDoors.push({x:dx,y:dy});
      // key in a room that isn't start
      let r=rooms[1+ (i% (rooms.length-1))] || rooms[0];
      keys.push({x:r.cx,y:r.cy});
    }
  }
  // potions: heal pickups, a couple per floor
  const npot=1+Math.floor(f/2);
  for(let i=0;i<npot;i++){
    let r=rooms[1+rnd(0,Math.max(1,rooms.length-1))]||rooms[0];
    let px=r.cx+rnd(-1,2), py=r.cy+rnd(-1,2);
    if(grid[py]&&grid[py][px]===FLOOR && !(px===player.x&&py===player.y) && !potions.find(p=>p.x===px&&p.y===py))
      potions.push({x:px,y:py});
  }
  // enemies scale with floor
  const nen=2+Math.floor(f*1.2);
  for(let i=0;i<nen;i++){
    let r=rooms[rnd(1,rooms.length)]||rooms[0];
    let ex=r.cx+rnd(-1,2), ey=r.cy+rnd(-1,2);
    if(grid[ey]&&grid[ey][ex]===FLOOR && !(ex===player.x&&ey===player.y))
      enemies.push({x:ex,y:ey,hp:2+Math.floor(f/2),dmg:1});
  }
  // boss guards the stairs on the last floor
  if(f>=MAXFLOOR){
    const b=rooms[rooms.length-1];
    let bx=b.cx, by=b.cy, found=false;
    for(let ry=b.y;ry<b.y+b.h&&!found;ry++)for(let rx=b.x;rx<b.x+b.w&&!found;rx++){
      if(grid[ry][rx]===FLOOR){ bx=rx; by=ry; found=true; }
    }
    enemies.push({x:bx,y:by,hp:16,dmg:2,boss:true});
  }
  if(f===1) kills=0;
  floorNum=f;
  updateHud();
  render();
  msg('floor '+f);
}

function updateHud(){
  document.getElementById('hp').textContent=player.hp;
  document.getElementById('fl').textContent=floorNum;
  document.getElementById('ky').textContent=keys.length;
  document.getElementById('kl').textContent=kills||0;
}

function msg(t){ document.getElementById('msg').textContent=t; msgT=Date.now(); }

function render(){
  cx.clearRect(0,0,cv.width,cv.height);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const v=grid[y][x];
    const px=x*T, py=y*T;
    if(v===WALL){ cx.fillStyle='#16162a'; cx.fillRect(px,py,T,T); cx.fillStyle='#1e1e38'; cx.fillRect(px+2,py+2,T-4,T-4); }
    else if(v===FLOOR){ cx.fillStyle='#0e0e1c'; cx.fillRect(px,py,T,T); }
    else if(v===DOOR){ cx.fillStyle='#0e0e1c'; cx.fillRect(px,py,T,T); cx.fillStyle='#7a4a1e'; cx.fillRect(px+6,py+3,T-12,T-6); cx.fillStyle='#fd5'; cx.fillRect(px+T/2-2,py+T/2-2,4,4); }
    else if(v===STAIRS){ cx.fillStyle='#0e0e1c'; cx.fillRect(px,py,T,T); cx.fillStyle='#6cf'; for(let s=0;s<4;s++)cx.fillRect(px+6+s*4,py+T-8-s*5,T-12-s*8,3); }
  }
  // keys
  for(const k of keys){ cx.fillStyle='#fd5'; cx.font='22px monospace'; cx.fillText('⚷',k.x*T+5,k.y*T+24); }
  // potions
  for(const p of potions){ cx.fillStyle='#e46'; cx.fillRect(p.x*T+11,p.y*T+12,10,14); cx.fillStyle='#f9b'; cx.fillRect(p.x*T+13,p.y*T+8,6,5); }
  // enemies
  for(const e of enemies){ const R=e.boss?14:10; cx.fillStyle=e.boss?'#c33':'#e55'; cx.beginPath(); cx.arc(e.x*T+T/2,e.y*T+T/2,R,0,7); cx.fill(); cx.fillStyle='#300'; const o=e.boss?8:10; cx.fillRect(e.x*T+o,e.y*T+12,4,4); cx.fillRect(e.x*T+T-o-4,e.y*T+12,4,4); }
  // player
  cx.fillStyle='#8f9'; cx.beginPath(); cx.arc(player.x*T+T/2,player.y*T+T/2,11,0,7); cx.fill();
  cx.fillStyle='#042'; cx.fillRect(player.x*T+11,player.y*T+12,3,4); cx.fillRect(player.x*T+18,player.y*T+12,3,4);
}

function walkable(x,y){
  if(x<0||y<0||x>=W||y>=H) return false;
  const v=grid[y][x];
  if(v===WALL) return false;
  if(v===DOOR){ if(keys.length>0){ keys.pop(); grid[y][x]=FLOOR; msg('unlocked a door'); updateHud(); return true;} else { msg('need a key'); return false; } }
  return true;
}

function bumpEnemy(x,y){
  return enemies.find(e=>e.x===x&&e.y===y);
}

function playerMove(dx,dy){
  const nx=player.x+dx, ny=player.y+dy;
  const en=bumpEnemy(nx,ny);
  if(en){ en.hp-=2; if(en.hp<=0){ enemies=enemies.filter(e=>e!==en); kills=(kills||0)+1; msg(en.boss?'BOSS DOWN 🗝':'killed'); } else msg('hit'); afterTurn(); return; }
  if(!walkable(nx,ny)) return;
  player.x=nx; player.y=ny;
  // potion pickup
  const pot=potions.find(p=>p.x===nx&&p.y===ny);
  if(pot){ potions=potions.filter(p=>p!==pot); player.hp=Math.min(player.maxhp,player.hp+5); msg('+5 hp'); updateHud(); }
  if(grid[ny][nx]===STAIRS){
    if(enemies.some(e=>e.boss)){ msg('the boss blocks the way'); return; }
    if(floorNum>=MAXFLOOR){ win(); return; } genFloor(floorNum+1); return;
  }
  afterTurn();
}

function afterTurn(){
  for(const e of enemies){
    const dx=player.x-e.x, dy=player.y-e.y;
    if(Math.abs(dx)+Math.abs(dy)===1){ player.hp-=e.dmg; if(player.hp<=0){ lose(); return; } }
    else if(Math.random()<0.75){
      let mx=0,my=0;
      if(Math.abs(dx)>Math.abs(dy)) mx=dx>0?1:-1; else my=dy>0?1:-1;
      const tx=e.x+mx, ty=e.y+my;
      if(grid[ty]&&grid[ty][tx]===FLOOR && !bumpEnemy(tx,ty) && !(tx===player.x&&ty===player.y)){ e.x=tx; e.y=ty; }
    }
  }
  updateHud(); render();
}

function win(){ render(); document.getElementById('msg').textContent='u escaped the dungeon. '+kills+' kills. press r to go again 🗝'; }
function lose(){ render(); document.getElementById('msg').textContent='u died on floor '+floorNum+'. press r'; }

let dead=false;
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(document.getElementById('msg').textContent.includes('died')||document.getElementById('msg').textContent.includes('escaped')){
    if(k==='r'){ dead=false; keys=[]; genFloor(1); }
    return;
  }
  let dx=0,dy=0;
  if(k==='w'||k==='arrowup')dy=-1;
  else if(k==='s'||k==='arrowdown')dy=1;
  else if(k==='a'||k==='arrowleft')dx=-1;
  else if(k==='d'||k==='arrowright')dx=1;
  else return;
  e.preventDefault();
  playerMove(dx,dy);
});

genFloor(1);
</script>
</body>
</html>
