<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dungeon</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b12;color:#cdd;font-family:ui-monospace,monospace;overflow:hidden}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px}
  canvas{background:#0b0b12;image-rendering:pixelated;border:1px solid #23233a;box-shadow:0 0 40px #000 inset}
  #hud{display:flex;gap:18px;font-size:14px;letter-spacing:.5px;color:#8f9}
  #hud .dim{color:#556}
  #msg{height:18px;font-size:13px;color:#fc6}
  .key{color:#fd5}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>hp <span id="hp">10</span></span>
    <span>floor <span id="fl">1</span>/5</span>
    <span class="key">keys <span id="ky">0</span></span>
    <span class="dim">kills <span id="kl">0</span></span>
    <span class="dim">atk <span id="atk">1</span></span>
    <span class="dim">wasd / arrows &middot; bump to attack</span>
  </div>
  <canvas id="c"></canvas>
  <div id="msg"></div>
</div>
<script>
// ---- dungeon crawler ----
const W=22, H=16, T=32;
const cv=document.getElementById('c');
cv.width=W*T; cv.height=H*T;
const cx=cv.getContext('2d');

const WALL=0, FLOOR=1, DOOR=2, STAIRS=3, KEY=4, POTION=5, TRAP=6, CHEST=7, SCROLL=8;
let grid, player, enemies, keys, potions, torches, kills, floorNum, msgT, revealUntil=0, seen;
const MAXFLOOR=5;
const THEMES=[
  null,
  {name:'the cellar',   wall:'#16162a', wall2:'#1e1e38', floor:'#0e0e1c'},
  {name:'the flooded halls', wall:'#0f2430', wall2:'#163a48', floor:'#08141a'},
  {name:'the mossy deep', wall:'#16281a', wall2:'#22402a', floor:'#0b160e'},
  {name:'the ember vaults', wall:'#2a1616', wall2:'#3e1e1e', floor:'#180c0c'},
  {name:'the gilded hoard', wall:'#2a2410', wall2:'#443a18', floor:'#16130a'}
];
function theme(){ return THEMES[Math.min(floorNum,MAXFLOOR)] || THEMES[1]; }

function rnd(a,b){return Math.floor(a+Math.random()*(b-a));}

function genFloor(f){
  grid=[]; for(let y=0;y<H;y++){grid.push(new Array(W).fill(WALL));}
  const rooms=[];
  const nrooms=4+rnd(0,3);
  for(let i=0;i<nrooms;i++){
    let w=rnd(3,6), h=rnd(3,5);
    let x=rnd(1,W-w-1), y=rnd(1,H-h-1);
    let ok=true;
    for(const r of rooms){ if(x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y){ok=false;break;} }
    if(!ok) continue;
    for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)grid[yy][xx]=FLOOR;
    rooms.push({x,y,w,h,cx:Math.floor(x+w/2),cy:Math.floor(y+h/2)});
  }
  // connect rooms in order w/ L corridors
  for(let i=1;i<rooms.length;i++){
    let a=rooms[i-1], b=rooms[i];
    let x=a.cx, y=a.cy;
    while(x!==b.cx){grid[y][x]=FLOOR; x+= x<b.cx?1:-1;}
    while(y!==b.cy){grid[y][x]=FLOOR; y+= y<b.cy?1:-1;}
    grid[y][x]=FLOOR;
  }
  if(rooms.length<2){ // fallback tiny
    for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++)grid[y][x]=FLOOR;
    rooms.push({x:2,y:2,w:W-4,h:H-4,cx:3,cy:3});
  }
  const start=rooms[0];
  player={x:start.cx,y:start.cy,hp:10,maxhp:10,atk:1};
  seen=Array.from({length:H},()=>Array(W).fill(false));

  // stairs in last room
  const last=rooms[rooms.length-1];
  grid[last.cy][last.cx]=STAIRS;

  // keys: place f+1 doors on corridors, keys in other rooms
  keys=[]; enemies=[]; potions=[]; torches=[];
  const nkeys=Math.min(rooms.length-1, 1+Math.floor(f/2));
  const placedDoors=[];
  for(let i=0;i<nkeys;i++){
    // door: pick a floor tile not start/stairs
    let tries=0, dx,dy;
    do{ dx=rnd(1,W-1); dy=rnd(1,H-1); tries++; }while(grid[dy][dx]!==FLOOR && tries<100);
    if(grid[dy][dx]===FLOOR){ grid[dy][dx]=DOOR; placedDoors.push({x:dx,y:dy});
      // key in a room that isn't start
      let r=rooms[1+ (i% (rooms.length-1))] || rooms[0];
      keys.push({x:r.cx,y:r.cy});
    }
  }
  // potions: heal pickups, a couple per floor
  const npot=1+Math.floor(f/2);
  for(let i=0;i<npot;i++){
    let r=rooms[1+rnd(0,Math.max(1,rooms.length-1))]||rooms[0];
    let px=r.cx+rnd(-1,2), py=r.cy+rnd(-1,2);
    if(grid[py]&&grid[py][px]===FLOOR && !(px===player.x&&py===player.y) && !potions.find(p=>p.x===px&&p.y===py))
      potions.push({x:px,y:py});
  }
  // treasure chest: one per floor, gives +1 atk
  { let tries=0, cxx,cyy;
    do{ cxx=rnd(1,W-1); cyy=rnd(1,H-1); tries++; }while(grid[cyy][cxx]!==FLOOR && tries<200);
    if(grid[cyy][cxx]===FLOOR && !(cxx===player.x&&cyy===player.y)) grid[cyy][cxx]=CHEST;
  }
  // torch: widens what u can see, one on deeper floors
  if(f>=2){
    let tries=0, tx2,ty2;
    do{ tx2=rnd(1,W-1); ty2=rnd(1,H-1); tries++; }while(grid[ty2][tx2]!==FLOOR && tries<100);
    if(grid[ty2][tx2]===FLOOR && !(tx2===player.x&&ty2===player.y)) torches.push({x:tx2,y:ty2});
  }
  // traps: spike tiles on deeper floors
  if(f>=2){
    const ntr=1+Math.floor(f/2);
    for(let i=0;i<ntr;i++){
      let tries=0, tx,ty;
      do{ tx=rnd(1,W-1); ty=rnd(1,H-1); tries++; }while(grid[ty][tx]!==FLOOR && tries<100);
      if(grid[ty][tx]===FLOOR && !(tx===player.x&&ty===player.y)) grid[ty][tx]=TRAP;
    }
  }
  // scroll: one per floor from f2, reveals the whole map for a few secs
  if(f>=2){
    let tries=0, sx,sy;
    do{ sx=rnd(1,W-1); sy=rnd(1,H-1); tries++; }while(grid[sy][sx]!==FLOOR && tries<200);
    if(grid[sy][sx]===FLOOR && !(sx===player.x&&sy===player.y)) grid[sy][sx]=SCROLL;
  }
  // enemies scale with floor
  const nen=2+Math.floor(f*1.2);
  for(let i=0;i<nen;i++){
    let r=rooms[rnd(1,rooms.length)]||rooms[0];
    let ex=r.cx+rnd(-1,2), ey=r.cy+rnd(-1,2);
    if(grid[ey]&&grid[ey][ex]===FLOOR && !(ex===player.x&&ey===player.y)){
      const archer = f>=3 && Math.random()<0.4;
      enemies.push({x:ex,y:ey,hp:2+Math.floor(f/2),dmg:1,type:archer?'archer':'slime'});
    }
  }
  // boss guards the stairs on the last floor
  if(f>=MAXFLOOR){
    const b=rooms[rooms.length-1];
    let bx=b.cx, by=b.cy, found=false;
    for(let ry=b.y;ry<b.y+b.h&&!found;ry++)for(let rx=b.x;rx<b.x+b.w&&!found;rx++){
      if(grid[ry][rx]===FLOOR){ bx=rx; by=ry; found=true; }
    }
    enemies.push({x:bx,y:by,hp:16,dmg:2,boss:true});
  }
  if(f===1) kills=0;
  floorNum=f;
  updateHud();
  render();
  msg('floor '+f+' — '+theme().name);
}

function updateHud(){
  document.getElementById('hp').textContent=player.hp;
  document.getElementById('fl').textContent=floorNum;
  document.getElementById('ky').textContent=keys.length;
  document.getElementById('kl').textContent=kills||0;
  document.getElementById('atk').textContent=player.atk||1;
}

function msg(t){ document.getElementById('msg').textContent=t; msgT=Date.now(); }

function render(){
  cx.clearRect(0,0,cv.width,cv.height);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const v=grid[y][x];
    const px=x*T, py=y*T;
    const th=theme();
    if(v===WALL){ cx.fillStyle=th.wall; cx.fillRect(px,py,T,T); cx.fillStyle=th.wall2; cx.fillRect(px+2,py+2,T-4,T-4); }
    else if(v===FLOOR){ cx.fillStyle=th.floor; cx.fillRect(px,py,T,T); }
    else if(v===DOOR){ cx.fillStyle=th.floor; cx.fillRect(px,py,T,T); cx.fillStyle='#7a4a1e'; cx.fillRect(px+6,py+3,T-12,T-6); cx.fillStyle='#fd5'; cx.fillRect(px+T/2-2,py+T/2-2,4,4); }
    else if(v===STAIRS){ cx.fillStyle=th.floor; cx.fillRect(px,py,T,T); cx.fillStyle='#6cf'; for(let s=0;s<4;s++)cx.fillRect(px+6+s*4,py+T-8-s*5,T-12-s*8,3); }
    else if(v===TRAP){ cx.fillStyle=th.floor; cx.fillRect(px,py,T,T); cx.fillStyle='#a33'; for(let s=0;s<3;s++){ cx.beginPath(); cx.moveTo(px+6+s*8,py+T-6); cx.lineTo(px+10+s*8,py+8); cx.lineTo(px+14+s*8,py+T-6); cx.fill(); } }
  }
  // keys
  for(const k of keys){ cx.fillStyle='#fd5'; cx.font='22px monospace'; cx.fillText('⚷',k.x*T+5,k.y*T+24); }
  // chests
  for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){ if(grid[yy][xx]===CHEST){ cx.fillStyle='#b8862a'; cx.fillRect(xx*T+6,yy*T+12,20,14); cx.fillStyle='#ffd76a'; cx.fillRect(xx*T+6,yy*T+12,20,4); cx.fillStyle='#6b4a12'; cx.fillRect(xx*T+15,yy*T+18,3,6);} }
  // scrolls
  for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){ if(grid[yy][xx]===SCROLL){ cx.fillStyle='#e8d9b0'; cx.fillRect(xx*T+8,yy*T+9,17,15); cx.fillStyle='#8a6a3a'; for(let l=0;l<3;l++)cx.fillRect(xx*T+11,yy*T+13+l*4,11,1); } }
  // potions
  for(const p of potions){ cx.fillStyle='#e46'; cx.fillRect(p.x*T+11,p.y*T+12,10,14); cx.fillStyle='#f9b'; cx.fillRect(p.x*T+13,p.y*T+8,6,5); }
  // torches
  for(const t of torches){ cx.fillStyle='#6b4a12'; cx.fillRect(t.x*T+14,t.y*T+16,4,10); cx.fillStyle='#ffb020'; cx.beginPath(); cx.arc(t.x*T+16,t.y*T+12,6,0,7); cx.fill(); cx.fillStyle='#ffe680'; cx.beginPath(); cx.arc(t.x*T+16,t.y*T+11,3,0,7); cx.fill(); }
  // enemies
  for(const e of enemies){ const R=e.boss?14:10; cx.fillStyle=e.boss?'#c33':(e.type==='archer'?'#7a4fd0':'#e55'); cx.beginPath(); cx.arc(e.x*T+T/2,e.y*T+T/2,R,0,7); cx.fill(); cx.fillStyle='#300'; const o=e.boss?8:10; cx.fillRect(e.x*T+o,e.y*T+12,4,4); cx.fillRect(e.x*T+T-o-4,e.y*T+12,4,4); if(e.type==='archer'){ cx.strokeStyle='#e8d0ff'; cx.lineWidth=2; cx.beginPath(); cx.arc(e.x*T+T/2,e.y*T+T/2,R-3,0,7); cx.stroke(); } }
  // map reveal overlay
  if(Date.now()<revealUntil){
    cx.globalAlpha=0.85; cx.fillStyle='#0b0d1a'; cx.fillRect(0,0,cv.width,cv.height);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const v=grid[y][x]; if(v===WALL) continue;
      cx.fillStyle = v===STAIRS?'#6cf' : v===DOOR?'#7a4a1e' : v===TRAP?'#a33' : v===CHEST?'#ffd76a' : v===SCROLL?'#e8d9b0' : '#3a4a5a';
      cx.fillRect(x*T+3,y*T+3,T-6,T-6); }
    cx.fillStyle='#8f9'; cx.fillRect(player.x*T+6,player.y*T+6,T-12,T-12);
    cx.globalAlpha=1;
  }
  // darkness: reveal tiles near player, dim the rest
  const rr=player.torch?7.8:4.7, R2=rr*rr;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const dx=x-player.x, dy=y-player.y, d2=dx*dx+dy*dy;
    if(d2<R2) seen[y][x]=true;
    if(!seen[y][x]){ cx.fillStyle='#05060c'; cx.fillRect(x*T,y*T,T,T); }
    else if(d2>=R2){ cx.fillStyle='rgba(5,6,12,0.42)'; cx.fillRect(x*T,y*T,T,T); }
  }
  // player
  cx.fillStyle='#8f9'; cx.beginPath(); cx.arc(player.x*T+T/2,player.y*T+T/2,11,0,7); cx.fill();
  cx.fillStyle='#042'; cx.fillRect(player.x*T+11,player.y*T+12,3,4); cx.fillRect(player.x*T+18,player.y*T+12,3,4);
}

function walkable(x,y){
  if(x<0||y<0||x>=W||y>=H) return false;
  const v=grid[y][x];
  if(v===WALL) return false;
  if(v===TRAP) return true;
  if(v===DOOR){ if(keys.length>0){ keys.pop(); grid[y][x]=FLOOR; msg('unlocked a door'); updateHud(); return true;} else { msg('need a key'); return false; } }
  return true;
}

function bumpEnemy(x,y){
  return enemies.find(e=>e.x===x&&e.y===y);
}

function playerMove(dx,dy){
  const nx=player.x+dx, ny=player.y+dy;
  const en=bumpEnemy(nx,ny);
  if(en){ en.hp-=(player.atk||1)*2; if(en.hp<=0){ const ex=en.x, ey=en.y; const wasBoss=en.boss; const wasSlime=en.type==='slime'; enemies=enemies.filter(e=>e!==en); kills=(kills||0)+1; if(wasSlime && Math.random()<0.5){ for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){ if(enemies.length>12) break; const sx2=ex+ox, sy2=ey+oy; if(grid[sy2]&&grid[sy2][sx2]===FLOOR && !bumpEnemy(sx2,sy2) && !(sx2===player.x&&sy2===player.y)) enemies.push({x:sx2,y:sy2,hp:1,dmg:1,type:'slime'}); } } let drop=''; if(wasBoss){ keys.push({x:ex,y:ey}); drop=' + a key'; } else if(Math.random()<0.35){ potions.push({x:ex,y:ey}); drop=' + a potion'; } else if(Math.random()<0.12){ keys.push({x:ex,y:ey}); drop=' + a key'; } msg((wasBoss?'BOSS DOWN 🗝':'killed')+drop); } else msg('hit'); afterTurn(); return; }
  if(!walkable(nx,ny)) return;
  player.x=nx; player.y=ny;
  // potion pickup
  if(grid[ny][nx]===TRAP){ player.hp-=2; grid[ny][nx]=FLOOR; msg('spikes! -2 hp'); updateHud(); if(player.hp<=0){ lose(); return; } }
  if(grid[ny][nx]===CHEST){ grid[ny][nx]=FLOOR; player.atk=(player.atk||1)+1; msg('found a blade. atk '+player.atk); updateHud(); }
  if(grid[ny][nx]===SCROLL){ grid[ny][nx]=FLOOR; revealUntil=Date.now()+4000; msg('the map unfolds'); }
  const pot=potions.find(p=>p.x===nx&&p.y===ny);
  if(pot){ potions=potions.filter(p=>p!==pot); player.hp=Math.min(player.maxhp,player.hp+5); msg('+5 hp'); updateHud(); }
  const tor=torches.find(t=>t.x===nx&&t.y===ny);
  if(tor){ torches=torches.filter(t=>t!==tor); player.torch=true; msg('a torch. u can see further now'); updateHud(); }
  if(grid[ny][nx]===STAIRS){
    if(enemies.some(e=>e.boss)){ msg('the boss blocks the way'); return; }
    if(floorNum>=MAXFLOOR){ win(); return; } genFloor(floorNum+1); return;
  }
  afterTurn();
}

function afterTurn(){
  for(const e of enemies){
    const dx=player.x-e.x, dy=player.y-e.y;
    const dist=Math.abs(dx)+Math.abs(dy);
    if(dist===1){ player.hp-=e.dmg; if(player.hp<=0){ lose(); return; } }
    else if(e.type==='archer' && dist<=4 && Math.random()<0.6){ player.hp-=e.dmg; msg('an arrow hits u'); if(player.hp<=0){ lose(); return; } }
    else if(Math.random()<0.75){
      let mx=0,my=0;
      if(Math.abs(dx)>Math.abs(dy)) mx=dx>0?1:-1; else my=dy>0?1:-1;
      const tx=e.x+mx, ty=e.y+my;
      if(grid[ty]&&grid[ty][tx]===FLOOR && !bumpEnemy(tx,ty) && !(tx===player.x&&ty===player.y)){ e.x=tx; e.y=ty; }
    }
  }
  updateHud(); render();
}

function win(){ render(); document.getElementById('msg').textContent='u escaped the dungeon. '+kills+' kills. press r to go again 🗝'; }
function lose(){ render(); document.getElementById('msg').textContent='u died on floor '+floorNum+'. press r'; }

let dead=false;
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(document.getElementById('msg').textContent.includes('died')||document.getElementById('msg').textContent.includes('escaped')){
    if(k==='r'){ dead=false; keys=[]; genFloor(1); }
    return;
  }
  let dx=0,dy=0;
  if(k==='w'||k==='arrowup')dy=-1;
  else if(k==='s'||k==='arrowdown')dy=1;
  else if(k==='a'||k==='arrowleft')dx=-1;
  else if(k==='d'||k==='arrowright')dx=1;
  else return;
  e.preventDefault();
  playerMove(dx,dy);
});

genFloor(1);
</script>
</body>
</html>
