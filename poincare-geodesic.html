<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>poincare geodesics</title>
<style>
  :root{--bg:#0b0d12;--fg:#e8ecf4;--dim:#7a8699;--acc:#7ad0ff;--acc2:#ff9ecb}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  #wrap{display:flex;height:100%;flex-direction:column}
  header{padding:14px 18px;border-bottom:1px solid #1b2130}
  h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}
  .sub b{color:var(--acc)}
  #stage{flex:1;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
  #hud{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--dim);pointer-events:none;line-height:1.7}
  #hud b{color:var(--fg)}
  button{background:#161c28;color:var(--fg);border:1px solid #2a3448;border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--acc)}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>poincar&eacute; geodesics</h1>
    <div class="sub">click two points in the disk &mdash; the <b>hyperbolic straight line</b> between them appears as an arc orthogonal to the boundary. click a third point to start over. <button id="clear">clear</button></div>
  </header>
  <div id="stage"><canvas id="c"></canvas><div id="hud"></div></div>
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const hud=document.getElementById('hud');
let W=0,H=0,cx=0,cy=0,R=0,dpr=1;
let pts=[]; // points in disk coords (unit disk)

function resize(){
  const r=cv.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  W=r.width; H=r.height;
  cx=W/2; cy=H/2; R=Math.min(W,H)*0.42;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize',resize);

// to/from screen
function toScreen(p){ return [cx+p[0]*R, cy+p[1]*R]; }
function fromScreen(x,y){ return [(x-cx)/R,(y-cy)/R]; }

// geodesic through two interior points a,b (unit disk): circle orthogonal to unit circle
// center c on perpendicular bisector, |c|^2 = 1 + r^2  (orthogonality to unit circle)
function geodesicArc(a,b){
  // if nearly collinear with origin, it's a diameter
  const cross=a[0]*b[1]-a[1]*b[0];
  if(Math.abs(cross)<1e-6){
    // diameter: extend a and b to boundary and draw straight
    return {diameter:true};
  }
  // solve for center c=(cx,cy): |c-a|^2=|c-b|^2 and |c|^2=1+r^2 where r=|c-a|
  // |c-a|^2=|c-b|^2 => 2 c.(b-a) = |b|^2-|a|^2
  const ax=a[0],ay=a[1],bx=b[0],by=b[1];
  const dx=bx-ax, dy=by-ay;
  const rhs=(bx*bx+by*by)-(ax*ax+ay*ay);
  // c satisfies c.(b-a)=rhs/2 -> one linear constraint. plus |c|^2=1+|c-a|^2 => |c|^2=1+|c|^2-2c.a+|a|^2 => 2 c.a = 1+|a|^2
  // two linear equations for c:
  // c.(b-a)=rhs/2
  // c.a=(1+|a|^2)/2
  const A1=dx, B1=dy, C1=rhs/2;
  const A2=ax, B2=ay, C2=(1+ax*ax+ay*ay)/2;
  const det=A1*B2-A2*B1;
  if(Math.abs(det)<1e-12) return {diameter:true};
  const ccx=(C1*B2-C2*B1)/det;
  const ccy=(A1*C2-A2*C1)/det;
  const rad=Math.hypot(ax-ccx,ay-ccy);
  return {cx:ccx,cy:ccy,r:rad};
}

function drawArc(g,a,b){
  const [sax,say]=toScreen(a);
  const [sbx,sby]=toScreen(b);
  if(g.diameter){
    // extend the line a-b to the unit circle in both directions
    const dx=b[0]-a[0],dy=b[1]-a[1];
    const L=Math.hypot(dx,dy);
    const ux=dx/L,uy=dy/L;
    // find t so a+t*u on unit circle
    const t1=(-(a[0]*ux+a[1]*uy))+Math.sqrt((a[0]*ux+a[1]*uy)**2-(a[0]*a[0]+a[1]*a[1])+1);
    const t2=(-(a[0]*ux+a[1]*uy))-Math.sqrt((a[0]*ux+a[1]*uy)**2-(a[0]*a[0]+a[1]*a[1])+1);
    const p1=[a[0]+t1*ux,a[1]+t1*uy];
    const p2=[a[0]+t2*ux,a[1]+t2*uy];
    const [x1,y1]=toScreen(p1),[x2,y2]=toScreen(p2);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    return;
  }
  // arc of circle (g.cx,g.cy,g.r) between angles of a and b
  const [scx,scy]=toScreen([g.cx,g.cy]);
  const sr=g.r*R;
  let a1=Math.atan2(say-scy,sax-scx);
  let a2=Math.atan2(sby-scy,sbx-scx);
  // choose the shorter arc
  let da=a2-a1;
  while(da>Math.PI)da-=2*Math.PI;
  while(da<-Math.PI)da+=2*Math.PI;
  ctx.beginPath();
  ctx.arc(scx,scy,sr,a1,a1+da,da<0);
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // boundary circle
  ctx.strokeStyle='#2a3448'; ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,R,0,2*Math.PI);ctx.stroke();
  // faint radial grid
  ctx.strokeStyle='rgba(122,134,153,.12)';ctx.lineWidth=1;
  for(let i=0;i<12;i++){const ang=i/12*2*Math.PI;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(ang)*R,cy+Math.sin(ang)*R);ctx.stroke();}
  // geodesic
  if(pts.length>=2){
    ctx.strokeStyle='#7ad0ff';ctx.lineWidth=2.2;ctx.shadowColor='#7ad0ff';ctx.shadowBlur=8;
    const g=geodesicArc(pts[0],pts[1]);
    drawArc(g,pts[0],pts[1]);
    ctx.shadowBlur=0;
  }
  // points
  for(let i=0;i<pts.length;i++){
    const [x,y]=toScreen(pts[i]);
    ctx.fillStyle=(i===0)?'#ff9ecb':'#7ad0ff';
    ctx.beginPath();ctx.arc(x,y,5,0,2*Math.PI);ctx.fill();
  }
  updateHud();
}

function updateHud(){
  if(pts.length===0){hud.innerHTML='pick a first point';return;}
  if(pts.length===1){hud.innerHTML='pick a second point';return;}
  // hyperbolic distance between the two points
  const [a,b]=pts;
  const num=2*((a[0]-b[0])**2+(a[1]-b[1])**2);
  const den=(1-(a[0]*a[0]+a[1]*a[1]))*(1-(b[0]*b[0]+b[1]*b[1]));
  const d=Math.acosh(1+num/den);
  hud.innerHTML=`hyperbolic distance <b>${d.toFixed(3)}</b> &nbsp; (euclidean chord ${Math.hypot(a[0]-b[0],a[1]-b[1]).toFixed(3)})`;
}

cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  let p=fromScreen(x,y);
  const rho=Math.hypot(p[0],p[1]);
  if(rho>=0.999) return; // outside disk
  if(pts.length>=2) pts=[];
  pts.push(p);
  draw();
});

document.getElementById('clear').addEventListener('click',()=>{pts=[];draw();});
resize();
</script>
</body>
</html>
