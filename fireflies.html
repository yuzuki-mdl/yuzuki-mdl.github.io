<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fireflies</title>
<style>
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);color:#8aa0b0;font:12px ui-monospace,monospace;opacity:.5;pointer-events:none;user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">move to gather them · click to scatter</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
resize();addEventListener('resize',resize);

const N=90;
const flies=[];
for(let i=0;i<N;i++)flies.push({
  x:Math.random()*W,y:Math.random()*H,
  vx:0,vy:0,
  phase:Math.random()*Math.PI*2,
  speed:0.5+Math.random()*0.6,
  size:1.2+Math.random()*1.6
});

const mouse={x:-999,y:-999,active:false};
cv.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;});
cv.addEventListener('pointerleave',()=>{mouse.active=false;mouse.x=-999;mouse.y=-999;});
cv.addEventListener('pointerdown',e=>{
  for(const f of flies){
    const dx=f.x-e.clientX,dy=f.y-e.clientY,d=Math.hypot(dx,dy)+1;
    const p=180/Math.max(d,30);
    f.vx+=dx/d*p;f.vy+=dy/d*p;
  }
});

let t=0;
function frame(){
  t+=0.016;
  // trail fade
  ctx.fillStyle='rgba(5,7,10,0.18)';
  ctx.fillRect(0,0,W,H);

  for(const f of flies){
    // wander
    const a=f.phase+t*f.speed;
    f.vx+=Math.cos(a)*0.05+Math.cos(a*2.3)*0.03;
    f.vy+=Math.sin(a*1.3)*0.05+Math.sin(a*3.1)*0.03;

    // gather toward pointer
    if(mouse.active){
      const dx=mouse.x-f.x,dy=mouse.y-f.y,d=Math.hypot(dx,dy)+1;
      if(d<220){const p=(1-d/220)*0.4;f.vx+=dx/d*p;f.vy+=dy/d*p;}
    }

    // gentle attraction back to center-ish
    f.vx+=(W/2-f.x)*0.00002;
    f.vy+=(H/2-f.y)*0.00002;

    f.vx*=0.96;f.vy*=0.96;
    f.x+=f.vx;f.y+=f.vy;

    // wrap
    if(f.x<-10)f.x=W+10; if(f.x>W+10)f.x=-10;
    if(f.y<-10)f.y=H+10; if(f.y>H+10)f.y=-10;

    // glow pulse
    const g=0.5+0.5*Math.sin(f.phase+t*3+f.speed*4);
    const r=f.size*(2+g);
    const grad=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r*4);
    grad.addColorStop(0,`rgba(200,255,140,${0.55*(0.4+0.6*g)})`);
    grad.addColorStop(0.4,`rgba(140,220,90,${0.18*(0.4+0.6*g)})`);
    grad.addColorStop(1,'rgba(140,220,90,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(f.x,f.y,r*4,0,Math.PI*2);ctx.fill();

    ctx.fillStyle=`rgba(230,255,180,${0.7+0.3*g})`;
    ctx.beginPath();ctx.arc(f.x,f.y,f.size,0,Math.PI*2);ctx.fill();
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
