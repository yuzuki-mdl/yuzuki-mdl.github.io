<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maze — yuzuki</title>
<style>
  :root{--bg:#0d1117;--fg:#c9d1d9;--teal:#5eead4;--warm:#fbbf24;--dim:#30363d;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 ui-monospace,Menlo,monospace}
  #wrap{display:flex;flex-direction:column;height:100%}
  #top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-bottom:1px solid var(--dim)}
  #top b{color:var(--teal);font-weight:600}
  button{background:#161b22;color:var(--fg);border:1px solid var(--dim);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--teal);color:var(--teal)}
  input[type=range]{width:110px;accent-color:var(--teal)}
  label{color:#8b949e;font-size:12px}
  #canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{background:#010409;border-radius:8px;max-width:100%;max-height:100%}
  #hint{padding:4px 12px;color:#8b949e;font-size:12px}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <b>maze</b>
    <label>size <input id="size" type="range" min="10" max="60" value="30"></label>
    <button id="gen">new maze</button>
    <button id="solve">solve</button>
    <button id="braid">knot it</button>
    <span id="stat" style="color:#8b949e;font-size:12px"></span>
  </div>
  <div id="canvasWrap"><canvas id="c"></canvas></div>
  <div id="hint">recursive-backtracker gen · a* solve · drag to paint walls</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const sizeEl=document.getElementById('size'),statEl=document.getElementById('stat');
let N=30, cell=0, W=0, H=0, grid=[], path=[], solving=false, animId=0;

function idx(x,y){return y*N+x}
function makeGrid(){
  grid=[];
  for(let y=0;y<N;y++){grid.push([]);for(let x=0;x<N;x++)grid[y].push({walls:[1,1,1,1],v:false});}
}
// walls: 0=top 1=right 2=bottom 3=left
const DX=[0,1,0,-1], DY=[-1,0,1,0], OPP=[2,3,0,1];

function genMaze(){
  makeGrid();
  const stack=[];
  let cx=0,cy=0;grid[0][0].v=true;stack.push([0,0]);
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const nbrs=[];
    for(let d=0;d<4;d++){
      const nx=x+DX[d], ny=y+DY[d];
      if(nx>=0&&nx<N&&ny>=0&&ny<N&&!grid[ny][nx].v) nbrs.push([nx,ny,d]);
    }
    if(nbrs.length){
      const [nx,ny,d]=nbrs[(Math.random()*nbrs.length)|0];
      grid[y][x].walls[d]=0;
      grid[ny][nx].walls[OPP[d]]=0;
      grid[ny][nx].v=true;
      stack.push([nx,ny]);
    } else stack.pop();
  }
  path=[];
}

function braid(){
  // knock out some dead ends to create loops
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const g=grid[y][x];
    const open=g.walls.filter(w=>!w).length;
    if(open===1 && Math.random()<0.7){
      const closed=[];
      for(let d=0;d<4;d++) if(g.walls[d]) closed.push(d);
      const d=closed[(Math.random()*closed.length)|0];
      const nx=x+DX[d], ny=y+DY[d];
      if(nx>=0&&nx<N&&ny>=0&&ny<N){ g.walls[d]=0; grid[ny][nx].walls[OPP[d]]=0; }
    }
  }
  path=[];draw();
}

function solve(){
  // A* from 0,0 to N-1,N-1
  const open=[{x:0,y:0,g:0,f:0}];
  const came={}; const gScore={};
  const key=(x,y)=>x+','+y;
  gScore[key(0,0)]=0;
  const h=(x,y)=>Math.abs(x-(N-1))+Math.abs(y-(N-1));
  let found=false;
  while(open.length){
    open.sort((a,b)=>a.f-b.f);
    const cur=open.shift();
    if(cur.x===N-1&&cur.y===N-1){found=true;break;}
    const g=grid[cur.y][cur.x];
    for(let d=0;d<4;d++){
      if(g.walls[d]) continue;
      const nx=cur.x+DX[d], ny=cur.y+DY[d];
      if(nx<0||nx>=N||ny<0||ny>=N) continue;
      const tg=gScore[key(cur.x,cur.y)]+1;
      const k=key(nx,ny);
      if(gScore[k]===undefined||tg<gScore[k]){
        gScore[k]=tg; came[k]=[cur.x,cur.y];
        open.push({x:nx,y:ny,g:tg,f:tg+h(nx,ny)});
      }
    }
  }
  path=[];
  if(found){
    let x=N-1,y=N-1;
    while(!(x===0&&y===0)){ path.push([x,y]); const p=came[key(x,y)]; x=p[0];y=p[1]; }
    path.push([0,0]); path.reverse();
  }
  animateSolve();
}

function animateSolve(){
  cancelAnimationFrame(animId);
  let i=0; solving=true;
  const shown=[];
  function step(){
    if(i>=path.length){solving=false;return;}
    shown.push(path[i]);
    draw(shown);
    i++;
    if(i<path.length) animId=requestAnimationFrame(step);
    else {solving=false; draw(path);}
  }
  step();
}

function resize(){
  const wrap=document.getElementById('canvasWrap');
  const maxW=wrap.clientWidth-20, maxH=wrap.clientHeight-20;
  const px=Math.max(6,Math.min(maxW,maxH));
  cell=Math.floor(px/N);
  W=H=cell*N+1;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  c.width=W*dpr; c.height=H*dpr;
  c.style.width=W+'px'; c.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

function draw(shownPath){
  ctx.clearRect(0,0,W,H);
  // path
  if(shownPath&&shownPath.length){
    ctx.strokeStyle='rgba(251,191,36,0.85)'; ctx.lineWidth=Math.max(1.5,cell*0.22);
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath();
    for(let i=0;i<shownPath.length;i++){
      const [x,y]=shownPath[i];
      const px=x*cell+cell/2, py=y*cell+cell/2;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  // walls
  ctx.strokeStyle='#5eead4'; ctx.lineWidth=Math.max(1,cell*0.12); ctx.lineCap='square';
  ctx.beginPath();
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const g=grid[y][x];
    const px=x*cell, py=y*cell;
    if(g.walls[0]){ctx.moveTo(px,py);ctx.lineTo(px+cell,py);}
    if(g.walls[1]){ctx.moveTo(px+cell,py);ctx.lineTo(px+cell,py+cell);}
    if(g.walls[2]){ctx.moveTo(px,py+cell);ctx.lineTo(px+cell,py+cell);}
    if(g.walls[3]){ctx.moveTo(px,py);ctx.lineTo(px,py+cell);}
  }
  ctx.stroke();
  // start/end dots
  if(cell>=6){
    ctx.fillStyle='#5eead4'; ctx.beginPath(); ctx.arc(cell/2,cell/2,Math.max(2,cell*0.18),0,7); ctx.fill();
    ctx.fillStyle='#fbbf24'; ctx.beginPath(); ctx.arc((N-1)*cell+cell/2,(N-1)*cell+cell/2,Math.max(2,cell*0.18),0,7); ctx.fill();
  }
  statEl.textContent=N+'×'+N+' · '+path.length+' step path';
}

// drag to paint walls / carve
let painting=false;
c.addEventListener('pointerdown',e=>{painting=true;carve(e);});
window.addEventListener('pointerup',()=>painting=false);
c.addEventListener('pointermove',e=>{if(painting)carve(e);});
function carve(e){
  const r=c.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/cell), y=Math.floor((e.clientY-r.top)/cell);
  if(x<0||y<0||x>=N||y>=N) return;
  // carve open all walls of this cell (simplify: knock down its walls + neighbors' matching)
  const g=grid[y][x];
  for(let d=0;d<4;d++){
    if(g.walls[d]){
      const nx=x+DX[d], ny=y+DY[d];
      if(nx>=0&&nx<N&&ny>=0&&ny<N){ g.walls[d]=0; grid[ny][nx].walls[OPP[d]]=0; }
    }
  }
  path=[]; draw();
}

function newMaze(){ N=parseInt(sizeEl.value,10); genMaze(); resize(); }

document.getElementById('gen').onclick=newMaze;
document.getElementById('solve').onclick=solve;
document.getElementById('braid').onclick=braid;
sizeEl.oninput=()=>{ /* debounce regen on release */ };
sizeEl.onchange=newMaze;
window.addEventListener('resize',()=>{ if(!solving) resize(); });

newMaze();
</script>
</body>
</html>
