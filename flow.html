<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>flow field</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b10;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:14px;bottom:12px;font:12px/1.5 ui-monospace,monospace;color:#6a6a80;pointer-events:none;user-select:none}
  #hud b{color:#c9c9e0;font-weight:500}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>r</b> reseed &nbsp; <b>space</b> pause &nbsp; click to burst</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = c.width = Math.floor(innerWidth * DPR);
  H = c.height = Math.floor(innerHeight * DPR);
  ctx.fillStyle = '#0b0b10';
  ctx.fillRect(0,0,W,H);
}
addEventListener('resize', resize);
resize();

// --- tiny value noise (hash based, smooth) ---
function hash(x, y, s){
  let h = x * 374761393 + y * 668265263 + s * 2147483647;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
function smooth(t){ return t*t*(3-2*t); }
function noise(x, y, s){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash(xi, yi, s), b = hash(xi+1, yi, s);
  const c2 = hash(xi, yi+1, s), d = hash(xi+1, yi+1, s);
  const u = smooth(xf), v = smooth(yf);
  return (a*(1-u)+b*u)*(1-v) + (c2*(1-u)+d*u)*v;
}

let seed = Math.floor(Math.random()*10000);
let SCALE = 0.0016;   // spatial frequency of the field
let particles = [];
const COUNT = 1400;

function angleAt(x, y){
  // two octaves of noise -> smooth, organic flow
  const n = noise(x*SCALE, y*SCALE, seed) * 0.75
          + noise(x*SCALE*2.7, y*SCALE*2.7, seed+7) * 0.25;
  return n * Math.PI * 4;
}

function spawn(p){
  p.x = Math.random()*W;
  p.y = Math.random()*H;
  p.life = 0;
  p.max = 120 + Math.random()*260;
  p.hue = 190 + Math.random()*120; // cyan -> violet-ish
  p.spd = 0.6 + Math.random()*1.1;
  return p;
}
function reset(){
  particles = [];
  for(let i=0;i<COUNT;i++) particles.push(spawn({}));
  ctx.fillStyle = '#0b0b10';
  ctx.fillRect(0,0,W,H);
}
reset();

let paused = false;
addEventListener('keydown', e=>{
  if(e.key === 'r' || e.key === 'R'){ seed = Math.floor(Math.random()*10000); reset(); }
  if(e.code === 'Space'){ paused = !paused; e.preventDefault(); }
});
addEventListener('pointerdown', e=>{
  // burst: move a chunk of particles to the click
  const x = e.clientX*DPR, y = e.clientY*DPR;
  for(let i=0;i<300;i++){
    const p = particles[Math.floor(Math.random()*particles.length)];
    p.x = x + (Math.random()-0.5)*30;
    p.y = y + (Math.random()-0.5)*30;
    p.life = 0;
  }
});

function frame(){
  if(paused){ requestAnimationFrame(frame); return; }
  // fade previous frame -> trails
  ctx.fillStyle = 'rgba(11,11,16,0.055)';
  ctx.fillRect(0,0,W,H);
  ctx.lineWidth = 1.1 * DPR;

  for(const p of particles){
    const a = angleAt(p.x, p.y);
    const nx = p.x + Math.cos(a)*p.spd*DPR*2.0;
    const ny = p.y + Math.sin(a)*p.spd*DPR*2.0;
    ctx.strokeStyle = `hsla(${p.hue}, 80%, 62%, ${0.55*(1 - p.life/p.max)})`;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(nx, ny);
    ctx.stroke();
    p.x = nx; p.y = ny;
    p.life++;
    if(p.life > p.max || p.x < -50 || p.x > W+50 || p.y < -50 || p.y > H+50){
      spawn(p);
    }
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
