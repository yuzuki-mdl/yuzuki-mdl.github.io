<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tetris</title>
<style>
  :root{--bg:#0d0b14;--fg:#e8e6f0;--dim:#8a86a0;--acc:#b48cff;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;}
  h1{font-size:15px;font-weight:400;color:var(--dim);letter-spacing:.3em;margin:0;text-transform:uppercase;}
  .wrap{display:flex;gap:18px;align-items:flex-start;}
  canvas{background:#08060d;border-radius:8px;box-shadow:0 0 0 1px #221d33, 0 12px 40px -12px #000;display:block;touch-action:none;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:96px;}
  .box{background:#141020;border-radius:8px;padding:10px;}
  .lbl{font-size:10px;color:var(--dim);letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px;}
  .val{font-size:22px;color:var(--fg);}
  #next{display:block;background:#08060d;border-radius:6px;}
  .hint{font-size:10px;color:var(--dim);line-height:1.6;max-width:200px;text-align:center;}
  .over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0d0b14ee;flex-direction:column;gap:12px;z-index:9;}
  .over.show{display:flex;}
  .over h2{margin:0;font-weight:400;font-size:20px;}
  button{background:var(--acc);color:#0d0b14;border:0;padding:10px 22px;border-radius:6px;font-family:inherit;font-size:13px;cursor:pointer;font-weight:600;}
  button:active{transform:translateY(1px);}
</style>
</head>
<body>
<h1>tetris</h1>
<div class="wrap">
  <canvas id="c" width="300" height="600"></canvas>
  <div class="side">
    <div class="box"><div class="lbl">score</div><div class="val" id="score">0</div></div>
    <div class="box"><div class="lbl">lines</div><div class="val" id="lines">0</div></div>
    <div class="box"><div class="lbl">next</div><canvas id="next" width="96" height="96"></canvas></div>
  </div>
</div>
<div class="hint">arrows move/rotate · space hard-drop · p pause</div>
<div class="over" id="over"><h2>game over</h2><button id="again">again</button></div>
<script>
const COLS=10, ROWS=20, CELL=30;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const nc=document.getElementById('next'), nctx=nc.getContext('2d');
const scoreEl=document.getElementById('score'), linesEl=document.getElementById('lines');
const overEl=document.getElementById('over');

const SHAPES={
  I:[[1,1,1,1]],
  O:[[1,1],[1,1]],
  T:[[0,1,0],[1,1,1]],
  S:[[0,1,1],[1,1,0]],
  Z:[[1,1,0],[0,1,1]],
  J:[[1,0,0],[1,1,1]],
  L:[[0,0,1],[1,1,1]],
};
const COLORS={I:'#4fd6e0',O:'#f2d94e',T:'#b48cff',S:'#5ee08a',Z:'#ff6b7a',J:'#5b8cff',L:'#ff9f43'};
const KEYS=Object.keys(SHAPES);

let grid, cur, next, score, lines, dropTimer, dropInterval, paused, dead, bag;

function newGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(null));}
function refillBag(){bag=KEYS.slice();for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}}
function nextPiece(){if(!bag||!bag.length)refillBag();const t=bag.pop();return{t,shape:SHAPES[t].map(r=>r.slice()),x:Math.floor((COLS-SHAPES[t][0].length)/2),y:0};}
function rot(piece){const s=piece.shape;const R=s.length,C=s[0].length;const out=Array.from({length:C},()=>Array(R).fill(0));for(let r=0;r<R;r++)for(let c=0;c<C;c++)out[c][R-1-r]=s[r][c];return out;}
function collides(p){for(let r=0;r<p.shape.length;r++)for(let c=0;c<p.shape[r].length;c++){if(!p.shape[r][c])continue;const x=p.x+c,y=p.y+r;if(x<0||x>=COLS||y>=ROWS)return true;if(y>=0&&grid[y][x])return true;}return false;}
function merge(p){for(let r=0;r<p.shape.length;r++)for(let c=0;c<p.shape[r].length;c++){if(!p.shape[r][c])continue;const y=p.y+r,x=p.x+c;if(y>=0)grid[y][x]=p.t;}}
function clearLines(){let cleared=0;for(let r=ROWS-1;r>=0;r--){if(grid[r].every(c=>c)){grid.splice(r,1);grid.unshift(Array(COLS).fill(null));cleared++;r++;}}if(cleared){const pts=[0,100,300,500,800][cleared]||800;score+=pts;lines+=cleared;scoreEl.textContent=score;linesEl.textContent=lines;dropInterval=Math.max(80,600-(lines*35));}}
function spawn(){cur=next;next=nextPiece();if(collides(cur)){dead=true;overEl.classList.add('show');}}
function tick(){if(paused||dead)return;cur.y++;if(collides(cur)){cur.y--;merge(cur);clearLines();spawn();}}
function move(dx){if(paused||dead)return;cur.x+=dx;if(collides(cur))cur.x-=dx;}
function rotate(){if(paused||dead)return;const s=rot(cur);const old=cur.shape;cur.shape=s;if(collides(cur)){cur.shape=old;return;}/*wall kick*/for(const k of[-1,1,-2,2]){cur.x+=k;if(!collides(cur))return;cur.x-=k;}cur.shape=old;}
function hardDrop(){if(paused||dead)return;while(!collides(cur))cur.y++;cur.y--;merge(cur);clearLines();spawn();}

function cell(ctx2,x,y,color,size,ox=0,oy=0){const px=ox+x*size,py=oy+y*size;ctx2.fillStyle=color;ctx2.fillRect(px+1,py+1,size-2,size-2);ctx2.fillStyle='rgba(255,255,255,.18)';ctx2.fillRect(px+1,py+1,size-2,3);}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);
  // grid lines
  ctx.strokeStyle='#181322';ctx.lineWidth=1;
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,ROWS*CELL);ctx.stroke();}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(COLS*CELL,y*CELL);ctx.stroke();}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c])cell(ctx,c,r,COLORS[grid[r][c]],CELL);
  if(cur&&!dead){for(let r=0;r<cur.shape.length;r++)for(let c=0;c<cur.shape[r].length;c++)if(cur.shape[r][c])cell(ctx,cur.x+c,cur.y+r,COLORS[cur.t],CELL);}
  // next
  nctx.clearRect(0,0,nc.width,nc.height);
  if(next){const s=next.shape,sz=20;const w=s[0].length*sz,h=s.length*sz;const ox=(nc.width-w)/2,oy=(nc.height-h)/2;for(let r=0;r<s.length;r++)for(let c=0;c<s[r].length;c++)if(s[r][c])cell(nctx,c,r,COLORS[next.t],sz,ox,oy);}
}

function reset(){grid=newGrid();score=0;lines=0;dropInterval=600;dropTimer=0;paused=false;dead=false;scoreEl.textContent=0;linesEl.textContent=0;overEl.classList.remove('show');refillBag();next=nextPiece();spawn();}

let last=0;
function loop(t){const dt=t-last;last=t;if(!paused&&!dead){dropTimer+=dt;if(dropTimer>dropInterval){dropTimer=0;tick();}}draw();requestAnimationFrame(loop);}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')move(-1);
  else if(e.key==='ArrowRight')move(1);
  else if(e.key==='ArrowDown')tick();
  else if(e.key==='ArrowUp'||e.key==='x')rotate();
  else if(e.key===' '){e.preventDefault();hardDrop();}
  else if(e.key==='p')paused=!paused;
  else return;
  e.preventDefault();
});
// touch
let tx=0;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>30)move(dx>0?1:-1);else rotate();},{passive:true});
document.getElementById('again').onclick=reset;

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
