<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hat tiler — aperiodic monotile</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#0e0f13; color:#e8e8ea;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; cursor:grab; }
  canvas.drag { cursor:grabbing; }
  #ui { position:fixed; left:14px; top:14px; padding:12px 14px; border-radius:12px;
    background:rgba(20,22,28,.82); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.08); font-size:12px; line-height:1.9;
    max-width:220px; user-select:none; }
  #ui h1 { font-size:12px; margin:0 0 8px; font-weight:600; letter-spacing:.04em;
    color:#9aa0ad; text-transform:lowercase; }
  #ui .row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  button { font:inherit; font-size:12px; color:#e8e8ea; background:#1d2029;
    border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:5px 10px;
    cursor:pointer; transition:background .12s; }
  button:hover { background:#262a35; }
  button.on { background:#2b6cf6; border-color:#2b6cf6; color:#fff; }
  button:disabled { opacity:.35; cursor:default; }
  .stat { color:#7d8492; }
  .stat b { color:#e8e8ea; font-weight:600; }
  .hint { color:#5c6270; font-size:11px; line-height:1.6; margin-top:8px; }
  a { color:#7aa2ff; text-decoration:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>hat tiler</h1>
  <div class="row" id="types"></div>
  <div class="row">
    <button id="grow">grow +1</button>
    <button id="reset">reset</button>
  </div>
  <div class="row">
    <button id="outline" class="on">supertiles</button>
  </div>
  <div class="stat">level <b id="lvl">1</b> · <b id="nhat">4</b> hats</div>
  <div class="hint">drag to pan · scroll to zoom</div>
  <div class="hint">substitution by craig s. kaplan (hatviz, BSD). built by yuzuki.</div>
</div>
<script>
// ---- geometry (after kaplan's hatviz, BSD-3) ----
const r3 = Math.sqrt(3);
const hr3 = r3/2;
const ident = [1,0,0, 0,1,0];
const pt = (x,y)=>({x,y});
const hexPt = (x,y)=>pt(x + 0.5*y, hr3*y);
function inv(T){ const d=T[0]*T[4]-T[1]*T[3];
  return [T[4]/d, -T[1]/d, (T[1]*T[5]-T[2]*T[4])/d, -T[3]/d, T[0]/d, (T[2]*T[3]-T[0]*T[5])/d]; }
function mul(A,B){ return [A[0]*B[0]+A[1]*B[3], A[0]*B[1]+A[1]*B[4], A[0]*B[2]+A[1]*B[5]+A[2],
  A[3]*B[0]+A[4]*B[3], A[3]*B[1]+A[4]*B[4], A[3]*B[2]+A[4]*B[5]+A[5]]; }
const padd=(p,q)=>pt(p.x+q.x,p.y+q.y);
const psub=(p,q)=>pt(p.x-q.x,p.y-q.y);
function trot(a){ const c=Math.cos(a),s=Math.sin(a); return [c,-s,0, s,c,0]; }
const ttrans=(tx,ty)=>[1,0,tx, 0,1,ty];
function rotAbout(p,a){ return mul(ttrans(p.x,p.y), mul(trot(a), ttrans(-p.x,-p.y))); }
const transPt=(M,P)=>pt(M[0]*P.x+M[1]*P.y+M[2], M[3]*P.x+M[4]*P.y+M[5]);
function matchSeg(p,q){ return [q.x-p.x, p.y-q.y, p.x, q.y-p.y, q.x-p.x, p.y]; }
function matchTwo(p1,q1,p2,q2){ return mul(matchSeg(p2,q2), inv(matchSeg(p1,q1))); }
function intersect(p1,q1,p2,q2){
  const d=(q2.y-p2.y)*(q1.x-p1.x)-(q2.x-p2.x)*(q1.y-p1.y);
  const uA=((q2.x-p2.x)*(p1.y-p2.y)-(q2.y-p2.y)*(p1.x-p2.x))/d;
  return pt(p1.x+uA*(q1.x-p1.x), p1.y+uA*(q1.y-p1.y));
}
const hat_outline = [
  hexPt(0,0), hexPt(-1,-1), hexPt(0,-2), hexPt(2,-2),
  hexPt(2,-1), hexPt(4,-2), hexPt(5,-1), hexPt(4,0),
  hexPt(3,0), hexPt(2,2), hexPt(0,3), hexPt(0,2), hexPt(-1,2) ];

// ---- tiles ----
class HatTile {
  constructor(label){ this.label=label; }
  draw(ctx,S,level){ drawPoly(ctx, hat_outline, S, fillFor(this.label), '#11141a', 1); }
  recurseLevels(S,level,cb){ cb(this,S,level); }
}
class MetaTile {
  constructor(shape,width){ this.shape=shape; this.width=width; this.children=[]; }
  addChild(T,geom){ this.children.push({T,geom}); }
  evalChild(n,i){ return transPt(this.children[n].T, this.children[n].geom.shape[i]); }
  draw(ctx,S,level){
    if(level>0){ for(const g of this.children) g.geom.draw(ctx, mul(S,g.T), level-1); }
    else { drawPoly(ctx, this.shape, S, null, '#11141a', this.width); }
  }
  recurseLevels(S,level,cb){
    cb(this,S,level);
    if(level>0) for(const g of this.children) g.geom.recurseLevels(mul(S,g.T), level-1, cb);
  }
  recentre(){
    let cx=0,cy=0; for(const p of this.shape){cx+=p.x;cy+=p.y;}
    cx/=this.shape.length; cy/=this.shape.length;
    const tr=pt(-cx,-cy);
    for(let i=0;i<this.shape.length;i++) this.shape[i]=padd(this.shape[i],tr);
    const M=ttrans(-cx,-cy);
    for(const ch of this.children) ch.T=mul(M,ch.T);
  }
}

const H1_hat=new HatTile('H1'), H_hat=new HatTile('H'), T_hat=new HatTile('T'), P_hat=new HatTile('P'), F_hat=new HatTile('F');

function H_init(){ const H_outline=[pt(0,0),pt(4,0),pt(4.5,hr3),pt(2.5,5*hr3),pt(1.5,5*hr3),pt(-0.5,hr3)];
  const m=new MetaTile(H_outline,2);
  m.addChild(matchTwo(hat_outline[5],hat_outline[7],H_outline[5],H_outline[0]),H_hat);
  m.addChild(matchTwo(hat_outline[9],hat_outline[11],H_outline[1],H_outline[2]),H_hat);
  m.addChild(matchTwo(hat_outline[5],hat_outline[7],H_outline[3],H_outline[4]),H_hat);
  m.addChild(mul(ttrans(2.5,hr3), mul([-0.5,-hr3,0,hr3,-0.5,0],[0.5,0,0,0,-0.5,0])),H1_hat);
  return m; }
function T_init(){ const T_outline=[pt(0,0),pt(3,0),pt(1.5,3*hr3)];
  const m=new MetaTile(T_outline,2);
  m.addChild([0.5,0,0.5,0,0.5,hr3],T_hat); return m; }
function P_init(){ const P_outline=[pt(0,0),pt(4,0),pt(3,2*hr3),pt(-1,2*hr3)];
  const m=new MetaTile(P_outline,2);
  m.addChild([0.5,0,1.5,0,0.5,hr3],P_hat);
  m.addChild(mul(ttrans(0,2*hr3), mul([0.5,hr3,0,-hr3,0.5,0],[0.5,0,0,0,0.5,0])),P_hat);
  return m; }
function F_init(){ const F_outline=[pt(0,0),pt(3,0),pt(3.5,hr3),pt(3,2*hr3),pt(-1,2*hr3)];
  const m=new MetaTile(F_outline,2);
  m.addChild([0.5,0,1.5,0,0.5,hr3],F_hat);
  m.addChild(mul(ttrans(0,2*hr3), mul([0.5,hr3,0,-hr3,0.5,0],[0.5,0,0,0,0.5,0])),F_hat);
  return m; }

function constructPatch(H,T,P,F){
  const rules=[
    ['H'],[0,0,'P',2],[1,0,'H',2],[2,0,'P',2],[3,0,'H',2],[4,4,'P',2],
    [0,4,'F',3],[2,4,'F',3],[4,1,3,2,'F',0],[8,3,'H',0],[9,2,'P',0],
    [10,2,'H',0],[11,4,'P',2],[12,0,'H',2],[13,0,'F',3],[14,2,'F',1],
    [15,3,'H',4],[8,2,'F',1],[17,3,'H',0],[18,2,'P',0],[19,2,'H',2],
    [20,4,'F',3],[20,0,'P',2],[22,0,'H',2],[23,4,'F',3],[23,0,'F',3],
    [16,0,'P',2],[9,4,0,2,'T',2],[4,0,'F',3]
  ];
  const ret=new MetaTile([],H.width);
  const shapes={H,T,P,F};
  for(const r of rules){
    if(r.length===1){ ret.addChild(ident, shapes[r[0]]); }
    else if(r.length===4){
      const poly=ret.children[r[0]].geom.shape; const T=ret.children[r[0]].T;
      const Pp=transPt(T,poly[(r[1]+1)%poly.length]); const Q=transPt(T,poly[r[1]]);
      const nshp=shapes[r[2]]; const npoly=nshp.shape;
      ret.addChild(matchTwo(npoly[r[3]],npoly[(r[3]+1)%npoly.length],Pp,Q),nshp);
    } else {
      const chP=ret.children[r[0]], chQ=ret.children[r[2]];
      const Pp=transPt(chQ.T,chQ.geom.shape[r[3]]); const Q=transPt(chP.T,chP.geom.shape[r[1]]);
      const nshp=shapes[r[4]]; const npoly=nshp.shape;
      ret.addChild(matchTwo(npoly[r[5]],npoly[(r[5]+1)%npoly.length],Pp,Q),nshp);
    }
  }
  return ret;
}
function constructMetatiles(patch){
  const bps1=patch.evalChild(8,2), bps2=patch.evalChild(21,2);
  const rbps=transPt(rotAbout(bps1,-2*Math.PI/3),bps2);
  const p72=patch.evalChild(7,2), p252=patch.evalChild(25,2);
  const llc=intersect(bps1,rbps,patch.evalChild(6,2),p72);
  let w=psub(patch.evalChild(6,2),llc);
  const new_H_outline=[llc,bps1];
  w=transPt(trot(-Math.PI/3),w); new_H_outline.push(padd(new_H_outline[1],w));
  new_H_outline.push(patch.evalChild(14,2));
  w=transPt(trot(-Math.PI/3),w); new_H_outline.push(psub(new_H_outline[3],w));
  new_H_outline.push(patch.evalChild(6,2));
  const new_H=new MetaTile(new_H_outline,patch.width*2);
  for(const ch of [0,9,16,27,26,6,1,8,10,15]) new_H.addChild(patch.children[ch].T,patch.children[ch].geom);

  const new_P_outline=[p72,padd(p72,psub(bps1,llc)),bps1,llc];
  const new_P=new MetaTile(new_P_outline,patch.width*2);
  for(const ch of [7,2,3,4,28]) new_P.addChild(patch.children[ch].T,patch.children[ch].geom);

  const new_F_outline=[bps2,patch.evalChild(24,2),patch.evalChild(25,0),p252,padd(p252,psub(llc,bps1))];
  const new_F=new MetaTile(new_F_outline,patch.width*2);
  for(const ch of [21,20,22,23,24,25]) new_F.addChild(patch.children[ch].T,patch.children[ch].geom);

  const AAA=new_H_outline[2];
  const BBB=padd(new_H_outline[1],psub(new_H_outline[4],new_H_outline[5]));
  const CCC=transPt(rotAbout(BBB,-Math.PI/3),AAA);
  const new_T_outline=[BBB,CCC,AAA];
  const new_T=new MetaTile(new_T_outline,patch.width*2);
  new_T.addChild(patch.children[11].T,patch.children[11].geom);

  new_H.recentre(); new_P.recentre(); new_F.recentre(); new_T.recentre();
  return [new_H,new_T,new_P,new_F];
}

// ---- render ----
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const PAL={ H1:'#2b6cf6', H:'#3f7dff', T:'#f2f4f8', P:'#e6e9f0', F:'#9aa3b5' };
function fillFor(label){ return PAL[label]||'#888'; }

let tiles, level, view, sel='H', showSuper=true;
function reset(){ tiles=[H_init(),T_init(),P_init(),F_init()]; level=1; view={x:0,y:0,s:28}; fit(); draw(); }
function grow(){ if(level>=5) return;
  const patch=constructPatch(...tiles); tiles=constructMetatiles(patch); level++; fit(); draw(); }

function boundsOf(meta,lev){
  // world-space bbox of the hats drawn for this metatile at this level
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  meta.recurseLevels(ident,lev,(t,S)=>{ const shp = t.label ? hat_outline : t.shape;
    if(shp && shp.length){
    for(const p of shp){ const q=transPt(S,p);
      minx=Math.min(minx,q.x);miny=Math.min(miny,q.y);maxx=Math.max(maxx,q.x);maxy=Math.max(maxy,q.y);} } });
  return {minx,miny,maxx,maxy};
}
function fit(){
  const idx={H:0,T:1,P:2,F:3}[sel];
  const b=boundsOf(tiles[idx], level);
  const w=b.maxx-b.minx, h=b.maxy-b.miny;
  const s=Math.min(cv.width/(w+4), cv.height/(h+4));
  const cx=(b.minx+b.maxx)/2, cy=(b.miny+b.maxy)/2;
  view.s=s; view.x=cv.width/2 - cx*s; view.y=cv.height/2 - cy*s;
}

function drawPoly(c, shape, S, fill, stroke, w){
  c.beginPath();
  for(let i=0;i<shape.length;i++){ const q=transPt(S,shape[i]);
    const sx=q.x*view.s+view.x, sy=q.y*view.s+view.y;
    if(i===0) c.moveTo(sx,sy); else c.lineTo(sx,sy); }
  c.closePath();
  if(fill){ c.fillStyle=fill; c.fill(); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=Math.max(0.6,w*view.s*0.06); c.stroke(); }
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#0e0f13'; ctx.fillRect(0,0,cv.width,cv.height);
  const idx={H:0,T:1,P:2,F:3}[sel];
  const root=tiles[idx];
  // hats (deepest fills)
  root.draw(ctx, ident, level);
  // supertile outlines at intermediate levels
  if(showSuper){
    for(let lev=level; lev>=1; lev--){
      root.recurseLevels(ident, lev, (t,S,l)=>{ if(l===lev && t.shape && t.shape.length){
        drawPoly(ctx, t.shape, S, null, 'rgba(255,255,255,0.18)', t.width?t.width:1);
      }});
    }
  }
  // count hats
  let n=0; root.recurseLevels(ident, level, (t)=>{ if(t.label) n++; });
  document.getElementById('lvl').textContent=level;
  document.getElementById('nhat').textContent=n;
}

// ---- ui ----
const typesEl=document.getElementById('types');
for(const t of ['H','T','P','F']){ const b=document.createElement('button'); b.textContent=t;
  if(t===sel) b.classList.add('on');
  b.onclick=()=>{ sel=t; [...typesEl.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); fit(); draw(); };
  typesEl.appendChild(b); }
document.getElementById('grow').onclick=grow;
document.getElementById('reset').onclick=reset;
const ob=document.getElementById('outline');
ob.onclick=()=>{ showSuper=!showSuper; ob.classList.toggle('on',showSuper); draw(); };

// ---- pan/zoom ----
let drag=null;
cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; cv.classList.add('drag'); });
window.addEventListener('pointerup',()=>{ drag=null; cv.classList.remove('drag'); });
window.addEventListener('pointermove',e=>{ if(!drag) return; view.x=drag.vx+(e.clientX-drag.x); view.y=drag.vy+(e.clientY-drag.y); draw(); });
cv.addEventListener('wheel',e=>{ e.preventDefault();
  const f=e.deltaY<0?1.12:1/1.12; const mx=e.clientX,my=e.clientY;
  view.x=mx-(mx-view.x)*f; view.y=my-(my-view.y)*f; view.s*=f; draw(); },{passive:false});

function resize(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio;
  ctx.setTransform(1,0,0,1,0,0); }
addEventListener('resize',()=>{ resize(); fit(); draw(); });
resize(); reset();
</script>
</body>
</html>
