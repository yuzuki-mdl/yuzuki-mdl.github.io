<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ferrofluid</title>
<style>
  html,body{margin:0;height:100%;background:#07070b;overflow:hidden;font-family:ui-monospace,monospace;color:#8ea0b8}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;left:14px;bottom:12px;font-size:12px;line-height:1.5;opacity:.7;pointer-events:none}
  #hud b{color:#9fe}
</style>
</head>
<body>
<canvas id=c></canvas>
<div id=hud><b>drag</b> the magnets &nbsp; <b>space</b> reset &nbsp; bring them together</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
resize();addEventListener('resize',resize);

const N=3000;
let P=[];
function rnd(a,b){return a+Math.random()*(b-a);}

let mags=[];
function reset(){
  const m=Math.min(W,H);
  mags=[
    {x:W/2-m*0.22, y:H/2, r:70, ang:[], ph:0},
    {x:W/2+m*0.22, y:H/2, r:70, ang:[], ph:2.1}
  ];
  const SPIKES=18;
  for(const mg of mags) for(let i=0;i<SPIKES;i++) mg.ang.push(i/SPIKES*Math.PI*2);
  spawn();
}
function spawn(){
  P=[];
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2, r=rnd(40,Math.min(W,H)*0.46);
    P.push({x:W/2+Math.cos(a)*r, y:H/2+Math.sin(a)*r, vx:0, vy:0});
  }
}
reset();

let drag=null;
function pos(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
cv.addEventListener('pointerdown',e=>{
  const p=pos(e);
  for(const mg of mags){ if(Math.hypot(p.x-mg.x,p.y-mg.y)<mg.r+20){ drag=mg; mg.x=p.x; mg.y=p.y; cv.setPointerCapture(e.pointerId); break; } }
});
cv.addEventListener('pointermove',e=>{ if(!drag)return; const p=pos(e); drag.x=p.x; drag.y=p.y; });
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('pointercancel',()=>drag=null);
addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); reset(); } });

let t=0;
function frame(){
  t+=0.016;
  ctx.fillStyle='rgba(7,7,11,0.26)';ctx.fillRect(0,0,W,H);

  for(const mg of mags){
    const g=ctx.createRadialGradient(mg.x,mg.y,2,mg.x,mg.y,mg.r);
    g.addColorStop(0,'rgba(120,200,255,0.8)');
    g.addColorStop(0.5,'rgba(60,120,200,0.2)');
    g.addColorStop(1,'rgba(40,80,140,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(mg.x,mg.y,mg.r,0,7);ctx.fill();
  }

  for(const p of P){
    let near=null, nd=1e9;
    for(const mg of mags){ const d=Math.hypot(mg.x-p.x,mg.y-p.y); if(d<nd){nd=d;near=mg;} }

    for(const mg of mags){
      let dx=mg.x-p.x, dy=mg.y-p.y;
      let d=Math.sqrt(dx*dx+dy*dy)+0.001;
      const pull=1400/(d+30);
      p.vx += (dx/d)*pull*0.02;
      p.vy += (dy/d)*pull*0.02;
    }

    const dx=near.x-p.x, dy=near.y-p.y, d=Math.sqrt(dx*dx+dy*dy)+0.001;
    const ang=Math.atan2(p.y-near.y,p.x-near.x);
    let best=0,bd=9;
    for(let i=0;i<near.ang.length;i++){
      let da=Math.abs(Math.atan2(Math.sin(ang-near.ang[i]),Math.cos(ang-near.ang[i])));
      if(da<bd){bd=da;best=i;}
    }
    const sa=near.ang[best];
    const perp=Math.sin(ang-sa)*d;
    p.vx += -Math.sin(sa)*perp*0.004;
    p.vy +=  Math.cos(sa)*perp*0.004;

    const targetR=55+14*Math.sin(t*0.6+best+near.ph);
    if(d<targetR){ p.vx -= (dx/d)*0.9; p.vy -= (dy/d)*0.9; }

    p.vx*=0.90; p.vy*=0.90;
    p.vx+=rnd(-0.02,0.02); p.vy+=rnd(-0.02,0.02);
    p.x+=p.vx; p.y+=p.vy;

    const glow=Math.max(0,1-nd/220);
    ctx.fillStyle='rgba('+(80+glow*120)+','+(160+glow*70)+',255,'+(0.35+glow*0.5)+')';
    ctx.fillRect(p.x,p.y,1.6,1.6);
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
