<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ferrofluid</title>
<style>
  html,body{margin:0;height:100%;background:#07070b;overflow:hidden;font-family:ui-monospace,monospace;color:#8ea0b8}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;left:14px;bottom:12px;font-size:12px;line-height:1.5;opacity:.7;pointer-events:none}
  #hud b{color:#9fe}
</style>
</head>
<body>
<canvas id=c></canvas>
<div id=hud><b>drag</b> the magnet &nbsp; <b>space</b> reset &nbsp; ferrofluid spikes</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
resize();addEventListener('resize',resize);

let mag={x:innerWidth/2,y:innerHeight/2};
let dragging=false;
const N=2600;
let P=[];
function rnd(a,b){return a+Math.random()*(b-a);}
function spawn(){
  P=[];
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2, r=rnd(40,Math.min(innerWidth,innerHeight)*0.48);
    P.push({x:mag.x+Math.cos(a)*r, y:mag.y+Math.sin(a)*r, vx:0, vy:0});
  }
}
spawn();

function pos(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
cv.addEventListener('pointerdown',e=>{const p=pos(e);const d=Math.hypot(p.x-mag.x,p.y-mag.y);if(d<80){dragging=true;cv.setPointerCapture(e.pointerId);}});
cv.addEventListener('pointermove',e=>{if(!dragging)return;const p=pos(e);mag.x=p.x;mag.y=p.y;});
cv.addEventListener('pointerup',()=>dragging=false);
cv.addEventListener('pointercancel',()=>dragging=false);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();mag.x=innerWidth/2;mag.y=innerHeight/2;spawn();}});

const SPIKES=18;
const spikeAng=[];
for(let i=0;i<SPIKES;i++)spikeAng.push(i/SPIKES*Math.PI*2);

let t=0;
function frame(){
  t+=0.016;
  ctx.fillStyle='rgba(7,7,11,0.28)';ctx.fillRect(0,0,W,H);

  const mg=ctx.createRadialGradient(mag.x,mag.y,2,mag.x,mag.y,70);
  mg.addColorStop(0,'rgba(120,200,255,0.85)');
  mg.addColorStop(0.5,'rgba(60,120,200,0.22)');
  mg.addColorStop(1,'rgba(40,80,140,0)');
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mag.x,mag.y,70,0,7);ctx.fill();

  for(const p of P){
    let dx=mag.x-p.x, dy=mag.y-p.y;
    let d=Math.sqrt(dx*dx+dy*dy)+0.001;
    const pull=1400/(d+30);
    p.vx += (dx/d)*pull*0.02;
    p.vy += (dy/d)*pull*0.02;

    const ang=Math.atan2(p.y-mag.y,p.x-mag.x);
    let best=0,bd=9;
    for(let i=0;i<SPIKES;i++){
      let da=Math.abs(Math.atan2(Math.sin(ang-spikeAng[i]),Math.cos(ang-spikeAng[i])));
      if(da<bd){bd=da;best=i;}
    }
    const sa=spikeAng[best];
    const perp=Math.sin(ang-sa)*d;
    p.vx += -Math.sin(sa)*perp*0.004;
    p.vy +=  Math.cos(sa)*perp*0.004;

    const targetR=55+14*Math.sin(t*0.6+best);
    if(d<targetR){ p.vx -= (dx/d)*0.9; p.vy -= (dy/d)*0.9; }

    p.vx*=0.90; p.vy*=0.90;
    p.vx+=rnd(-0.02,0.02); p.vy+=rnd(-0.02,0.02);
    p.x+=p.vx; p.y+=p.vy;

    const near=Math.max(0,1-d/220);
    ctx.fillStyle='rgba('+(80+near*120)+','+(160+near*70)+',255,'+(0.35+near*0.5)+')';
    ctx.fillRect(p.x,p.y,1.6,1.6);
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
