<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>triangle groups</title>
<style>
  :root{--bg:#0b0d12;--fg:#e8ecf4;--dim:#7a8699;--acc:#7ad0ff;--acc2:#ff9ecb}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  #wrap{display:flex;height:100%;flex-direction:column}
  header{padding:14px 18px;border-bottom:1px solid #1b2130}
  h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:12px;margin-top:4px;max-width:70ch}
  .sub b{color:var(--acc)}
  #stage{flex:1;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--dim);pointer-events:none;line-height:1.7}
  #hud b{color:var(--fg)}
  button,select{background:#161c28;color:var(--fg);border:1px solid #2a3448;border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
  button:hover,select:hover{border-color:var(--acc)}
  .row{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>triangle groups</h1>
    <div class="sub">a hyperbolic triangle with angles <b>&pi;/p, &pi;/q, &pi;/r</b> tiles the disk when 1/p+1/q+1/r &lt; 1. reflecting across its edges generates a <b>reflection group</b>; the tiling is its orbit. pick one &mdash; the disk fills with congruent triangles, each the mirror image of its neighbours.</div>
    <div class="row">
      <select id="grp">
        <option value="2,3,7">(2,3,7) &mdash; the klein quartic / {3,7}</option>
        <option value="2,3,8">(2,3,8) &mdash; order-8 triangle</option>
        <option value="2,4,5">(2,4,5) &mdash; {4,5} dual of {5,4}</option>
        <option value="2,3,9">(2,3,9)</option>
        <option value="2,3,12">(2,3,12)</option>
      </select>
      <button id="reset">reset view</button>
    </div>
  </header>
  <div id="stage"><canvas id="c"></canvas><div id="hud"></div></div>
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const hud=document.getElementById('hud');
let W=0,H=0,cx=0,cy=0,R=0,dpr=1;
let view={ox:0,oy:0,scale:1};
let tris=[]; // each: [{x,y},{x,y},{x,y}] in disk coords
let edges=[]; // mirror geodesics: {type:'line',a}|{type:'circ',c,r}

function resize(){
  const r=cv.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  W=r.width; H=r.height;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2; cy=H/2; R=Math.min(W,H)*0.46;
  draw();
}

// ---- hyperbolic geometry in the poincare disk (unit circle) ----
// geodesic through two boundary-adjacent points p,q inside disk:
// here we build from the fundamental triangle's vertices directly.
function cmul(a,b){return {x:a.x*b.x-a.y*b.y, y:a.x*b.y+a.y*b.x};}
function cadd(a,b){return {x:a.x+b.x,y:a.y+b.y};}
function csub(a,b){return {x:a.x-b.x,y:a.y-b.y};}
function cdiv(a,b){const d=b.x*b.x+b.y*b.y; return {x:(a.x*b.x+a.y*b.y)/d, y:(a.y*b.x-a.x*b.y)/d};}
function cconj(a){return {x:a.x,y:-a.y};}
function cabs(a){return Math.hypot(a.x,a.y);}

// inversion (reflection) in circle centre c radius rho, as a map on the disk
function invCircle(z,c,rho){
  const d=csub(z,c);
  const dd=d.x*d.x+d.y*d.y;
  const k=(rho*rho)/dd;
  return cadd(c,{x:d.x*k,y:d.y*k});
}
// reflection in a diameter through origin at angle th
function reflLine(z,th){
  const c=Math.cos(2*th), s=Math.sin(2*th);
  return {x:c*z.x+s*z.y, y:s*z.x-c*z.y};
}

// reflect a point across the geodesic through boundary pts u,v (unit vectors)
// geodesic = circle orthogonal to unit circle through u,v. handle v=-u (diameter).
function reflGeo(z,u,v){
  // if u,v antipodal -> diameter
  const dot=u.x*v.x+u.y*v.y;
  if(Math.abs(dot+1)<1e-9){
    const th=Math.atan2(u.y,u.x);
    return reflLine(z,th);
  }
  // circle through u,v orthogonal to unit circle. centre c on perpendicular bisector.
  // For orthogonality: |c|^2 = rho^2 + 1.
  // circle through u: |u-c|^2 = rho^2  => 1 - 2 u.c + |c|^2 = rho^2 => 1-2u.c+1=0 => u.c=1
  // so c satisfies u.c=1 and v.c=1.
  const det=u.x*v.y-u.y*v.x;
  const c={x:(1*v.y-u.y*1)/det, y:(u.x*1-1*v.x)/det};
  const rho2=c.x*c.x+c.y*c.y-1;
  const rho=Math.sqrt(Math.max(rho2,1e-12));
  return invCircle(z,c,rho);
}

// fundamental triangle with angles pi/p,pi/q,pi/r, vertex A at origin? 
// place so it's centred-ish. Use standard construction:
// vertices via the (p,q,r) triangle. We build by placing one vertex and reflecting.
// Simpler: build triangle from its three angles using hyperbolic trig, vertices in disk.
function buildFundamental(p,q,r){
  // angles at vertices A=pi/p, B=pi/q, C=pi/r
  // hyperbolic law of cosines for angles: cos A = -cos B cos C + sin B sin C cosh a
  // solve side lengths a (opposite A), etc.
  const A=Math.PI/p, B=Math.PI/q, C=Math.PI/r;
  const coshA=(Math.cos(A)+Math.cos(B)*Math.cos(C))/(Math.sin(B)*Math.sin(C));
  const a=Math.acosh(Math.max(coshA,1)); // side opposite A = BC
  // place B at origin, C along +x at hyperbolic distance a from B
  // so B=(0,0), C=(tanh(a/2),0)
  const Cx=Math.tanh(a/2);
  // angle at B is B: A lies at angle B from BC direction, at hyperbolic distance c=AB
  // side c opposite C: cosh c = (cos C + cos A cos B)/(sin A sin B)
  const coshc=(Math.cos(C)+Math.cos(A)*Math.cos(B))/(Math.sin(A)*Math.sin(B));
  const c=Math.acosh(Math.max(coshc,1));
  // A at hyperbolic distance c from B(origin), direction angle B
  const rA=Math.tanh(c/2);
  const Apos={x:rA*Math.cos(B), y:rA*Math.sin(B)};
  return [{x:0,y:0}, Apos, {x:Cx,y:0}]; // B, A, C
}

function boundaryOf(z1,z2){
  // geodesic through z1,z2 inside disk -> its two boundary points on unit circle
  // if the geodesic is a diameter (z1,z2,0 collinear and through origin)
  const cross=z1.x*z2.y-z1.y*z2.x;
  const d1=z1.x*z1.x+z1.y*z1.y, d2=z2.x*z2.x+z2.y*z2.y;
  // circle through z1,z2 orthogonal to unit circle: centre c with |c|^2=rho^2+1
  // and |z1-c|^2=rho^2 => 1? no: |z1|^2 -2 z1.c +|c|^2 = rho^2 = |c|^2-1 => |z1|^2-2 z1.c = -1 => z1.c=(|z1|^2+1)/2
  const b1=(d1+1)/2, b2=(d2+1)/2;
  const det=z1.x*z2.y-z1.y*z2.x;
  if(Math.abs(det)<1e-9){
    // diameter through origin
    return null;
  }
  const c={x:(b1*z2.y-z1.y*b2)/det, y:(z1.x*b2-b1*z2.x)/det};
  const rho=Math.sqrt(Math.max(c.x*c.x+c.y*c.y-1,1e-12));
  // boundary points: intersection of circle(c,rho) with unit circle
  const d=Math.hypot(c.x,c.y);
  if(d<1e-9) return null;
  const a2=(1 - rho*rho + d*d)/(2*d);
  const h=Math.sqrt(Math.max(1-a2*a2,0));
  const mx=c.x/d*a2, my=c.y/d*a2;
  const px=-c.y/d*h, py=c.x/d*h;
  return [{x:mx+px,y:my+py},{x:mx-px,y:my-py}];
}

function reflectTri(tri, edgeIdx){
  // reflect the triangle across edge edgeIdx (edge from v[edgeIdx] to v[(edgeIdx+1)%3])
  const v0=tri[edgeIdx], v1=tri[(edgeIdx+1)%3];
  const bp=boundaryOf(v0,v1);
  let refl;
  if(!bp){ // diameter
    const th=Math.atan2(v0.y,v0.x);
    refl=z=>reflLine(z,th);
  } else {
    const u=bp[0], v=bp[1];
    refl=z=>reflGeo(z,u,v);
  }
  return tri.map(refl);
}

function centroid(tri){
  return {x:(tri[0].x+tri[1].x+tri[2].x)/3, y:(tri[0].y+tri[1].y+tri[2].y)/3};
}

function genTiling(p,q,r,maxTris){
  const fund=buildFundamental(p,q,r);
  tris=[];
  const seen=new Set();
  const key=t=>{const c=centroid(t);return Math.round(c.x*1e5)+','+Math.round(c.y*1e5);};
  const queue=[{tri:fund,depth:0}];
  seen.add(key(fund));
  tris.push(fund);
  while(queue.length && tris.length<maxTris){
    const cur=queue.shift();
    if(cur.depth>=18) continue;
    for(let e=0;e<3;e++){
      const nt=reflectTri(cur.tri,e);
      const k=key(nt);
      if(seen.has(k)) continue;
      // must stay inside disk
      if(nt.some(v=>v.x*v.x+v.y*v.y>1.0001)) continue;
      seen.add(k);
      tris.push(nt);
      queue.push({tri:nt,depth:cur.depth+1});
    }
  }
}

// ---- drawing ----
function toScreen(z){
  return {x:cx+(z.x*view.scale+view.ox)*R, y:cy-(z.y*view.scale+view.oy)*R};
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // disk boundary
  ctx.beginPath();
  ctx.arc(cx,cy,R*view.scale,0,Math.PI*2);
  ctx.strokeStyle='#2a3448'; ctx.lineWidth=1; ctx.stroke();

  // triangles, colored by centroid angle for a subtle rainbow
drawTris: for(let i=0;i<tris.length;i++){
    const t=tris[i];
    const c=centroid(t);
    const ang=Math.atan2(c.y,c.x);
    const hue=(ang*180/Math.PI+360)%360;
    const rad=c.x*c.x+c.y*c.y;
    const light=18+rad*30;
    ctx.beginPath();
    for(let j=0;j<3;j++){
      const s=toScreen(t[j]);
      if(j===0) ctx.moveTo(s.x,s.y); else ctx.lineTo(s.x,s.y);
    }
    ctx.closePath();
    ctx.fillStyle=`hsl(${hue},45%,${light}%)`;
    ctx.fill();
    ctx.strokeStyle='rgba(232,236,244,0.10)'; ctx.lineWidth=0.6; ctx.stroke();
  }

  hud.innerHTML=`<b>${tris.length}</b> triangles &nbsp; &middot; &nbsp; group (${curP},${curQ},${curR})`;
}

let curP=2,curQ=3,curR=7;
function rebuild(){
  const [p,q,r]=document.getElementById('grp').value.split(',').map(Number);
  curP=p;curQ=q;curR=r;
  genTiling(p,q,r,3000);
  view={ox:0,oy:0,scale:1};
  draw();
}

// pan/zoom + drag
document.getElementById('grp').addEventListener('change',rebuild);
document.getElementById('reset').addEventListener('click',rebuild);

let drag=null;
cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,ox:view.ox,oy:view.oy};});
window.addEventListener('mouseup',()=>drag=null);
window.addEventListener('mousemove',e=>{
  if(!drag) return;
  view.ox=drag.ox+(e.clientX-drag.x)/R;
  view.oy=drag.oy-(e.clientY-drag.y)/R;
  draw();
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.08:1/1.08;
  view.scale*=f;
  draw();
},{passive:false});

window.addEventListener('resize',resize);
resize();
rebuild();
</script>
</body>
</html>
