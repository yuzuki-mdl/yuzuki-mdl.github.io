<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>peg solitaire</title>
<style>
  :root{--bg:#14110e;--hole:#2a241e;--peg:#e8c07d;--peg2:#f0d29a;--sel:#7fd1c0;--txt:#d8cdbc}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(circle at 50% 30%,#1d1813,#0e0c09 80%);color:var(--txt);font:15px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;gap:14px;padding:20px}
  h1{font-weight:500;letter-spacing:2px;font-size:18px;margin:0;opacity:.85}
  #wrap{position:relative}
  canvas{display:block;cursor:pointer;touch-action:manipulation}
  #hud{display:flex;gap:22px;align-items:center;font-size:14px;opacity:.8}
  #hud b{color:var(--peg2);font-weight:600}
  button{background:#2a241e;color:var(--txt);border:1px solid #3a322a;padding:7px 14px;border-radius:7px;font:inherit;cursor:pointer}
  button:hover{background:#332b23;border-color:#4a4034}
  button:disabled{opacity:.35;cursor:default}
  #msg{min-height:20px;color:var(--sel);font-size:14px;opacity:0;transition:opacity .3s}
  #msg.on{opacity:1}
</style>
</head>
<body>
<h1>PEG SOLITAIRE</h1>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">
  <span>pegs left: <b id="left">32</b></span>
  <button id="undo">undo</button>
  <button id="reset">restart</button>
</div>
<div id="msg"></div>
<script>
// english cross board: 7x7 with corners cut
const N=7, R=30, GAP=6;
const cell = R*2+GAP;
// valid: full 7x7 minus the 2x2 corners
function valid(r,c){
  if(r<0||r>=N||c<0||c>=N) return false;
  const corner = (r<2||r>4)&&(c<2||c>4);
  return !corner;
}
const W=N*cell, H=N*cell;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=W*dpr; cv.height=H*dpr;
cv.style.width=W+'px'; cv.style.height=H+'px';
ctx.scale(dpr,dpr);

let board, sel, history, won;
function init(){
  board=[];
  for(let r=0;r<N;r++){board.push([]);for(let c=0;c<N;c++) board[r][c]= valid(r,c)?1:0;}
  board[3][3]=0; // center empty
  sel=null; history=[]; won=false;
  setMsg('');
  draw(); updHud();
}
function pegCount(){let n=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c])n++;return n;}
function updHud(){document.getElementById('left').textContent=pegCount();}
function setMsg(t){const m=document.getElementById('msg');m.textContent=t;m.classList.toggle('on',!!t);}

const DIRS=[[0,1],[0,-1],[1,0],[-1,0]];
function canJump(r,c,dr,dc){
  const r1=r+dr,c1=c+dc,r2=r+2*dr,c2=c+2*dc;
  if(!valid(r2,c2)) return false;
  return board[r][c]===1 && board[r1][c1]===1 && board[r2][c2]===0;
}
function anyMove(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(board[r][c]!==1)continue;
    for(const [dr,dc] of DIRS) if(canJump(r,c,dr,dc)) return true;
  }
  return false;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!valid(r,c))continue;
    const x=c*cell+cell/2, y=r*cell+cell/2;
    // hole
    ctx.beginPath();ctx.arc(x,y,R,0,7);
    ctx.fillStyle='#2a241e';ctx.fill();
    ctx.lineWidth=1.5;ctx.strokeStyle='#0a0806';ctx.stroke();
    // inner shadow
    ctx.beginPath();ctx.arc(x,y,R-3,0,7);
    ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=2;ctx.stroke();
    if(board[r][c]){
      const g=ctx.createRadialGradient(x-R*.35,y-R*.35,2,x,y,R);
      g.addColorStop(0,'#f4dca6');g.addColorStop(.6,'#e0b877');g.addColorStop(1,'#a97e42');
      ctx.beginPath();ctx.arc(x,y,R-4,0,7);
      ctx.fillStyle=g;ctx.fill();
      ctx.beginPath();ctx.arc(x-R*.3,y-R*.3,R*.28,0,7);
      ctx.fillStyle='rgba(255,255,255,.5)';ctx.fill();
    }
    if(sel && sel[0]===r && sel[1]===c){
      ctx.beginPath();ctx.arc(x,y,R-2,0,7);
      ctx.strokeStyle='#7fd1c0';ctx.lineWidth=3;ctx.stroke();
    }
  }
}

function px(e){
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left), y=(e.clientY-rect.top);
  const c=Math.floor(x/cell), r=Math.floor(y/cell);
  return [r,c];
}

cv.addEventListener('click',e=>{
  if(won) return;
  const [r,c]=px(e);
  if(!valid(r,c))return;
  if(board[r][c]===1){
    // select a peg, or try jump if one selected
    if(sel){
      const dr=r-sel[0], dc=c-sel[1];
      const isJump = Math.abs(dr)+Math.abs(dc)===2 && (dr===0||dc===0);
      if(isJump){
        const mr=sel[0]+dr/2, mc=sel[1]+dc/2;
        if(board[mr][mc]===1 && board[r][c]===0){
          // can't jump onto a peg; but target is peg here so no
        }
      }
    }
    sel=[r,c]; draw(); return;
  }
  // clicked empty hole
  if(sel){
    const dr=r-sel[0], dc=c-sel[1];
    if(Math.abs(dr)+Math.abs(dc)===2 && (dr===0||dc===0)){
      const mr=sel[0]+dr/2, mc=sel[1]+dc/2;
      if(board[sel[0]][sel[1]]===1 && board[mr][mc]===1 && board[r][c]===0){
        history.push({from:[...sel],over:[mr,mc],to:[r,c]});
        board[sel[0]][sel[1]]=0; board[mr][mc]=0; board[r][c]=1;
        sel=null; draw(); updHud(); checkEnd(); return;
      }
    }
    // invalid target: reselect nothing
    sel=[r,c]; draw();
  }
});

function checkEnd(){
  const n=pegCount();
  if(n===1){won=true;setMsg('solved — one peg. nice.');return;}
  if(!anyMove()){setMsg('no moves left. '+n+' pegs stuck.');return;}
  setMsg('');
}

function undo(){
  const h=history.pop();
  if(!h){return;}
  board[h.from[0]][h.from[1]]=1;
  board[h.over[0]][h.over[1]]=1;
  board[h.to[0]][h.to[1]]=0;
  sel=null; won=false; setMsg(''); draw(); updHud();
}

document.getElementById('undo').addEventListener('click',undo);
document.getElementById('reset').addEventListener('click',init);

init();
</script>
</body>
</html>
