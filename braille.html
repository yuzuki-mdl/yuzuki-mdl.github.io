<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>braille raymarcher</title>
<style>
  :root { --bg:#0b0d10; --fg:#d6f5e6; --dim:#3a4a44; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  .wrap { display:flex; flex-direction:column; align-items:center; gap:14px; padding:24px; }
  h1 { font-size:15px; font-weight:500; letter-spacing:.08em; text-transform:lowercase;
       color:var(--fg); margin:0; }
  .sub { font-size:12px; color:var(--dim); max-width:640px; text-align:center; line-height:1.5; }
  pre { margin:0; line-height:1.0; font-size:14px; white-space:pre; user-select:none; }
  .bar { display:flex; gap:10px; align-items:center; font-size:12px; color:var(--dim); }
  button { background:none; border:1px solid var(--dim); color:var(--fg);
    font:inherit; font-size:12px; padding:4px 10px; border-radius:4px; cursor:pointer; }
  button:hover { border-color:var(--fg); }
  a { color:var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <h1>braille raymarcher</h1>
  <div class="sub">a raymarched scene rendered as unicode braille dots — each character cell holds a 2&times;4 dot grid, so the whole thing is text you can copy. drag to orbit.</div>
  <pre id="out"></pre>
  <div class="bar">
    <button id="spin">pause spin</button>
    <button id="res">density</button>
    <span id="info"></span>
    <a href="index.html">&larr; home</a>
  </div>
</div>
<script>
// braille dot bit positions inside a 2x4 cell:
// (col,row) -> bit
const DOT = [
  [0x01, 0x02, 0x04, 0x40], // col 0, rows 0..3
  [0x08, 0x10, 0x20, 0x80], // col 1, rows 0..3
];

const out = document.getElementById('out');
const info = document.getElementById('info');

let cols = 44;          // character columns
let spin = true;
let ang = 0.6;
let pitch = 0.35;

try {
  const q = new URLSearchParams(location.search);
  if (q.has('c')) cols = Math.max(16, Math.min(120, +q.get('c') || cols));
  if (q.has('a')) { ang = +q.get('a'); spin = false; }
  if (q.has('p')) pitch = +q.get('p');
} catch(e){}

// ---- scene: signed distance field ----
function sdSphere(p, r){ return Math.hypot(p[0],p[1],p[2]) - r; }
function sdTorus(p, R, r){
  const q = Math.hypot(p[0], p[2]) - R;
  return Math.hypot(q, p[1]) - r;
}
function sdBox(p, b){
  const x = Math.abs(p[0])-b[0], y = Math.abs(p[1])-b[1], z = Math.abs(p[2])-b[2];
  const m = Math.max(x, Math.max(y,z));
  return Math.hypot(Math.max(x,0),Math.max(y,0),Math.max(z,0)) + Math.min(m,0);
}
function rotY(p, a){
  const c = Math.cos(a), s = Math.sin(a);
  return [p[0]*c + p[2]*s, p[1], -p[0]*s + p[2]*c];
}
function rotX(p, a){
  const c = Math.cos(a), s = Math.sin(a);
  return [p[0], p[1]*c - p[2]*s, p[1]*s + p[2]*c];
}
function mod(a, m){ return a - m*Math.floor(a/m + 0.5); }

function map(p){
  // p in world space
  let q = rotX(rotY(p, ang), pitch);
  // central sphere
  let d = sdSphere(q, 1.0);
  // torus ring
  d = Math.min(d, sdTorus([q[0], q[1]-0.0, q[2]], 1.7, 0.28));
  // orbiting boxes
  const t = ang;
  for (let i=0;i<3;i++){
    const a = t + i*Math.PI*2/3;
    const bx = Math.cos(a)*2.5, bz = Math.sin(a)*2.5;
    const bp = [q[0]-bx, q[1], q[2]-bz];
    d = Math.min(d, sdBox(rotY(bp, a), [0.28,0.28,0.28]) - 0.05);
  }
  return d;
}

function normal(p, e){
  const dx = map([p[0]+e,p[1],p[2]]) - map([p[0]-e,p[1],p[2]]);
  const dy = map([p[0],p[1]+e,p[2]]) - map([p[0],p[1]-e,p[2]]);
  const dz = map([p[0],p[1],p[2]+e]) - map([p[0],p[1],p[2]-e]);
  const l = Math.hypot(dx,dy,dz) || 1;
  return [dx/l, dy/l, dz/l];
}

// ---- render to braille ----
let rows = 0;
function render(){
  const cw = window.innerWidth, ch = window.innerHeight;
  // fit roughly: each char ~8.4px wide, ~14px tall at 14px font
  const maxCols = Math.max(24, Math.floor((cw - 60) / 8.4));
  const maxRows = Math.max(12, Math.floor((ch - 220) / 14));
  cols = Math.min(cols, maxCols);
  rows = Math.min(Math.floor(cols * 0.55), maxRows);

  const px = cols * 2;   // dot width
  const py = rows * 4;   // dot height

  // camera
  const cam = [0, 1.3, -3.4];
  const target = [0, 0.1, 0];
  const fwd = norm([target[0]-cam[0], target[1]-cam[1], target[2]-cam[2]]);
  const right = norm(cross(fwd, [0,1,0]));
  const up = cross(right, fwd);
  const fov = 1.05; // scale

  // build char grid
  const chars = new Array(cols * rows);
  for (let cy=0; cy<rows; cy++){
    for (let cx=0; cx<cols; cx++){
      let bits = 0;
      for (let sub=0; sub<8; sub++){
        const dc = sub & 1;      // 0 or 1
        const dr = sub >> 1;     // 0..3
        const ix = cx*2 + dc;
        const iy = cy*4 + dr;
        // screen coords normalized -1..1 (x), aspect (y)
        const sx = (ix + 0.5) / px * 2 - 1;
        const sy = 1 - (iy + 0.5) / py * 2;
        const aspect = px / py;
        const rd = norm([
          fwd[0] + right[0]*sx*fov + up[0]*sy*fov*aspect,
          fwd[1] + right[1]*sx*fov + up[1]*sy*fov*aspect,
          fwd[2] + right[2]*sx*fov + up[2]*sy*fov*aspect,
        ]);
        // march
        let t = 0.1, hit = false;
        for (let s=0; s<48; s++){
          const p = [cam[0]+rd[0]*t, cam[1]+rd[1]*t, cam[2]+rd[2]*t];
          const d = map(p);
          if (d < 0.002){ hit = true; break; }
          t += d;
          if (t > 14) break;
        }
        if (hit){
          const p = [cam[0]+rd[0]*t, cam[1]+rd[1]*t, cam[2]+rd[2]*t];
          const n = normal(p, 0.001);
          // simple lambert + rim
          const L = norm([-0.5, 0.9, -0.4]);
          const diff = Math.max(0, n[0]*L[0]+n[1]*L[1]+n[2]*L[2]);
          const fres = Math.pow(1 - Math.max(0, -(rd[0]*n[0]+rd[1]*n[1]+rd[2]*n[2])), 3);
          const shade = Math.min(1, diff*1.1 + fres*0.5 + 0.12);
          // dither the shade into dot density: brighter -> more dots lit
          // sub is 0..7; use a fixed per-subdot rank so lit dots grow with brightness
          const rank = sub / 8;
          if (shade > rank) bits |= DOT[dc][dr];
        }
      }
      chars[cy*cols+cx] = bits ? String.fromCharCode(0x2800 + bits) : ' ';
    }
  }

  let s = '';
  for (let y=0; y<rows; y++){
    s += chars.slice(y*cols, y*cols+cols).join('') + '\n';
  }
  out.textContent = s;
  info.textContent = cols + '\u00d7' + rows + ' chars \u00b7 ' + (cols*2) + '\u00d7' + (rows*4) + ' dots';

  // color the dots subtly by depth? keep simple: single fg
}

function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function norm(v){ const l = Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; }

// animation
let last = 0, acc = 0;
function tick(t){
  if (spin){
    ang += 0.012;
    render();
  }
  requestAnimationFrame(tick);
}

// drag to orbit
let dragging = false, lx = 0, ly = 0;
out.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; spin = false; spinBtn.textContent = 'spin'; });
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  ang += (e.clientX - lx) * 0.01;
  pitch += (e.clientY - ly) * 0.01;
  pitch = Math.max(-1.4, Math.min(1.4, pitch));
  lx = e.clientX; ly = e.clientY;
  render();
});

const spinBtn = document.getElementById('spin');
spinBtn.onclick = () => { spin = !spin; spinBtn.textContent = spin ? 'pause spin' : 'spin'; if (spin) requestAnimationFrame(tick); else render(); };

document.getElementById('res').onclick = () => { cols = cols > 80 ? 40 : cols + 20; render(); };

window.addEventListener('resize', () => render());
render();
requestAnimationFrame(tick);
</script>
</body>
</html>
