<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>invert — a circle-inversion kaleidoscope</title>
<style>
  :root{--bg:#0a0a12;--fg:#e8e8f0;--dim:#8a8aa0;--accent:#7cf}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
  #c{display:block;width:100vw;height:100vh;cursor:crosshair}
  #hud{position:fixed;left:14px;bottom:12px;color:var(--dim);font-size:12px;
    pointer-events:none;user-select:none}
  #hud b{color:var(--accent)}
  #btns{position:fixed;right:14px;bottom:12px;display:flex;gap:8px}
  button{background:transparent;border:1px solid #2a2a3a;color:var(--dim);
    padding:5px 10px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  h1{position:fixed;left:16px;top:12px;margin:0;font-size:13px;font-weight:400;
    color:var(--dim);letter-spacing:.08em;user-select:none}
  h1 b{color:var(--fg)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<h1><b>invert</b> — draw with circles, see the mirror</h1>
<div id="hud">drag to draw · click a ring to invert it · <b>space</b> clears</div>
<div id="btns">
  <button id="new">new rings</button>
  <button id="clear">clear</button>
</div>
<script>
(function(){
  const cv = document.getElementById('c');
  const g = cv.getContext('2d');
  let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
  let rings=[];        // {x,y,r}
  let strokes=[];      // {pts:[{x,y}], hue}
  let cur=null;
  let hue0=Math.random()*360;

  function resize(){
    W=innerWidth; H=innerHeight;
    cv.width=W*DPR; cv.height=H*DPR;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    g.setTransform(DPR,0,0,DPR,0,0);
    redraw();
  }

  // invert point p wrt circle (cx,cy,r)
  function inv(px,py,cx,cy,r){
    const dx=px-cx, dy=py-cy;
    const d2=dx*dx+dy*dy;
    if(d2<1e-9) return null;
    const k=(r*r)/d2;
    return {x:cx+dx*k, y:cy+dy*k};
  }

  function makeRings(){
    rings=[];
    const n=3+Math.floor(Math.random()*4);
    for(let i=0;i<n;i++){
      const ang=Math.random()*Math.PI*2;
      const dist=Math.min(W,H)*(0.12+Math.random()*0.22);
      rings.push({
        x:W/2+Math.cos(ang)*dist,
        y:H/2+Math.sin(ang)*dist,
        r:Math.min(W,H)*(0.10+Math.random()*0.20)
      });
    }
  }

  function redraw(){
    g.fillStyle='#0a0a12';
    g.fillRect(0,0,W,H);

    // draw strokes, each mirrored through every ring (and 2 levels deep)
    for(const s of strokes){
      drawMirrors(s.pts, s.hue, 0);
      drawLine(s.pts, s.hue, 0.9);
    }
    if(cur) drawLine(cur.pts, cur.hue, 1);

    // rings
    g.lineWidth=1;
    for(const R of rings){
      g.strokeStyle='rgba(124,204,255,0.35)';
      g.beginPath(); g.arc(R.x,R.y,R.r,0,Math.PI*2); g.stroke();
    }
  }

  function drawLine(pts,hue,alpha){
    if(pts.length<2) return;
    g.strokeStyle=`hsla(${hue},80%,65%,${alpha})`;
    g.lineWidth=1.6; g.lineJoin='round'; g.lineCap='round';
    g.beginPath();
    g.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) g.lineTo(pts[i].x,pts[i].y);
    g.stroke();
  }

  const MAXD=3; // mirror depth
  function drawMirrors(pts,hue,depth){
    if(depth>=MAXD) return;
    for(let ri=0;ri<rings.length;ri++){
      const R=rings[ri];
      const mp=[];
      let ok=true;
      for(const p of pts){
        const q=inv(p.x,p.y,R.x,R.y,R.r);
        if(!q||!isFinite(q.x)||!isFinite(q.y)){ok=false;break;}
        // skip points absurdly far (numerical blowup)
        if(Math.abs(q.x)>W*50||Math.abs(q.y)>H*50){ok=false;break;}
        mp.push(q);
      }
      if(!ok||mp.length<2) continue;
      drawLine(mp,(hue+40*(depth+1))%360,0.5/(depth+1));
      drawMirrors(mp,(hue+40*(depth+1))%360,depth+1);
    }
  }

  // pointer
  let drawing=false;
  function pos(e){
    const r=cv.getBoundingClientRect();
    return {x:e.clientX-r.left, y:e.clientY-r.top};
  }
  cv.addEventListener('pointerdown',e=>{
    drawing=true; cv.setPointerCapture(e.pointerId);
    const p=pos(e);
    cur={pts:[p], hue:(hue0+Math.random()*60)%360};
  });
  cv.addEventListener('pointermove',e=>{
    if(!drawing) return;
    const p=pos(e);
    const last=cur.pts[cur.pts.length-1];
    if(Math.hypot(p.x-last.x,p.y-last.y)>2){
      cur.pts.push(p);
      redraw();
    }
  });
  cv.addEventListener('pointerup',e=>{
    if(!drawing) return;
    drawing=false;
    if(cur&&cur.pts.length>1){ strokes.push(cur); if(strokes.length>60) strokes.shift(); }
    cur=null; redraw();
  });

  addEventListener('keydown',e=>{
    if(e.code==='Space'){ e.preventDefault(); strokes=[]; cur=null; redraw(); }
  });
  document.getElementById('clear').onclick=()=>{strokes=[];cur=null;redraw();};
  document.getElementById('new').onclick=()=>{makeRings();redraw();};

  addEventListener('resize',resize);
  resize();
  makeRings();
  redraw();

  // seed a demo stroke so the page isn't empty
  (function(){
    const pts=[];
    const cx=W/2, cy=H/2, rr=Math.min(W,H)*0.26;
    for(let a=0;a<Math.PI*1.4;a+=0.05){
      pts.push({x:cx+Math.cos(a)*rr*(0.6+0.4*Math.sin(a*3)),
                y:cy+Math.sin(a)*rr*(0.6+0.4*Math.cos(a*2))});
    }
    strokes.push({pts,hue:hue0});
    redraw();
  })();
})();
</script>
</body>
</html>
