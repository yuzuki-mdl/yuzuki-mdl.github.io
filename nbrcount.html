<!doctype html>
<html><head><meta charset=utf-8><title>3 vs 21</title>
<meta name=viewport content='width=device-width,initial-scale=1'>
<style>
body{background:#0e121a;color:#c7d0e0;font:14px/1.5 ui-monospace,monospace;margin:0;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
h1{font-size:16px;font-weight:400;color:#7d8aa3;margin:0}
.row{display:flex;gap:40px;flex-wrap:wrap;justify-content:center}
.card{background:#12161f;border:1px solid #1e2533;border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.lbl{color:#9aa6bc;font-size:12px}
.big{font-size:22px;color:#e8f0ff}
.cyan{color:#4fd6e0}
</style></head><body>
<h1>why {3,7} and {7,3} run differently under the same B2 rule</h1>
<div class=row>
  <div class=card><div class=lbl>{3,7} — a triangle, 3 edge-neighbours</div><svg id=a width=220 height=220></svg><div class=lbl>B2 fires: <span class=big>3</span> ways</div></div>
  <div class=card><div class=lbl>{7,3} — a heptagon, 7 edge-neighbours</div><svg id=b width=220 height=220></svg><div class=lbl>B2 fires: <span class=big>21</span> ways</div></div>
</div>
<div class=lbl>curvature identical (1/3+1/7 = 1/7+1/3). the graph is not.</div>
<script>
const NS='http://www.w3.org/2000/svg';
function poly(g,cx,cy,r,n,rot,fill,stroke,w){let p=[];for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}const e=document.createElementNS(NS,'polygon');e.setAttribute('points',p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' '));e.setAttribute('fill',fill);e.setAttribute('stroke',stroke);e.setAttribute('stroke-width',w||1.5);g.appendChild(e);return p;}
function line(g,x1,y1,x2,y2,col,w){const e=document.createElementNS(NS,'line');e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);e.setAttribute('stroke',col);e.setAttribute('stroke-width',w||1);g.appendChild(e);}
function dot(g,x,y,r,col){const e=document.createElementNS(NS,'circle');e.setAttribute('cx',x);e.setAttribute('cy',y);e.setAttribute('r',r);e.setAttribute('fill',col);g.appendChild(e);}
// triangle
{const g=document.getElementById('a');const cx=110,cy=120,r=70;
 const p=poly(g,cx,cy,r,3,-Math.PI/2,'#12161f','#4fd6e0',2);
 // edges = neighbours, highlight each
 for(let i=0;i<3;i++){const [x1,y1]=p[i],[x2,y2]=p[(i+1)%3];line(g,x1,y1,x2,y2,'#4fd6e0',4);}
 // B2 = pick 2 of the 3 edges: 3 pairs, mark midpoints
 for(let i=0;i<3;i++){const [x1,y1]=p[i],[x2,y2]=p[(i+1)%3];dot(g,(x1+x2)/2,(y1+y2)/2,4,'#ffd166');}}
// heptagon
{const g=document.getElementById('b');const cx=110,cy=120,r=88;
 const p=poly(g,cx,cy,r,7,-Math.PI/2,'#12161f','#b06bd6',2);
 for(let i=0;i<7;i++){const [x1,y1]=p[i],[x2,y2]=p[(i+1)%7];line(g,x1,y1,x2,y2,'#b06bd6',4);}
 // B2 = 21 pairs of 7 edges; draw faint chords between edge midpoints
 const mids=[];for(let i=0;i<7;i++){const [x1,y1]=p[i],[x2,y2]=p[(i+1)%7];mids.push([(x1+x2)/2,(y1+y2)/2]);dot(g,(x1+x2)/2,(y1+y2)/2,3,'#ffd166');}
 for(let i=0;i<7;i++)for(let j=i+1;j<7;j++)line(g,mids[i][0],mids[i][1],mids[j][0],mids[j][1],'#ffd16622',1);}
</script>
</body></html>
