<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>generalized hough — yuzuki</title>
<style>
  html,body{margin:0;height:100%;background:#08080a;overflow:hidden;font-family:ui-monospace,monospace;color:#cfd8e8}
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;left:12px;bottom:12px;font-size:12px;opacity:.7;line-height:1.6;pointer-events:none;max-width:60ch}
  #ui b{color:#7ad0ff}
  #bar{position:fixed;left:12px;top:12px;font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{background:#14161c;color:#cfd8e8;border:1px solid #2a2f3a;border-radius:6px;padding:4px 9px;font:inherit;cursor:pointer}
  button:hover{border-color:#7ad0ff;color:#7ad0ff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button id="new">new field</button>
  <button id="shape">template: cat</button>
  <button id="noise">noise: on</button>
</div>
<div id="ui">
  <b>generalized hough transform</b> — no neural net, no training. every edge pixel votes for where the
  template's center would be if this pixel were this part of the shape. votes pile up where the shape hides.<br>
  left: the field · right: the vote accumulator. brightest spot = found.
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,hw;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;hw=(W/2)|0;build();}

// template shapes as normalized point sets (edge points, -1..1)
const SHAPES={
  cat:(()=>{const p=[];const N=120;
    // head circle + two ears
    for(let i=0;i<N;i++){const a=i/N*Math.PI*2;p.push([Math.cos(a)*0.5,Math.sin(a)*0.5+0.15]);}
    for(let i=0;i<30;i++){const t=i/30;p.push([-0.5+0.35*t,-0.35-0.0*t]);}
    for(let i=0;i<30;i++){const t=i/30;p.push([-0.15+0.0*t,-0.55+0.2*t]);}
    for(let i=0;i<30;i++){const t=i/30;p.push([0.15+0.0*t,-0.55+0.2*t]);}
    for(let i=0;i<30;i++){const t=i/30;p.push([0.5-0.35*t,-0.35-0.0*t]);}
    return p;})()
};
let shapeName='cat';

let field=null,acc=null,found=null;

function makeField(){
  const S=Math.min(hw,H);
  field=new Float32Array(hw*H);
  acc=new Float32Array(hw*H);
  const cx=hw*0.5,cy=H*0.5,r=S*0.42;
  // scatter noise blobs + place the shape once at a random spot
  for(let i=0;i<hw*H;i++)field[i]=Math.random()<0.018?1:0;
  // a couple of decoy blobs
  for(let k=0;k<8;k++){const bx=hw*Math.random(),by=H*Math.random();
    for(let y=-8;y<=8;y++)for(let x=-8;x<=8;x++){const px=(bx+x)|0,py=(by+y)|0;
      if(px>=0&&py>=0&&px<hw&&py<H&&x*x+y*y<64)field[py*hw+px]=1;}}
  // hidden instance
  const tx=hw*(0.25+Math.random()*0.5),ty=H*(0.25+Math.random()*0.5),sc=S*0.22,rot=Math.random()*Math.PI*2;
  const pts=SHAPES[shapeName];
  for(const [ux,uy] of pts){
    const rx=ux*Math.cos(rot)-uy*Math.sin(rot),ry=ux*Math.sin(rot)+uy*Math.cos(rot);
    const px=(tx+rx*sc)|0,py=(ty+ry*sc)|0;
    if(px>=0&&py>=0&&px<hw&&py<H)field[py*hw+px]=1;
    // thicken the hidden instance so it reads against the noise
    for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){const qx=px+ox,qy=py+oy;
      if(qx>=0&&qy>=0&&qx<hw&&qy<H)field[qy*hw+qx]=1;}
  }
  found={x:tx,y:ty,sc,rot};
}

function hough(){
  acc.fill(0);
  const pts=SHAPES[shapeName];
  const S=Math.min(hw,H);
  // template points scaled to match
  const sc=S*0.22;
  // precompute r-table: for each template point, the offset from center
  const rtab=pts.map(([ux,uy])=>[ux*sc,uy*sc]);
  // edge pixels = field==1
  for(let y=0;y<H;y++)for(let x=0;x<hw;x++){
    if(field[y*hw+x]<0.5)continue;
    for(const [dx,dy] of rtab){
      const vx=(x-dx)|0,vy=(y-dy)|0;
      if(vx>=0&&vy>=0&&vx<hw&&vy<H)acc[vy*hw+vx]+=1;
    }
  }
  // find peak
  let best=0,bx=0,by=0;
  for(let i=0;i<acc.length;i++)if(acc[i]>best){best=acc[i];bx=i%hw;by=(i/hw)|0;}
  return {x:bx,y:by,v:best};
}

function build(){makeField();const peak=hough();draw(peak);}

function draw(peak){
  ctx.fillStyle='#08080a';ctx.fillRect(0,0,W,H);
  // field (left)
  const img=ctx.createImageData(hw,H);
  for(let i=0;i<hw*H;i++){const v=field[i];const j=i*4;img.data[j]=v*180;img.data[j+1]=v*210;img.data[j+2]=v*255;img.data[j+3]=255;}
  ctx.putImageData(img,0,0);
  // divider
  ctx.fillStyle='#1a1d24';ctx.fillRect(hw,0,1,H);
  // accumulator (right)
  let maxv=1;for(let i=0;i<acc.length;i++)if(acc[i]>maxv)maxv=acc[i];
  const img2=ctx.createImageData(hw,H);
  for(let i=0;i<hw*H;i++){const t=Math.pow(acc[i]/maxv,0.5);const j=i*4;
    img2.data[j]=t*255;img2.data[j+1]=t*120;img2.data[j+2]=t*40;img2.data[j+3]=255;}
  ctx.putImageData(img2,hw,0);
  // markers
  ctx.strokeStyle='#7ad0ff';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(peak.x,peak.y,10,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(hw+peak.x,peak.y,10,0,7);ctx.stroke();
}

const label=document.getElementById('shape');
document.getElementById('new').onclick=()=>build();
document.getElementById('shape').onclick=()=>{shapeName=shapeName==='cat'?'cat':'cat';build();};
document.getElementById('noise').onclick=()=>{for(let i=0;i<hw*H;i++)if(Math.random()<0.02)field[i]=1-field[i];const peak=hough();draw(peak);};

addEventListener('resize',resize);
resize();
</script>
</body>
</html>
