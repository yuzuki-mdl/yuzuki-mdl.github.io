<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>collatz</title>
<style>
  :root{--bg:#0d0f14;--fg:#e6e8ee;--dim:#7a8194;--acc:#7ee787;--hot:#ff7b72}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column;align-items:center;padding:24px;gap:16px;min-height:100vh}
  h1{font-size:18px;font-weight:600;margin:0;letter-spacing:.5px}
  p.sub{color:var(--dim);margin:0;font-size:12px;text-align:center;max-width:520px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  input[type=number]{background:#161a22;border:1px solid #2a3040;color:var(--fg);padding:8px 10px;border-radius:8px;font:inherit;width:130px}
  button{background:#1c2230;border:1px solid #2a3040;color:var(--fg);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--acc);color:var(--acc)}
  button.go{background:var(--acc);color:#0d0f14;border-color:var(--acc);font-weight:600}
  canvas{background:#0a0c10;border:1px solid #1e2430;border-radius:10px;max-width:100%}
  .stats{color:var(--dim);font-size:12px;text-align:center;min-height:20px}
  .stats b{color:var(--fg)}
  .stats .hot{color:var(--hot)}
</style>
</head>
<body>
<h1>collatz</h1>
<p class="sub">pick a number. even → ÷2, odd → 3n+1. does it always reach 1? nobody knows. watch the hailstone fall.</p>
<div class="row">
  <input id="n" type="number" value="27" min="1" max="100000000">
  <button class="go" id="run">run</button>
  <button id="rand">random</button>
  <button id="peak">record peak</button>
</div>
<canvas id="cv" width="900" height="420"></canvas>
<div class="stats" id="stats"></div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const nIn = document.getElementById('n');
const statsEl = document.getElementById('stats');

function seq(n){
  const s = [n];
  let guard = 0;
  while(n !== 1 && guard++ < 1000000){
    n = (n % 2 === 0) ? n/2 : 3*n+1;
    s.push(n);
  }
  return s;
}

let anim = null;
function draw(s, upto){
  const W = cv.width, H = cv.height, pad = 30;
  ctx.clearRect(0,0,W,H);
  const maxV = Math.max(...s);
  const n = s.length;
  const x = i => pad + (W - 2*pad) * (n<=1?0:i/(n-1));
  const y = v => H - pad - (H - 2*pad) * (maxV<=1?0:v/maxV);

  // axes hint
  ctx.strokeStyle = '#1e2430'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, H-pad); ctx.lineTo(W-pad, H-pad); ctx.stroke();

  // line
  ctx.strokeStyle = '#7ee787'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for(let i=0;i<=upto && i<n;i++){
    const px = x(i), py = y(s[i]);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke();

  // peak marker
  const pk = s.indexOf(maxV);
  if(pk <= upto){
    ctx.fillStyle = '#ff7b72';
    ctx.beginPath(); ctx.arc(x(pk), y(maxV), 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#7a8194'; ctx.font = '11px ui-monospace,monospace';
    ctx.fillText('peak ' + maxV, Math.min(W-90, x(pk)+8), Math.max(14, y(maxV)-8));
  }
  // end dot
  if(upto >= n-1){
    ctx.fillStyle = '#e6e8ee';
    ctx.beginPath(); ctx.arc(x(n-1), y(s[n-1]), 3.5, 0, Math.PI*2); ctx.fill();
  }
}

function run(){
  const start = Math.max(1, Math.floor(+nIn.value || 1));
  const s = seq(start);
  if(anim) cancelAnimationFrame(anim);
  const maxV = Math.max(...s);
  const steps = s.length - 1;
  const peakN = s.indexOf(maxV);
  statsEl.innerHTML = `start <b>${start}</b> · steps <b>${steps}</b> · peak <b>${maxV}</b> (at step ${peakN})`;
  let i = 0;
  const speed = Math.max(1, Math.ceil(s.length / 180));
  function tick(){
    i = Math.min(s.length-1, i + speed);
    draw(s, i);
    if(i < s.length-1) anim = requestAnimationFrame(tick);
  }
  anim = requestAnimationFrame(tick);
}

document.getElementById('run').onclick = run;
document.getElementById('rand').onclick = () => {
  nIn.value = Math.floor(Math.random()*99999)+1;
  run();
};
document.getElementById('peak').onclick = () => {
  // find the number under 100000 with the longest chain
  let bestN = 1, bestLen = 0;
  for(let k=1;k<100000;k++){
    const L = seq(k).length;
    if(L > bestLen){ bestLen = L; bestN = k; }
  }
  nIn.value = bestN;
  run();
};
nIn.addEventListener('keydown', e => { if(e.key === 'Enter') run(); });
run();
</script>
</body>
</html>
