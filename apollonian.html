<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>apollonian gasket · yuzuki</title>
<style>
  html,body{margin:0;background:#0b0b0f;color:#e8e8f0;font-family:system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
  #hud{position:fixed;left:14px;bottom:12px;font-size:13px;line-height:1.5;color:#8a8aa0;pointer-events:none}
  #hud b{color:#e8e8f0;font-weight:600}
  #top{position:fixed;left:14px;top:12px;font-size:13px;color:#8a8aa0}
  #top a{color:#9d8cff;text-decoration:none}
  button{position:fixed;right:14px;top:12px;background:#1a1a24;color:#e8e8f0;border:1px solid #2e2e40;
         border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
  button:hover{background:#22222e}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">apollonian gasket · <a href="index.html">back</a></div>
<div id="hud"></div>
<button id="reset">reset</button>
<script>
// exact integer descartes. curvatures stay integers when seed is integer.
// k4 = k1+k2+k3 ± 2*sqrt(k1k2+k2k3+k3k1)
// each circle: {k, z} where z = k*x + i*k*y (complex scaled by curvature)
// descartes in complex form: z4 = z1+z2+z3 ± 2*sqrt(z1z2+z2z3+z3z1)

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);

function resize(){
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}
window.addEventListener('resize', resize);

// complex helpers
const cadd=(a,b)=>({re:a.re+b.re, im:a.im+b.im});
const csub=(a,b)=>({re:a.re-b.re, im:a.im-b.im});
const cmul=(a,b)=>({re:a.re*b.re-a.im*b.im, im:a.re*b.im+a.im*b.re});
const csqrt=(a)=>{
  const r=Math.hypot(a.re,a.im);
  const sr=Math.sqrt(Math.max(0,(r+a.re)/2));
  const si=Math.sign(a.im||1)*Math.sqrt(Math.max(0,(r-a.re)/2));
  return {re:sr, im:si};
};
const cscale=(a,s)=>({re:a.re*s, im:a.im*s});

// a circle: k (curvature, signed), z (complex center scaled by k)
// center = z/k, radius = 1/k (if k>0). if k<0 it's the outer bounding circle.
function center(c){ return {re:c.z.re/c.k, im:c.z.im/c.k}; }
function radius(c){ return 1/Math.abs(c.k); }

let circles=[];
let queue=[];

function seed(){
  // classic (-1,2,2,3) integer gasket
  // outer circle k=-1 centered origin: z = -1*(0+0i) = 0
  const outer = {k:-1, z:{re:0,im:0}};
  // three inner tangent circles, integer curvatures 2,2,3
  // pick a valid arrangement. centers from a known config:
  // use formula: for k1=-1, k2=2, k3=2, k4 = -1+2+2 ± 2*sqrt(2*2+2*2+2*(-1)) = 3 ± 2*sqrt(4) = 3±4 -> 7 or -1
  // so k4=7? no wait. let's just place three known circles geometrically.
  // classic config: outer radius 1 at origin. inner circles with k=2,2,3.
  // radius 1/2,1/2,1/3. place them to be mutually tangent inside unit circle.
  // centers: (0,0.5),(0,-0.5) for the 2s? no.
  // standard: circles centered at (-0.5,0),(0.5,0),(0,±?)...
  // let me use exact descartes construction from (-1,2,2) then solve for third.
  // Simpler: use the known "soddy" seed with circles at:
  //   outer k=-1 center (0,0)
  //   k=2 center (0, 1/2)  radius 1/2  -> tangent to outer at top
  //   k=2 center (0,-1/2)  radius 1/2  -> tangent to outer at bottom
  //   k=3 center (0,0)     radius 1/3  -> tangent to both 2s and outer? dist to k=2 circles = 1/2, sum radii = 1/2+1/3=5/6 no.
  // ok just compute: two k=2 circles mutually tangent inside unit circle.
  // centers at distance d from origin, radius 1/2. tangent to outer: d+1/2=1 -> d=1/2.
  // mutually tangent: dist between centers = 1. so centers at angle ±60°? dist=2*(1/2)*sin(θ)...
  // centers on circle radius 1/2, chord = 1 -> angle = 2*asin(1/(2*(1/2))) = 2*asin(1) = 180°. So opposite.
  // centers (0,1/2),(0,-1/2), they're tangent (dist 1 = 1/2+1/2). good, tangent to outer too.
  // third circle k=3 radius 1/3 tangent to both and outer. center on x-axis by symmetry.
  // tangent to outer: dist from origin = 1-1/3 = 2/3. so center (2/3,0) or (-2/3,0).
  // check tangent to (0,1/2) r=1/2: dist = sqrt(4/9+1/4)=sqrt(16/36+9/36)=sqrt(25/36)=5/6 = 1/2+1/3. yes!
  // perfect. exact integer curvatures -1,2,2,3 with rational centers.
  const c1={k:2, z:{re:0, im:2*0.5}};    // center (0,1/2), z=k*center=(0,1)
  const c2={k:2, z:{re:0, im:-2*0.5}};   // center (0,-1/2), z=(0,-1)
  const c3={k:3, z:{re:3*(2/3), im:0}};  // center (2/3,0), z=(2,0)
  return [outer, c1, c2, c3];
}

// descartes: given 3 tangent circles, find the 4th (the two solutions)
function descartes(c1,c2,c3){
  const sumk = c1.k+c2.k+c3.k;
  const sumz = cadd(cadd(c1.z,c2.z),c3.z);
  // curvature: real descartes, k4 = sumk ± 2*sqrt(k1k2+k2k3+k3k1)
  const b = c1.k*c2.k + c2.k*c3.k + c3.k*c1.k;
  const sk = 2*Math.sqrt(b);
  // center: complex descartes, z4 = sumz ± 2*sqrt(z1z2+z2z3+z3z1)
  const p = cadd(cadd(cmul(c1.z,c2.z),cmul(c2.z,c3.z)),cmul(c3.z,c1.z));
  const s = cscale(csqrt(p), 2);
  return [
    {k: sumk + sk, z: cadd(sumz, s)},
    {k: sumk - sk, z: csub(sumz, s)}
  ];
}

// each circle knows its 3 tangent neighbours (indices). to split we find a triple.
// simpler approach: maintain circles with neighbour lists. click a circle -> find 3 neighbours -> descartes -> add the OTHER solution (not itself).

function build(){
  circles = seed().map(c=>({...c, nbrs:[]}));
  // wire up neighbours: c0 tangent to c1,c2,c3. c1 tangent c2,c3. c2 tangent c3.
  const tang=(a,b)=>{
    const ca=center(a), cb=center(b);
    const d=Math.hypot(ca.re-cb.re, ca.im-cb.im);
    return Math.abs(d - (radius(a)+radius(b))) < 1e-6 || Math.abs(d - Math.abs(radius(a)-radius(b)))<1e-6;
  };
  for(let i=0;i<circles.length;i++) for(let j=i+1;j<circles.length;j++){
    if(tang(circles[i],circles[j])){ circles[i].nbrs.push(j); circles[j].nbrs.push(i); }
  }
  queue = [];
  // seed the queue with the three gaps of the initial config
  for(let i=0;i<circles.length;i++) for(let j=i+1;j<circles.length;j++) for(let k=j+1;k<circles.length;k++){
    const a=circles[i],b=circles[j],c=circles[k];
    if(tang(a,b)&&tang(b,c)&&tang(a,c)){
      queue.push([i,j,k]);
    }
  }
}

// fill the queue with new gaps created when a circle is added
function addGaps(idx){
  const c=circles[idx];
  const nb=c.nbrs;
  for(let i=0;i<nb.length;i++) for(let j=i+1;j<nb.length;j++){
    const a=nb[i], b=nb[j];
    // a,b tangent to c and to each other -> gap (a,b,idx)
    if(circles[a].nbrs.includes(b)){
      queue.push([a,b,idx]);
    }
  }
}

// pick a random gap and fill it with a new circle
function fillOne(){
  if(queue.length===0) return false;
  // pick a random gap
  const gi = Math.floor(Math.random()*queue.length);
  const [i,j,k] = queue[gi];
  queue.splice(gi,1);
  const a=circles[i],b=circles[j],c=circles[k];
  const sols = descartes(a,b,c);
  // the gap is filled by the circle that's NOT one of a,b,c. both solutions are candidates,
  // one is one of the existing (shouldn't be, since we picked a gap), other is new.
  // check which one is new by comparing to a,b,c
  // two soddy circles: the gap filler (smaller) and the enclosing one (bigger).
  // pick the one that is NOT already present, and among candidates the smaller (larger |k|).
  let pick=null;
  for(const s of sols){
    let dup=false;
    for(const t of [a,b,c]){
      if(Math.abs(s.k-t.k)<1e-6 && Math.hypot(s.z.re-t.z.re, s.z.im-t.z.im)<1e-6){ dup=true; break; }
    }
    if(dup) continue;
    if(pick===null || Math.abs(s.k) > Math.abs(pick.k)) pick=s;
  }
  if(!pick) return false;
  if(Math.abs(pick.k) < 1e-6) return false; // degenerate
  // avoid absurdly tiny circles
  if(Math.abs(pick.k) > 50000) return false;
  // geometric test: the new circle must not overlap any existing circle except its 3 parents.
  // if it does, we picked the wrong soddy solution — try the other one.
  const overlaps=(s)=>{
    const sc=center(s), sr=radius(s);
    // must stay inside the outer circle (radius 1 at origin)
    if(Math.hypot(sc.re,sc.im)+sr > 1+1e-4) return true;
    for(let t=0;t<circles.length;t++){
      const oc=circles[t]; if(oc.k<0) continue;
      const ocenter=center(oc), orad=radius(oc);
      const d=Math.hypot(sc.re-ocenter.re, sc.im-ocenter.im);
      if(d < sr+orad-1e-4) return true; // real overlap
    }
    return false;
  };
  if(overlaps(pick)){
    // try the other solution
    let alt=null;
    for(const s of sols){ if(s!==pick){ alt=s; break; } }
    if(alt && Math.abs(alt.k)>1e-6 && !overlaps(alt)) pick=alt;
    else return false; // both solutions overlap -> not a real gap
  }
  const nc = {k: pick.k, z: pick.z, nbrs:[i,j,k]};
  const idx = circles.length;
  circles.push(nc);
  circles[i].nbrs.push(idx); circles[j].nbrs.push(idx); circles[k].nbrs.push(idx);
  addGaps(idx);
  return true;
}

// view: map the unit disk to screen
let view = {cx:0.5, cy:0.5, scale:1}; // will be set in draw

function toScreen(p){
  // p is a complex point in circle-space (unit disk centered origin)
  return { x: view.cx + p.re*view.scale, y: view.cy - p.im*view.scale };
}

const palette=(k)=>{
  const hue = (k*137.508)%360;
  return `hsl(${hue},70%,${40+((k*7)%30)}%)`;
};

function draw(){
  ctx.fillStyle='#0b0b0f';
  ctx.fillRect(0,0,W,H);
  const m = Math.min(W,H);
  view.scale = m*0.46;
  view.cx = W/2; view.cy = H/2;
  // draw largest first (smaller k = bigger)
  const order = circles.map((c,i)=>i).sort((a,b)=>Math.abs(circles[a].k)-Math.abs(circles[b].k));
  for(const i of order){
    const c=circles[i];
    const ctr = center(c);
    const r = radius(c)*view.scale;
    const sp = toScreen(ctr);
    if(c.k<0){
      // outer boundary
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, r, 0, Math.PI*2);
      ctx.strokeStyle='#3a3a50'; ctx.lineWidth=1.5; ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, r, 0, Math.PI*2);
      ctx.fillStyle = palette(c.k);
      ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;
      if(r>1.5){
        ctx.strokeStyle='rgba(11,11,15,0.6)'; ctx.lineWidth=0.8; ctx.stroke();
      }
      if(r>11){
        ctx.fillStyle='rgba(11,11,15,0.85)';
        ctx.font=`${Math.min(r*0.7,20)}px ui-monospace,monospace`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(Math.round(c.k), sp.x, sp.y);
      }
    }
  }
  document.getElementById('hud').innerHTML =
    `<b>${circles.length-1}</b> circles · click a circle to split it deeper`;
}

// click: find smallest circle containing the point, split it (fill its gaps)
cv.addEventListener('click', e=>{
  const rect = cv.getBoundingClientRect();
  const sx = e.clientX-rect.left, sy = e.clientY-rect.top;
  // convert to circle space
  const px = (sx-view.cx)/view.scale;
  const py = -(sy-view.cy)/view.scale;
  // find smallest circle containing point
  let best=-1, bestR=Infinity;
  for(let i=0;i<circles.length;i++){
    const c=circles[i]; if(c.k<0) continue;
    const ctr=center(c), r=radius(c);
    const d=Math.hypot(px-ctr.re, py-ctr.im);
    if(d<=r+1e-9 && r<bestR){ bestR=r; best=i; }
  }
  if(best>=0){
    // split it: fill its gaps
    const c=circles[best];
    const nb=c.nbrs;
    for(let i=0;i<nb.length;i++) for(let j=i+1;j<nb.length;j++){
      const a=nb[i], b=nb[j];
      if(circles[a].nbrs.includes(b)) queue.push([a,b,best]);
    }
    const before=circles.length;
    // fill up to 3 gaps
    for(let t=0;t<3;t++) fillOne();
    if(circles.length>before) draw();
  }
});

document.getElementById('reset').addEventListener('click',()=>{
  build();
  // pre-fill a few levels
  for(let t=0;t<12;t++) fillOne();
  draw();
});

build();
for(let t=0;t<12;t++) fillOne();
resize();
</script>
</body>
</html>
