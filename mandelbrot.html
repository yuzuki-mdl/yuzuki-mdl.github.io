<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mandelbrot</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,monospace}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
  #hud{position:fixed;left:12px;bottom:10px;color:#8ff;font-size:12px;opacity:.7;pointer-events:none;text-shadow:0 0 4px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">click to zoom · right-click / shift-click to zoom out · double-click to reset</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W=0,H=0,img=null;
let view = {cx:-0.5, cy:0, scale:3.2}; // width of view in complex plane
const MAXI=220;

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = Math.floor(innerWidth*dpr); H = Math.floor(innerHeight*dpr);
  c.width=W; c.height=H;
  img = ctx.createImageData(W,H);
  render();
}

function render(){
  const aspect = W/H;
  const w = view.scale, h = view.scale/aspect;
  const x0 = view.cx - w/2, y0 = view.cy - h/2;
  const data = img.data;
  const px = w/W, py = h/H;
  for(let j=0;j<H;j++){
    const ci = y0 + j*py;
    for(let i=0;i<W;i++){
      const cr = x0 + i*px;
      let zr=0, zi=0, it=0;
      // cardioid / bulb quick escape
      const q=(cr-0.25)*(cr-0.25)+ci*ci;
      if(q*(q+(cr-0.25)) < 0.25*ci*ci || (cr+1)*(cr+1)+ci*ci < 0.0625){
        it = MAXI;
      } else {
        while(zr*zr+zi*zi <= 4 && it < MAXI){
          const t = zr*zr - zi*zi + cr;
          zi = 2*zr*zi + ci;
          zr = t;
          it++;
        }
      }
      let r,g,b;
      if(it>=MAXI){ r=g=b=0; }
      else{
        const t = it/MAXI;
        // smooth-ish palette
        r = 9*(1-t)*t*t*t*255;
        g = 15*(1-t)*(1-t)*t*t*255;
        b = 8.5*(1-t)*(1-t)*(1-t)*t*255;
        r=Math.min(255,r);g=Math.min(255,g);b=Math.min(255,b);
      }
      const o = (j*W+i)*4;
      data[o]=r; data[o+1]=g; data[o+2]=b; data[o+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}

function toComplex(ev){
  const rect = c.getBoundingClientRect();
  const mx = (ev.clientX-rect.left)/rect.width;
  const my = (ev.clientY-rect.top)/rect.height;
  const aspect = rect.width/rect.height;
  const w = view.scale, h = view.scale/aspect;
  const cr = view.cx - w/2 + mx*w;
  const ci = view.cy - h/2 + my*h;
  return {cr,ci};
}

c.addEventListener('contextmenu', e=>e.preventDefault());
c.addEventListener('click', e=>{
  const {cr,ci} = toComplex(e);
  const out = e.shiftKey;
  view.scale *= out ? 1.6 : 0.55;
  view.cx = cr + (view.cx-cr)*(out?1.6:0.55);
  view.cy = ci + (view.cy-ci)*(out?1.6:0.55);
  render();
});
c.addEventListener('dblclick', e=>{ view={cx:-0.5,cy:0,scale:3.2}; render(); });
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
