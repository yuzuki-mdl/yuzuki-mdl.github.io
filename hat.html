<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hat monotile tiler</title>
<style>
  html,body{margin:0;height:100%;background:#f7f7f2;overflow:hidden;font-family:ui-monospace,monospace;color:#333}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas:active{cursor:grabbing}
  #ui{position:fixed;left:12px;top:12px;font-size:12px;line-height:1.7;background:#ffffffe6;padding:10px 12px;border-radius:8px;box-shadow:0 1px 6px #0002;user-select:none}
  #ui b{color:#0a7ac0}
  button{font-family:inherit;font-size:12px;margin:2px 4px 2px 0;padding:4px 9px;border:1px solid #bbb;background:#fff;border-radius:5px;cursor:pointer}
  button:hover{background:#eef6fc}
  .row{margin-top:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  hat monotile · level <b id="lev">1</b> · <span id="cnt">1</span> tiles<br>
  <div class="row">
    <button id="sub">build supertiles</button>
    <button id="reset">reset</button>
  </div>
  <div class="row">
    <button id="ht">hats: on</button>
    <button id="st">outlines: on</button>
  </div>
  drag to pan · scroll to zoom
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const hr3=Math.sqrt(3)/2;
const PI=Math.PI;

// ---- affine matrices [a,b,c,d,e,f] ----
const ident=[1,0,0,0,1,0];
function pt(x,y){return {x,y};}
function hexPt(x,y){return pt(x+0.5*y, hr3*y);}
function inv(T){const det=T[0]*T[4]-T[1]*T[3];return [T[4]/det,-T[1]/det,(T[1]*T[5]-T[2]*T[4])/det,-T[3]/det,T[0]/det,(T[2]*T[3]-T[0]*T[5])/det];}
function mul(A,B){return [A[0]*B[0]+A[1]*B[3],A[0]*B[1]+A[1]*B[4],A[0]*B[2]+A[1]*B[5]+A[2],A[3]*B[0]+A[4]*B[3],A[3]*B[1]+A[4]*B[4],A[3]*B[2]+A[4]*B[5]+A[5]];}
function padd(p,q){return {x:p.x+q.x,y:p.y+q.y};}
function psub(p,q){return {x:p.x-q.x,y:p.y-q.y};}
function trot(a){const c=Math.cos(a),s=Math.sin(a);return [c,-s,0,s,c,0];}
function ttrans(tx,ty){return [1,0,tx,0,1,ty];}
function rotAbout(p,ang){return mul(ttrans(p.x,p.y),mul(trot(ang),ttrans(-p.x,-p.y)));}
function transPt(M,P){return pt(M[0]*P.x+M[1]*P.y+M[2],M[3]*P.x+M[4]*P.y+M[5]);}
function matchSeg(p,q){return [q.x-p.x,p.y-q.y,p.x,q.y-p.y,q.x-p.x,p.y];}
function matchTwo(p1,q1,p2,q2){return mul(matchSeg(p2,q2),inv(matchSeg(p1,q1)));}
function intersect(p1,q1,p2,q2){const d=(q2.y-p2.y)*(q1.x-p1.x)-(q2.x-p2.x)*(q1.y-p1.y);const uA=((q2.x-p2.x)*(p1.y-p2.y)-(q2.y-p2.y)*(p1.x-p2.x))/d;return pt(p1.x+uA*(q1.x-p1.x),p1.y+uA*(q1.y-p1.y));}

const hat_outline=[hexPt(0,0),hexPt(-1,-1),hexPt(0,-2),hexPt(2,-2),hexPt(2,-1),hexPt(4,-2),hexPt(5,-1),hexPt(4,0),hexPt(3,0),hexPt(2,2),hexPt(0,3),hexPt(0,2),hexPt(-1,2)];

const cols={H1:'#89c9e8',H:'#9ccdeb',T:'#fbfbfb',P:'#fafafa',F:'#bfbfbf'};
const edgeCol='#555';

class HatTile{
  constructor(label){this.label=label;}
  draw(S,level,ctx,lw){this._poly(S,ctx,lw);}
  _poly(S,ctx,lw){
    ctx.beginPath();
    for(let i=0;i<hat_outline.length;i++){const tp=transPt(S,hat_outline[i]);if(i===0)ctx.moveTo(tp.x,tp.y);else ctx.lineTo(tp.x,tp.y);}
    ctx.closePath();
    ctx.fillStyle=cols[this.label];
    ctx.fill();
    ctx.lineWidth=lw;ctx.strokeStyle=edgeCol;ctx.stroke();
  }
}

class MetaTile{
  constructor(shape,width){this.shape=shape;this.width=width;this.children=[];}
  addChild(T,geom){this.children.push({T,geom});}
  evalChild(n,i){return transPt(this.children[n].T,this.children[n].geom.shape[i]);}
  draw(S,level,ctx,lw){
    if(level>0){for(const g of this.children)g.geom.draw(mul(S,g.T),level-1,ctx,lw);}
    else{this._outline(S,ctx,lw);}
  }
  _outline(S,ctx,lw){
    if(this.shape.length<2)return;
    ctx.beginPath();
    for(let i=0;i<this.shape.length;i++){const tp=transPt(S,this.shape[i]);if(i===0)ctx.moveTo(tp.x,tp.y);else ctx.lineTo(tp.x,tp.y);}
    ctx.closePath();
    ctx.lineWidth=this.width*lw*0.5;
    ctx.strokeStyle='#2a6a9a';ctx.stroke();
  }
  recentre(){
    let cx=0,cy=0;for(const p of this.shape){cx+=p.x;cy+=p.y;}cx/=this.shape.length;cy/=this.shape.length;
    for(let i=0;i<this.shape.length;i++)this.shape[i]=padd(this.shape[i],pt(-cx,-cy));
    const M=ttrans(-cx,-cy);for(const ch of this.children)ch.T=mul(M,ch.T);
  }
}

const H1_hat=new HatTile('H1'),H_hat=new HatTile('H'),T_hat=new HatTile('T'),P_hat=new HatTile('P'),F_hat=new HatTile('F');

const H_init=(function(){
  const H_outline=[pt(0,0),pt(4,0),pt(4.5,hr3),pt(2.5,5*hr3),pt(1.5,5*hr3),pt(-0.5,hr3)];
  const meta=new MetaTile(H_outline,2);
  meta.addChild(matchTwo(hat_outline[5],hat_outline[7],H_outline[5],H_outline[0]),H_hat);
  meta.addChild(matchTwo(hat_outline[9],hat_outline[11],H_outline[1],H_outline[2]),H_hat);
  meta.addChild(matchTwo(hat_outline[5],hat_outline[7],H_outline[3],H_outline[4]),H_hat);
  meta.addChild(mul(ttrans(2.5,hr3),mul([-0.5,-hr3,0,hr3,-0.5,0],[0.5,0,0,0,-0.5,0])),H1_hat);
  return meta;
})();

const T_init=(function(){
  const T_outline=[pt(0,0),pt(3,0),pt(1.5,3*hr3)];
  const meta=new MetaTile(T_outline,2);
  meta.addChild([0.5,0,0.5,0,0.5,hr3],T_hat);
  return meta;
})();

const P_init=(function(){
  const P_outline=[pt(0,0),pt(4,0),pt(3,2*hr3),pt(-1,2*hr3)];
  const meta=new MetaTile(P_outline,2);
  meta.addChild([0.5,0,1.5,0,0.5,hr3],P_hat);
  meta.addChild(mul(ttrans(0,2*hr3),mul([0.5,hr3,0,-hr3,0.5,0],[0.5,0,0,0,0.5,0])),P_hat);
  return meta;
})();

const F_init=(function(){
  const F_outline=[pt(0,0),pt(3,0),pt(3.5,hr3),pt(3,2*hr3),pt(-1,2*hr3)];
  const meta=new MetaTile(F_outline,2);
  meta.addChild([0.5,0,1.5,0,0.5,hr3],F_hat);
  meta.addChild(mul(ttrans(0,2*hr3),mul([0.5,hr3,0,-hr3,0.5,0],[0.5,0,0,0,0.5,0])),F_hat);
  return meta;
})();

function constructPatch(H,T,P,F){
  const rules=[
    ['H'],[0,0,'P',2],[1,0,'H',2],[2,0,'P',2],[3,0,'H',2],[4,4,'P',2],
    [0,4,'F',3],[2,4,'F',3],[4,1,3,2,'F',0],[8,3,'H',0],[9,2,'P',0],
    [10,2,'H',0],[11,4,'P',2],[12,0,'H',2],[13,0,'F',3],[14,2,'F',1],
    [15,3,'H',4],[8,2,'F',1],[17,3,'H',0],[18,2,'P',0],[19,2,'H',2],
    [20,4,'F',3],[20,0,'P',2],[22,0,'H',2],[23,4,'F',3],[23,0,'F',3],
    [16,0,'P',2],[9,4,0,2,'T',2],[4,0,'F',3]
  ];
  const ret=new MetaTile([],H.width);
  const shapes={H,T,P,F};
  for(const r of rules){
    if(r.length===1){ret.addChild(ident,shapes[r[0]]);}
    else if(r.length===4){
      const poly=ret.children[r[0]].geom.shape;const Tt=ret.children[r[0]].T;
      const Pp=transPt(Tt,poly[(r[1]+1)%poly.length]);const Q=transPt(Tt,poly[r[1]]);
      const nshp=shapes[r[2]];const npoly=nshp.shape;
      ret.addChild(matchTwo(npoly[r[3]],npoly[(r[3]+1)%npoly.length],Pp,Q),nshp);
    } else {
      const chP=ret.children[r[0]];const chQ=ret.children[r[2]];
      const Pp=transPt(chQ.T,chQ.geom.shape[r[3]]);const Q=transPt(chP.T,chP.geom.shape[r[1]]);
      const nshp=shapes[r[4]];const npoly=nshp.shape;
      ret.addChild(matchTwo(npoly[r[5]],npoly[(r[5]+1)%npoly.length],Pp,Q),nshp);
    }
  }
  return ret;
}

function constructMetatiles(patch){
  const bps1=patch.evalChild(8,2);const bps2=patch.evalChild(21,2);
  const rbps=transPt(rotAbout(bps1,-2*PI/3),bps2);
  const p72=patch.evalChild(7,2);const p252=patch.evalChild(25,2);
  const llc=intersect(bps1,rbps,patch.evalChild(6,2),p72);
  let w=psub(patch.evalChild(6,2),llc);
  const new_H_outline=[llc,bps1];
  w=transPt(trot(-PI/3),w);
  new_H_outline.push(padd(new_H_outline[1],w));
  new_H_outline.push(patch.evalChild(14,2));
  w=transPt(trot(-PI/3),w);
  new_H_outline.push(psub(new_H_outline[3],w));
  new_H_outline.push(patch.evalChild(6,2));
  const new_H=new MetaTile(new_H_outline,patch.width*2);
  for(const ch of [0,9,16,27,26,6,1,8,10,15])new_H.addChild(patch.children[ch].T,patch.children[ch].geom);

  const new_P_outline=[p72,padd(p72,psub(bps1,llc)),bps1,llc];
  const new_P=new MetaTile(new_P_outline,patch.width*2);
  for(const ch of [7,2,3,4,28])new_P.addChild(patch.children[ch].T,patch.children[ch].geom);

  const new_F_outline=[bps2,patch.evalChild(24,2),patch.evalChild(25,0),p252,padd(p252,psub(llc,bps1))];
  const new_F=new MetaTile(new_F_outline,patch.width*2);
  for(const ch of [21,20,22,23,24,25])new_F.addChild(patch.children[ch].T,patch.children[ch].geom);

  const AAA=new_H_outline[2];
  const BBB=padd(new_H_outline[1],psub(new_H_outline[4],new_H_outline[5]));
  const CCC=transPt(rotAbout(BBB,-PI/3),AAA);
  const new_T_outline=[BBB,CCC,AAA];
  const new_T=new MetaTile(new_T_outline,patch.width*2);
  new_T.addChild(patch.children[11].T,patch.children[11].geom);

  new_H.recentre();new_P.recentre();new_F.recentre();new_T.recentre();
  return [new_H,new_T,new_P,new_F];
}

// ---- state ----
let tiles=[H_init,T_init,P_init,F_init];
let level=1;
let view={scale:26,cx:0,cy:0};
let showHats=true, showOutlines=true;

function countHats(t,lev){
  if(lev<=0)return t instanceof HatTile?1:0;
  if(t instanceof HatTile)return 1;
  let n=0;for(const c of t.children)n+=countHats(c.geom,lev-1);return n;
}

function drawTileSet(idx){
  const toScreen=mul(ttrans(cv.width/2,cv.height/2),mul(ttrans(view.cx,view.cy),[view.scale,0,0,0,-view.scale,0]));
  const lw=1;
  const t=tiles[idx];
  if(showHats)t.draw(toScreen,level,ctx,lw);
  if(showOutlines){
    for(let lev=level-1;lev>=0;lev--){t.draw(toScreen,lev,ctx,lw);}
  }
}

function render(){
  cv.width=innerWidth;cv.height=innerHeight;
  ctx.fillStyle='#f7f7f2';ctx.fillRect(0,0,cv.width,cv.height);
  drawTileSet(0); // H type
  document.getElementById('lev').textContent=level;
  document.getElementById('cnt').textContent=countHats(tiles[0],level);
}

function build(){
  const patch=constructPatch(...tiles);
  tiles=constructMetatiles(patch);
  level++;
  render();
}

function reset(){
  tiles=[H_init,T_init,P_init,F_init];level=1;view={scale:26,cx:0,cy:0};render();
}

// ---- controls ----
document.getElementById('sub').onclick=build;
document.getElementById('reset').onclick=reset;
const htBtn=document.getElementById('ht'),stBtn=document.getElementById('st');
htBtn.onclick=()=>{showHats=!showHats;htBtn.textContent='hats: '+(showHats?'on':'off');render();};
stBtn.onclick=()=>{showOutlines=!showOutlines;stBtn.textContent='outlines: '+(showOutlines?'on':'off');render();};

let drag=null;
cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,cx:view.cx,cy:view.cy};});
window.addEventListener('mousemove',e=>{if(!drag)return;view.cx=drag.cx+(e.clientX-drag.x)/view.scale;view.cy=drag.cy-(e.clientY-drag.y)/view.scale;render();});
window.addEventListener('mouseup',()=>{drag=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12;view.scale*=f;render();},{passive:false});
window.addEventListener('resize',render);

render();
</script>
</body>
</html>
