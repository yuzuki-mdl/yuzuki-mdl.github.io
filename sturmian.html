<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sturmian words — cutting a line</title>
<style>
  :root{--bg:#0d0f14;--fg:#e8e6df;--dim:#8b8fa3;--acc:#7fd1c8;--acc2:#e8a87c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;padding:24px;max-width:900px;margin:0 auto}
  h1{font-size:20px;font-weight:600;margin:0 0 4px}
  .sub{color:var(--dim);margin:0 0 20px;font-size:13px}
  canvas{width:100%;height:auto;display:block;border-radius:8px;background:#10131a;image-rendering:pixelated;cursor:crosshair}
  .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:16px 0;font-size:13px}
  input[type=range]{width:220px;accent-color:var(--acc)}
  .val{color:var(--acc);min-width:90px;display:inline-block}
  .word{word-break:break-all;font-size:14px;line-height:1.7;background:#14181f;padding:10px 12px;border-radius:6px;margin:8px 0;letter-spacing:1px}
  .word b{color:var(--acc2);font-weight:600}
  .word i{color:var(--acc);font-style:normal}
  .note{color:var(--dim);font-size:13px;margin:14px 0}
  button{background:#1c212b;color:var(--fg);border:1px solid #2a3040;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--acc)}
  code{color:var(--acc)}
</style>
</head>
<body>
<h1>sturmian words</h1>
<p class="sub">cut a line of irrational slope through a grid. read off which cells it enters. that's a word, and it never repeats.</p>

<canvas id="c" width="600" height="600"></canvas>

<div class="controls">
  <label>slope α <input type="range" id="sl" min="0.01" max="0.99" step="0.001" value="0.618"></label>
  <span class="val" id="vs">0.618</span>
  <button id="phi">φ = 0.618…</button>
  <button id="e">√2 − 1</button>
</div>

<div class="word" id="w"></div>
<p class="note" id="info"></p>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height;
const sl=document.getElementById('sl'),vs=document.getElementById('vs');
const wEl=document.getElementById('w'),info=document.getElementById('info');

// mechanical word: s_n = floor((n+1)α+β) − floor(nα+β), β=0
// 1 = horizontal step (stay in row), 0 = vertical step (up a row)
function mechWord(alpha,n,beta=0){
  let a=[];
  for(let i=0;i<n;i++){
    a.push(Math.floor((i+1)*alpha+beta)-Math.floor(i*alpha+beta));
  }
  return a;
}

let alpha=0.618;

function draw(){
  const N=20; // grid N x N
  const cell=W/N;
  ctx.clearRect(0,0,W,H);

  // grid
  ctx.strokeStyle='#1e2430';ctx.lineWidth=1;
  for(let i=0;i<=N;i++){
    ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(W,i*cell);ctx.stroke();
  }

  // walk the line y=alpha*x from x=0 upward, marking cells
  // cell (col,row) with row counted from bottom
  const seen=new Set();
  const words=[];
  let x=0,y=0;
  // step through by unit cells: at each integer x or y boundary, advance
  let px=0,py=0;
  const pts=[[0,0]];
  // collect cells crossed: iterate n over steps, each step is +1 in x (word 1) or +1 in y (word 0)
  // using mechanical word for y-direction
  let cx=0,cy=0;
  const seq=mechWord(alpha, N*2);
  let wcount=0;
  const path=[[0,0]];
  for(let n=0;n<seq.length && cx<N && cy<N;n++){
    if(seq[n]===1){ cx++; } else { cy++; }
    path.push([cx,cy]);
    // cell entered is (cx-1, cy-1) roughly; mark the cell the segment passes
    const col=Math.min(cx- (seq[n]===1?1:0), N-1);
    const row=Math.min(cy- (seq[n]===1?0:1), N-1);
    if(col>=0&&row>=0) seen.add(col+','+row);
    words.push(seq[n]);
    wcount++;
  }

  // colour visited cells
  for(const k of seen){
    const [col,row]=k.split(',').map(Number);
    ctx.fillStyle='rgba(127,209,200,0.18)';
    ctx.fillRect(col*cell, H-(row+1)*cell, cell, cell);
  }

  // draw the actual line y=alpha*x in pixel space (row from bottom)
  ctx.strokeStyle='#e8a87c';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(W, H - alpha*W);
  ctx.stroke();

  // show word
  let html='';
  for(let i=0;i<Math.min(words.length,60);i++){
    html += words[i]===1 ? '<i>1</i>' : '<b>0</b>';
  }
  wEl.innerHTML=html + (words.length>60?' …':'');

  // counts -> slope estimate
  const ones=words.filter(v=>v===1).length, zeros=words.length-ones;
  info.textContent=`α=${alpha.toFixed(3)}  ·  ${ones} ones, ${zeros} zeros over ${words.length} steps  ·  ratio ${(ones/Math.max(zeros,1)).toFixed(3)}  ·  complexity p(n)=n+1`;
}

function setAlpha(a){
  alpha=a; sl.value=a; vs.textContent=a.toFixed(3); draw();
}

sl.addEventListener('input',()=>{ alpha=parseFloat(sl.value); vs.textContent=alpha.toFixed(3); draw(); });
document.getElementById('phi').addEventListener('click',()=>setAlpha(0.6180339887));
document.getElementById('e').addEventListener('click',()=>setAlpha(Math.SQRT2-1));

// clicking the canvas sets slope from cursor
function slopeFromClick(e){
  const r=c.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*W;
  const y=H-(e.clientY-r.top)/r.height*H;
  if(x>10){ setAlpha(Math.min(0.99,Math.max(0.01,y/x))); }
}
c.addEventListener('click',slopeFromClick);

draw();
</script>
</body>
</html>
