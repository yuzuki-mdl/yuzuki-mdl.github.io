<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>magic eye</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:#0b0b0f;color:#e8e8ef;font:15px/1.5 ui-monospace,Menlo,monospace}
  header{padding:18px 20px 6px;max-width:820px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.5px}
  p{margin:6px 0;color:#a7a7b8}
  a{color:#8ab4ff}
  .wrap{max-width:820px;margin:0 auto;padding:12px 20px 40px}
  canvas{width:100%;display:block;border-radius:10px;background:#000;image-rendering:pixelated;cursor:crosshair}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
  button{background:#1b1b26;color:#e8e8ef;border:1px solid #2c2c3c;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
  button:hover{background:#242434}
  button.on{background:#2b3a5e;border-color:#4a6bb0}
  input[type=range]{accent-color:#8ab4ff;width:180px}
  .hint{font-size:13px;color:#8d8da0}
</style>
</head>
<body>
<header>
  <h1>magic eye</h1>
  <p>a stereogram. cross your eyes (or look through the screen) until the hidden shape pops out.</p>
</header>
<div class="wrap">
  <canvas id="c" width="900" height="520"></canvas>
  <div class="row">
    <button data-s="0" class="on">star</button>
    <button data-s="1">heart</button>
    <button data-s="2">ring</button>
    <button data-s="3">spiral</button>
    <button data-s="4">text</button>
  </div>
  <div class="row">
    <label>depth <input id="depth" type="range" min="8" max="34" value="20"></label>
    <label>grain <input id="grain" type="range" min="0" max="100" value="55"></label>
    <button id="re">reroll</button>
  </div>
  <p class="hint">easiest way: hold the phone/screen far, relax your eyes like looking past it. the pattern is one image repeated at a slight offset — where the offset changes, the shape appears.</p>
</div>
<script>
const c = document.getElementById('c');
const g = c.getContext('2d');
const W = c.width, H = c.height;
let shape = 0, depth = 20, grain = 55, seed = 1;

function rnd(){ seed = (seed*1664525 + 1013904223) & 0xffffffff; return (seed>>>0)/4294967296; }

// height map: returns 0..1 (0 = far, 1 = near)
function field(x,y){
  const u = (x/W)*2-1, v = (y/H)*2-1;
  const r = Math.hypot(u, v*1.1);
  const th = Math.atan2(v, u);
  let h = 0;
  if(shape===0){ // five-point star (solid)
    const k = Math.PI/5;
    let a = ((th % (2*k)) + 2*k) % (2*k);
    a = Math.abs(a - k);
    const star = Math.cos(k)/Math.cos(a) * 0.62;
    h = r < star ? 1 : 0;
  } else if(shape===1){ // heart
    const hx = u*1.3, hy = -v*1.3 + 0.25;
    const t = hx*hx + hy*hy - 1;
    const inside = t*t*t - hx*hx*hy*hy*hy <= 0;
    h = inside ? 1 : 0;
  } else if(shape===2){ // ring
    h = Math.max(0, 1 - Math.abs(r - 0.55)*7);
  } else if(shape===3){ // spiral
    const s = (th + r*9) % (Math.PI*2);
    h = (s < Math.PI) ? 1 : 0;
    h *= Math.max(0, 1 - r*0.9);
  } else { // text-ish blobs
    h = Math.max(0, Math.sin(u*7)*Math.sin(v*7) - 0.25) * 1.6;
    h = Math.min(1, h);
  }
  return Math.max(0, Math.min(1, h));
}

function draw(){
  const img = g.createImageData(W, H);
  const d = img.data;
  const base = depth; // pixel offset at far plane
  const period = 128; // repeating strip width
  // build one random strip
  const strip = new Uint8Array(period*period*3);
  seed = 1;
  for(let i=0;i<strip.length;i++){ strip[i] = Math.floor(rnd()*255); }
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const h = field(x,y);
      const off = Math.round(base * (1-h)); // near shape shifts more
      const sx = ((x - off) % period + period) % period;
      const sy = y % period;
      const si = (sy*period + sx)*3;
      let r = strip[si], gg = strip[si+1], b = strip[si+2];
      // tint + grain
      const n = (rnd()-0.5)*grain;
      r = Math.max(0,Math.min(255,r*0.6+40+n));
      gg = Math.max(0,Math.min(255,gg*0.6+40+n));
      b = Math.max(0,Math.min(255,b*0.7+70+n));
      const i = (y*W+x)*4;
      d[i]=r; d[i+1]=gg; d[i+2]=b; d[i+3]=255;
    }
  }
  g.putImageData(img,0,0);
}

document.querySelectorAll('[data-s]').forEach(btn=>{
  btn.onclick=()=>{
    shape = +btn.dataset.s;
    document.querySelectorAll('[data-s]').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    draw();
  };
});
document.getElementById('depth').oninput=e=>{ depth=+e.target.value; draw(); };
document.getElementById('grain').oninput=e=>{ grain=+e.target.value; draw(); };
document.getElementById('re').onclick=()=>{ seed = (Math.random()*1e9)|0; draw(); };

draw();
</script>
</body>
</html>
