<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>torus knots</title>
<style>
  :root{--bg:#0e0f13;--fg:#e8e6e3;--dim:#8a8790;--acc:#7fd1c0;--acc2:#e08f7a}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,Menlo,monospace}
  #wrap{display:flex;flex-direction:column;height:100%}
  header{padding:14px 18px 6px}
  h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:12px;margin-top:2px}
  canvas{flex:1;width:100%;display:block;cursor:grab}
  .ctl{padding:10px 18px 16px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;border-top:1px solid #1c1e26}
  label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
  input[type=range]{width:120px;accent-color:var(--acc)}
  .val{color:var(--fg);min-width:2ch;display:inline-block}
  .readout{font-size:13px;color:var(--dim);margin-left:auto}
  .readout b{color:var(--acc);font-weight:600}
  .bad{color:var(--acc2)}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>torus knots</h1>
    <div class="sub">the (p,q) curve on a torus, drawn flat. drag to rotate.</div>
  </header>
  <canvas id="c"></canvas>
  <div class="ctl">
    <label>p <input id="p" type="range" min="1" max="12" value="2"><span class="val" id="pv">2</span></label>
    <label>q <input id="q" type="range" min="1" max="12" value="3"><span class="val" id="qv">3</span></label>
    <div class="readout" id="out"></div>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const pEl=document.getElementById('p'),qEl=document.getElementById('q');
const pv=document.getElementById('pv'),qv=document.getElementById('qv'),out=document.getElementById('out');
let rotX=0.9, rotZ=0.3, dragging=false, lx=0, ly=0;
const R=1, r=0.42; // torus radii

function gcd(a,b){while(b){[a,b]=[b,a%b];}return a;}

// torus point: u around the big circle, v around the tube
function torus(u,v){
  const cu=Math.cos(u), su=Math.sin(u), cv2=Math.cos(v), sv=Math.sin(v);
  const x=(R+r*cv2)*cu, y=(R+r*cv2)*su, z=r*sv;
  return [x,y,z];
}
function rotate(pt){
  let [x,y,z]=pt;
  // rotZ then rotX
  let cz=Math.cos(rotZ),sz=Math.sin(rotZ);
  let x1=x*cz-y*sz, y1=x*sz+y*cz, z1=z;
  let cx=Math.cos(rotX),sx=Math.sin(rotX);
  let y2=y1*cx-z1*sx, z2=y1*sx+z1*cx;
  return [x1,y2,z2];
}

function draw(){
  const W=cv.width=cv.clientWidth*devicePixelRatio;
  const H=cv.height=cv.clientHeight*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const w=cv.clientWidth, h=cv.clientHeight;
  ctx.clearRect(0,0,w,h);
  const p=+pEl.value, q=+qEl.value;
  pv.textContent=p; qv.textContent=q;
  const cop=gcd(p,q)===1;
  const scale=Math.min(w,h)*0.34;
  const cx=w/2, cy=h/2;

  // ---------- draw the torus surface as faint wireframe ----------
  ctx.lineWidth=0.6;
  const NU=36, NV=16;
  ctx.strokeStyle='rgba(120,140,160,0.10)';
  for(let i=0;i<NU;i++){
    const u=i/NU*Math.PI*2;
    ctx.beginPath();
    for(let j=0;j<=NV;j++){
      const v=j/NV*Math.PI*2;
      const P=rotate(torus(u,v));
      const sx=cx+P[0]*scale, sy=cy-P[2]*scale;
      j?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);
    }
    ctx.stroke();
  }
  for(let j=0;j<NV;j++){
    const v=j/NV*Math.PI*2;
    ctx.beginPath();
    for(let i=0;i<=NU;i++){
      const u=i/NU*Math.PI*2;
      const P=rotate(torus(u,v));
      const sx=cx+P[0]*scale, sy=cy-P[2]*scale;
      i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);
    }
    ctx.stroke();
  }

  // ---------- the knot: u = p*t, v = q*t ----------
  const STEPS=Math.max(400, (p*q)*160);
  const pts=[];
  for(let i=0;i<=STEPS;i++){
    const t=i/STEPS*Math.PI*2;
    const P=rotate(torus(p*t, q*t));
    pts.push([cx+P[0]*scale, cy-P[2]*scale, P[2]]); // keep z for depth-ish
  }
  // draw in two passes: back (dimmer) then front, split by z
  ctx.lineWidth=2.6;
  ctx.strokeStyle='rgba(127,209,192,0.35)';
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){ if(pts[i][2]<0){ i?ctx.lineTo(pts[i][0],pts[i][1]):ctx.moveTo(pts[i][0],pts[i][1]); } }
  ctx.stroke();
  // front segments
  ctx.strokeStyle='#7fd1c0';
  ctx.beginPath();
  let pen=false;
  for(let i=0;i<pts.length;i++){
    if(pts[i][2]>=0){ if(!pen){ctx.moveTo(pts[i][0],pts[i][1]);pen=true;} else ctx.lineTo(pts[i][0],pts[i][1]); }
    else pen=false;
  }
  ctx.stroke();

  // ---------- readout ----------
  if(cop){
    const cross=(p-1)*(q-1);
    out.innerHTML=`(${p},${q}) torus knot · crossings <b>${cross}</b>`;
  } else {
    const g=gcd(p,q);
    out.innerHTML=`<span class="bad">(${p},${q}) = ${g} parallel copies of (${p/g},${q/g})</span>`;
  }
}

pEl.oninput=draw; qEl.oninput=draw;

cv.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',e=>{dragging=false;});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  rotZ+=(e.clientX-lx)*0.008;
  rotX+=(e.clientY-ly)*0.008;
  rotX=Math.max(-1.4,Math.min(1.4,rotX));
  lx=e.clientX;ly=e.clientY;draw();
});
window.addEventListener('resize',draw);
requestAnimationFrame(draw);
</script>
</body>
</html>
