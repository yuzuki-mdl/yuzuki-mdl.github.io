<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>625 curves, one slow walk</title>
<style>
  html,body{margin:0;height:100%;background:#0d0d10;color:#c9c9cf;font:13px/1.5 ui-monospace,monospace}
  #wrap{display:grid;grid-template-columns:repeat(25,1fr);gap:1px;padding:1px;height:100vh;box-sizing:border-box}
  canvas{width:100%;height:100%;display:block;background:#15151a;border-radius:1px}
  header{position:fixed;left:12px;bottom:10px;opacity:.5;pointer-events:none;max-width:70vw}
  canvas.hi{outline:1px solid #d6a87f}
</style>
</head>
<body>
<div id="wrap"></div>
<header>625 curves · every control-point pair exactly once · each cell differs from the last by one lattice step · snake walk in two dimensions</header>
<script>
// same cubic bezier as onecurve.html. fixed endpoints. two control points,
// each on a 5x5 lattice. but now: ENUMERATE all 625 pairs, in an order where
// each consecutive cell moves exactly one control point by one lattice step.
// snake A through its 25 spots; inside each, snake B through its 25 in
// alternating directions, so the seams are always a single step of A.
const A=[0.15,0.5], B=[0.85,0.5];
const LAT=[-0.3,-0.15,0,0.15,0.3];

// a 2D snake over the 5x5 lattice: visits all 25 spots, each step one lattice
// unit, alternating direction per row so the seams are single steps too.
const snake=[];
for(let r=0;r<5;r++){
  const f=(r%2===0);
  for(let k=0;k<5;k++){ const col=f?k:4-k; snake.push([col,r]); }
}
// now walk: A follows the snake; inside each A spot, B follows the snake,
// alternating its own direction so the join between A spots is one step of A.
const walk=[];
for(let i=0;i<25;i++){
  const A2=snake[i];
  const f=(i%2===0);
  for(let k=0;k<25;k++){
    const B2 = f ? snake[k] : snake[24-k];
    walk.push([A2,B2]);
  }
}

const wrap=document.getElementById('wrap');
const N=walk.length;
const cells=[];
for(let i=0;i<N;i++){
  const c=document.createElement('canvas');
  c.width=c.height=64; wrap.appendChild(c); cells.push(c);
  const g=c.getContext('2d');
  const [A2,B2]=walk[i];
  const c1=[A[0]+LAT[A2[0]], A[1]+LAT[A2[1]]];
  const c2=[B[0]+LAT[B2[0]], B[1]+LAT[B2[1]]];
  g.translate(32,32); g.scale(32*0.8,32*0.8);
  g.beginPath();
  g.moveTo(A[0],A[1]);
  g.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],B[0],B[1]);
  g.strokeStyle='#d6a87f'; g.lineWidth=0.05; g.lineJoin='round'; g.stroke();
  g.fillStyle='#c9c9cf'; g.globalAlpha=0.22;
  for(const p of [c1,c2]){ g.beginPath(); g.arc(p[0],p[1],0.03,0,7); g.fill(); }
  g.globalAlpha=1;
  c.title = 'step '+(i+1)+'/'+N;
}
// start and end markers
cells[0].style.outline='1px solid #7fd6a8';
cells[N-1].style.outline='1px solid #d67f7f';

// show the walk as a moving highlight so u can feel the morph
let t=0, last=0;
function tick(now){
  if(now-last>40){ last=now;
    if(cells[t]) cells[t].classList.remove('hi');
    t=(t+1)%N;
    cells[t].classList.add('hi');
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
