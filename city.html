<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>city</title>
<style>
  html,body{margin:0;height:100%;background:#0a0e1a;overflow:hidden;font-family:ui-monospace,monospace;color:#cfd6e6}
  #c{display:block;width:100vw;height:100vh;cursor:crosshair}
  #ui{position:fixed;left:14px;bottom:14px;display:flex;gap:10px;align-items:center;font-size:12px;opacity:.85;user-select:none}
  #ui button{background:#1a2236;color:#cfd6e6;border:1px solid #2c3a5a;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
  #ui button:hover{background:#243050}
  #ui label{display:flex;gap:6px;align-items:center}
  #ui input[type=range]{width:90px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="regen">new city</button>
  <label>time <input id="tod" type="range" min="0" max="100" value="28"></label>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);draw();}

let seed=Math.floor(Math.random()*1e9);
function rng(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return((seed>>>0)/4294967296);}
function rr(a,b){return a+rng()*(b-a);}

// time of day 0..100 -> sky palette (night -> dawn -> day -> dusk -> night)
function lerp(a,b,t){return a+(b-a)*t;}
function mix(c1,c2,t){return[Math.round(lerp(c1[0],c2[0],t)),Math.round(lerp(c1[1],c2[1],t)),Math.round(lerp(c1[2],c2[2],t))];}
const stops=[
  {t:0,   top:[6,8,20],   bot:[14,18,38],  sun:[70,80,140], lit:0.9},
  {t:25,  top:[26,30,70], bot:[120,80,90],  sun:[255,170,120], lit:0.5},
  {t:45,  top:[80,140,210],bot:[190,210,235],sun:[255,240,200], lit:0.15},
  {t:65,  top:[70,120,200],bot:[235,200,170],sun:[255,220,160], lit:0.2},
  {t:82,  top:[40,50,110], bot:[210,120,90],  sun:[255,140,90],  lit:0.6},
  {t:100, top:[6,8,20],   bot:[14,18,38],  sun:[70,80,140], lit:0.9},
];
function sky(tod){
  let a=stops[0],b=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){if(tod>=stops[i].t&&tod<=stops[i+1].t){a=stops[i];b=stops[i+1];break;}}
  const t=(tod-a.t)/((b.t-a.t)||1);
  return{top:mix(a.top,b.top,t),bot:mix(a.bot,b.bot,t),sun:mix(a.sun,b.sun,t),lit:lerp(a.lit,b.lit,t)};
}

let buildings=[];
let parallax=0; // -1..1, eased toward mouse x
let parTarget=0;
function build(){
  seed=Math.floor(Math.random()*1e9);
  buildings=[];
  const layers=[
    {n:26, hmin:0.10, hmax:0.30, base:1.0,  shade:0.28, win:0.0},
    {n:20, hmin:0.18, hmax:0.45, base:1.0,  shade:0.5,  win:0.5},
    {n:14, hmin:0.30, hmax:0.70, base:1.0,  shade:0.75, win:0.9},
  ];
  for(const L of layers){
    let x=-0.05;
    while(x<1.05){
      const w=rr(0.02,0.07);
      const h=rr(L.hmin,L.hmax);
      // occasional tower
      const tower = rng()<0.08 ? rr(1.15,1.5):1;
      buildings.push({x,w,h:h*tower,layer:L,lit:rng()<L.win});
      x+=w+rr(0.004,0.02);
    }
  }
}

function draw(){
  const tod=+document.getElementById('tod').value;
  const sk=sky(tod);
  // sky gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${sk.top.join(',')})`);
  g.addColorStop(1,`rgb(${sk.bot.join(',')})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // sun / moon
  const sx=W*0.72, sy=H*(0.18+0.5*(1-Math.abs(tod-45)/45)*0.4 + (tod<45?0.2:0.2));
  const sunY=H*lerp(0.62,0.14,Math.sin(Math.PI*Math.min(1,Math.max(0,(tod-5)/90))));
  const isNight = tod<12||tod>88;
  const sr=isNight?26:Math.max(30,H*0.06);
  const glow=ctx.createRadialGradient(sx,sunY,0,sx,sunY,sr*4);
  glow.addColorStop(0,`rgba(${sk.sun.join(',')},0.9)`);
  glow.addColorStop(1,`rgba(${sk.sun.join(',')},0)`);
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(sx,sunY,sr*4,0,7);ctx.fill();
  ctx.fillStyle=`rgb(${sk.sun.join(',')})`;ctx.beginPath();ctx.arc(sx,sunY,sr,0,7);ctx.fill();
  if(isNight){ // craters
    ctx.fillStyle=`rgba(0,0,0,0.10)`;
    ctx.beginPath();ctx.arc(sx-sr*0.3,sunY-sr*0.2,sr*0.28,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(sx+sr*0.25,sunY+sr*0.15,sr*0.2,0,7);ctx.fill();
  }

  // stars at night
  if(isNight){
    const srng=(s=>()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;})(12345);
    for(let i=0;i<220;i++){const x=srng()*W,y=srng()*H*0.7;const a=srng()*0.7+0.1;ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fillRect(x,y,1.4,1.4);}
  }

  // buildings back-to-front
  const par=parallax; // -1..1 mouse offset
  const sorted=buildings.slice().sort((a,b)=>a.layer.shade-b.layer.shade);
  for(const b of sorted){
    const depthShift = (b.layer.shade-0.5)*W*0.04*par; // nearer layers shift more
    const bx=b.x*W+depthShift, bw=b.w*W, bh=b.h*H;
    const top=H-bh;
    const base=sk.bot;
    const col= mix([10,14,28],base,0.15).map(c=>Math.round(c*b.layer.shade+8));
    ctx.fillStyle=`rgb(${col.join(',')})`;
    ctx.fillRect(bx,top,bw,bh);
    // subtle edge
    ctx.fillStyle=`rgba(255,255,255,0.03)`;ctx.fillRect(bx,top,1,bh);

    // windows
    if(b.layer.win>0){
      const litProb = 0.35 + sk.lit*0.5;
      const wc=Math.max(3,Math.floor(bw/12));
      const wr=Math.max(3,Math.floor(bh/14));
      const padX=bw/(wc+1), padY=bh/(wr+1);
      const ws=Math.min(padX,padY)*0.5;
      for(let gy=0;gy<wr;gy++)for(let gx=0;gx<wc;gx++){
        const on = rng()<litProb;
        if(on){
          const warmth=rng();
          const wcol = warmth<0.6?[255,214,140]:warmth<0.85?[255,180,110]:[170,220,255];
          const a=0.5+rng()*0.5;
          ctx.fillStyle=`rgba(${wcol.join(',')},${a})`;
        }else{
          ctx.fillStyle=`rgba(20,26,44,0.7)`;
        }
        const wx=bx+padX*(gx+0.5)-ws/2;
        const wy=top+padY*(gy+0.5)-ws/2;
        ctx.fillRect(wx,wy,ws,ws);
      }
    }
  }

  // reflection glow on the ground/haze near horizon
  const hz=ctx.createLinearGradient(0,H*0.85,0,H);
  hz.addColorStop(0,'rgba(0,0,0,0)');
  hz.addColorStop(1,`rgba(${sk.bot.join(',')},0.25)`);
  ctx.fillStyle=hz;ctx.fillRect(0,H*0.85,W,H*0.15);
}

build();
resize();
addEventListener('resize',resize);
document.getElementById('regen').addEventListener('click',()=>{build();draw();});
document.getElementById('tod').addEventListener('input',draw);
addEventListener('mousemove',e=>{parTarget=(e.clientX/W-0.5)*2;});
(function loop(){parallax+=(parTarget-parallax)*0.06;if(Math.abs(parTarget-parallax)>0.001)draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
