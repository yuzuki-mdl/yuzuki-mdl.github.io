<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tornado toy</title>
<style>
html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:12px;bottom:12px;color:#8b93a7;font-size:13px;user-select:none;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">drag to spin the air · click to drop debris</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;function resize(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
resize();addEventListener('resize',resize);
let spin=0,targetSpin=0;
cv.addEventListener('pointermove',e=>{if(e.buttons){targetSpin+=(e.movementX||0)*0.0009;}});
cv.addEventListener('pointerdown',e=>{for(let i=0;i<6;i++)spawn(e.clientX,e.clientY);});
const parts=[];
const COLORS=['#cfd6e6','#9aa6c0','#7f8aa6','#e8edf7','#5f6a85','#b9c3d8'];
function spawn(x,y){
  const a=Math.random()*Math.PI*2,r=Math.random()*8;
  parts.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,
    ang:a,rad:Math.max(6,Math.hypot(x-innerWidth/2,y-innerHeight*0.6)),
    spd:0.6+Math.random()*1.2,size:1+Math.random()*2.2,
    col:COLORS[(Math.random()*COLORS.length)|0],life:1});
}
function step(){
  spin+=(targetSpin-spin)*0.06;targetSpin*=0.97;
  const cx=innerWidth/2,cy=innerHeight*0.62;
  ctx.fillStyle='rgba(11,13,18,0.22)';ctx.fillRect(0,0,innerWidth,innerHeight);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.ang+=(0.9+p.spd*0.6)/Math.max(40,p.rad)*spin*180+0.02*p.spd;
    p.rad+= (18 - p.rad*0.02)*0.01 + p.spd*0.05;
    p.x=cx+Math.cos(p.ang)*p.rad;
    p.y=cy+Math.sin(p.ang)*p.rad*0.42 - p.rad*0.55;
    p.life-=0.0015;
    if(p.rad>Math.max(innerWidth,innerHeight)*0.9||p.life<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=Math.min(1,p.life*1.4);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  ctx.globalAlpha=1;
  if(Math.random()<0.55)spawn(innerWidth/2+(Math.random()-0.5)*20,innerHeight*0.62+(Math.random()-0.5)*16);
  requestAnimationFrame(step);
}
step();
</script>
</body>
</html>
