<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>physarum</title>
<style>
  html,body{margin:0;height:100%;background:#08080a;overflow:hidden;font-family:ui-monospace,monospace;color:#cfd8e8}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  #ui{position:fixed;left:12px;bottom:12px;font-size:12px;opacity:.6;line-height:1.6;pointer-events:none}
  #ui b{color:#7ad0ff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <b id="n">40000</b> slime agents · click = drop food · space = reset<br>
  each one senses left/right, turns toward the strongest trail, leaves its own
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,DPR;

const GW=360, GH=360;
let trail, next;

const N=40000;
const SENSE_ANG=0.55;
const SENSE_DIST=9;
const TURN=0.42;
const SPEED=1.0;
const DEPOSIT=5.0;
const DECAY=0.94;

let agents=[];

function idx(x,y){ return (y*GW+x); }
function sample(x,y){
  if(x<0||y<0||x>=GW||y>=GH) return 0;
  return trail[idx(x|0,y|0)];
}

function mkAgents(){
  agents=[];
  for(let i=0;i<N;i++){
    agents.push({x:Math.random()*GW, y:Math.random()*GH, a:Math.random()*Math.PI*2});
  }
}

function reset(){
  trail=new Float32Array(GW*GH);
  next=new Float32Array(GW*GH);
  mkAgents();
}

function step(){
  for(const p of agents){
    const a=p.a;
    const fx=Math.cos(a), fy=Math.sin(a);
    const la=a-SENSE_ANG, ra=a+SENSE_ANG;
    const sL=sample(p.x+Math.cos(la)*SENSE_DIST, p.y+Math.sin(la)*SENSE_DIST);
    const sF=sample(p.x+fx*SENSE_DIST, p.y+fy*SENSE_DIST);
    const sR=sample(p.x+Math.cos(ra)*SENSE_DIST, p.y+Math.sin(ra)*SENSE_DIST);
    if(sF>sL && sF>sR){}
    else if(sL>sR){ p.a -= TURN*(0.6+Math.random()*0.8); }
    else if(sR>sL){ p.a += TURN*(0.6+Math.random()*0.8); }
    p.x += Math.cos(p.a)*SPEED;
    p.y += Math.sin(p.a)*SPEED;
    if(p.x<0) p.x+=GW; if(p.x>=GW) p.x-=GW;
    if(p.y<0) p.y+=GH; if(p.y>=GH) p.y-=GH;
    trail[idx(p.x|0,p.y|0)]+=DEPOSIT;
  }
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      const i=idx(x,y);
      let s=trail[i]*4;
      s+=trail[x>0?i-1:i];
      s+=trail[x<GW-1?i+1:i];
      s+=trail[y>0?i-GW:i];
      s+=trail[y<GH-1?i+GW:i];
      next[i]=(s/8)*DECAY;
    }
  }
  const t=trail; trail=next; next=t;
}

const off=document.createElement('canvas');
off.width=GW; off.height=GH;
const octx=off.getContext('2d');
let img=octx.createImageData(GW,GH);

function draw(){
  const d=img.data;
  for(let i=0;i<GW*GH;i++){
    let v=trail[i]/22; if(v>1) v=1;
    const r=(v*v*255)|0;
    const g=(Math.sqrt(v)*220)|0;
    const b=(v*120+40)|0;
    d[i*4]=r; d[i*4+1]=g; d[i*4+2]=b; d[i*4+3]=255;
  }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(off,0,0,W,H);
}

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

function loop(){
  step();
  draw();
  requestAnimationFrame(loop);
}

addEventListener('resize',resize);
addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); reset(); } });
cv.addEventListener('click',e=>{
  const gx=(e.clientX/innerWidth*GW)|0, gy=(e.clientY/innerHeight*GH)|0;
  for(let y=-14;y<=14;y++)for(let x=-14;x<=14;x++){
    if(x*x+y*y>196) continue;
    const px=gx+x, py=gy+y;
    if(px<0||py<0||px>=GW||py>=GH) continue;
    trail[idx(px,py)]+=40;
  }
});

resize(); reset(); loop();
</script>
</body>
</html>
