<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my room</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14;font-family:ui-monospace,monospace;color:#cdd6f4}
  #hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:13px;line-height:1.7;background:rgba(11,14,20,.82);padding:18px 22px;border-radius:10px;border:1px solid #2a3040;z-index:10;cursor:pointer}
  #hint b{color:#f5c2e7}
  .hide{display:none}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(205,214,244,.5);pointer-events:none;z-index:5}
</style>
</head>
<body>
<div id="cross" class="hide"></div>
<div id="hint">
  <b>my room</b><br>
  click to walk in<br>
  <span style="opacity:.6">wasd move · mouse look · e = light switch<br>f pick up · r rotate · backspace delete · + to add · esc out</span>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x1a1b34, 40, 400);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 200);
camera.position.set(0, 1.6, 2.6);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const propMat = (c,r=.85)=>new THREE.MeshStandardMaterial({color:c, roughness:r});
const fireFlames = [];
const aquariumFish = [];
const clockHands = []; // {mesh, len, speed} hands ticking
// ---- room ----
const W = 7, D = 7, H = 3.2; // width depth height
const room = new THREE.Group();
scene.add(room);

// floor
const floorMat = new THREE.MeshStandardMaterial({color:0x2a2233, roughness:.9});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), floorMat);
floor.rotation.x = -Math.PI/2; room.add(floor);

// ceiling
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({color:0x1a1622, roughness:1}));
ceil.rotation.x = Math.PI/2; ceil.position.y = H; room.add(ceil);

// walls
const wallMat = new THREE.MeshStandardMaterial({color:0x3a2f47, roughness:.95, side:THREE.DoubleSide});
function wall(w,h,x,y,z,ry){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat);
  m.position.set(x,y,z); m.rotation.y = ry; room.add(m); return m;
}
wall(W,H,0,H/2,-D/2,0);      // back
// front wall has a doorway out to the bedroom
const BD_X = 0.0, BD_W = 1.6, BD_Y1 = 2.4;
const frSegR = (W/2) - (BD_X + BD_W/2);
if(frSegR > 0.01){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(frSegR,H), wallMat);
  m.position.set(BD_X+BD_W/2 + frSegR/2, H/2, D/2); m.rotation.y = Math.PI; room.add(m);
}
const frSegL = (BD_X - BD_W/2) - (-W/2);
if(frSegL > 0.01){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(frSegL,H), wallMat);
  m.position.set(-W/2 + frSegL/2, H/2, D/2); m.rotation.y = Math.PI; room.add(m);
}
const frLintelH = H - BD_Y1;
if(frLintelH > 0.01){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(BD_W, frLintelH), wallMat);
  m.position.set(BD_X, BD_Y1 + frLintelH/2, D/2); m.rotation.y = Math.PI; room.add(m);
}
// right wall has a doorway out to the study
const SD_Z = 0.8, SD_W = 1.8, SD_Y1 = 2.4;
const srSegFront = (D/2) - (SD_Z + SD_W/2);
if(srSegFront > 0.01){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(srSegFront,H), wallMat);
  m.position.set(W/2, H/2, SD_Z+SD_W/2 + srSegFront/2); m.rotation.y = -Math.PI/2; room.add(m);
}
const srSegBack = (SD_Z - SD_W/2) - (-D/2);
if(srSegBack > 0.01){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(srSegBack,H), wallMat);
  m.position.set(W/2, H/2, -D/2 + srSegBack/2); m.rotation.y = -Math.PI/2; room.add(m);
}
const srLintelH = H - SD_Y1;
if(srLintelH > 0.01){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(SD_W, srLintelH), wallMat);
  m.position.set(W/2, SD_Y1 + srLintelH/2, SD_Z); m.rotation.y = -Math.PI/2; room.add(m);
}

// left wall has a doorway out to the balcony
const OP_Z = 0.8, OP_W = 2.0, OP_Y0 = 0.0, OP_Y1 = 2.4;
// segment in front of the opening (toward +z)
const segFront = (D/2) - (OP_Z + OP_W/2);
if(segFront > 0.01){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(segFront,H), wallMat);
  m.position.set(-W/2, H/2, OP_Z+OP_W/2 + segFront/2); m.rotation.y = Math.PI/2; room.add(m);
}
// segment behind the opening (toward -z), now split by the kitchen doorway
const KZ = -1.8, KW = 1.0; // kitchen doorway center z + width
const KZ0 = KZ - KW/2, KZ1 = KZ + KW/2;
// segment between balcony opening and kitchen door
const segMid0 = OP_Z - OP_W/2;   // -0.2
const segMid1 = KZ1;             // -1.3
if(segMid0 - segMid1 > 0.01){
  const len = segMid0 - segMid1;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len,H), wallMat);
  m.position.set(-W/2, H/2, segMid1 + len/2); m.rotation.y = Math.PI/2; room.add(m);
}
// segment from back wall to kitchen door
const segBk0 = -D/2, segBk1 = KZ0;
if(segBk1 - segBk0 > 0.01){
  const len = segBk1 - segBk0;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len,H), wallMat);
  m.position.set(-W/2, H/2, segBk0 + len/2); m.rotation.y = Math.PI/2; room.add(m);
}
// lintel over kitchen doorway
{
  const lh = H - 2.2;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(KW, lh), wallMat);
  m.position.set(-W/2, 2.2 + lh/2, KZ); m.rotation.y = Math.PI/2; room.add(m);
}
// lintel above the opening
const lintelH = H - OP_Y1;
if(lintelH > 0.01){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(OP_W, lintelH), wallMat);
  m.position.set(-W/2, OP_Y1 + lintelH/2, OP_Z); m.rotation.y = Math.PI/2; room.add(m);
}

// rug
const rug = new THREE.Mesh(new THREE.CircleGeometry(1.6, 40), new THREE.MeshStandardMaterial({color:0x4a3a5c, roughness:1}));
rug.rotation.x = -Math.PI/2; rug.position.set(0,0.01,0); room.add(rug);

// a low table
const tableMat = new THREE.MeshStandardMaterial({color:0x5a4a3a, roughness:.8});
const table = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.08,0.9), tableMat);
table.position.set(0,0.5,-1.2); room.add(table);
for(const [x,z] of [[-.6,-1.55],[.6,-1.55],[-.6,-.85],[.6,-.85]]){
  const leg = new THREE.Mesh(new THREE.BoxGeometry(.08,.5,.08), tableMat);
  leg.position.set(x,.25,z); room.add(leg);
}

// shelf on back wall
const shelfMat = new THREE.MeshStandardMaterial({color:0x4a3a3a, roughness:.8});
// raised + shifted right so the fridge (1.7 tall) and counter top clear them
const SHELF_X = -0.9, SHELF_W = 2.2, SHELF_Y0 = 1.5, SHELF_DY = 0.6;
for(let i=0;i<3;i++){
  const s = new THREE.Mesh(new THREE.BoxGeometry(SHELF_W,.06,.4), shelfMat);
  s.position.set(SHELF_X, SHELF_Y0+i*SHELF_DY, -D/2+0.22); room.add(s);
}
// moonlight spilling in through the doorway
const winLight = new THREE.PointLight(0x8fb6ff, 6, 14, 2);
winLight.position.set(-W/2+0.6, 1.9, OP_Z); room.add(winLight);

// ---- balcony + outside ----
// slab
const slabMat = new THREE.MeshStandardMaterial({color:0x2f2a38, roughness:.95});
const slab = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.12, OP_W+0.6), slabMat);
slab.position.set(-W/2-1.0, 0.0, OP_Z); room.add(slab);
// railing posts + top rail
const railMat = new THREE.MeshStandardMaterial({color:0x4a4450, roughness:.7, metalness:.3});
const railTop = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.05, 0.05), railMat);
railTop.position.set(-W/2-1.0, 1.0, OP_Z - (OP_W+0.6)/2); room.add(railTop);
const railTop2 = railTop.clone(); railTop2.position.z = OP_Z + (OP_W+0.6)/2; room.add(railTop2);
for(let i=0;i<=8;i++){
  const t = i/8;
  const x = -W/2 - t*2.0;
  for(const zz of [OP_Z-(OP_W+0.6)/2, OP_Z+(OP_W+0.6)/2]){
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.04,1.0,0.04), railMat);
    p.position.set(x, 0.5, zz); room.add(p);
  }
}
// outer railing (far edge)
const railFar = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,OP_W+0.6), railMat);
railFar.position.set(-W/2-2.0, 1.0, OP_Z); room.add(railFar);
for(let i=0;i<=4;i++){
  const t = i/4;
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.04,1.0,0.04), railMat);
  p.position.set(-W/2-2.0, 0.5, OP_Z-(OP_W+0.6)/2 + t*(OP_W+0.6)); room.add(p);
}

// sky dome-ish: big backdrop sphere behind, plus ground + hills + city + moon + stars
const skyGeo = new THREE.SphereGeometry(80, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms:{ top:{value:new THREE.Color(0x0d1330)}, bot:{value:new THREE.Color(0x3a2f52)} },
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vP; uniform vec3 top; uniform vec3 bot;
    void main(){ float h = clamp(vP.y/80.0*0.5+0.5, 0.0, 1.0); gl_FragColor = vec4(mix(bot, top, h), 1.0); }`
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// stars
const starGeo = new THREE.BufferGeometry();
const sN = 700; const sPos = new Float32Array(sN*3);
for(let i=0;i<sN;i++){
  const u = Math.random()*Math.PI*2, v = Math.random()*0.6+0.05;
  const r = 70;
  sPos[i*3]   = Math.cos(u)*Math.cos(v)*r;
  sPos[i*3+1] = Math.sin(v)*r + 5;
  sPos[i*3+2] = Math.sin(u)*Math.cos(v)*r;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(sPos,3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff, size:0.35, sizeAttenuation:true, transparent:true, opacity:0.9})));

// moon
const moon = new THREE.Mesh(new THREE.SphereGeometry(3, 24, 24), new THREE.MeshBasicMaterial({color:0xf5e6c8}));
moon.position.set(-40, 22, -20); scene.add(moon);
const moonHalo = new THREE.Mesh(new THREE.SphereGeometry(4.2, 24, 24), new THREE.MeshBasicMaterial({color:0xdfe6ff, transparent:true, opacity:0.12}));
moonHalo.position.copy(moon.position); scene.add(moonHalo);

// distant ground (city level, way below the balcony)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.MeshStandardMaterial({color:0x121522, roughness:1}));
ground.rotation.x = -Math.PI/2; ground.position.y = -18; scene.add(ground);

// distant city blocks w/ window lights
const cityMat = new THREE.MeshStandardMaterial({color:0x0e1220, roughness:1});
const lightMat = new THREE.MeshBasicMaterial({color:0xffd99a});
for(let i=0;i<70;i++){
  const bw = 2+Math.random()*5, bh = 6+Math.random()*28, bd = 2+Math.random()*5;
  const x = -30 - Math.random()*90;
  const z = -60 + Math.random()*120;
  const b = new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd), cityMat);
  b.position.set(x, -18 + bh/2, z); scene.add(b);
  // a few lit windows
  const nWin = 2 + Math.floor(Math.random()*5);
  for(let w=0; w<nWin; w++){
    const lw = new THREE.Mesh(new THREE.PlaneGeometry(0.6,0.9), lightMat);
    lw.position.set(x + bw/2 + 0.02, -18 + 2 + Math.random()*(bh-3), z - bd/2 + 1 + Math.random()*(bd-2));
    lw.rotation.y = Math.PI/2; scene.add(lw);
  }
}

// hills silhouette
const hillMat = new THREE.MeshBasicMaterial({color:0x0a0d18});
for(let i=0;i<6;i++){
  const h = new THREE.Mesh(new THREE.CircleGeometry(20+Math.random()*15, 24, 0, Math.PI), hillMat);
  h.position.set(-50-Math.random()*40, -18, -70 + Math.random()*140);
  h.rotation.y = Math.PI/2; scene.add(h);
}

// ---- little covered nook at the far end of the balcony ----
const nookZ0 = OP_Z + (OP_W+0.6)/2; // 2.1, outer edge of balcony slab
const nookD = 1.9;                  // depth of nook in z
const nookW = 2.0;                  // matches slab width in x
const nookCX = -W/2 - 1.0;          // same x-center as slab
const nookZc = nookZ0 + nookD/2;
// slab extension
const nookSlab = new THREE.Mesh(new THREE.BoxGeometry(nookW, 0.12, nookD), slabMat);
nookSlab.position.set(nookCX, 0.0, nookZc); room.add(nookSlab);
// back wall of nook (far +z)
const nookWallMat = new THREE.MeshStandardMaterial({color:0x342a40, roughness:.95, side:THREE.DoubleSide});
// back wall of nook, with a doorway through to the greenhouse
const nookDoorW = 1.0;
const nookPanelW = (nookW - nookDoorW)/2;
for(const s of [-1,1]){
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(nookPanelW, H), nookWallMat);
  panel.position.set(nookCX + s*(nookDoorW/2 + nookPanelW/2), H/2, nookZ0 + nookD); room.add(panel);
}
const nookLintel = new THREE.Mesh(new THREE.PlaneGeometry(nookDoorW, H-2.2), nookWallMat);
nookLintel.position.set(nookCX, 2.2 + (H-2.2)/2, nookZ0 + nookD); room.add(nookLintel);
// side wall (far -x edge), the outer one, so the nook is sheltered from the city side
const nookSide = new THREE.Mesh(new THREE.PlaneGeometry(nookD, H), nookWallMat);
nookSide.position.set(nookCX - nookW/2, H/2, nookZc); nookSide.rotation.y = Math.PI/2; room.add(nookSide);
// roof
const nookRoofMat = new THREE.MeshStandardMaterial({color:0x2a2233, roughness:1});
const nookRoof = new THREE.Mesh(new THREE.BoxGeometry(nookW+0.1, 0.08, nookD+0.1), nookRoofMat);
nookRoof.position.set(nookCX, H, nookZc); room.add(nookRoof);
// little chair in the nook
const nookChairMat = new THREE.MeshStandardMaterial({color:0x6a4a3a, roughness:.8});
const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.06,0.5), nookChairMat);
chairSeat.position.set(nookCX, 0.45, nookZc+0.35); room.add(chairSeat);
const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.05), nookChairMat);
chairBack.position.set(nookCX, 0.7, nookZc+0.6); room.add(chairBack);
for(const [dx,dz] of [[-.2,-.2],[.2,-.2],[-.2,.2],[.2,.2]]){
  const leg = new THREE.Mesh(new THREE.BoxGeometry(.05,.45,.05), nookChairMat);
  leg.position.set(nookCX+dx, 0.225, nookZc+0.35+dz); room.add(leg);
}
// little side table
const sideTable = new THREE.Mesh(new THREE.BoxGeometry(0.35,0.05,0.35), nookChairMat);
sideTable.position.set(nookCX+0.55, 0.55, nookZc+0.35); room.add(sideTable);
const stLeg = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.55,0.05), nookChairMat);
stLeg.position.set(nookCX+0.55, 0.275, nookZc+0.35); room.add(stLeg);
// a little mug on the table
const nookMug = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.045,0.09,12), new THREE.MeshStandardMaterial({color:0xd8d2e0, roughness:.6}));
nookMug.position.set(nookCX+0.55, 0.62, nookZc+0.35); room.add(nookMug);
// hanging lantern
const nookLantern = new THREE.Mesh(new THREE.SphereGeometry(0.1,12,12), new THREE.MeshBasicMaterial({color:0xffd9a0}));
nookLantern.position.set(nookCX, H-0.35, nookZc); room.add(nookLantern);
const nookLight = new THREE.PointLight(0xffc98a, 8, 6, 2);
nookLight.position.copy(nookLantern.position); room.add(nookLight);
const lanternWire = new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.35,6), new THREE.MeshStandardMaterial({color:0x1a1a20}));
lanternWire.position.set(nookCX, H-0.17, nookZc); room.add(lanternWire);
// a little potted plant in the corner
const nookPlantPot = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.07,0.14,10), new THREE.MeshStandardMaterial({color:0x8a5a4a, roughness:.9}));
nookPlantPot.position.set(nookCX-0.7, 0.07, nookZc+0.7); room.add(nookPlantPot);
for(let i=0;i<5;i++){
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8), new THREE.MeshStandardMaterial({color:0x4a7a4a, roughness:.9}));
  const a = i/5*Math.PI*2;
  leaf.position.set(nookCX-0.7+Math.cos(a)*0.06, 0.2+Math.random()*0.1, nookZc+0.7+Math.sin(a)*0.06);
  leaf.scale.y = 1.4; room.add(leaf);
}

// little string of fairy lights along the nook roof edge
const fairyMat = new THREE.MeshBasicMaterial({color:0xffe8b0});
for(let i=0;i<9;i++){
  const t = i/8;
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.028,8,8), fairyMat);
  bulb.position.set(nookCX - nookW/2 + 0.15 + t*(nookW-0.3), H-0.06 - Math.sin(t*Math.PI)*0.09, nookZc - nookD/2 + 0.08);
  room.add(bulb);
}
const fairyLight = new THREE.PointLight(0xffcf8a, 2.5, 3.5, 2);
fairyLight.position.set(nookCX, H-0.12, nookZc - nookD/2 + 0.1); room.add(fairyLight);

// ---- little greenhouse/sunroom off the far end of the nook ----
const ghZ0 = nookZ0 + nookD;        // 4.0, right where the nook ends
const ghD = 2.0;                    // depth in z
const ghW = nookW;                  // same width
const ghCX = nookCX;
const ghZc = ghZ0 + ghD/2;
const glassMat = new THREE.MeshStandardMaterial({color:0x9fd4c8, roughness:.15, metalness:.1, transparent:true, opacity:0.18, side:THREE.DoubleSide});
const ghFrameMat = new THREE.MeshStandardMaterial({color:0x3d5a4a, roughness:.8});
// floor
const ghFloor = new THREE.Mesh(new THREE.BoxGeometry(ghW, 0.12, ghD), slabMat);
ghFloor.position.set(ghCX, 0.0, ghZc); room.add(ghFloor);
// back glass wall
const ghBack = new THREE.Mesh(new THREE.PlaneGeometry(ghW, H), glassMat);
ghBack.position.set(ghCX, H/2, ghZ0+ghD); room.add(ghBack);
// side glass walls
const ghSide1 = new THREE.Mesh(new THREE.PlaneGeometry(ghD, H), glassMat);
ghSide1.position.set(ghCX-ghW/2, H/2, ghZc); ghSide1.rotation.y=Math.PI/2; room.add(ghSide1);
const ghSide2 = new THREE.Mesh(new THREE.PlaneGeometry(ghD, H), glassMat);
ghSide2.position.set(ghCX+ghW/2, H/2, ghZc); ghSide2.rotation.y=Math.PI/2; room.add(ghSide2);
// glass roof
const ghRoof = new THREE.Mesh(new THREE.PlaneGeometry(ghW, ghD), glassMat);
ghRoof.rotation.x = -Math.PI/2; ghRoof.position.set(ghCX, H, ghZc); room.add(ghRoof);
// corner posts + roof beams
for(const [dx,dz] of [[-ghW/2,-ghD/2],[ghW/2,-ghD/2],[-ghW/2,ghD/2],[ghW/2,ghD/2]]){
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.07,H,0.07), ghFrameMat);
  post.position.set(ghCX+dx, H/2, ghZc+dz); room.add(post);
}
const beamMat = ghFrameMat;
const beamBack = new THREE.Mesh(new THREE.BoxGeometry(ghW,0.06,0.06), beamMat);
beamBack.position.set(ghCX, H, ghZ0+ghD); room.add(beamBack);
// grow light
const growLight = new THREE.PointLight(0xffe0b0, 5, 6, 2);
growLight.position.set(ghCX, H-0.3, ghZc); room.add(growLight);
// potted plants on a little shelf
const ghShelfMat = new THREE.MeshStandardMaterial({color:0x5a4a3a, roughness:.9});
const ghShelf = new THREE.Mesh(new THREE.BoxGeometry(ghW-0.3,0.05,0.35), ghShelfMat);
ghShelf.position.set(ghCX, 0.7, ghZ0+ghD-0.2); room.add(ghShelf);
for(let i=0;i<4;i++){
  const px = ghCX - (ghW-0.6)/2 + i*(ghW-0.6)/3;
  const potMat = new THREE.MeshStandardMaterial({color:[0x8a5a3a,0x6a6a7a,0x9a6a4a,0x5a7a5a][i], roughness:.9});
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.07,0.12,10), potMat);
  pot.position.set(px, 0.79, ghZ0+ghD-0.2); room.add(pot);
  const leafMat = new THREE.MeshStandardMaterial({color:[0x4a8a4a,0x5aa05a,0x6ab06a,0x3a7a3a][i], roughness:.8});
  for(let l=0;l<5;l++){
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8), leafMat);
    const a = l/5*Math.PI*2;
    leaf.position.set(px+Math.cos(a)*0.06, 0.9+Math.random()*0.08, ghZ0+ghD-0.2+Math.sin(a)*0.06);
    leaf.scale.y = 1.6; room.add(leaf);
  }
}
// a little bench to sit on
const ghBench = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.06,0.35), ghShelfMat);

function drawRain(dt){
  rctx.fillStyle = '#0b1026'; rctx.fillRect(0,0,128,192);
  const g = rctx.createLinearGradient(0,120,0,192);
  g.addColorStop(0,'rgba(40,50,90,0)'); g.addColorStop(1,'rgba(60,70,120,0.5)');
  rctx.fillStyle = g; rctx.fillRect(0,120,128,72);
  rctx.strokeStyle = 'rgba(170,200,255,0.55)'; rctx.lineWidth = 1;
  for(const d of rainDrops){
    d.y += d.sp*dt; if(d.y > 192){ d.y = -d.len; d.x = Math.random()*128; }
    rctx.beginPath(); rctx.moveTo(d.x, d.y); rctx.lineTo(d.x-2, d.y+d.len); rctx.stroke();
  }
  rainTex.needsUpdate = true;
}

// ---- grab / arrange ----
const raycaster = new THREE.Raycaster();
const centerNDC = new THREE.Vector2(0,0);
let held = null;
const REACH = 2.6;

function propUnderCrosshair(){
  raycaster.setFromCamera(centerNDC, camera);
  const hits = raycaster.intersectObjects(props, true);
  if(!hits.length || hits[0].distance > REACH) return null;
  let o = hits[0].object;
  while(o && !props.includes(o)) o = o.parent;
  return o || null;
}

function tryGrab(){
  if(held){ dropHeld(); return; }
  const p = propUnderCrosshair();
  if(p){ held = p; }
}

function dropHeld(){
  const p = held; held = null;
  p.position.x = Math.max(-W/2+0.5, Math.min(W/2-0.5, p.position.x));
  p.position.z = Math.max(-D/2+0.5, Math.min(D/2-0.5, p.position.z));
  p.position.y = Math.max(0, p.position.y);
  saveLayout();
}

addEventListener('keydown', e=>{
  if(e.code==='KeyF') tryGrab();
  if(e.code==='KeyR' && held) held.rotation.y += Math.PI/6;
  if(e.code==='Backspace' && held){ // delete a prop
    room.remove(held); props.splice(props.indexOf(held),1); held=null; saveLayout();
  }
});

function loadLayout(){
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){}
  if(!raw) return;
  let items, known;
  if(Array.isArray(raw)){ items = raw; known = LEGACY_DEFAULTS.slice(); }
  else if(raw && Array.isArray(raw.items)){ items = raw.items; known = Array.isArray(raw.known) ? raw.known : LEGACY_DEFAULTS.slice(); }
  else return;
  for(const p of props.slice()){ room.remove(p); }
  props.length = 0;
  const seen = new Set();
  for(const d of items){
    const mk = MAKERS[d.name]; if(!mk) continue;
    seen.add(d.name);
    const g = addProp(mk(), d.x, d.z, d.name, d.y||0);
    g.rotation.y = d.ry||0;
  }
  // add defaults this save has never seen (props added to the game since)
  for(const d of DEFAULT_LAYOUT){
    if(known.includes(d.name) || seen.has(d.name)) continue;
    const g = addProp(MAKERS[d.name](), d.x, d.z, d.name, d.y||0);
    if(d.ry) g.rotation.y = d.ry;
  }
}

function toggleLights(){
  // only when standing near the switch
  const dx = camera.position.x - (-W/2+3.0);
  const dz = camera.position.z - (D/2);
  if(dx*dx + dz*dz > 2.2*2.2) return;

let yaw = 0, pitch = 0;
const hint = document.getElementById('hint');
const cross = document.getElementById('cross');
let locked = false;

hint.addEventListener('click', ()=>{ renderer.domElement.requestPointerLock(); });
document.addEventListener('pointerlockchange', ()=>{
  locked = document.pointerLockElement === renderer.domElement;
  hint.classList.toggle('hide', locked);
  cross.classList.toggle('hide', !locked);
});
document.addEventListener('mousemove', e=>{
  if(!locked) return;
  yaw   -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
});

const vel = new THREE.Vector3();
const clock = new THREE.Clock();
const BOUND = {x: W/2-0.4, z: D/2-0.4};

function tick(){
  const now = performance.now();
  const dt = Math.min(clock.getDelta(), 0.05);
  const speed = 2.6;
  const dir = new THREE.Vector3();
  const fwd = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  if(keys['KeyW']||keys['ArrowUp']) dir.add(fwd);
  if(keys['KeyS']||keys['ArrowDown']) dir.sub(fwd);
  if(keys['KeyD']||keys['ArrowRight']) dir.add(right);
  if(keys['KeyA']||keys['ArrowLeft']) dir.sub(right);
  if(dir.lengthSq()>0) dir.normalize();
  vel.lerp(dir.multiplyScalar(speed), 1-Math.pow(0.001, dt));
  camera.position.x += vel.x*dt;
  camera.position.z += vel.z*dt;
  // allow stepping into the bedroom through the front-wall doorway
  const inDoorX = camera.position.x > BD_X - BD_W/2 + 0.25 && camera.position.x < BD_X + BD_W/2 - 0.25;
  const inBedroomX = camera.position.x > bdX0 + 0.3 && camera.position.x < bdX1 - 0.3;
  const alreadyIn = camera.position.z > D/2 + 0.1;
  const canGoThrough = alreadyIn ? inBedroomX : inDoorX;
  const maxZ = canGoThrough ? (bdZ1 - 0.3) : BOUND.z;
  camera.position.z = Math.max(-BOUND.z, Math.min(maxZ, camera.position.z));
  // allow stepping out onto the balcony through the doorway, and into the far nook
  const onBalconyZ = (camera.position.z > OP_Z - (OP_W/2 - 0.3)) && (camera.position.z < nookZ0 + nookD - 0.3);
  const onGreenhouseZ = (camera.position.z > nookZ0 + nookD - 0.3) && (camera.position.z < ghZ0 + ghD - 0.3);
  const onKitchenZ = (camera.position.z > kZ0 + 0.3) && (camera.position.z < kZ1 - 0.3);
  const minX = (onBalconyZ || onGreenhouseZ || onKitchenZ) ? (-W/2 - 2.0 + 0.3) : -BOUND.x;
  // allow stepping into the study off the right wall
  const inStudyZ = (camera.position.z > stZ0 + 0.3) && (camera.position.z < stZ1 - 0.3);
  const maxX = inStudyZ ? (stX0 + stW - 0.3) : BOUND.x;
  camera.position.x = Math.max(minX, Math.min(maxX, camera.position.x));
  camera.position.y = 1.6;

  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
  camera.quaternion.copy(q);

  // gentle lamp flicker (only when on)
  if(lightsOn) lampLight.intensity = 18 + Math.sin(performance.now()*0.003)*1.2;

  // fireplace flames flicker
  if(fireFlames.length){
    const t = performance.now()*0.008;
    for(let i=0;i<fireFlames.length;i++){
      const f = fireFlames[i];
      const s = 0.85 + Math.sin(t + i*1.7)*0.18 + Math.random()*0.06;
      f.scale.y = s; f.scale.x = f.scale.z = 0.9 + Math.sin(t*1.3+i)*0.1;
    }
  }

  // wall clock hands track real time
  if(clockHands.length){
    const d=new Date();
    const mins=d.getMinutes()+d.getSeconds()/60;
    const hrs=(d.getHours()%12)+mins/60;
    clockHands[0].mesh.rotation.z = -hrs/12*Math.PI*2;
    clockHands[1].mesh.rotation.z = -mins/60*Math.PI*2;
  }

  // fish swim in loops inside the aquarium
  if(aquariumFish.length){
    const t = performance.now()*0.001;
    for(let i=aquariumFish.length-1;i>=0;i--){
      const f = aquariumFish[i];
      if(!f.mesh.parent){ aquariumFish.splice(i,1); continue; }
      const a = t*f.speed + f.phase;
      f.mesh.position.x = Math.sin(a)*0.36;
      f.mesh.position.z = Math.cos(a*0.7)*0.1;
      f.mesh.position.y = f.yBase + Math.sin(a*1.6)*0.06;
      // face direction of travel (body points +x)
      const vx = Math.cos(a), vz = -Math.sin(a*0.7)*0.7;
      f.mesh.rotation.y = Math.atan2(vx, vz) - Math.PI/2;
    }
  }

  // the pet cat wanders around the floor
  {
    const px = pet.position.x, pz = pet.position.z;
    const dx = petState.target.x - px, dz = petState.target.z - pz;
    const dist = Math.hypot(dx, dz);
    if(dist < 0.12){
      if(!petState.waitUntil) petState.waitUntil = now + 1500 + Math.random()*4000;
      if(now > petState.waitUntil){ pickPetTarget(); petState.waitUntil = 0; }
    } else {
      const sp = 0.9;
      pet.position.x += (dx/dist)*sp*dt;
      pet.position.z += (dz/dist)*sp*dt;
      petState.facing = Math.atan2(dx, dz);
    }
    // smooth turn toward facing
    let df = petState.facing - pet.rotation.y;
    while(df > Math.PI) df -= Math.PI*2;
    while(df < -Math.PI) df += Math.PI*2;
    pet.rotation.y += df * Math.min(1, dt*8);
    // little bob while walking
    if(dist >= 0.12) pet.position.y = Math.abs(Math.sin(now*0.012))*0.03;
    else pet.position.y = 0;
  }

  // the cat plush blinks now and then
  if(now > nextBlink){
    const t = (now - nextBlink)/140;
    if(t >= 1){ for(const e of catEyes) e.scale.y = 1; nextBlink = now + 2500 + Math.random()*4500; }
    else { const open = Math.abs(t - 0.5)*2; for(const e of catEyes) e.scale.y = Math.max(0.12, open); }
  }

  // held prop floats in front of u while u carry it
  if(held){
    const hold = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)).multiplyScalar(0.9);
    const target = new THREE.Vector3(camera.position.x+hold.x, held.position.y, camera.position.z+hold.z);
    held.position.lerp(target, 1-Math.pow(0.0001, dt));
    promptEl.textContent = 'f place · r rotate';
    promptEl.style.opacity = '1';
  } else {
    const p = propUnderCrosshair();
    if(p){ promptEl.textContent = 'f pick up ' + (p.userData.name||''); promptEl.style.opacity='1'; }
    else promptEl.style.opacity='0';
  }

  drawRain(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

// ---- touch controls (phones/tablets) ----
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if(isTouch){
  hint.classList.add('hide');
  noteEl.style.display='none';
  // drag anywhere on the canvas to look around
  let lookId=null, lx=0, ly=0;
  renderer.domElement.addEventListener('touchstart', e=>{
    const t=e.changedTouches[0]; lookId=t.identifier; lx=t.clientX; ly=t.clientY;
  }, {passive:true});
  renderer.domElement.addEventListener('touchmove', e=>{
    for(const t of e.changedTouches){
      if(t.identifier!==lookId) continue;
      yaw   -= (t.clientX-lx)*0.004;
      pitch -= (t.clientY-ly)*0.004;
      pitch = Math.max(-1.2, Math.min(1.2, pitch));
      lx=t.clientX; ly=t.clientY;
    }
  }, {passive:true});
  const endLook=e=>{ for(const t of e.changedTouches) if(t.identifier===lookId) lookId=null; };
  renderer.domElement.addEventListener('touchend', endLook);
  renderer.domElement.addEventListener('touchcancel', endLook);

  // virtual joystick (bottom-left) drives the same WASD keys
  const stick=document.createElement('div');
  Object.assign(stick.style,{position:'fixed',left:'20px',bottom:'20px',width:'110px',height:'110px',borderRadius:'50%',background:'rgba(20,16,26,.45)',border:'1px solid #3a3048',zIndex:7,touchAction:'none'});
  const knob=document.createElement('div');
  Object.assign(knob.style,{position:'absolute',left:'50%',top:'50%',width:'46px',height:'46px',marginLeft:'-23px',marginTop:'-23px',borderRadius:'50%',background:'rgba(232,220,192,.5)'});
  stick.appendChild(knob); document.body.appendChild(stick);
  let stickId=null, sx=0, sy=0;
  const R=38;
  function moveStick(dx,dy){
    const m=Math.hypot(dx,dy)||1; const c=Math.min(m,R)/m;
    knob.style.transform='translate('+(dx*c)+'px,'+(dy*c)+'px)';
    const nx=dx/m, ny=dy/m, dead=0.35;
    keys['KeyW']=ny<-dead; keys['KeyS']=ny>dead;
    keys['KeyA']=nx<-dead; keys['KeyD']=nx>dead;
  }
  stick.addEventListener('touchstart', e=>{
    const t=e.changedTouches[0]; stickId=t.identifier;
    const r=stick.getBoundingClientRect(); sx=r.left+r.width/2; sy=r.top+r.height/2;
    moveStick(t.clientX-sx, t.clientY-sy); e.preventDefault();
  }, {passive:false});
  stick.addEventListener('touchmove', e=>{
    for(const t of e.changedTouches) if(t.identifier===stickId) moveStick(t.clientX-sx, t.clientY-sy);
    e.preventDefault();
  }, {passive:false});
  const endStick=e=>{
    for(const t of e.changedTouches) if(t.identifier===stickId){
      stickId=null; knob.style.transform='translate(0,0)';
      keys['KeyW']=keys['KeyS']=keys['KeyA']=keys['KeyD']=false;
    }
  };
  stick.addEventListener('touchend', endStick);
  stick.addEventListener('touchcancel', endStick);

  // action buttons (bottom-center)
  const bar=document.createElement('div');
  Object.assign(bar.style,{position:'fixed',left:'50%',bottom:'24px',transform:'translateX(-50%)',display:'flex',gap:'10px',zIndex:7});
  function mkBtn(label, fn){
    const b=document.createElement('button'); b.textContent=label;
    Object.assign(b.style,{width:'52px',height:'52px',borderRadius:'50%',background:'rgba(20,16,26,.6)',color:'#e8dcc0',border:'1px solid #3a3048',font:'18px system-ui,sans-serif',touchAction:'none'});
    b.addEventListener('touchstart', e=>{ e.preventDefault(); fn(); }, {passive:false});
    bar.appendChild(b); return b;
  }
  mkBtn('✋', ()=>tryGrab());
  mkBtn('⟳', ()=>{ if(held) held.rotation.y += Math.PI/6; });
  mkBtn('🗑', ()=>{ if(held){ room.remove(held); props.splice(props.indexOf(held),1); held=null; saveLayout(); } });
  document.body.appendChild(bar);

  // the spawn palette needs to sit above the joystick on small screens
  pal.style.bottom='84px';
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
