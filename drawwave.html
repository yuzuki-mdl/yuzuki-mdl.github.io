<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>draw a wave</title>
<style>
  :root{--bg:#0b0b10;--fg:#e8e8f0;--dim:#55556a;--on:#7cf;--on2:#f7a;--grid:#1a1a24}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 ui-monospace,monospace;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px 12px;gap:14px;user-select:none}
  h1{font-size:15px;font-weight:400;letter-spacing:.3em;color:var(--dim);margin:0}
  canvas{width:min(900px,94vw);height:min(360px,50vh);background:#0e0e15;border:1px solid #23232f;border-radius:10px;touch-action:none;cursor:crosshair;display:block}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{background:#1b1b26;color:var(--fg);border:1px solid #2c2c3c;padding:8px 16px;border-radius:8px;
    font:inherit;cursor:pointer;transition:.12s}
  button:hover{border-color:#3c3c52}
  button.play{border-color:var(--on);color:var(--on)}
  .ctl{display:flex;gap:8px;align-items:center;color:var(--dim)}
  input[type=range]{accent-color:var(--on);width:110px}
  .hint{color:var(--dim);font-size:12px;text-align:center;max-width:460px;line-height:1.6}
  .val{color:var(--fg);min-width:44px;display:inline-block}
</style>
</head>
<body>
<h1>DRAW A WAVE</h1>
<canvas id="c"></canvas>
<div class="bar">
  <button id="play" class="play">▶ hold to hear</button>
  <button id="clear">clear</button>
  <button id="rand">random</button>
</div>
<div class="bar">
  <div class="ctl">pitch <input type=range id=pitch min=40 max=1200 step=1 value=220><span class=val id=pv>220</span>hz</div>
  <div class="ctl">loop <input type=range id=loop min=1 max=8 step=1 value=2><span class=val id=lv>2</span>x</div>
</div>
<div class="hint">draw any shape across the box (left → right = one cycle of the sound). hold play to hear it loop. draw a sine for a pure tone, a saw for a buzz, scribble for noise. loop stretches the shape over more cycles.</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W=0,H=0,DPR=Math.min(2,devicePixelRatio||1);
let pts=[]; // normalized x in [0,1], y amplitude in [-1,1]
function resize(){
  const r=c.getBoundingClientRect();W=r.width;H=r.height;
  c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);draw();
}
window.addEventListener('resize',resize);

function defaultWave(){
  pts=[];
  for(let i=0;i<=256;i++){const x=i/256;pts.push({x:x,y:Math.sin(x*Math.PI*2)*0.8});}
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // grid
  ctx.strokeStyle='#1a1a24';ctx.lineWidth=1;
  for(let i=1;i<8;i++){const x=W*i/8;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
  // wave
  if(pts.length>1){
    ctx.strokeStyle='#7cf';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.lineCap='round';
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const px=pts[i].x*W, py=H/2 - pts[i].y*(H/2-6);
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
    // glow dots
    ctx.fillStyle='#f7a';
    for(let i=0;i<pts.length;i+=Math.max(1,Math.floor(pts.length/24))){
      const px=pts[i].x*W, py=H/2 - pts[i].y*(H/2-6);
      ctx.beginPath();ctx.arc(px,py,2,0,7);ctx.fill();
    }
  }
}

// drawing
let drawing=false;
function addPoint(e){
  const r=c.getBoundingClientRect();
  const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  const y=Math.max(-1,Math.min(1,1-2*(e.clientY-r.top)/r.height));
  pts.push({x,y});
  pts.sort((a,b)=>a.x-b.x);
  // thin out: keep max ~600 pts
  if(pts.length>600){const keep=[];for(let i=0;i<pts.length;i+=2)keep.push(pts[i]);pts=keep;}
  draw();
}
c.addEventListener('pointerdown',e=>{drawing=true;pts=[];addPoint(e);c.setPointerCapture(e.pointerId);});
c.addEventListener('pointermove',e=>{if(drawing)addPoint(e);});
c.addEventListener('pointerup',e=>{drawing=false;});
c.addEventListener('pointercancel',()=>{drawing=false;});

// audio
let ac=null,osc=null,gain=null,playing=false;
function waveTable(buf){
  // build periodic wave from pts, using nearest-sample lookup
  const N=2048;
  const re=new Float32Array(N), im=new Float32Array(N);
  // direct sum: sample pts as a piecewise function, then do DFT (cheap enough at 2048? O(N^2)=4M ok)
  // simpler: sample waveform into a buffer, then run an FFT-less DFT with limited harmonics
  const samp=new Float32Array(N);
  if(pts.length<2){for(let i=0;i<N;i++)samp[i]=0;}
  else{
    // sort already; build lookup
    const loops=+document.getElementById('loop').value||1;
    let pi=0;
    for(let i=0;i<N;i++){
      const x=(i/N*loops)%1;
      while(pi<pts.length-1 && pts[pi+1].x<x)pi++;
      const a=pts[pi], b=pts[Math.min(pi+1,pts.length-1)];
      let y;
      if(b.x===a.x)y=a.y;else{const t=(x-a.x)/(b.x-a.x);y=a.y+(b.y-a.y)*t;}
      samp[i]=y;
    }
  }
  // DFT for first H harmonics
  const H=64;
  for(let k=1;k<=H;k++){
    let sr=0,si=0;
    for(let n=0;n<N;n++){
      const ang=2*Math.PI*k*n/N;
      sr+=samp[n]*Math.cos(ang);
      si-=samp[n]*Math.sin(ang);
    }
    re[k]=sr/N*2; im[k]=si/N*2;
  }
  return ac.createPeriodicWave(re,im,{disableNormalization:false});
}

function startAudio(){
  if(ac)return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  osc=ac.createOscillator();
  gain=ac.createGain();
  gain.gain.value=0;
  osc.connect(gain).connect(ac.destination);
  osc.start();
}
function updateWave(){
  if(!ac||!osc)return;
  try{osc.setPeriodicWave(waveTable());}catch(e){}
}

const pitchEl=document.getElementById('pitch'),pv=document.getElementById('pv');
const loopEl=document.getElementById('loop'),lv=document.getElementById('lv');
pitchEl.addEventListener('input',()=>{pv.textContent=pitchEl.value;if(osc)osc.frequency.value=+pitchEl.value;});
loopEl.addEventListener('input',()=>{lv.textContent=loopEl.value;updateWave();});

const playBtn=document.getElementById('play');
function playOn(){
  startAudio();
  if(ac.state==='suspended')ac.resume();
  osc.frequency.value=+pitchEl.value;
  updateWave();
  gain.gain.cancelScheduledValues(ac.currentTime);
  gain.gain.setTargetAtTime(0.25,ac.currentTime,0.02);
  playing=true;
}
function playOff(){
  if(!ac)return;
  gain.gain.cancelScheduledValues(ac.currentTime);
  gain.gain.setTargetAtTime(0,ac.currentTime,0.05);
  playing=false;
}
playBtn.addEventListener('pointerdown',e=>{e.preventDefault();playOn();});
window.addEventListener('pointerup',playOff);
playBtn.addEventListener('pointerleave',()=>{if(playing)playOff();});

// clear & random
document.getElementById('clear').onclick=()=>{pts=[];if(playing)updateWave();draw();};
document.getElementById('rand').onclick=()=>{
  pts=[];const n=8+Math.floor(Math.random()*24);
  let y=0;
  for(let i=0;i<=n;i++){y+=(Math.random()-0.5)*1.2;y=Math.max(-1,Math.min(1,y));pts.push({x:i/n,y:y});}
  pts.sort((a,b)=>a.x-b.x);draw();if(playing)updateWave();
};

// redraw wave on draw change while playing
const origAdd=addPoint;
addPoint=function(e){origAdd(e);if(playing)updateWave();};

resize();
defaultWave();draw();
</script>
</body>
</html>
