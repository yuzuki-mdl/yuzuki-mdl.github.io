<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ibfv — dye on the disk</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;color:#cdd6e6;font:13px/1.4 ui-monospace,Menlo,monospace;overflow:hidden}
  #wrap{display:flex;flex-direction:column;height:100%}
  canvas{flex:1;display:block;touch-action:none;cursor:crosshair}
  #bar{padding:8px 12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#0b0e16;border-top:1px solid #1a2030}
  #bar label{display:flex;gap:6px;align-items:center;color:#8b98b0}
  input[type=range]{width:110px;accent-color:#5ad}
  .k{color:#5ad}
  a{color:#5ad}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="bar">
    <span class="k">ibfv</span> dye advected along a rotation flow, in the hyperbolic disk
    <label>decay <input id="alpha" type="range" min="2" max="120" value="22"></label>
    <label>speed <input id="speed" type="range" min="0" max="300" value="120"></label>
    <label><input id="pause" type="checkbox"> pause</label>
    <span id="hint" style="color:#556">drag to move the vortex centre</span>
  </div>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d', {willReadFrequently:true});

// disk centre in screen space + geometry
let W=0,H=0, cx=0, cy=0, R=0;
let vcx=0.5, vcy=0.5; // vortex centre in disk coords (unit disk, 0..1 -> -1..1)

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = c.clientWidth; H = c.clientHeight;
  c.width = Math.round(W*dpr); c.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  R = Math.min(W,H)*0.46;
  cx = W/2; cy = H/2;
  // reset buffers
  prev = new Float32Array(W*H*3);
  noise = makeNoise();
}

// R,G,B noise textures, tileable-ish random
let noiseTex = null;
function makeNoise(){
  const N = 256;
  noiseTex = new Float32Array(N*N*3);
  for(let i=0;i<N*N*3;i++) noiseTex[i] = Math.random();
  return N;
}
let NS = 256;

let prev = null;

// hyperbolic: map screen (sx,sy) -> disk coords (u,v) in [-1,1]^2
function toDisk(sx,sy){ return [ (sx-cx)/R, (sy-cy)/R ]; }

function samplePrev(u,v){
  // u,v in [-1,1]; out of disk -> black
  const sx = cx + u*R, sy = cy + v*R;
  if(sx<0||sy<0||sx>=W-1||sy>=H-1) return [0,0,0];
  const x0=Math.floor(sx), y0=Math.floor(sy), fx=sx-x0, fy=sy-y0;
  const i00=(y0*W+x0)*3, i10=i00+3, i01=i00+W*3, i11=i01+3;
  const out=[0,0,0];
  for(let k=0;k<3;k++){
    const a=prev[i00+k], b=prev[i10+k], cc=prev[i01+k], d=prev[i11+k];
    out[k]=(a*(1-fx)+b*fx)*(1-fy)+(cc*(1-fx)+d*fx)*fy;
  }
  return out;
}

// velocity field at disk point (u,v): rotation about vortex centre
// hyperbolic: angular speed grows toward the rim so it looks alive; direction = tangent
function velocity(u,v, speed){
  const vx0 = vcx*2-1, vy0 = vcy*2-1;
  const dx = u - vx0, dy = v - vy0;
  const r2 = dx*dx+dy*dy;
  // tangent (perp) of radius
  let tx = -dy, ty = dx;
  // hyperbolic-ish scaling: faster near rim (1-|z|^2 in denominator)
  const rho = u*u+v*v;
  const hyp = 1.0/Math.max(0.05, (1-rho)); // blows up at rim
  let sp = speed*0.0012*hyp;
  sp = Math.min(sp, 0.05); // cap so a frame never leaps the whole disk
  return [tx*sp, ty*sp];
}

let t=0;
function frame(){
  if(!paused()){
    const alpha = +document.getElementById('alpha').value/1000;
    const speed = +document.getElementById('speed').value;
    const dt = 1.0;
    const out = new Float32Array(W*H*3);
    for(let sy=0; sy<H; sy++){
      const v = (sy-cy)/R;
      for(let sx=0; sx<W; sx++){
        const u = (sx-cx)/R;
        const idx=(sy*W+sx)*3;
        const rho=u*u+v*v;
        if(rho>1.0){ out[idx]=out[idx+1]=out[idx+2]=0; continue; }
        const [vx,vy]=velocity(u,v,speed);
        // backward advect (screen space): source = current - v*dt
        const su = u - vx*dt, sv = v - vy*dt;
        const adv = samplePrev(su,sv);
        // noise sample
        const ni = ((sy&255)*NS + (sx&255))*3;
        const nr=noiseTex[ni], ng=noiseTex[ni+1], nb=noiseTex[ni+2];
        out[idx]   = (1-alpha)*adv[0] + alpha*nr;
        out[idx+1] = (1-alpha)*adv[1] + alpha*ng;
        out[idx+2] = (1-alpha)*adv[2] + alpha*nb;
      }
    }
    prev = out;
    // draw
    const img = ctx.createImageData(W,H);
    const d = img.data;
    for(let i=0;i<W*H;i++){
      const r=prev[i*3],g=prev[i*3+1],b=prev[i*3+2];
      // tone map + gamma
      d[i*4]   = Math.min(255, Math.pow(r,0.8)*255);
      d[i*4+1] = Math.min(255, Math.pow(g,0.8)*255);
      d[i*4+2] = Math.min(255, Math.pow(b,0.8)*255);
      d[i*4+3] = 255;
    }
    ctx.putImageData(img,0,0);
    // rim ring
    ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.strokeStyle='#1b2333'; ctx.lineWidth=1.5; ctx.stroke();
    t++;
  }
  requestAnimationFrame(frame);
}

function paused(){ return document.getElementById('pause').checked; }

// drag vortex
let dragging=false;
c.addEventListener('pointerdown',e=>{dragging=true; moveVortex(e);});
c.addEventListener('pointermove',e=>{ if(dragging) moveVortex(e); });
window.addEventListener('pointerup',()=>dragging=false);
function moveVortex(e){
  const r=c.getBoundingClientRect();
  const sx=e.clientX-r.left, sy=e.clientY-r.top;
  let u=(sx-cx)/R, v=(sy-cy)/R;
  const rho=u*u+v*v; if(rho>0.98){const s=Math.sqrt(0.98/rho);u*=s;v*=s;}
  vcx=(u+1)/2; vcy=(v+1)/2;
}

window.addEventListener('resize',()=>{resize();});
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
