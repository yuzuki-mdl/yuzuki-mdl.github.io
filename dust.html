<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dust</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0f;overflow:hidden;cursor:crosshair}
  canvas{display:block}
  .hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    color:#6a6a85;font:13px/1.4 ui-monospace,monospace;pointer-events:none;
    letter-spacing:.04em;transition:opacity .6s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="h">move ur cursor · click to scatter</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = innerWidth * DPR;
  H = cv.height = innerHeight * DPR;
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
}
resize();
addEventListener('resize', resize);

const N = 900;
const P = [];
function spawn(p){
  p.x = Math.random() * W;
  p.y = Math.random() * H;
  p.vx = 0; p.vy = 0;
  p.h = 200 + Math.random() * 100; // hue: blues → violets
  p.s = 0.5 + Math.random() * 1.6;
  return p;
}
for (let i = 0; i < N; i++) P.push(spawn({}));

let mx = -9999, my = -9999, down = false;
function pos(e){
  const t = e.touches ? e.touches[0] : e;
  mx = t.clientX * DPR; my = t.clientY * DPR;
}
addEventListener('mousemove', e => { pos(e); });
addEventListener('touchmove', e => { pos(e); e.preventDefault(); }, {passive:false});
addEventListener('mousedown', e => { down = true; pos(e); scatter(); });
addEventListener('mouseup', () => down = false);
addEventListener('touchstart', e => { down = true; pos(e); scatter(); }, {passive:true});
addEventListener('touchend', () => down = false);

function scatter(){
  for (const p of P){
    const dx = p.x - mx, dy = p.y - my;
    const d2 = dx*dx + dy*dy + 1;
    if (d2 < 260*260*DPR*DPR){
      const f = 9000 / d2;
      p.vx += dx * f; p.vy += dy * f;
    }
  }
}

const R = 150 * DPR;
let t = 0;
function frame(){
  t += 0.006;
  // soft trailing fade
  ctx.fillStyle = 'rgba(10,10,15,0.14)';
  ctx.fillRect(0, 0, W, H);

  for (const p of P){
    // gentle drift field (curl-ish)
    const a = Math.sin(p.x * 0.0016 + t) * Math.cos(p.y * 0.0016 - t) * 2.2;
    p.vx += Math.cos(a) * 0.03;
    p.vy += Math.sin(a) * 0.03;

    // cursor repulsion
    const dx = p.x - mx, dy = p.y - my;
    const d2 = dx*dx + dy*dy + 1;
    if (d2 < R*R){
      const f = (down ? 260 : 90) / d2;
      p.vx += dx * f; p.vy += dy * f;
    }

    // damping + wrap
    p.vx *= 0.94; p.vy *= 0.94;
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x += W; else if (p.x > W) p.x -= W;
    if (p.y < 0) p.y += H; else if (p.y > H) p.y -= H;

    const sp = Math.min(Math.hypot(p.vx, p.vy) * 0.12, 0.9);
    ctx.fillStyle = `hsla(${p.h}, 80%, ${55 + sp*30}%, ${0.35 + sp*0.5})`;
    const s = p.s * DPR * (1 + sp*1.4);
    ctx.beginPath();
    ctx.arc(p.x, p.y, s, 0, 6.283);
    ctx.fill();
  }
  requestAnimationFrame(frame);
}
frame();

setTimeout(() => { document.getElementById('h').style.opacity = 0; }, 5000);
</script>
</body>
</html>
