    ctx.strokeStyle=o?'rgba(58,110,165,0.55)':'rgba(192,64,96,0.9)';
    ctx.lineWidth=o?1.2:2.2;ctx.stroke();
  }
  // cells
  for(let i=0;i<N;i++){const p=px(coords[i]);const isYou=i===you;const seen=visited.has(i);
    ctx.beginPath();ctx.arc(p[0],p[1],isYou?7:(seen?3.2:2.2),0,7);
    ctx.fillStyle=isYou?'#ffd040':(seen?'rgba(232,232,240,0.8)':'rgba(120,120,150,0.5)');ctx.fill();
    if(isYou){ctx.beginPath();ctx.arc(p[0],p[1],12,0,7);ctx.strokeStyle='rgba(255,208,64,0.4)';ctx.lineWidth=2;ctx.stroke();}
  }
  document.getElementById('cell').textContent=you;
  document.getElementById('vis').textContent=visited.size;
}
function moveTo(u){if(!adj[you].includes(u))return;if(!openSet.has(ek(you,u)))return;you=u;visited.add(u);draw();}
function nearest(mx,my){let best=-1,bd=1e9;for(let i=0;i<N;i++){const p=px(coords[i]);const d=(p[0]-mx)**2+(p[1]-my)**2;if(d<bd){bd=d;best=i;}}return {i:best,d:Math.sqrt(bd)};}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const {i,d}=nearest(mx,my);if(d<40)moveTo(i);});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='r'){you=DATA.start;visited=new Set([you]);draw();return;}
  let dir=null;
  if(k==='arrowup'||k==='w')dir=[0,1];else if(k==='arrowdown'||k==='s')dir=[0,-1];else if(k==='arrowleft'||k==='a')dir=[-1,0];else if(k==='arrowright'||k==='d')dir=[1,0];
  if(!dir)return;
  // pick open neighbour whose direction best matches dir
  const p0=coords[you];let best=-1,bestdot=-1e9;
  for(const u of adj[you]){if(!openSet.has(ek(you,u)))continue;const p=coords[u];const dx=p[0]-p0[0],dy=p[1]-p0[1];const L=Math.hypot(dx,dy)||1;const dot=(dx/L)*dir[0]+(dy/L)*dir[1];if(dot>bestdot){bestdot=dot;best=u;}}
  if(best>=0&&bestdot>0.2)moveTo(best);
});
document.getElementById('reset').onclick=()=>{you=DATA.start;visited=new Set([you]);draw();};
fit();draw();
</script></body></html>
