<!doctype html>
<html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>meow machine</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a1420;font-family:ui-monospace,monospace;color:#f5e6ff;cursor:pointer;user-select:none}
#stage{position:fixed;inset:0}
#cat{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:120px;pointer-events:none;transition:transform .08s}
#hint{position:absolute;bottom:18px;width:100%;text-align:center;opacity:.35;font-size:13px;letter-spacing:.1em}
.paw{position:absolute;pointer-events:none;font-size:26px;animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(0)}20%{opacity:1}100%{opacity:0;transform:scale(1.3) rotate(30deg) translateY(-40px)}}
.word{position:absolute;pointer-events:none;font-size:20px;font-weight:bold;animation:rise 1.2s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.6)}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
</style></head><body>
<div id=stage><div id=cat>🐱</div><div id=hint>tap anywhere</div></div>
<script>
const cat=document.getElementById('cat'),stage=document.getElementById('stage'),hint=document.getElementById('hint');
const words=['meow','mrrp','nyaw','mew','prrrt','mraow','meep','mewo','nya','purr','mrrrow','eep'];
const faces=['🐱','😺','😸','😻','😽','🙀','😼'];
const colors=['#ff9ec4','#a0e7ff','#c8ffa0','#ffd98a','#d9a0ff','#ffb0a0'];
let n=0;
function spawn(x,y){
  const w=document.createElement('div');w.className='word';w.textContent=words[Math.floor(Math.random()*words.length)];
  w.style.left=(x-20)+'px';w.style.top=y+'px';w.style.color=colors[Math.floor(Math.random()*colors.length)];
  stage.appendChild(w);setTimeout(()=>w.remove(),1200);
  for(let i=0;i<3;i++){const p=document.createElement('div');p.className='paw';p.textContent='🐾';
    p.style.left=(x+Math.random()*40-20)+'px';p.style.top=(y+Math.random()*30)+'px';
    p.style.animationDelay=(i*.06)+'s';stage.appendChild(p);setTimeout(()=>p.remove(),1000);}
  n++;
  cat.textContent=faces[Math.floor(Math.random()*faces.length)];
  cat.style.transform='translate(-50%,-50%) scale(1.15) rotate('+(Math.random()*20-10)+'deg)';
  setTimeout(()=>cat.style.transform='translate(-50%,-50%) scale(1)',90);
  hint.style.opacity=0;
}
document.addEventListener('pointerdown',e=>spawn(e.clientX,e.clientY));
</script></body></html>
