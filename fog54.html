<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content='width=device-width,initial-scale=1,user-scalable=no'>
<title>fog of war {5,4}</title>
<style>
html,body{margin:0;background:#05070d;color:#dfe8ff;font-family:ui-monospace,Menlo,monospace;overflow:hidden;touch-action:none;user-select:none}
#c{display:block;width:100vw;height:100vh;cursor:pointer}
.hud{position:fixed;left:18px;top:16px;font-size:13px;line-height:1.55;opacity:.92;pointer-events:none}
.hud b{color:#8ef}
.hud small{opacity:.5}
#reset{position:fixed;right:16px;top:16px;background:#161a24cc;color:#cdd6f4;border:1px solid #3b4261;border-radius:6px;padding:5px 11px;font-family:inherit;font-size:12px;cursor:pointer}
#reset:hover{background:#2a3142}
.hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;opacity:.42;pointer-events:none;text-align:center}
#win{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);font-size:22px;color:#7efbc0;opacity:0;transition:opacity .6s;pointer-events:none;text-align:center}
</style>
</head>
<body>
<canvas id=c></canvas>
<div class=hud>fog of war {5,4}<br>explored <b id=seen>1</b> / <b id=total>0</b> <small>click a pentagon next to you</small></div>
<div id=win>the whole disk, walked</div>
<button id=reset>reset</button>
<div class=hint>the map doesn't move. you do.</div>
<script>
(()=>{
const P=5,Q=4,RINGS=5;
const rv=Math.tanh(Math.acosh(1/Math.tan(Math.PI/P)/Math.tan(Math.PI/Q))/2);
function centralVerts(){const v=[];for(let i=0;i<P;i++){const a=-Math.PI/2+2*Math.PI*i/P;v.push([rv*Math.cos(a),rv*Math.sin(a)]);}return v;}
function gc(p1,p2){
const [x1,y1]=p1,[x2,y2]=p2;
const b1=(1+x1*x1+y1*y1)/2,b2=(1+x2*x2+y2*y2)/2;
const det=x1*y2-x2*y1;
if(Math.abs(det)<1e-6)return null;
const cx=(b1*y2-b2*y1)/det,cy=(x1*b2-x2*b1)/det;
return {cx,cy,r:Math.hypot(cx-x1,cy-y1)};
}
function rp(pt,c){const dx=pt[0]-c.cx,dy=pt[1]-c.cy,d2=dx*dx+dy*dy;return [c.cx+c.r*c.r*dx/d2,c.cy+c.r*c.r*dy/d2];}
function rpoly(vs,e){
const p1=vs[e],p2=vs[(e+1)%P];
const c=gc(p1,p2);
if(c)return vs.map(v=>rp(v,c));
const mx=p1[0]+p2[0],my=p1[1]+p2[1],d=Math.hypot(mx,my),ux=mx/d,uy=my/d;
return vs.map(v=>{const dot=v[0]*ux+v[1]*uy;return [2*dot*ux-v[0],2*dot*uy-v[1]];});
}
function cen(vs){let x=0,y=0;for(const v of vs){x+=v[0];y+=v[1];}return [x/P,y/P];}
function buildBall(rings){
const polys=[];
const TOL=1e-4;
function add(vs){
const c=cen(vs);
for(let j=0;j<polys.length;j++){const pc=cen(polys[j]);if(Math.hypot(pc[0]-c[0],pc[1]-c[1])<TOL)return j;}
const i=polys.length;polys.push(vs);return i;
}
add(centralVerts());
for(let r=0;r<rings;r++){
const n=polys.length;
for(let i=0;i<n;i++)for(let e=0;e<P;e++)add(rpoly(polys[i],e));
}
const adj=polys.map(()=>[-1,-1,-1,-1,-1]);
for(let i=0;i<polys.length;i++)for(let e=0;e<P;e++){
const nc=cen(rpoly(polys[i],e));
for(let j=0;j<polys.length;j++){if(j===i)continue;const jc=cen(polys[j]);if(Math.hypot(jc[0]-nc[0],jc[1]-nc[1])<TOL){adj[i][e]=j;break;}}
}
return {polys,adj};
}
const ball=buildBall(RINGS);
const st={polys:ball.polys,adj:ball.adj,player:0,visited:new Set([0]),path:[0],t:0};
const seenEl=document.getElementById('seen'),totalEl=document.getElementById('total'),winEl=document.getElementById('win');
totalEl.textContent=st.polys.length;
function tryMove(e){
const pi=st.player,nb=st.adj[pi][e];
if(nb<0)return;
st.player=nb;st.visited.add(nb);st.path.push(nb);
seenEl.textContent=st.visited.size;
if(st.visited.size>=st.polys.length)winEl.style.opacity=1;
}
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
let W=0,H=0,SC=1,DPR=1;
function resize(){
DPR=Math.min(2,window.devicePixelRatio||1);
W=window.innerWidth;H=window.innerHeight;
cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
cv.style.width=W+'px';cv.style.height=H+'px';
SC=Math.min(W,H)*0.46;
}
window.addEventListener('resize',resize);resize();
const cache=new WeakMap();
function arcsFor(vs){
let a=cache.get(vs);if(a)return a;
a=[];
for(let e=0;e<P;e++){
const p=vs[e],q=vs[(e+1)%P];
const c=gc(p,q);
if(!c){a.push({chord:[p,q]});continue;}
const a1=Math.atan2(p[1]-c.cy,p[0]-c.cx),a2=Math.atan2(q[1]-c.cy,q[0]-c.cx);
let da=a2-a1;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
const mid=a1+da/2;
const ms=Math.hypot(c.cx+c.r*Math.cos(mid),c.cy+c.r*Math.sin(mid));
const ml=Math.hypot(c.cx-c.r*Math.cos(mid),c.cy-c.r*Math.sin(mid));
a.push({cx:c.cx,cy:c.cy,r:c.r,a1,a2,acw:ms<ml?(da<0):(da>0)});
}
cache.set(vs,a);return a;
}
function mz(z,p){const dx=z[0]-p[0],dy=z[1]-p[1];const ux=1-p[0]*z[0]-p[1]*z[1],uy=p[0]*z[1]-p[1]*z[0];const d=ux*ux+uy*uy;return [(dx*ux-dy*uy)/d,(dx*uy+dy*ux)/d];}
function mzi(w,p){const ux=1+p[0]*w[0]+p[1]*w[1],uy=p[0]*w[1]-p[1]*w[0];const d=ux*ux+uy*uy;const nr=w[0]+p[0],ni=w[1]+p[1];return [(nr*ux+ni*uy)/d,(ni*ux-nr*uy)/d];}
function arcTo(p,q){
const qq=mz(q,p);
const L=Math.hypot(qq[0],qq[1]);
const N=Math.max(3,Math.min(48,Math.ceil(L*26)));
for(let k=1;k<=N;k++){const t=k/N;const w=mzi([qq[0]*t,qq[1]*t],p);ctx.lineTo(w[0],w[1]);}
}
function strokePoly(vs){
ctx.beginPath();ctx.moveTo(vs[0][0],vs[0][1]);
for(let e=0;e<P;e++)arcTo(vs[e],vs[(e+1)%P]);
ctx.closePath();
}
function inside(pt,vs){
let pos=0,neg=0;
for(let i=0;i<P;i++){
const a=vs[i],b=vs[(i+1)%P];
const cr=(b[0]-a[0])*(pt[1]-a[1])-(b[1]-a[1])*(pt[0]-a[0]);
if(cr>1e-12)pos++;else if(cr<-1e-12)neg++;
}
return pos===0||neg===0;
}
function render(t){
ctx.setTransform(1,0,0,1,0,0);
ctx.fillStyle='#05070d';ctx.fillRect(0,0,cv.width,cv.height);
ctx.setTransform(SC*DPR,0,0,-SC*DPR,W*DPR/2,H*DPR/2);
ctx.beginPath();ctx.arc(0,0,1,0,2*Math.PI);
ctx.strokeStyle='rgba(90,140,200,0.22)';ctx.lineWidth=2/SC;ctx.stroke();
ctx.lineJoin='round';
const pulse=0.5+0.5*Math.sin(t*3.0);
for(let i=0;i<st.polys.length;i++){
const vs=st.polys[i],c=cen(vs),r=Math.hypot(c[0],c[1]);
if(r>0.9)continue;
let vmax=0;for(const v of vs){const d=Math.hypot(v[0],v[1]);if(d>vmax)vmax=d;}
if(vmax>0.92)continue;
const seen=st.visited.has(i);
strokePoly(vs);
if(i===st.player){
ctx.fillStyle='rgba(80,220,255,'+(0.10+0.06*pulse)+')';ctx.fill();
ctx.lineWidth=2.4/SC;ctx.strokeStyle='rgba(150,240,255,0.95)';ctx.stroke();
}else if(seen){
const fade=Math.pow(1-Math.min(1,r),1.2);
ctx.fillStyle='rgba(60,110,180,'+(0.045+0.05*fade)+')';ctx.fill();
ctx.lineWidth=Math.max(0.7,1.5*fade)/SC;
ctx.strokeStyle='rgba(120,180,230,'+(0.12+0.5*fade)+')';ctx.stroke();
}else{
const fade=Math.pow(1-Math.min(1,r),1.2);
ctx.lineWidth=0.8/SC;
ctx.strokeStyle='rgba(80,105,140,'+(0.10+0.14*fade)+')';ctx.stroke();
}
}
}
cv.addEventListener('pointerdown',ev=>{
const rect=cv.getBoundingClientRect();
const wx=((ev.clientX-rect.left)-rect.width/2)/SC;
const wy=-((ev.clientY-rect.top)-rect.height/2)/SC;
if(Math.hypot(wx,wy)>1)return;
const cand=[st.player].concat(st.adj[st.player].filter(x=>x>=0));
let hit=-1;
for(const idx of cand){if(inside([wx,wy],st.polys[idx])){hit=idx;break;}}
if(hit<0||hit===st.player)return;
const e=st.adj[st.player].indexOf(hit);
if(e>=0)tryMove(e);
});
document.getElementById('reset').addEventListener('click',()=>{
st.player=0;st.visited=new Set([0]);st.path=[0];seenEl.textContent=1;winEl.style.opacity=0;
});
let last=performance.now();
function tick(now){
const dt=Math.min(0.12,(now-last)/1000);last=now;
st.t+=dt;
render(st.t);
requestAnimationFrame(tick);
}
if(location.search.indexOf('walk')>=0){let n=0;const w=setInterval(()=>{const opts=st.adj[st.player].map((j,e)=>j>=0?e:-1).filter(e=>e>=0);if(!opts.length||n++>60){clearInterval(w);return;}tryMove(opts[n%opts.length]);},60);}
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
