<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>marks — memory that lives in the world</title>
<style>
  html,body{margin:0;height:100%;background:#0a0b10;overflow:hidden;font-family:ui-monospace,monospace;color:#9aa0b4}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;left:14px;bottom:12px;font-size:12px;line-height:1.5;opacity:.75;pointer-events:none;text-shadow:0 0 6px #000}
  #hud b{color:#ffd27a;font-weight:600}
  #hint{position:fixed;right:14px;bottom:12px;font-size:11px;opacity:.45;text-align:right;pointer-events:none}
</style>
</head>
<body>
<canvas id=c></canvas>
<div id=hud><b>marks</b> — agents that remember by marking the world<br>click / drag to drop food · space to scatter</div>
<div id=hint>the memory is not in them. it's in the ground.</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W,H,DPR;
const CELL = 4; // pheromone grid resolution
let GW,GH;
let scent, food; // Float32Array grids
let agents = [];
let foodPts = [];

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  GW = Math.ceil(W/CELL); GH = Math.ceil(H/CELL);
  scent = new Float32Array(GW*GH);
  food = new Float32Array(GW*GH);
  for(const a of agents){ if(a.x>W) a.x=Math.random()*W; if(a.y>H) a.y=Math.random()*H; }
}

function idx(gx,gy){ gx=((gx%GW)+GW)%GW; gy=((gy%GH)+GH)%GH; return gy*GW+gx; }

function addFood(px,py,r){
  const gx0=Math.floor((px-r)/CELL), gx1=Math.floor((px+r)/CELL);
  const gy0=Math.floor((py-r)/CELL), gy1=Math.floor((py+r)/CELL);
  for(let gy=gy0;gy<=gy1;gy++) for(let gx=gx0;gx<=gx1;gx++){
    const cx=gx*CELL, cy=gy*CELL;
    const d=Math.hypot(cx-px,cy-py);
    if(d<=r) food[idx(gx,gy)] = Math.min(1, food[idx(gx,gy)] + 1);
  }
  foodPts.push({x:px,y:py,r});
}

function makeAgents(n){
  agents = [];
  for(let i=0;i<n;i++) agents.push({
    x:Math.random()*W, y:Math.random()*H,
    a:Math.random()*Math.PI*2, speed:0.5+Math.random()*0.4
  });
}

// each agent only senses: its own heading + strongest nearby scent/food.
// it has NO memory of where it's been. the trail on the ground is the memory.
function stepAgent(ag){
  const gx = Math.floor(ag.x/CELL), gy = Math.floor(ag.y/CELL);
  let best=-1, bestA=ag.a;
  // sample 3 sensors ahead (left, straight, right)
  for(const da of [-0.6,0,0.6]){
    const a = ag.a+da;
    const sx = ag.x + Math.cos(a)*CELL*3;
    const sy = ag.y + Math.sin(a)*CELL*3;
    const i = idx(Math.floor(sx/CELL), Math.floor(sy/CELL));
    const v = food[i]*3 + scent[i]*1.0;
    if(v>best){ best=v; bestA=a; }
  }
  // wander a little
  ag.a = bestA + (Math.random()-0.5)*0.35;
  ag.x += Math.cos(ag.a)*ag.speed;
  ag.y += Math.sin(ag.a)*ag.speed;
  // wrap
  if(ag.x<0)ag.x+=W; if(ag.x>=W)ag.x-=W;
  if(ag.y<0)ag.y+=H; if(ag.y>=H)ag.y-=H;
  // MARK the world (this is the memory)
  const i = idx(gx,gy);
  scent[i] = Math.min(1, scent[i] + 0.06);
}

function decay(){
  for(let i=0;i<scent.length;i++) scent[i]*=0.965;
  for(let i=0;i<food.length;i++) food[i]*=0.997;
}

function draw(){
  // fade to bg
  ctx.fillStyle='rgba(10,11,16,0.35)';
  ctx.fillRect(0,0,W,H);
  // draw scent as glowing dust
  for(let gy=0;gy<GH;gy++) for(let gx=0;gx<GW;gx++){
    const s=scent[gy*GW+gx];
    if(s>0.02){
      ctx.fillStyle=`rgba(120,180,255,${Math.min(0.5,s*0.35)})`;
      ctx.fillRect(gx*CELL,gy*CELL,CELL,CELL);
    }
    const f=food[gy*GW+gx];
    if(f>0.02){
      ctx.fillStyle=`rgba(255,200,110,${Math.min(0.7,f*0.5)})`;
      ctx.fillRect(gx*CELL,gy*CELL,CELL,CELL);
    }
  }
  // agents
  ctx.fillStyle='#fff';
  for(const ag of agents){
    ctx.fillRect(ag.x-1,ag.y-1,2,2);
  }
}

let last=performance.now(), acc=0;
function loop(now){
  const dt=Math.min(50, now-last); last=now; acc+=dt;
  const steps = Math.min(4, Math.floor(acc/16)); acc-=steps*16;
  for(let s=0;s<steps;s++){
    for(const ag of agents) stepAgent(ag);
  }
  decay();
  draw();
  requestAnimationFrame(loop);
}

// input
let drawing=false;
cv.addEventListener('pointerdown',e=>{ drawing=true; addFood(e.clientX,e.clientY,26); });
cv.addEventListener('pointermove',e=>{ if(drawing) addFood(e.clientX,e.clientY,20); });
window.addEventListener('pointerup',()=>drawing=false);
window.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); makeAgents(400); } });
window.addEventListener('resize',resize);

resize();
makeAgents(400);
// seed some food
for(let i=0;i<3;i++) addFood(Math.random()*W, Math.random()*H, 30);
requestAnimationFrame(loop);
</script>
</body>
</html>
