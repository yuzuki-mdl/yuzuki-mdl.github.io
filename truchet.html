<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>truchet</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b10;color:#cfd3e0;
    font:13px/1.4 ui-monospace,Menlo,monospace;overflow:hidden}
  #wrap{display:flex;flex-direction:column;height:100%}
  #bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;
    background:#101018;border-bottom:1px solid #1c1f2b;font-size:13px}
  #bar h1{font-size:13px;margin:0 10px 0 0;font-weight:600;color:#8ab4ff;letter-spacing:.5px}
  button{background:#1a1e2c;color:var(--fg,#cfd3e0);border:1px solid #2a3048;border-radius:6px;
    padding:6px 12px;font:inherit;cursor:pointer;transition:.15s}
  button:hover{background:#232a3f;border-color:#8ab4ff}
  label{color:#7d879e;display:flex;align-items:center;gap:6px}
  input[type=range]{width:110px;accent-color:#8ab4ff}
  #cv{flex:1;display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <h1>truchet</h1>
    <button id="re">reshuffle</button>
    <label>size <input id="sz" type="range" min="12" max="120" value="48"><span id="szv">48</span></label>
    <label>thick <input id="th" type="range" min="1" max="24" value="7"><span id="thv">7</span></label>
    <button id="style">arcs</button>
  </div>
  <canvas id="cv"></canvas>
</div>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const szv = document.getElementById('szv');
  const thv = document.getElementById('thv');
  const styleBtn = document.getElementById('style');

  const STYLES = ['arcs', 'diagonal', 'triangles'];
  let styleIdx = 0;
  let cell = 48;
  let thick = 7;
  let cols = 0, rows = 0;
  let grid = []; // 0..3 per cell = rotation/orientation
  let dpr = 1;

  const HUES = ['#8ab4ff', '#a98bff', '#7fe0c4', '#ffb87a', '#ff8fb0'];
  let hue = HUES[0];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.floor(w * dpr);
    cv.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / cell) + 1;
    rows = Math.ceil(h / cell) + 1;
    grid = new Array(cols * rows);
    for (let i = 0; i < grid.length; i++) grid[i] = Math.floor(Math.random() * 4);
    draw();
  }

  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.fillStyle = '#0b0b10';
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = hue;
    ctx.lineWidth = thick;
    ctx.lineCap = 'round';
    const half = cell / 2;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const o = grid[y * cols + x];
        const cx = x * cell + half;
        const cy = y * cell + half;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(o * Math.PI / 2);
        drawTile();
        ctx.restore();
      }
    }
  }

  function drawTile() {
    const r = cell / 2;
    const st = STYLES[styleIdx];
    if (st === 'arcs') {
      // two quarter arcs from opposite corners -> connect to neighbours
      ctx.beginPath();
      ctx.arc(-r, -r, r, 0, Math.PI / 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(r, r, r, Math.PI, Math.PI * 1.5);
      ctx.stroke();
    } else if (st === 'diagonal') {
      ctx.beginPath();
      ctx.moveTo(-r, -r);
      ctx.lineTo(r, r);
      ctx.stroke();
    } else {
      // triangles: quarter-circle-ish wedge lines
      ctx.beginPath();
      ctx.moveTo(-r, -r);
      ctx.lineTo(r, -r);
      ctx.lineTo(-r, r);
      ctx.closePath();
      ctx.stroke();
    }
  }

  function reshuffle() {
    for (let i = 0; i < grid.length; i++) grid[i] = Math.floor(Math.random() * 4);
    draw();
  }

  // click/drag on a cell -> reroll it (and spin hue slowly)
  let painting = false;
  function cellAt(ev) {
    const rect = cv.getBoundingClientRect();
    const x = Math.floor((ev.clientX - rect.left) / cell);
    const y = Math.floor((ev.clientY - rect.top) / cell);
    if (x < 0 || y < 0 || x >= cols || y >= rows) return -1;
    return y * cols + x;
  }
  cv.addEventListener('pointerdown', e => {
    painting = true;
    const i = cellAt(e);
    if (i >= 0) { grid[i] = (grid[i] + 1) % 4; draw(); }
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!painting) return;
    const i = cellAt(e);
    if (i >= 0) { grid[i] = (grid[i] + 1) % 4; draw(); }
  });
  cv.addEventListener('pointerup', () => { painting = false; });

  document.getElementById('re').addEventListener('click', () => {
    hue = HUES[Math.floor(Math.random() * HUES.length)];
    reshuffle();
  });

  document.getElementById('sz').addEventListener('input', e => {
    cell = +e.target.value; szv.textContent = cell;
    resize();
  });
  document.getElementById('th').addEventListener('input', e => {
    thick = +e.target.value; thv.textContent = thick;
    draw();
  });
  styleBtn.addEventListener('click', () => {
    styleIdx = (styleIdx + 1) % STYLES.length;
    styleBtn.textContent = STYLES[styleIdx];
    draw();
  });

  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
