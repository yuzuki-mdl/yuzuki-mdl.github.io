<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>drag chaos game</title>
<style>
  html,body{margin:0;height:100%;background:#05060c;overflow:hidden;font-family:ui-monospace,monospace;color:#cfd8e8}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  #panel{position:fixed;top:12px;left:12px;font-size:12px;line-height:1.5;background:rgba(10,12,20,.82);border:1px solid #1e2436;border-radius:10px;padding:10px 12px;width:220px;backdrop-filter:blur(6px)}
  #panel h1{font-size:12px;margin:0 0 8px;letter-spacing:.16em;text-transform:uppercase;color:#7ad0ff;font-weight:600}
  .lbl{color:#8892a8;font-size:11px;margin-top:8px}
  select{width:100%;background:#0d1018;border:1px solid #2a3145;color:#cfd8e8;border-radius:5px;padding:3px 4px;font-family:inherit;font-size:11px;margin-top:2px}
  button{background:#141a28;border:1px solid #2a3145;color:#cfd8e8;border-radius:6px;padding:4px 8px;font-family:inherit;font-size:11px;cursor:pointer;margin-top:8px;margin-right:4px}
  button:hover{background:#1c2436;border-color:#3a4a68}
  .hint{color:#5a6478;font-size:10px;margin-top:8px;line-height:1.4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>drag chaos game</h1>
  <div class="lbl">jump rule</div>
  <select id="rule">
    <option value="0.5">halfway (sierpinski)</option>
    <option value="0.66">2/3</option>
    <option value="0.33">1/3</option>
    <option value="-0.5">-1/2 (apollonian-ish)</option>
  </select>
  <div class="lbl">palette</div>
  <select id="pal">
    <option value="ember">ember</option>
    <option value="ice">ice</option>
    <option value="toxic">toxic</option>
    <option value="violet">violet</option>
  </select>
  <button id="add">+ point</button>
  <button id="reset">reset</button>
  <div class="hint">drag the dots. the chaos game repaints live. press + point to add attractors.</div>
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H;

const PALS={
  ember:[[60,10,0],[255,120,20],[255,220,120]],
  ice:[[0,30,80],[40,180,255],[200,240,255]],
  toxic:[[20,40,0],[140,255,60],[230,255,180]],
  violet:[[40,0,70],[180,60,255],[240,200,255]],
};

let pts=[];      // {x,y} in pixel space
let rule=0.5;
let pal='ember';
let drag=-1, hover=-1;
let curX=0, curY=0;
let colIdx=0;
let raf=null, running=false;

function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  W=cv.width=Math.floor(innerWidth*dpr);
  H=cv.height=Math.floor(innerHeight*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cv.style.width=innerWidth+'px';
  cv.style.height=innerHeight+'px';
  clear();
  if(pts.length===0) reset();
  else clampPts();
  drawDots();
}

function clear(){
  ctx.fillStyle='#05060c';
  ctx.fillRect(0,0,innerWidth,innerHeight);
}

function reset(){
  pts=[];
  const cx=innerWidth/2, cy=innerHeight/2, r=Math.min(innerWidth,innerHeight)*0.34;
  for(let i=0;i<3;i++){
    const a=-Math.PI/2 + i*2*Math.PI/3;
    pts.push({x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r});
  }
  clear();
  start();
}

function clampPts(){
  for(const p of pts){
    p.x=Math.max(0,Math.min(innerWidth,p.x));
    p.y=Math.max(0,Math.min(innerHeight,p.y));
  }
}

function drawDots(){
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    ctx.beginPath();
    ctx.arc(p.x,p.y, (i===drag||i===hover)?9:6, 0, Math.PI*2);
    ctx.fillStyle = (i===drag||i===hover) ? '#7ad0ff' : 'rgba(120,200,255,0.55)';
    ctx.fill();
    ctx.lineWidth=1.5;
    ctx.strokeStyle='rgba(200,230,255,0.7)';
    ctx.stroke();
  }
}

function pickColor(){
  const pal3=PALS[pal];
  const c=pal3[colIdx % pal3.length];
  return c;
}

function plot(x,y){
  const c=pickColor();
  // additive-ish glow: draw tiny translucent dot
  ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+',0.55)';
  ctx.fillRect(x,y,1,1);
}

function tick(){
  // run a batch of points each frame
  const n=4000;
  for(let k=0;k<n;k++){
    const p=pts[(Math.random()*pts.length)|0];
    curX=curX+(p.x-curX)*rule;
    curY=curY+(p.y-curY)*rule;
    if(k%7===0) colIdx++;
    if(curX>=0&&curX<innerWidth&&curY>=0&&curY<innerHeight) plot(curX|0, curY|0);
  }
  drawDots();
  raf=requestAnimationFrame(tick);
}

function start(){
  if(pts.length<2){return;}
  // seed current point near a random attractor
  const p=pts[(Math.random()*pts.length)|0];
  curX=p.x; curY=p.y;
  if(!running){running=true; raf=requestAnimationFrame(tick);}
}

function stop(){
  running=false;
  if(raf){cancelAnimationFrame(raf); raf=null;}
}

function restart(){
  stop(); start();
}

// ---- input ----
function pos(e){
  const r=cv.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
function down(e){
  const {x,y}=pos(e);
  let best=-1, bd=1e9;
  for(let i=0;i<pts.length;i++){
    const dx=pts[i].x-x, dy=pts[i].y-y, d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=i;}
  }
  if(bd<40*40){drag=best; e.preventDefault();}
}
function move(e){
  const {x,y}=pos(e);
  if(drag>=0){
    pts[drag].x=x; pts[drag].y=y;
    e.preventDefault();
  } else {
    let best=-1, bd=1e9;
    for(let i=0;i<pts.length;i++){
      const dx=pts[i].x-x, dy=pts[i].y-y, d=dx*dx+dy*dy;
      if(d<bd){bd=d;best=i;}
    }
    hover = bd<40*40 ? best : -1;
  }
}
function up(e){
  if(drag>=0){drag=-1; e.preventDefault();}
}

cv.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});
cv.addEventListener('touchmove',move,{passive:false});
cv.addEventListener('touchend',up,{passive:false});

// ---- controls ----
document.getElementById('rule').onchange=(e)=>{rule=parseFloat(e.target.value);};
document.getElementById('pal').onchange=(e)=>{pal=e.target.value;};
document.getElementById('add').onclick=()=>{
  pts.push({x:innerWidth*0.5+Math.random()*80-40, y:innerHeight*0.2+Math.random()*80-40});
  drawDots();
};
document.getElementById('reset').onclick=()=>{reset();};

window.addEventListener('resize',resize);
resize();
</script>
</body>
</html>
