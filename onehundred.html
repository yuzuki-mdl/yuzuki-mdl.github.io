<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>one line, a hundred ways</title>
<style>
  html,body{margin:0;height:100%;background:#0d0d10;color:#c9c9cf;font:13px/1.5 ui-monospace,monospace}
  #wrap{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;padding:2px;height:100vh;box-sizing:border-box}
  canvas{width:100%;height:100%;display:block;background:#15151a;border-radius:2px}
  header{position:fixed;left:12px;bottom:10px;opacity:.5;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"></div>
<header>one polyline · one random seed per cell · each seed applies one transform</header>
<script>
// one rule: draw the SAME base polyline, but each cell gets a seed that
// picks exactly ONE transform from a small set. nothing else varies.
// irregular base so the transforms are actually visible: fixed angle steps,
// not a regular polygon's symmetry group
const BASE = (()=>{ const p=[]; let x=0,y=0,a=0.3; const steps=[0.9,1.4,0.7,1.2,1.6,0.8,1.1];
  p.push([x,y]);
  for(const s of steps){ a+=s; x+=Math.cos(a)*0.5; y+=Math.sin(a)*0.5; p.push([x,y]); }
  // centre it
  const cx=p.reduce((s,q)=>s+q[0],0)/p.length, cy=p.reduce((s,q)=>s+q[1],0)/p.length;
  return p.map(([px,py])=>[px-cx,py-cy]);
})();

function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const TR = [
  ([x,y])=>[ x, y],            // identity
  ([x,y])=>[-y, x],            // rotate 90
  ([x,y])=>[ x,-y],            // flip y
  ([x,y])=>[-x, y],            // flip x
  ([x,y])=>[ y, x],            // swap
  ([x,y])=>[-x,-y],            // rotate 180
];

const N=100, wrap=document.getElementById('wrap');
for(let i=0;i<N;i++){
  const c=document.createElement('canvas');
  c.width=c.height=140; wrap.appendChild(c);
  const g=c.getContext('2d');
  const rnd=mulberry(i*2654435761>>>0);
  const t=TR[Math.floor(rnd()*TR.length)];
  const scale=0.9+rnd()*0.12;
  g.translate(70,70); g.scale(scale*70,scale*70);
  g.beginPath();
  const pts=BASE.map(p=>t(p));
  g.moveTo(pts[0][0],pts[0][1]);
  for(let k=1;k<pts.length;k++) g.lineTo(pts[k][0],pts[k][1]);
  g.strokeStyle='#7fd6c8'; g.lineWidth=0.045; g.lineJoin='round'; g.stroke();
  // faint dot at each vertex, same rule for all
  g.fillStyle='#c9c9cf';
  for(const [x,y] of pts){ g.beginPath(); g.arc(x,y,0.03,0,7); g.fill(); }
}
</script>
</body>
</html>
