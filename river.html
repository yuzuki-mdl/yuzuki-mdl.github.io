<body>
<header>
<h1>the river crossing</h1>
<p class="sub">a game on conway&rsquo;s topograph of <code>Q = p&sup2; &minus; 2pq &minus; 5q&sup2;</code>. you stand on a lattice vector; hop to a farey neighbour (an edge of the tree). the <span style="color:var(--gold)">gold river</span> is where Q flips sign. cross it as many times as you can.</p>
</header>
<div id="hud">
  <div><span class="lbl">Q = </span><b id="qval">&mdash;</b></div>
  <div><span class="lbl">side: </span><b id="side">&mdash;</b></div>
  <div><span class="lbl">crossings: </span><b id="score">0</b></div>
</div>
<canvas id="cv"></canvas>
<div id="msg"></div>
<button id="reset">start over</button>

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const nodes=DATA.nodes,edges=DATA.edges,adj=DATA.adj,river=DATA.river;
const riverSet=new Set(river.map(e=>e[0]+'-'+e[1]).concat(river.map(e=>e[1]+'-'+e[0])));
function isRiver(a,b){return riverSet.has(a+'-'+b);}

let W,H,R,CX,CY,scale;
function resize(){
  const m=Math.min(window.innerWidth-24,560);
  W=H=m; R=m/2;
  cv.width=m*devicePixelRatio; cv.height=m*devicePixelRatio;
  cv.style.width=m+'px'; cv.style.height=m+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  CX=W/2; CY=H/2; scale=(R-14)/0.95;
  draw();
}
function sx(x){return CX+x*scale;}
function sy(y){return CY+y*scale;}

let cur=DATA.start, score=0, crossedThis=null, visited=new Set([cur]);

function setHUD(){
  document.getElementById('qval').textContent=nodes[cur].Q;
  const s=nodes[cur].Q>0?'positive':(nodes[cur].Q<0?'negative':'zero');
  document.getElementById('side').textContent=s;
  document.getElementById('side').style.color=nodes[cur].Q>0?'var(--blue)':(nodes[cur].Q<0?'var(--pink)':'var(--gold)');
  document.getElementById('score').textContent=score;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // disk
  ctx.beginPath(); ctx.arc(CX,CY,R-6,0,7); ctx.fillStyle='#11161f'; ctx.fill();
  ctx.strokeStyle='#1d2636'; ctx.lineWidth=1; ctx.stroke();
  // edges
  for(const [a,b] of edges){
    const rv=isRiver(a,b);
    ctx.beginPath();
    ctx.moveTo(sx(nodes[a].x),sy(nodes[a].y));
    ctx.lineTo(sx(nodes[b].x),sy(nodes[b].y));
    ctx.strokeStyle=rv?'rgba(240,184,74,.8)':'rgba(90,100,120,.22)';
    ctx.lineWidth=rv?2:1;
    ctx.stroke();
  }
  // nodes
  const neigh=new Set(adj[cur]);
  for(let i=0;i<nodes.length;i++){
    const nd=nodes[i];
    let r=2.2;
    if(i===cur)r=6;
    else if(neigh.has(i))r=4;
    ctx.beginPath();
    ctx.arc(sx(nd.x),sy(nd.y),r,0,7);
    if(i===cur){ctx.fillStyle='#7ee0a0';ctx.fill();ctx.strokeStyle='#7ee0a0';ctx.lineWidth=1;ctx.beginPath();ctx.arc(sx(nd.x),sy(nd.y),10,0,7);ctx.stroke();}
    else if(neigh.has(i)){ctx.fillStyle='#c9d1e0';ctx.fill();}
    else{ctx.fillStyle=nd.Q>0?'rgba(95,168,224,.55)':(nd.Q<0?'rgba(224,106,154,.55)':'rgba(240,184,74,.6)');ctx.fill();}
  }
}

function pick(mx,my){
  let best=-1,bd=1e9;
  for(let i=0;i<nodes.length;i++){
    const dx=mx-sx(nodes[i].x),dy=my-sy(nodes[i].y);
    const d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=i;}
  }
  return best;
}

function hop(i){
  if(!adj[cur].includes(i))return;
  const crossed=isRiver(cur,i);
  cur=i; visited.add(cur);
  if(crossed){score++; flash('crossed the river. Q is now '+(nodes[cur].Q>0?'positive':'negative'));}
  setHUD(); draw();
}
let flashT=0;
function flash(t){const m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;clearTimeout(flashT);flashT=setTimeout(()=>m.style.opacity=0,1600);}

cv.addEventListener('pointerdown',e=>{
  const rect=cv.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const i=pick(mx,my);
  if(i>=0)hop(i);
});

document.getElementById('reset').onclick=()=>{cur=DATA.start;score=0;visited=new Set([cur]);setHUD();draw();};

window.addEventListener('resize',resize);
resize(); setHUD();
</script>
