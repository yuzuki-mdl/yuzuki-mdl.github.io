<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>truchet flow</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden;font-family:ui-monospace,monospace}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
  #ui{position:fixed;left:12px;bottom:12px;color:#7c8794;font-size:12px;line-height:1.5;user-select:none;pointer-events:none}
  #ui b{color:#c9d3de;font-weight:600}
  #hud{position:fixed;right:12px;top:12px;color:#5b6672;font-size:11px;text-align:right;user-select:none;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><b>truchet</b> flow — click to reseed · <b>space</b> new palette · <b>s</b> save</div>
<div id="hud"></div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const hud = document.getElementById('hud');
let W=0,H=0,DPR=Math.min(2,devicePixelRatio||1);
let N=42;
let seed=1;
let pal=0;

const PALETTES=[
  ['#0b0d10','#22303c','#3f5a6e','#8fd0c9','#e7f2ee'],
  ['#0b0d10','#2a1e2e','#5a2e4a','#c96a8e','#f4d3e0'],
  ['#0b0d10','#1e2a1a','#3c5a2e','#9ec96a','#e6f4d3'],
  ['#0b0d10','#1a2230','#2e4a7a','#6a9ec9','#d3e6f4'],
  ['#0b0d10','#2e2417','#5a4020','#c9a06a','#f4e6d3'],
];

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rng(){ return mulberry(seed*2654435761 >>> 0); }
let rand;

function resize(){
  W=c.clientWidth; H=c.clientHeight;
  c.width=W*DPR; c.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}

function draw(){
  const P=PALETTES[pal];
  ctx.fillStyle=P[0];
  ctx.fillRect(0,0,W,H);
  const size=Math.min(W,H)/N;
  const cols=Math.ceil(W/size)+1, rows=Math.ceil(H/size)+1;
  rand=rng();
  const lw=Math.max(1,size*0.14);
  ctx.lineWidth=lw; ctx.lineCap='round';
  for(let j=0;j<rows;j++){
    for(let i=0;i<cols;i++){
      const x=i*size, y=j*size;
      const r=rand();
      const t=(i/cols*0.6 + j/rows*0.4 + r*0.5)%1;
      const col=P[1+Math.floor(t*(P.length-1))%(P.length-1)];
      ctx.strokeStyle=col;
      ctx.beginPath();
      if(r<0.5){
        ctx.arc(x, y, size/2, 0, Math.PI/2);
        ctx.arc(x+size, y+size, size/2, Math.PI, Math.PI*1.5);
      } else {
        ctx.arc(x+size, y, size/2, Math.PI/2, Math.PI);
        ctx.arc(x, y+size, size/2, Math.PI*1.5, Math.PI*2);
      }
      ctx.stroke();
    }
  }
  hud.textContent = 'tiles '+cols+'x'+rows+' · seed '+seed+' · palette '+pal;
}

c.addEventListener('click',e=>{ seed=Math.floor(Math.random()*1e9); draw(); });
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); pal=(pal+1)%PALETTES.length; draw(); }
  if(e.key==='s'||e.key==='S'){
    const a=document.createElement('a');
    a.download='truchet-'+seed+'.png'; a.href=c.toDataURL('image/png'); a.click();
  }
});
window.addEventListener('resize',resize);
resize();
</script>
</body>
</html>
