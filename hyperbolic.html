<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hyperbolic tiling</title>
<style>
  :root{--bg:#0b0d10;--fg:#e6e8ec;--dim:#8a90a0;--acc:#7fd1ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;min-height:100vh}
  header{padding:14px 18px 6px}
  h1{font-size:16px;margin:0 0 2px;font-weight:600}
  .sub{color:var(--dim);font-size:12px}
  .wrap{flex:1;display:flex;flex-wrap:wrap;gap:16px;padding:8px 18px 18px;align-items:flex-start}
  canvas{background:#05070a;border-radius:12px;touch-action:none;max-width:100%}
  .panel{display:flex;flex-direction:column;gap:14px;min-width:200px}
  .row{display:flex;flex-direction:column;gap:4px}
  label{color:var(--dim);font-size:12px}
  input[type=range]{width:100%;accent-color:var(--acc)}
  .val{color:var(--acc)}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{background:#1a1f27;color:var(--fg);border:1px solid #2a3038;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--acc);color:var(--acc)}
  button.on{background:#12303f;border-color:var(--acc);color:var(--acc)}
  .stat{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>hyperbolic tiling</h1>
  <div class="sub">the poincaré disk — a triangle {p,q,2} reflected forever. all the triangles are the same size in hyperbolic space; they just shrink toward the edge.</div>
</header>
<div class="wrap">
  <canvas id="c" width="720" height="720"></canvas>
  <div class="panel">
    <div class="row"><label>p (fold of the polygon): <span class="val" id="pv">7</span></label><input id="p" type="range" min="3" max="12" step="1" value="7"></div>
    <div class="row"><label>q (meeting at each vertex): <span class="val" id="qv">3</span></label><input id="q" type="range" min="3" max="12" step="1" value="3"></div>
    <div class="btns">
      <button id="spin">spin</button>
      <button id="edge">edges</button>
    </div>
    <div class="stat" id="stat"></div>
    <div class="stat">drag to rotate the disk</div>
  </div>
</div>
<script>
function cmul(a,b){return [a[0]*b[0]-a[1]*b[1], a[0]*b[1]+a[1]*b[0]];}
function cadd(a,b){return [a[0]+b[0],a[1]+b[1]];}
function csub(a,b){return [a[0]-b[0],a[1]-b[1]];}
function cscale(a,s){return [a[0]*s,a[1]*s];}
function reflect(z,a,b){
  const ab=csub(b,a);
  const cross=a[0]*b[1]-a[1]*b[0];
  if(Math.abs(cross)<1e-12){
    const d=Math.hypot(a[0],a[1])>Math.hypot(b[0],b[1])?a:b;
    const u=cscale(d,1/Math.hypot(d[0],d[1]));
    const u2=[u[0]*u[0]-u[1]*u[1],2*u[0]*u[1]];
    return cmul(u2,[z[0],-z[1]]);
  }
  const A1=2*a[0],B1=2*a[1],C1=a[0]*a[0]+a[1]*a[1]+1;
  const A2=2*b[0],B2=2*b[1],C2=b[0]*b[0]+b[1]*b[1]+1;
  const det=A1*B2-A2*B1;
  const cx=(C1*B2-C2*B1)/det;
  const cy=(A1*C2-A2*C1)/det;
  const rho2=cx*cx+cy*cy-1;
  const w=csub(z,[cx,cy]);
  const ww=w[0]*w[0]+w[1]*w[1];
  const inv=[rho2*w[0]/ww, rho2*w[1]/ww];
  return cadd([cx,cy],inv);
}
function buildTiling(p,q,rmax){
  const coshR=(1/Math.tan(Math.PI/p))*(1/Math.tan(Math.PI/q));
  if(coshR<=1) return null;
  const Rr=Math.acosh(coshR);
  const tanhR=Math.tanh(Rr);
  const rr=Math.atanh(tanhR*Math.cos(Math.PI/p));
  const O=[0,0];
  const V=[Math.tanh(Rr/2),0];
  const ang=Math.PI/p;
  const M=[Math.tanh(rr/2)*Math.cos(ang),Math.tanh(rr/2)*Math.sin(ang)];
  const tri=[O,V,M];
  function cen(t){return [(t[0][0]+t[1][0]+t[2][0])/3,(t[0][1]+t[1][1]+t[2][1])/3];}
  function ckey(t){const c=cen(t);return Math.round(c[0]*200000)*1000000+Math.round(c[1]*200000);}
  function nbrs(t){
    const idx=[[0,1,2],[1,2,0],[2,0,1]];const res=[];
    for(let i=0;i<3;i++){const m=idx[i];res.push([t[m[0]],t[m[1]],reflect(t[m[2]],t[m[0]],t[m[1]])]);}
    return res;
  }
  const seen=new Set([ckey(tri)]);
  let frontier=[tri];
  const out=[tri];
  for(let d=0;d<60;d++){
    const next=[];
    for(let i=0;i<frontier.length;i++){
      const nn=nbrs(frontier[i]);
      for(let j=0;j<3;j++){
        const nt=nn[j];const k=ckey(nt);
        if(!seen.has(k)){
          const c=cen(nt);
          if(Math.hypot(c[0],c[1])<rmax){seen.add(k);out.push(nt);next.push(nt);}
        }
      }
    }
    frontier=next;if(frontier.length===0)break;
  }
  return out;
}
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let P=7,Q=3,spin=false,showEdge=false,rot=0;
let tiles=null;
function rebuild(){
  tiles=buildTiling(P,Q,0.988);
  document.getElementById('stat').textContent=tiles?tiles.length+' triangles':'no tiling (needs 1/p+1/q < 1/2) — try bigger p,q';
  draw();
}
function draw(){
  const W=cv.width,H=cv.height,R=Math.min(W,H)/2-6,cx=W/2,cy=H/2;
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fillStyle='#070a0f';ctx.fill();
  if(tiles){
    for(let i=0;i<tiles.length;i++){
      const t=tiles[i];
      const c=[(t[0][0]+t[1][0]+t[2][0])/3,(t[0][1]+t[1][1]+t[2][1])/3];
      const dist=Math.hypot(c[0],c[1]);
      const hue=205+dist*90;
      const light=22+ (1-dist)*26;
      ctx.beginPath();
      ctx.moveTo(t[0][0]*R,t[0][1]*R);
      ctx.lineTo(t[1][0]*R,t[1][1]*R);
      ctx.lineTo(t[2][0]*R,t[2][1]*R);
      ctx.closePath();
      ctx.fillStyle='hsl('+hue+',55%,'+light+'%)';
      ctx.fill();
      if(showEdge){
        ctx.strokeStyle='rgba(10,14,20,0.85)';ctx.lineWidth=0.6;ctx.stroke();
      }
    }
  }
  ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.strokeStyle='#7fd1ff';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
}
let dragging=false,lastAng=0;
cv.addEventListener('pointerdown',e=>{dragging=true;const r=cv.getBoundingClientRect();lastAng=Math.atan2(e.clientY-r.top-cv.height/2,e.clientX-r.left-cv.width/2);cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!dragging)return;const r=cv.getBoundingClientRect();const a=Math.atan2(e.clientY-r.top-cv.height/2,e.clientX-r.left-cv.width/2);rot+=a-lastAng;lastAng=a;draw();});
cv.addEventListener('pointerup',()=>{dragging=false;});
document.getElementById('p').addEventListener('input',e=>{P=+e.target.value;document.getElementById('pv').textContent=P;rebuild();});
document.getElementById('q').addEventListener('input',e=>{Q=+e.target.value;document.getElementById('qv').textContent=Q;rebuild();});
document.getElementById('spin').addEventListener('click',e=>{spin=!spin;e.target.classList.toggle('on',spin);});
document.getElementById('edge').addEventListener('click',e=>{showEdge=!showEdge;e.target.classList.toggle('on',showEdge);draw();});
function loop(){if(spin){rot+=0.004;draw();}requestAnimationFrame(loop);}
rebuild();loop();
</script>
</body>
</html>
