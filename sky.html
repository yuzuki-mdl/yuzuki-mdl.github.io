<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sky generator</title>
<style>
:root{--ink:#e9e6df;--bg:#0b0d12}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-monospace,Menlo,monospace}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
canvas{flex:1;width:100%;display:block}
#bar{display:flex;gap:14px;align-items:center;padding:10px 14px;background:#12151d;border-top:1px solid #222838;flex-wrap:wrap;font-size:13px}
#bar button{background:#1c2230;color:var(--ink);border:1px solid #2c3548;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
#bar button:hover{background:#252d3f}
label{display:flex;gap:6px;align-items:center;color:#9aa4b8}
input[type=range]{width:110px;accent-color:#7fd1c0}
#seed{color:#7fd1c0;min-width:80px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="bar">
  <button id="new">new sky</button>
  <label>time <input id="tod" type="range" min="0" max="1" step="0.001" value="0.5"></label>
  <label>clouds <input id="cloud" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  <span id="seed"></span>
</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1;
let seed=Math.floor(Math.random()*1e9);
let tod=0.5, cloudAmt=0.5;

// mulberry32
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}

// palettes keyed by time-of-day: dawn, day, dusk, night
const PALS=[
 {t:0.0, top:[10,14,40], bot:[40,30,70], sun:[120,110,180]},   // deep night
 {t:0.2, top:[60,60,120], bot:[230,150,140], sun:[255,200,150]}, // dawn
 {t:0.5, top:[70,140,220], bot:[180,215,240], sun:[255,245,210]}, // day
 {t:0.8, top:[60,70,150], bot:[240,140,90], sun:[255,170,90]},   // dusk
 {t:1.0, top:[10,14,40], bot:[40,30,70], sun:[120,110,180]},     // night again
];
function lerp(a,b,t){return a+(b-a)*t}
function palAt(t){
  for(let i=0;i<PALS.length-1;i++){
    const a=PALS[i],b=PALS[i+1];
    if(t>=a.t&&t<=b.t){
      const k=(t-a.t)/(b.t-a.t);
      return {top:a.top.map((v,j)=>lerp(v,b.top[j],k)),bot:a.bot.map((v,j)=>lerp(v,b.bot[j],k)),sun:a.sun.map((v,j)=>lerp(v,b.sun[j],k))};
    }
  }
  return PALS[PALS.length-1];
}
function rgb(a){return 'rgb('+a.map(v=>Math.round(v)).join(',')+')'}

function draw(){
  const R=rng(seed);
  const pal=palAt(tod);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgb(pal.top));g.addColorStop(1,rgb(pal.bot));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // sun / moon position follows tod
  const sx=W*(0.15+0.7*tod);
  const sy=H*(0.62-0.42*Math.sin(tod*Math.PI));
  const sr=Math.min(W,H)*(0.06+0.03*R());
  const glow=ctx.createRadialGradient(sx,sy,0,sx,sy,sr*6);
  glow.addColorStop(0,'rgba('+pal.sun.map(v=>Math.round(v)).join(',')+',0.9)');
  glow.addColorStop(0.3,'rgba('+pal.sun.map(v=>Math.round(v)).join(',')+',0.25)');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(sx,sy,sr*6,0,7);ctx.fill();
  ctx.fillStyle=rgb(pal.sun);ctx.beginPath();ctx.arc(sx,sy,sr,0,7);ctx.fill();

  // stars at night
  const nightness=Math.max(0,1-Math.abs(tod-0.0)/0.18)+Math.max(0,1-Math.abs(tod-1.0)/0.18);
  if(nightness>0.01){
    for(let i=0;i<140;i++){
      const x=R()*W,y=R()*H*0.7,r=R()*1.4+0.3,a=R()*0.8*Math.min(1,nightness);
      ctx.fillStyle='rgba(255,255,255,'+a.toFixed(2)+')';
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    }
  }

  // clouds: layered soft blobs
  const n=Math.floor(3+cloudAmt*14);
  for(let i=0;i<n;i++){
    const cx=R()*W, cy=H*(0.1+R()*0.45), cw=W*(0.12+R()*0.22), ch=cw*(0.18+R()*0.12);
    const light=R()*0.4+0.35;
    const base=pal.bot.map(v=>Math.min(255,v+40));
    ctx.save();
    ctx.globalAlpha=0.16+cloudAmt*0.22;
    const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,cw);
    cg.addColorStop(0,'rgba('+base.map(v=>Math.round(v)).join(',')+',1)');
    cg.addColorStop(1,'rgba('+base.map(v=>Math.round(v)).join(',')+',0)');
    ctx.fillStyle=cg;
    ctx.beginPath();ctx.ellipse(cx,cy,cw,ch,0,0,7);ctx.fill();
    ctx.restore();
  }

  // distant hills for depth
  const hills=2+Math.floor(R()*2);
  for(let h=0;h<hills;h++){
    const base=H*(0.72+h*0.08);
    ctx.beginPath();ctx.moveTo(0,H);
    let y=base;
    for(let x=0;x<=W;x+=W/24){
      y=base+Math.sin(x*0.004+h*2+R()*0.3)*H*0.03*(h+1)+R()*H*0.01;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H);ctx.closePath();
    const shade=pal.bot.map(v=>Math.max(0,v-90-h*20));
    ctx.fillStyle='rgba('+shade.map(v=>Math.round(v)).join(',')+',0.85)';
    ctx.fill();
  }
}

document.getElementById('new').onclick=()=>{seed=Math.floor(Math.random()*1e9);upd()}
document.getElementById('tod').oninput=e=>{tod=+e.target.value;upd()}
document.getElementById('cloud').oninput=e=>{cloudAmt=+e.target.value;upd()}
function upd(){document.getElementById('seed').textContent='#'+seed.toString(36);draw()}
window.addEventListener('resize',resize);
resize();upd();
</script>
</body>
</html>
