<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content='width=device-width,initial-scale=1'>
<title>wfc — collapse</title>
<style>
  :root{--bg:#0b0d10;--fg:#e8e6e1;--dim:#6b7280;--line:#232830}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;min-height:100%}
  h1{font-size:15px;font-weight:500;letter-spacing:.02em;margin:0}
  p.hint{color:var(--dim);font-size:12px;margin:0;text-align:center;max-width:60ch}
  canvas{image-rendering:pixelated;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair;max-width:96vw;max-height:70vh}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{background:#151a20;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{background:#1c232b}
  label{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:6px}
  input[type=range]{width:90px;accent-color:#7dd3fc}
</style>
<h1>wave function collapse</h1>
<p class=hint>a grid of tiles that dont know what they are yet, collapsing into a pattern that fits itself. drag on the canvas to force a spot and watch it spread.</p>
<canvas id=c width=560 height=560></canvas>
<div class=bar>
  <button id=reset>new</button>
  <label>size <input id=size type=range min=12 max=40 value=24></label>
</div>
<script>
// simple tileset: blank, and pipes/corners. each tile has 4 edges NESW, edges are 'w' (wall) or 'o' (open).
// we make a small set of tiles with edge signatures so adjacency is legal when shared edges match.
const TILES = [
  // name, [N,E,S,W] each 0=open 1=wall, weight, draw fn
  {n:'blank', e:[0,0,0,0], w:6, d:'blank'},
  {n:'cross', e:[1,1,1,1], w:2, d:'cross'},
  {n:'line-h',e:[0,1,0,1], w:3, d:'h'},
  {n:'line-v',e:[1,0,1,0], w:3, d:'v'},
  {n:'corner-ne',e:[0,1,1,0], w:2, d:'ne'},
  {n:'corner-nw',e:[0,0,1,1], w:2, d:'nw'},
  {n:'corner-se',e:[1,1,0,0], w:2, d:'se'},
  {n:'corner-sw',e:[1,0,0,1], w:2, d:'sw'},
  {n:'t-ne',e:[0,1,1,1], w:1, d:'tne'},
  {n:'t-nw',e:[1,1,1,0], w:1, d:'tnw'},
  {n:'t-se',e:[1,1,0,1], w:1, d:'tse'},
  {n:'t-sw',e:[1,0,1,1], w:1, d:'tsw'},
];
const N=TILES.length;
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]]; // N E S W
// opposite edge index for neighbor: N sees S(2), E sees W(3), S sees N(0), W sees E(1)
const OPP=[2,3,0,1];

// precompute allowed neighbor sets: allow[a][dir] = set of b that can sit in dir from a
const allow=[];
for(let a=0;a<N;a++){
  allow[a]=[];
  for(let d=0;d<4;d++){
    const set=[];
    for(let b=0;b<N;b++){
      // shared edge: a's edge d must equal b's edge OPP[d]
      if(TILES[a].e[d]===TILES[b].e[OPP[d]]) set.push(b);
    }
    allow[a][d]=set;
  }
}

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=24, cell, N2, grid, weights;

function reset(){
  W=+document.getElementById('size').value;
  const px=Math.floor(560/W);
  cv.width=cv.height=px*W;
  cell=px;
  N2=W*W;
  grid=[];
  for(let i=0;i<N2;i++) grid.push(maskAll());
  weights=TILES.map(t=>t.w);
  draw();
  // kick off
  setTimeout(step,10);
}

function maskAll(){ // bitmask of possibilities, all set
  return (1<<N)-1;
}
function countCard(m){let c=0;while(m){c+=m&1;m>>=1;}return c;}
function bits(m){const a=[];for(let i=0;i<N;i++)if(m&(1<<i))a.push(i);return a;}

// entropy = cardinality (weighted-ish). pick lowest card >1
function findLowest(){
  let best=-1,bc=1e9;
  for(let i=0;i<N2;i++){
    const c=countCard(grid[i]);
    if(c>1&&c<bc){bc=c;best=i;}
    if(c===1)continue;
  }
  return best;
}

function collapseCell(i){
  const opts=bits(grid[i]);
  // weighted pick
  let tot=0; for(const o of opts) tot+=weights[o];
  let r=Math.random()*tot, pick=opts[0];
  for(const o of opts){ r-=weights[o]; if(r<=0){pick=o;break;} }
  grid[i]=(1<<pick);
}

function propagate(changed){
  const stack=[...changed];
  while(stack.length){
    const i=stack.pop();
    const x=i%W, y=(i/W)|0;
    for(let d=0;d<4;d++){
      const nx=x+DIRS[d][0], ny=y+DIRS[d][1];
      if(nx<0||ny<0||nx>=W||ny>=W) continue;
      const j=ny*W+nx;
      // for each possible a in i, allowed b in dir d. union of allow[a][d] over a in grid[i]
      let allowed=0;
      const ai=bits(grid[i]);
      for(const a of ai) for(const b of allow[a][d]) allowed|=(1<<b);
      const before=grid[j];
      const after=before & allowed;
      if(after!==before){
        if(after===0){ // contradiction -> restart-ish: give it all
          grid[j]=maskAll();
        } else {
          grid[j]=after;
        }
        stack.push(j);
      }
    }
  }
}

function step(){
  const i=findLowest();
  if(i<0){ draw(); return; } // done
  collapseCell(i);
  propagate([i]);
  draw();
  setTimeout(step, 4);
}

// ---- drawing ----
function drawTile(idx,x,y){
  const px=x*cell, py=y*cell;
  const t=TILES[idx];
  ctx.fillStyle='#0b0d10'; ctx.fillRect(px,py,cell,cell);
  const c=cell/2, lw=Math.max(2,cell*0.14);
  ctx.strokeStyle='#7dd3fc'; ctx.lineWidth=lw; ctx.lineCap='round';
  ctx.beginPath();
  const mid=px+c, midy=py+c;
  // draw arms toward open (0) edges? walls(1) are borders. let open edges = drawn line coming in.
  // convention: open edge -> line reaches that edge
  if(t.e[0]===0){ ctx.moveTo(mid,py); ctx.lineTo(mid,midy);} // N open
  if(t.e[2]===0){ ctx.moveTo(mid,midy); ctx.lineTo(mid,py+cell);} // S open
  if(t.e[3]===0){ ctx.moveTo(px,midy); ctx.lineTo(mid,midy);} // W open
  if(t.e[1]===0){ ctx.moveTo(mid,midy); ctx.lineTo(px+cell,midy);} // E open
  ctx.stroke();
}

function draw(){
  ctx.fillStyle='#0b0d10'; ctx.fillRect(0,0,cv.width,cv.height);
  for(let i=0;i<N2;i++){
    const x=i%W, y=(i/W)|0;
    const m=grid[i];
    if(countCard(m)===1){
      drawTile(bits(m)[0],x,y);
    } else {
      // undecided: faint dot density by how many options
      const c=countCard(m);
      const a=Math.min(1,c/N)*0.5;
      ctx.fillStyle='rgba(125,211,252,'+a*0.25+')';
      ctx.fillRect(x*cell+1,y*cell+1,cell-2,cell-2);
    }
  }
  // gridlines faint
  ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=1;
  for(let i=0;i<=W;i++){
    ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,cv.height);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(cv.width,i*cell);ctx.stroke();
  }
}

// drag to force a cell: pick the tile nearest to where u clicked among options, collapse it, propagate, continue
function cellAt(ev){
  const r=cv.getBoundingClientRect();
  const x=Math.floor((ev.clientX-r.left)/r.width*W);
  const y=Math.floor((ev.clientY-r.top)/r.height*W);
  if(x<0||y<0||x>=W||y>=W) return -1;
  return y*W+x;
}
let dragging=false;
cv.addEventListener('pointerdown',e=>{dragging=true;force(e);});
cv.addEventListener('pointermove',e=>{if(dragging)force(e);});
window.addEventListener('pointerup',()=>dragging=false);

function force(ev){
  const i=cellAt(ev); if(i<0)return;
  if(countCard(grid[i])<=1)return;
  collapseCell(i);
  propagate([i]);
  draw();
  // resume auto after a beat
  clearTimeout(force._t);
  force._t=setTimeout(step,120);
}

document.getElementById('reset').onclick=reset;
document.getElementById('size').oninput=()=>{clearTimeout(force._t);reset();};
reset();
</script>
</html>
