<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>boids</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0c;overflow:hidden;font-family:ui-monospace,monospace;color:#cfd8e8}
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;left:12px;bottom:12px;font-size:12px;opacity:.6;line-height:1.6;pointer-events:none}
  #ui b{color:#7ad0ff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <b id="n">200</b> boids · click = scatter · space = reset<br>
  separation / alignment / cohesion
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,DPR;
let boids=[];
const N=200;
const PERC=70;      // perception radius px
const SEPD=26;      // separation radius
const MAXV=2.6;
const MAXF=0.05;
const WEIGHTS={sep:1.7, ali:1.0, coh:0.9};

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

function mk(){
  const a=Math.random()*Math.PI*2, s=1.2+Math.random()*1.2;
  return {x:Math.random()*W, y:Math.random()*H, vx:Math.cos(a)*s, vy:Math.sin(a)*s, hue:190+Math.random()*80};
}
function reset(){ boids=[]; for(let i=0;i<N;i++) boids.push(mk()); }

function limit(v,len){ const m=Math.hypot(v.x,v.y); if(m>len){ v.x=v.x/m*len; v.y=v.y/m*len; } return v; }

function step(){
  for(const b of boids){
    let sx=0,sy=0, ax=0,ay=0, cx=0,cy=0;
    let nSep=0, nAli=0, nCoh=0;
    for(const o of boids){
      if(o===b) continue;
      const dx=o.x-b.x, dy=o.y-b.y;
      const d2=dx*dx+dy*dy;
      if(d2>PERC*PERC || d2===0) continue;
      const d=Math.sqrt(d2);
      if(d<SEPD){ sx-=dx/d; sy-=dy/d; nSep++; }
      ax+=o.vx; ay+=o.vy; nAli++;
      cx+=o.x; cy+=o.y; nCoh++;
    }
    let fx=0,fy=0;
    if(nSep){ fx+=(sx/nSep)*WEIGHTS.sep; fy+=(sy/nSep)*WEIGHTS.sep; }
    if(nAli){ fx+=((ax/nAli)-b.vx)*WEIGHTS.ali*0.06; fy+=((ay/nAli)-b.vy)*WEIGHTS.ali*0.06; }
    if(nCoh){ fx+=(((cx/nCoh)-b.x))*WEIGHTS.coh*0.004; fy+=(((cy/nCoh)-b.y))*WEIGHTS.coh*0.004; }
    b.vx+=fx; b.vy+=fy;
    const v=limit({x:b.vx,y:b.vy},MAXV); b.vx=v.x; b.vy=v.y;
    b.x+=b.vx; b.y+=b.vy;
    // wrap
    if(b.x<0) b.x+=W; else if(b.x>=W) b.x-=W;
    if(b.y<0) b.y+=H; else if(b.y>=H) b.y-=H;
  }
}

function draw(){
  ctx.fillStyle='rgba(10,10,12,0.18)';
  ctx.fillRect(0,0,W,H);
  for(const b of boids){
    const ang=Math.atan2(b.vy,b.vx);
    const s=4.2;
    ctx.fillStyle='hsl('+b.hue+',85%,62%)';
    ctx.beginPath();
    ctx.moveTo(b.x+Math.cos(ang)*s, b.y+Math.sin(ang)*s);
    ctx.lineTo(b.x+Math.cos(ang+2.5)*s*0.7, b.y+Math.sin(ang+2.5)*s*0.7);
    ctx.lineTo(b.x+Math.cos(ang-2.5)*s*0.7, b.y+Math.sin(ang-2.5)*s*0.7);
    ctx.closePath(); ctx.fill();
  }
}

function loop(){ step(); draw(); requestAnimationFrame(loop); }

addEventListener('resize', ()=>{ resize(); reset(); });
addEventListener('click', (e)=>{
  for(const b of boids){
    const dx=b.x-e.clientX, dy=b.y-e.clientY, d=Math.hypot(dx,dy)+1;
    if(d<260){ b.vx+=dx/d*4; b.vy+=dy/d*4; }
  }
});
addEventListener('keydown', (e)=>{ if(e.code==='Space'){ e.preventDefault(); resize(); reset(); } });

resize(); reset(); loop();
</script>
</body>
</html>
