<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hyperbolic life</title>
<style>
  :root{--bg:#0b0d10;--fg:#e6e8ec;--dim:#8a90a0;--acc:#7fd1ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;min-height:100vh}
  header{padding:14px 18px 6px}
  h1{font-size:16px;margin:0 0 2px;font-weight:600}
  .sub{color:var(--dim);font-size:12px;max-width:640px}
  .wrap{flex:1;display:flex;flex-wrap:wrap;gap:16px;padding:8px 18px 18px;align-items:flex-start}
  canvas{background:#05070a;border-radius:12px;touch-action:none;max-width:100%}
  .panel{display:flex;flex-direction:column;gap:14px;min-width:200px}
  .row{display:flex;flex-direction:column;gap:4px}
  label{color:var(--dim);font-size:12px}
  input[type=range]{width:100%;accent-color:var(--acc)}
  .val{color:var(--acc)}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{background:#1a1f27;color:var(--fg);border:1px solid #2a3038;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--acc);color:var(--acc)}
  button.on{background:#12303f;border-color:var(--acc);color:var(--acc)}
  .stat{color:var(--dim);font-size:12px}
  .bits{display:flex;gap:4px}
  .bit{width:26px;height:26px;border:1px solid #2a3038;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--dim)}
  .bit.on{background:#12303f;border-color:var(--acc);color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>hyperbolic life</h1>
  <div class="sub">conway's game of life, but on the {p,q} triangle tiling of the hyperbolic plane. every triangle has exactly 3 edge-neighbours, so the rules are over 0-3 instead of 0-8. drag to rotate.</div>
</header>
<div class="wrap">
  <canvas id="c" width="720" height="720"></canvas>
  <div class="panel">
    <div class="row"><label>p: <span class="val" id="pv">7</span></label><input id="p" type="range" min="3" max="12" step="1" value="7"></div>
    <div class="row"><label>q: <span class="val" id="qv">3</span></label><input id="q" type="range" min="3" max="12" step="1" value="3"></div>
    <div class="row"><label>born on n neighbours</label><div class="bits" id="born"></div></div>
    <div class="row"><label>survives on n neighbours</label><div class="bits" id="surv"></div></div>
    <div class="btns">
      <button id="play">play</button>
      <button id="step">step</button>
      <button id="rand">random</button>
      <button id="clear">clear</button>
      <button id="spin">spin</button>
    </div>
    <div class="stat" id="stat"></div>
    <div class="stat">click a triangle to toggle it</div>
  </div>
</div>
<script>
function csub(a,b){return [a[0]-b[0],a[1]-b[1]];}
function cadd(a,b){return [a[0]+b[0],a[1]+b[1]];}
function cscale(a,s){return [a[0]*s,a[1]*s];}
function cmul(a,b){return [a[0]*b[0]-a[1]*b[1], a[0]*b[1]+a[1]*b[0]];}
function reflect(z,a,b){
  const cross=a[0]*b[1]-a[1]*b[0];
  if(Math.abs(cross)<1e-12){
    const d=Math.hypot(a[0],a[1])>Math.hypot(b[0],b[1])?a:b;
    const u=cscale(d,1/Math.hypot(d[0],d[1]));
    const u2=[u[0]*u[0]-u[1]*u[1],2*u[0]*u[1]];
    return cmul(u2,[z[0],-z[1]]);
  }
  const A1=2*a[0],B1=2*a[1],C1=a[0]*a[0]+a[1]*a[1]+1;
  const A2=2*b[0],B2=2*b[1],C2=b[0]*b[0]+b[1]*b[1]+1;
  const det=A1*B2-A2*B1;
  const cx=(C1*B2-C2*B1)/det, cy=(A1*C2-A2*C1)/det;
  const rho2=cx*cx+cy*cy-1;
  const w=csub(z,[cx,cy]);
  const ww=w[0]*w[0]+w[1]*w[1];
  return cadd([cx,cy],[rho2*w[0]/ww, rho2*w[1]/ww]);
}
function buildTiling(p,q,rmax){
  const coshR=(1/Math.tan(Math.PI/p))*(1/Math.tan(Math.PI/q));
  if(coshR<=1) return null;
  const Rr=Math.acosh(coshR);
  const tanhR=Math.tanh(Rr);
  const rr=Math.atanh(tanhR*Math.cos(Math.PI/p));
  const O=[0,0], V=[Math.tanh(Rr/2),0], ang=Math.PI/p;
  const M=[Math.tanh(rr/2)*Math.cos(ang),Math.tanh(rr/2)*Math.sin(ang)];
  const tri=[O,V,M];
  function cen(t){return [(t[0][0]+t[1][0]+t[2][0])/3,(t[0][1]+t[1][1]+t[2][1])/3];}
  function ckey(t){const c=cen(t);return Math.round(c[0]*200000)*1000000+Math.round(c[1]*200000);}
  function nbrs(t){const idx=[[0,1,2],[1,2,0],[2,0,1]];const res=[];
    for(let i=0;i<3;i++){const m=idx[i];res.push([t[m[0]],t[m[1]],reflect(t[m[2]],t[m[0]],t[m[1]])]);}return res;}
  const seen=new Set([ckey(tri)]);
  let frontier=[tri]; const out=[tri];
  for(let d=0;d<60;d++){
    const next=[];
    for(const t of frontier){const nn=nbrs(t);for(const nt of nn){const k=ckey(nt);
      if(!seen.has(k)){const c=cen(nt);if(Math.hypot(c[0],c[1])<rmax){seen.add(k);out.push(nt);next.push(nt);}}}}
    frontier=next;if(!frontier.length)break;
  }
  return out;
}

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=W*0.47;
let tris=[], adj=[], state=null, p=7, q=3, rot=0, spinning=false, playing=false;
let bornMask=0b0010, survMask=0b0110; // B1 S12 default

function vkey(pt){return pt[0].toFixed(6)+','+pt[1].toFixed(6);}
function buildAdj(tris){
  const em=new Map();
  tris.forEach((tri,idx)=>{for(let e=0;e<3;e++){
    const a=vkey(tri[e]),b=vkey(tri[(e+1)%3]);const k=a<b?a+'|'+b:b+'|'+a;
    if(!em.has(k))em.set(k,[]);em.get(k).push(idx);}});
  const a=tris.map(()=>[]);
  for(const list of em.values()){if(list.length===2){a[list[0]].push(list[1]);a[list[1]].push(list[0]);}}
  return a;
}
function rebuild(){
  const t=buildTiling(p,q,0.988);
  if(!t){tris=[];adj=[];state=null;draw();return;}
  tris=t; adj=buildAdj(tris);
  state=new Uint8Array(tris.length);
  randomize();
}
function randomize(){for(let i=0;i<state.length;i++)state[i]=Math.random()<0.45?1:0;draw();}
function clearAll(){for(let i=0;i<state.length;i++)state[i]=0;draw();}
function step(){
  if(!state)return;
  const ns=new Uint8Array(state.length);
  for(let i=0;i<state.length;i++){
    let c=0; for(const j of adj[i]) c+=state[j];
    ns[i]=state[i]?((survMask>>c)&1):((bornMask>>c)&1);
  }
  state=ns; draw();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fillStyle='#070a0f';ctx.fill();
  if(state){
    for(let i=0;i<tris.length;i++){
      const t=tris[i];
      ctx.beginPath();
      ctx.moveTo(t[0][0]*R,t[0][1]*R);
      ctx.lineTo(t[1][0]*R,t[1][1]*R);
      ctx.lineTo(t[2][0]*R,t[2][1]*R);
      ctx.closePath();
      if(state[i]){ctx.fillStyle='#7fd1ff';ctx.fill();}
      else{ctx.fillStyle='#0d1520';ctx.fill();}
    }
    ctx.strokeStyle='rgba(10,14,20,0.6)';ctx.lineWidth=0.4;
    for(const t of tris){ctx.beginPath();ctx.moveTo(t[0][0]*R,t[0][1]*R);ctx.lineTo(t[1][0]*R,t[1][1]*R);ctx.lineTo(t[2][0]*R,t[2][1]*R);ctx.closePath();ctx.stroke();}
  }
  ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.strokeStyle='#7fd1ff';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
  let alive=0; if(state)for(const s of state)alive+=s;
  document.getElementById('stat').textContent=(state?alive+' / '+tris.length+' alive':'invalid {p,q}');
}

// bit toggles
function makeBits(el,mask,setter){
  el.innerHTML='';
  for(let n=0;n<=3;n++){
    const d=document.createElement('div');d.className='bit'+(((mask>>n)&1)?' on':'');d.textContent=n;
    d.onclick=()=>{mask^=(1<<n);setter(mask);makeBits(el,mask,setter);};
    el.appendChild(d);
  }
}
const bornEl=document.getElementById('born'), survEl=document.getElementById('surv');
makeBits(bornEl,bornMask,m=>{bornMask=m;});
makeBits(survEl,survMask,m=>{survMask=m;});

// controls
document.getElementById('p').oninput=e=>{p=+e.target.value;document.getElementById('pv').textContent=p;rebuild();};
document.getElementById('q').oninput=e=>{q=+e.target.value;document.getElementById('qv').textContent=q;rebuild();};
document.getElementById('rand').onclick=randomize;
document.getElementById('clear').onclick=clearAll;
document.getElementById('step').onclick=()=>{if(!playing)step();};
const playBtn=document.getElementById('play');
playBtn.onclick=()=>{playing=!playing;playBtn.classList.toggle('on',playing);playBtn.textContent=playing?'pause':'play';};
const spinBtn=document.getElementById('spin');
spinBtn.onclick=()=>{spinning=!spinning;spinBtn.classList.toggle('on',spinning);};

// click to toggle a triangle
cv.addEventListener('click',e=>{
  if(!state)return;
  const rect=cv.getBoundingClientRect();
  const sx=(e.clientX-rect.left)*(W/rect.width), sy=(e.clientY-rect.top)*(H/rect.height);
  let x=sx-cx,y=sy-cy;
  const ca=Math.cos(-rot),sa=Math.sin(-rot);
  const xx=x*ca-y*sa, yy=x*sa+y*ca;
  const dx=xx/R, dy=yy/R;
  if(dx*dx+dy*dy>=1)return;
  for(let i=0;i<tris.length;i++){
    const t=tris[i];
    if(pointInTri(dx,dy,t)){state[i]^=1;draw();return;}
  }
});
function pointInTri(px,py,t){
  const [a,b,c]=t;
  const d1=(px-b[0])*(a[1]-b[1])-(a[0]-b[0])*(py-b[1]);
  const d2=(px-c[0])*(b[1]-c[1])-(b[0]-c[0])*(py-c[1]);
  const d3=(px-a[0])*(c[1]-a[1])-(c[0]-a[0])*(py-a[1]);
  const neg=(d1<0)||(d2<0)||(d3<0), pos=(d1>0)||(d2>0)||(d3>0);
  return !(neg&&pos);
}
// drag rotate
let dragging=false,lx=0;
cv.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{if(dragging){rot+=(e.clientX-lx)*0.01;lx=e.clientX;draw();}});

function loop(){
  if(spinning){rot+=0.004;}
  if(playing){step();}
  else if(spinning){draw();}
  requestAnimationFrame(loop);
}
rebuild();
loop();
</script>
</body>
</html>
