<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>picross</title>
<style>
  :root{--bg:#0b0d10;--fg:#e6e6e6;--dim:#5a6472;--acc:#7ee0c0;--fill:#7ee0c0;--mark:#3a4250}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 ui-monospace,Menlo,monospace;-webkit-user-select:none;user-select:none}
  h1{font-size:15px;font-weight:400;letter-spacing:.3em;color:var(--dim);margin:0}
  #wrap{max-width:640px;margin:0 auto;padding:14px 18px 40px}
  header{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}
  #hint{color:var(--dim);font-size:12px}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  button{background:#161a20;color:var(--fg);border:1px solid #232a33;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--acc);color:var(--acc)}
  select{background:#161a20;color:var(--fg);border:1px solid #232a33;border-radius:6px;padding:6px;font:inherit}
  #status{color:var(--dim);font-size:12px;margin-left:auto}
  #status.win{color:var(--acc)}
  #board{display:grid;gap:1px;background:#232a33;border:1px solid #232a33;border-radius:4px;padding:1px;width:100%}
  .cell{background:#0f1216;aspect-ratio:1;cursor:pointer;position:relative;transition:background .05s}
  .cell:hover{background:#161b22}
  .cell.f{background:var(--fill)}
  .cell.x::after{content:'';position:absolute;inset:28%;background:var(--mark);border-radius:1px}
  .cell.big{border-right:2px solid #2f3946}
  .cell.bigv{border-bottom:2px solid #2f3946}
  .clue{display:grid;font-size:11px;color:var(--dim);align-items:center;justify-content:center}
  .clue span{display:inline-block;padding:0 2px}
  .clue.done{color:var(--acc)}
  #grid-wrap{display:grid;gap:2px}
</style>
</head>
<body>
<div id="wrap">
  <header><h1>PICROSS</h1><span id="hint">drag to fill · right-drag to mark · numbers = block runs</span></header>
  <div class="bar">
    <button id="new">new puzzle</button>
    <select id="size"><option value="10">10×10</option><option value="15" selected>15×15</option><option value="20">20×20</option></select>
    <button id="clear">clear</button>
    <button id="hintbtn">hint</button>
    <span id="status"></span>
  </div>
  <div id="grid-wrap"><div id="board"></div></div>
</div>
<script>
(() => {
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const sizeSel = document.getElementById('size');

  function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296}}
  function genGrid(N,seed,density){const r=rng(seed);const g=[];for(let y=0;y<N;y++)g.push(new Array(N).fill(0));
    for(let y=0;y<N;y++)for(let x=0;x<=Math.floor((N-1)/2);x++){const v=r()<density?1:0;g[y][x]=v;g[y][N-1-x]=v;}
    return g;}
  function cluesLine(line){const out=[];let run=0;for(const v of line){if(v){run++;}else{if(run){out.push(run);run=0;}}}if(run)out.push(run);return out.length?out:[0];}

  let N=15, sol=[], rows=[], cols=[], state=[], painting=false, paintVal=1;
  const cellEls=[];

  function build(){
    boardEl.innerHTML=''; cellEls.length=0;
    const seed=(Math.random()*1e9)>>>0;
    sol=genGrid(N,seed,N<=10?0.55:0.5);
    rows=sol.map(cluesLine);
    cols=[]; for(let x=0;x<N;x++){const c=[];for(let y=0;y<N;y++)c.push(sol[y][x]);cols.push(cluesLine(c));}
    state=[]; for(let y=0;y<N;y++)state.push(new Array(N).fill(0)); // 0 empty,1 fill,2 mark

    const maxRowClue=Math.max(...rows.map(r=>r.length));
    const maxColClue=Math.max(...cols.map(c=>c.length));
    const cols_=maxRowClue+N;
    const grid=document.getElementById('grid-wrap');
    grid.style.gridTemplateColumns='auto 1fr';
    grid.innerHTML='';

    // top clue row
    const topLeft=document.createElement('div');
    grid.appendChild(topLeft);
    const top=document.createElement('div');
    top.style.display='grid'; top.style.gridTemplateColumns=`repeat(${N},1fr)`; top.style.gap='1px';
    for(let x=0;x<N;x++){
      const d=document.createElement('div'); d.className='clue'; d.style.display='flex'; d.style.flexDirection='column'; d.style.justifyContent='flex-end'; d.style.minHeight=(maxColClue*14)+'px';
      d.innerHTML=cols[x].map(v=>`<span>${v}</span>`).join('');
      d.dataset.col=x; d.dataset.type='colclue';
      top.appendChild(d);
    }
    grid.appendChild(top);

    // rows: clue + cells -> build a left clue column and the board
    const left=document.createElement('div');
    left.style.display='grid'; left.style.gridTemplateRows=`repeat(${N},1fr)`; left.style.gap='1px';
    for(let y=0;y<N;y++){
      const d=document.createElement('div'); d.className='clue'; d.style.display='flex'; d.style.justifyContent='flex-end'; d.style.alignItems='center'; d.style.gap='3px'; d.dataset.row=y; d.dataset.type='rowclue';
      d.innerHTML=rows[y].map(v=>`<span>${v}</span>`).join('');
      left.appendChild(d);
    }
    grid.appendChild(left);

    boardEl.style.display='grid';
    boardEl.style.gridTemplateColumns=`repeat(${N},1fr)`;
    boardEl.style.gap='1px';
    for(let y=0;y<N;y++){
      for(let x=0;x<N;x++){
        const c=document.createElement('div');
        c.className='cell';
        if((x+1)%5===0&&x<N-1)c.classList.add('big');
        if((y+1)%5===0&&y<N-1)c.classList.add('bigv');
        c.dataset.x=x; c.dataset.y=y;
        boardEl.appendChild(c);
        cellEls.push(c);
      }
    }
    grid.appendChild(boardEl);
    statusEl.textContent=''; statusEl.className='';
  }

  function idx(x,y){return y*N+x}
  // enumerate all placements of clue runs on a line given current state (0 unknown,1 filled,2 marked)
  // returns array of possible full lines (1 filled,0 empty) consistent with state
  function linePlacements(clue, cur){
    const L=cur.length; const res=[];
    const need = clue.length===1&&clue[0]===0 ? [] : clue;
    function rec(ci,pos,line){
      if(ci===need.length){
        for(let i=pos;i<L;i++){ if(cur[i]===1)return; line[i]=0; }
        res.push(line.slice()); return;
      }
      const run=need[ci];
      const after = need.slice(ci+1).reduce((a,b)=>a+b+1,0);
      for(let start=pos; start+run+after<=L; start++){
        let ok=true;
        for(let i=pos;i<start;i++){ if(cur[i]===1){ok=false;break;} line[i]=0; }
        if(!ok)break;
        for(let i=start;i<start+run;i++){ if(cur[i]===2){ok=false;break;} line[i]=1; }
        if(!ok)continue;
        if(start+run<L){ if(cur[start+run]===1)continue; line[start+run]=0; }
        rec(ci+1, start+run+1, line);
        if(!ok)break;
      }
    }
    rec(0,0,new Array(L).fill(0));
    return res;
  }
  function lineForced(clue,cur){
    const ps=linePlacements(clue,cur);
    if(!ps.length)return null;
    const out=new Array(cur.length).fill(-1);
    for(let i=0;i<cur.length;i++){
      let all1=true,all0=true;
      for(const p of ps){ if(p[i]!==1)all1=false; if(p[i]!==0)all0=false; }
      if(all1&&all0) return {contradiction:true};
      if(all1)out[i]=1; else if(all0)out[i]=0; else out[i]=-1;
    }
    return out;
  }
  function doHint(){
    let changed=false;
    for(let y=0;y<N&&!changed;y++){
      const cur=state[y].map(v=>v===1?1:(v===2?2:0));
      const f=lineForced(rows[y],cur);
      if(f&&!f.contradiction){
        for(let x=0;x<N;x++){
          if(f[x]===1&&state[y][x]!==1){state[y][x]=1;changed=true;}
          else if(f[x]===0&&state[y][x]===0){state[y][x]=2;changed=true;}
        }
      }
    }
    for(let x=0;x<N&&!changed;x++){
      const cur=[];for(let y=0;y<N;y++)cur.push(state[y][x]===1?1:(state[y][x]===2?2:0));
      const f=lineForced(cols[x],cur);
      if(f&&!f.contradiction){
        for(let y=0;y<N;y++){
          if(f[y]===1&&state[y][x]!==1){state[y][x]=1;changed=true;}
          else if(f[y]===0&&state[y][x]===0){state[y][x]=2;changed=true;}
        }
      }
    }
    if(changed)render();
    else statusEl.textContent='no forced cells — guess or clear something';
  }
  function paint(x,y,val){
    const cur=state[y][x];
    let nv = val;
    if(cur===val) nv=0; // toggle off if same
    state[y][x]=nv;
    render();
  }
  function render(){
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const el=cellEls[idx(x,y)];
      const s=state[y][x];
      el.classList.toggle('f',s===1);
      el.classList.toggle('x',s===2);
    }
    // update clue done state
    document.querySelectorAll('[data-type=rowclue]').forEach(d=>{
      const y=+d.dataset.row;
      const line=state[y].map(v=>v===1?1:0);
      const c=cluesLine(line);
      d.classList.toggle('done', JSON.stringify(c)===JSON.stringify(rows[y]));
    });
    document.querySelectorAll('[data-type=colclue]').forEach(d=>{
      const x=+d.dataset.col;
      const col=[];for(let y=0;y<N;y++)col.push(state[y][x]===1?1:0);
      const c=cluesLine(col);
      d.classList.toggle('done', JSON.stringify(c)===JSON.stringify(cols[x]));
    });
    checkWin();
  }
  function checkWin(){
    let ok=true;
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const want=sol[y][x];
      const have=state[y][x]===1?1:0;
      if(want!==have){ok=false;break;}
    }
    if(ok){statusEl.textContent='solved ✓';statusEl.className='win';}
  }

  document.getElementById('hintbtn').addEventListener('click',doHint);
  boardEl.addEventListener('mousedown',e=>{
    const t=e.target.closest('.cell'); if(!t)return;
    painting=true;
    paintVal = e.button===2?2:1;
    paint(+t.dataset.x,+t.dataset.y,paintVal);
    e.preventDefault();
  });
  boardEl.addEventListener('mouseover',e=>{
    if(!painting)return;
    const t=e.target.closest('.cell'); if(!t)return;
    paint(+t.dataset.x,+t.dataset.y,paintVal);
  });
  window.addEventListener('mouseup',()=>painting=false);
  boardEl.addEventListener('contextmenu',e=>e.preventDefault());

  // touch
  boardEl.addEventListener('touchstart',e=>{
    const t=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
    if(t&&t.classList.contains('cell')){painting=true;paintVal=1;paint(+t.dataset.x,+t.dataset.y,1);e.preventDefault();}
  },{passive:false});
  boardEl.addEventListener('touchmove',e=>{
    if(!painting)return;
    const t=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
    if(t&&t.classList.contains('cell')){paint(+t.dataset.x,+t.dataset.y,1);e.preventDefault();}
  },{passive:false});
  boardEl.addEventListener('touchend',()=>painting=false);

  document.getElementById('new').onclick=()=>{N=+sizeSel.value;build();};
  document.getElementById('clear').onclick=()=>{for(let y=0;y<N;y++)for(let x=0;x<N;x++)state[y][x]=0;render();};
  sizeSel.onchange=()=>{N=+sizeSel.value;build();};

  build();
})();
</script>
</body>
</html>
