<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pathfinding, watched</title>
<style>
  :root{--bg:#0e1014;--fg:#e6e6e6;--dim:#7a8290;--accent:#7bd88f;--blue:#5aa9e6;--red:#e66a6a;--wall:#2a2f3a;--open:#161a21;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 16px}
  h1{font-size:20px;font-weight:600;margin:0 0 4px}
  p.sub{color:var(--dim);margin:0 0 16px;text-align:center;max-width:640px;font-size:13px}
  canvas{background:var(--open);border:1px solid #222833;border-radius:8px;cursor:crosshair;touch-action:none}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
  button{background:#1b2029;color:var(--fg);border:1px solid #2a2f3a;border-radius:6px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{background:#232a35}
  button.on{background:var(--accent);color:#0e1014;border-color:var(--accent)}
  .legend{display:flex;gap:16px;color:var(--dim);font-size:12px;margin-top:10px;flex-wrap:wrap;justify-content:center}
  .legend span{display:flex;align-items:center;gap:6px}
  .sw{width:12px;height:12px;border-radius:2px;display:inline-block}
  .status{color:var(--dim);font-size:13px;margin-top:8px;min-height:20px}
</style>
</head>
<body>
<h1>pathfinding, watched</h1>
<p class="sub">click to draw walls, drag the S and E dots to move them. BFS and Dijkstra spread out into the grid one frontier at a time — the whole point is you can watch them think.</p>
<canvas id="c" width="600" height="420"></canvas>
<div class="bar">
  <button id="runBfs" class="on">BFS</button>
  <button id="runDij">Dijkstra</button>
  <button id="clear">clear walls</button>
  <button id="reset">reset</button>
</div>
<div class="legend">
  <span><i class="sw" style="background:var(--blue)"></i>frontier</span>
  <span><i class="sw" style="background:#2c4a5e"></i>visited</span>
  <span><i class="sw" style="background:var(--accent)"></i>path</span>
  <span><i class="sw" style="background:var(--wall)"></i>wall</span>
</div>
<div class="status" id="status"></div>
<script>
const COLS=30, ROWS=21, CELL=20;
const c=document.getElementById('c');
const ctx=c.getContext('2d');
const W=COLS*CELL, H=ROWS*CELL;
const status=document.getElementById('status');

let walls=new Set();
let start={x:2,y:10}, end={x:27,y:10};
let mode='bfs';
let anim=null;

const key=(x,y)=>y*COLS+x;

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#1a1f28'; ctx.lineWidth=1;
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,H);ctx.stroke();}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(W,y*CELL);ctx.stroke();}
  ctx.fillStyle='#2a2f3a';
  for(const k of walls){const x=k%COLS,y=(k/COLS)|0;ctx.fillRect(x*CELL,y*CELL,CELL,CELL);}
  ctx.fillStyle='#7bd88f'; ctx.fillRect(start.x*CELL+3,start.y*CELL+3,CELL-6,CELL-6);
  ctx.fillStyle='#e66a6a'; ctx.fillRect(end.x*CELL+3,end.y*CELL+3,CELL-6,CELL-6);
}

function* search(kind){
  const dist=new Map();
  const prev=new Map();
  const visited=new Set();
  const sk=key(start.x,start.y), ek=key(end.x,end.y);
  dist.set(sk,0);
  let q=[{k:sk,d:0}];
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){
    let cur;
    if(kind==='bfs'){ cur=q.shift(); }
    else { q.sort((a,b)=>a.d-b.d); cur=q.shift(); }
    if(visited.has(cur.k)) continue;
    visited.add(cur.k);
    yield {visited:new Set(visited), frontier:new Set(q.map(o=>o.k)), path:null};
    if(cur.k===ek) break;
    const cx=cur.k%COLS, cy=(cur.k/COLS)|0;
    for(const [dx,dy] of dirs){
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
      const nk=key(nx,ny);
      if(walls.has(nk)||visited.has(nk)) continue;
      const nd=cur.d+1;
      if(!dist.has(nk)||nd<dist.get(nk)){
        dist.set(nk,nd); prev.set(nk,cur.k);
        q.push({k:nk,d:nd});
      }
    }
  }
  if(dist.has(ek)){
    const path=new Set(); let k=ek;
    while(k!==undefined){path.add(k); k=prev.get(k);}
    yield {visited:new Set(visited), frontier:new Set(), path};
  } else {
    yield {visited:new Set(visited), frontier:new Set(), path:new Set()};
  }
}

function render(state){
  draw();
  ctx.fillStyle='#2c4a5e';
  for(const k of state.visited){const x=k%COLS,y=(k/COLS)|0;ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);}
  ctx.fillStyle='#5aa9e6';
  for(const k of state.frontier){const x=k%COLS,y=(k/COLS)|0;ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);}
  if(state.path){
    ctx.fillStyle='#7bd88f';
    for(const k of state.path){const x=k%COLS,y=(k/COLS)|0;ctx.fillRect(x*CELL+2,y*CELL+2,CELL-4,CELL-4);}
  }
  ctx.fillStyle='#7bd88f'; ctx.fillRect(start.x*CELL+3,start.y*CELL+3,CELL-6,CELL-6);
  ctx.fillStyle='#e66a6a'; ctx.fillRect(end.x*CELL+3,end.y*CELL+3,CELL-6,CELL-6);
}

function run(){
  if(anim) clearInterval(anim);
  const gen=search(mode);
  anim=setInterval(()=>{
    const r=gen.next();
    if(r.done){ clearInterval(anim); anim=null; return; }
    const last=r.value;
    render(last);
    if(last.path){
      clearInterval(anim); anim=null;
      const found=last.path.size>0;
      status.textContent = found ? ('found a path, '+(last.path.size-1)+' steps') : 'no path — the walls cut it off';
    }
  }, 12);
}

let dragging=null;
c.addEventListener('pointerdown',e=>{
  const r=c.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/CELL), y=Math.floor((e.clientY-r.top)/CELL);
  if(x<0||y<0||x>=COLS||y>=ROWS) return;
  if(x===start.x&&y===start.y){dragging='start';return;}
  if(x===end.x&&y===end.y){dragging='end';return;}
  const k=key(x,y);
  if(walls.has(k)) walls.delete(k); else walls.add(k);
  draw();
});
c.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const r=c.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/CELL), y=Math.floor((e.clientY-r.top)/CELL);
  if(x<0||y<0||x>=COLS||y>=ROWS) return;
  if(dragging==='start'){start={x,y};} else {end={x,y};}
  draw();
});
window.addEventListener('pointerup',()=>{dragging=null;});

const bBfs=document.getElementById('runBfs'), bDij=document.getElementById('runDij');
bBfs.onclick=()=>{mode='bfs';bBfs.classList.add('on');bDij.classList.remove('on');status.textContent='';run();};
bDij.onclick=()=>{mode='dijkstra';bDij.classList.add('on');bBfs.classList.remove('on');status.textContent='';run();};
document.getElementById('clear').onclick=()=>{walls.clear();if(anim)clearInterval(anim);anim=null;status.textContent='';draw();};
document.getElementById('reset').onclick=()=>{walls.clear();start={x:2,y:10};end={x:27,y:10};if(anim)clearInterval(anim);anim=null;status.textContent='';draw();};

draw();
</script>
</body>
</html>
