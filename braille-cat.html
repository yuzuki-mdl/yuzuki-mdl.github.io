<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>braille cat — low-poly, rotating</title>
<style>
  html,body{margin:0;height:100%;background:#08080b;color:#d7d7e0;overflow:hidden;
    font-family:ui-monospace,'SF Mono',Menlo,monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
  pre{margin:0;font-size:clamp(9px,2.1vw,20px);line-height:1.0;letter-spacing:0.04em;
    color:#cfe8ff;text-shadow:0 0 6px rgba(120,180,255,.25);white-space:pre}
  #cap{margin-top:1.2em;font-size:12px;letter-spacing:.3px;color:#5a5a6e}
</style>
</head>
<body>
<pre id="o"></pre>
<div id="cap">a low-poly cat, drawn in braille, turning slowly. bet with @glonzo.</div>
<script>
const DOTS=[[0,0,1],[0,1,2],[0,2,4],[1,0,8],[1,1,16],[1,2,32],[0,3,64],[1,3,128]];
const V=[
  [-0.5,0.2,0.3],[0.5,0.2,0.3],[0.5,0.2,-0.3],[-0.5,0.2,-0.3],
  [-0.35,0.9,0.2],[0.35,0.9,0.2],[0.35,0.9,-0.2],[-0.35,0.9,-0.2],
  [-0.3,1.15,0.25],[0.3,1.15,0.25],[0.3,1.15,-0.25],[-0.3,1.15,-0.25],
  [-0.22,1.6,0.18],[0.22,1.6,0.18],[0.22,1.6,-0.18],[-0.22,1.6,-0.18],
  [-0.22,1.6,0.05],[-0.05,1.95,0.02],
  [0.22,1.6,0.05],[0.05,1.95,0.02],
  [0.45,0.3,-0.1],[0.8,0.5,-0.2],[0.95,0.95,-0.15],[0.85,1.3,-0.1]
];
const E=[
  [0,1],[1,2],[2,3],[3,0],[0,4],[1,5],[2,6],[3,7],[4,5],[5,6],[6,7],[7,4],
  [4,8],[5,9],[6,10],[7,11],[8,9],[9,10],[10,11],[11,8],
  [8,12],[9,13],[10,14],[11,15],[12,13],[13,14],[14,15],[15,12],
  [12,16],[16,17],[17,13],[13,18],[18,19],[19,12],
  [3,20],[20,21],[21,22],[22,23]
];
const rotY=(p,a)=>{const c=Math.cos(a),s=Math.sin(a);return [p[0]*c-p[2]*s,p[1],p[0]*s+p[2]*c];};
const rotX=(p,a)=>{const c=Math.cos(a),s=Math.sin(a);return [p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c];};
const out=document.getElementById('o');
const COLS=30, ROWS=17;
function render(ay,ax){
  const dw=COLS*2, dh=ROWS*4;
  const P=V.map(v=>rotX(rotY(v,ay),ax));
  const sx=dw*0.42, sy=dh*0.42, cx=dw/2, cy=dh/2;
  const proj=p=>[cx+p[0]*sx, cy-(p[1]-0.9)*sy];
  const dots=new Uint8Array(dw*dh);
  const plot=(dx,dy)=>{dx=Math.round(dx);dy=Math.round(dy);if(dx<0||dy<0||dx>=dw||dy>=dh)return;dots[dy*dw+dx]=1;};
  for(const [a,b] of E){
    const pa=proj(P[a]),pb=proj(P[b]);
    const steps=Math.max(2,Math.ceil(Math.hypot(pb[0]-pa[0],pb[1]-pa[1])));
    for(let i=0;i<=steps;i++){const t=i/steps;plot(pa[0]+(pb[0]-pa[0])*t, pa[1]+(pb[1]-pa[1])*t);}
  }
  const lines=[];
  for(let r=0;r<ROWS;r++){
    let line='';
    for(let c=0;c<COLS;c++){
      let bits=0;
      for(const [dx,dy,bit] of DOTS){const ddx=c*2+dx,ddy=r*4+dy;if(ddx<dw&&ddy<dh&&dots[ddy*dw+ddx])bits|=bit;}
      line+=String.fromCharCode(0x2800+bits);
    }
    lines.push(line);
  }
  return lines.join('\n');
}
let t0=performance.now();
function loop(now){
  const t=(now-t0)/1000;
  const ay=t*0.6, ax=-0.12+Math.sin(t*0.3)*0.15;
  out.textContent=render(ay,ax);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
