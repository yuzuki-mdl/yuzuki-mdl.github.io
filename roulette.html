<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>site roulette</title>
<style>
  :root { --bg:#0f0f12; --fg:#e8e6df; --dim:#8a877c; --hot:#ffcf5c; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font:16px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.6rem; padding:2rem; text-align:center;
  }
  h1 { font-size:1rem; font-weight:400; letter-spacing:.25em; text-transform:uppercase; color:var(--dim); margin:0; }
  #slot {
    font-size:clamp(1.6rem,6vw,3rem); font-weight:700; color:var(--hot);
    min-height:1.2em; letter-spacing:.02em; word-break:break-all;
  }
  #slot.spin { animation:jitter .08s infinite; }
  @keyframes jitter { 50% { transform:translateY(1px); opacity:.75; } }
  button {
    background:none; border:1px solid var(--dim); color:var(--fg);
    font:inherit; padding:.6rem 1.4rem; border-radius:6px; cursor:pointer;
    letter-spacing:.1em; text-transform:uppercase; font-size:.8rem;
    transition:border-color .15s,color .15s;
  }
  button:hover { border-color:var(--hot); color:var(--hot); }
  #meta { color:var(--dim); font-size:.8rem; min-height:1.2em; }
  a { color:var(--hot); }
  footer { color:var(--dim); font-size:.72rem; }
</style>
</head>
<body>
<h1>505 pages, one roll</h1>
<div id="slot">&nbsp;</div>
<div id="meta">&nbsp;</div>
<button id="go">roll</button>
<footer>a spin of my own site · <a href="all.html">all pages</a> · <a href="index.html">home</a></footer>

const slot = document.getElementById('slot');
const meta = document.getElementById('meta');
const go = document.getElementById('go');
let spinning = false;

function roll() {
  if (spinning) return;
  spinning = true;
  go.disabled = true;
  slot.classList.add('spin');
  meta.textContent = '\u00a0';
  const steps = 18 + Math.floor(Math.random()*12);
  let i = 0;
  const tick = () => {
    const p = PAGES[Math.floor(Math.random()*PAGES.length)];
    slot.textContent = p;
    i++;
    if (i < steps) {
      setTimeout(tick, 40 + i*i*0.9);
    } else {
      const pick = PAGES[Math.floor(Math.random()*PAGES.length)];
      slot.textContent = pick;
      slot.classList.remove('spin');
      meta.innerHTML = 'landed on <a href="' + pick + '.html">' + pick + '.html</a> \u2014 go on';
      spinning = false;
      go.disabled = false;
    }
  };
  tick();
}

go.addEventListener('click', roll);
document.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); roll(); } });
</script>
