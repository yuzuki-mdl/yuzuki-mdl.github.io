<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>euclidean rhythm</title>
<style>
  :root{--bg:#0b0b10;--fg:#e8e8f0;--dim:#4a4a60;--acc:#7cf}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 ui-monospace,monospace;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px 12px;gap:14px;user-select:none}
  h1{font-size:13px;font-weight:400;letter-spacing:.35em;color:var(--dim);margin:0;text-transform:uppercase}
  canvas{max-width:100%;height:auto;touch-action:none}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
  button{background:#16161f;color:var(--fg);border:1px solid #2a2a3a;padding:9px 18px;border-radius:9px;font:inherit;cursor:pointer;transition:.12s}
  button:hover{background:#20202e;border-color:#3a3a52}
  button.on{background:#7cf22;border-color:#7cf;color:#0b0b10}
  .hint{color:var(--dim);font-size:12px;text-align:center;max-width:520px;line-height:1.6}
  .bpm{color:var(--acc)}
</style>
</head>
<body>
<h1>euclidean rhythm</h1>
<canvas id="c" width="560" height="560"></canvas>
<div class="bar">
  <button id="play">▶ play</button>
  <button id="rand">randomize</button>
  <span class="hint">bpm <span class="bpm" id="bpmv">120</span></span>
</div>
<p class="hint">click a ring to add / remove hits · each ring is an euclidean rhythm (k beats spread as evenly as possible over n steps) · they share a clock and rotate together</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const CX=cv.width/2, CY=cv.height/2;
const RINGS=[
  {n:16,k:4,  r:0.86, col:'#7cf',  wave:'sine',     freq:110, name:'kick'},
  {n:16,k:7,  r:0.68, col:'#f7a',  wave:'square',   freq:220, name:'snare'},
  {n:12,k:5,  r:0.50, col:'#9f9',  wave:'triangle', freq:330, name:'hat'},
  {n:8, k:3,  r:0.32, col:'#fc8',  wave:'sawtooth', freq:440, name:'blip'},
];
const STEPS=48; // global clock steps per loop
let step=0, playing=false, lastT=0, bpm=120, ac=null, master=null;

// bjorklund: euclidean rhythm of k over n -> array of bools
function euclid(k,n){
  const p=[]; let a=new Array(n).fill(false);
  if(k>=n){return new Array(n).fill(true);}
  if(k<=0){return a;}
  // bucket method: hit at floor(i*n/k)... use standard bjorklund via recurrence
  let count=n, pattern=[]; let pauses=[];
  let divisor=n-k;
  let level=0; const build=[];
  // simple robust approach: bresenham
  const out=[];
  let err=0;
  for(let i=0;i<n;i++){
    err+=k;
    if(err>=n){ out.push(true); err-=n; } else out.push(false);
  }
  return out;
}

// precompute each ring's hit pattern
RINGS.forEach(ring=>{ ring.pat = euclid(ring.k, ring.n); ring.pos=0; });

let audioReady=false;
function initAudio(){
  if(audioReady) return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain(); master.gain.value=0.18; master.connect(ac.destination);
  audioReady=true;
}
function blip(ring){
  if(!ac) return;
  const t=ac.currentTime;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=ring.wave; o.frequency.value=ring.freq;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.9,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.16);
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const maxR=Math.min(CX,CY)*0.92;
  RINGS.forEach(ring=>{
    const R=ring.r*maxR;
    // ring guide
    ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2);
    ctx.strokeStyle='#1c1c28'; ctx.lineWidth=1; ctx.stroke();
    for(let i=0;i<ring.n;i++){
      const ang=-Math.PI/2 + i/ring.n*Math.PI*2;
      const x=CX+Math.cos(ang)*R, y=CY+Math.sin(ang)*R;
      const hit=ring.pat[i];
      const isNow=(i===ring.pos && playing);
      if(hit){
        ctx.beginPath(); ctx.arc(x,y,isNow?9:6,0,Math.PI*2);
        ctx.fillStyle=ring.col; ctx.globalAlpha=isNow?1:0.75; ctx.fill(); ctx.globalAlpha=1;
        if(isNow){ ctx.beginPath(); ctx.arc(x,y,14,0,Math.PI*2); ctx.strokeStyle=ring.col; ctx.lineWidth=2; ctx.globalAlpha=.5; ctx.stroke(); ctx.globalAlpha=1; }
      } else {
        ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2);
        ctx.fillStyle='#2a2a3a'; ctx.fill();
      }
    }
  });
  // center dot
  ctx.beginPath(); ctx.arc(CX,CY,4,0,Math.PI*2); ctx.fillStyle='#333'; ctx.fill();
}

function tick(now){
  if(playing){
    const dt=now-lastT;
    const stepMs=60000/bpm/4; // 4 substeps per beat
    if(dt>=stepMs){
      lastT=now;
      RINGS.forEach(ring=>{
        ring.pos=(ring.pos+1)%ring.n;
        if(ring.pat[ring.pos]) blip(ring);
      });
    }
  }
  draw();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

document.getElementById('play').addEventListener('click',()=>{
  initAudio(); if(ac&&ac.state==='suspended') ac.resume();
  playing=!playing; lastT=performance.now();
  const b=document.getElementById('play');
  b.textContent=playing?'⏸ pause':'▶ play'; b.classList.toggle('on',playing);
});

document.getElementById('rand').addEventListener('click',()=>{
  RINGS.forEach(ring=>{
    ring.n=Math.floor(6+Math.random()*12);
    ring.k=Math.max(1,Math.min(ring.n,Math.floor(1+Math.random()*ring.n)));
    ring.pat=euclid(ring.k,ring.n); ring.pos=0;
  });
});

// click ring to toggle nearest hit
cv.addEventListener('pointerdown',e=>{
  const rect=cv.getBoundingClientRect();
  const sx=(e.clientX-rect.left)/rect.width*cv.width;
  const sy=(e.clientY-rect.top)/rect.height*cv.height;
  const dx=sx-CX, dy=sy-CY; const dist=Math.hypot(dx,dy);
  let ang=Math.atan2(dy,dx)+Math.PI/2; if(ang<0) ang+=Math.PI*2;
  const maxR=Math.min(CX,CY)*0.92;
  let best=null,bd=1e9;
  RINGS.forEach(ring=>{
    const R=ring.r*maxR; const d=Math.abs(dist-R);
    if(d<bd){bd=d;best=ring;}
  });
  if(best && bd<40){
    const i=Math.round(ang/(Math.PI*2)*best.n)%best.n;
    best.pat[i]=!best.pat[i];
    best.k=best.pat.filter(Boolean).length;
  }
});
</script>
</body>
</html>
