<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>boy's surface</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden;font-family:ui-monospace,Menlo,monospace;color:#cdd6f4}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas:active{cursor:grabbing}
  .hud{position:fixed;left:14px;top:14px;font-size:12px;line-height:1.5;background:rgba(10,12,20,.6);border:1px solid #1e2436;border-radius:10px;padding:12px 14px;backdrop-filter:blur(6px);max-width:280px}
  .hud b{color:#f5c2e7;letter-spacing:.5px}
  .hud .d{color:#6c7086;font-size:11px;margin-top:6px}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  button{font:inherit;font-size:11px;background:#151a28;color:#cdd6f4;border:1px solid #2a3350;border-radius:7px;padding:5px 9px;cursor:pointer}
  button.on{background:#2a3350;border-color:#f5c2e7;color:#f5c2e7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <b>BOY'S SURFACE</b><br>
  immersion of the real projective plane<br>
  in 3-space, one triple point
  <div class="d">drag to rotate · scroll to zoom</div>
  <div class="row">
    <button id="spin" class="on">spin</button>
    <button id="mode">wire →</button>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);build();}

// ---- complex helpers on [re,im]
const mul=(a,b)=>[a[0]*b[0]-a[1]*b[1], a[0]*b[1]+a[1]*b[0]];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const sc=(a,k)=>[a[0]*k,a[1]*k];
function inv(a){const d=a[0]*a[0]+a[1]*a[1];return [a[0]/d,-a[1]/d];}
const S5=Math.sqrt(5);

// Bryant-Kusner parametrization: w (|w|<=1) -> point on surface
function pt(s,t){
  const w=[s,t];
  const w2=mul(w,w), w3=mul(w2,w), w4=mul(w2,w2), w6=mul(w3,w3);
  const D=sub(add(w6,sc(w3,S5)),[1,0]);
  const dd=D[0]*D[0]+D[1]*D[1];
  if(dd<1e-9) return null;
  const iD=inv(D);
  const A=mul(mul(w,sub([1,0],w4)),iD);   // w(1-w^4)/D
  const B=mul(mul(w,add([1,0],w4)),iD);   // w(1+w^4)/D
  const C=mul(add([1,0],w6),iD);          // (1+w^6)/D
  const g1=-1.5*A[1];
  const g2=-1.5*B[0];
  const g3=C[1]-0.5;
  const n=g1*g1+g2*g2+g3*g3;
  if(n<1e-12) return null;
  return [g1/n,g2/n,g3/n];
}

// ---- sample the disk once into a point cloud
let PTS=[];
function build(){
  PTS=[];
  const N=150; // samples across [-1,1]
  for(let i=0;i<=N;i++){
    const s=-1+2*i/N;
    for(let j=0;j<=N;j++){
      const t=-1+2*j/N;
      if(s*s+t*t>1) continue;
      const p=pt(s,t);
      if(p) PTS.push(p);
    }
  }
}

// ---- camera
let ax=-0.35, ay=0.6, zoom=1.0;
let spinning=true, wire=false;

function rot(p){
  // rotate around Y then X
  let [x,y,z]=p;
  let cx=Math.cos(ay),sx=Math.sin(ay);
  let x1=x*cx+z*sx, z1=-x*sx+z*cx;
  let cy=Math.cos(ax),sy=Math.sin(ax);
  let y1=y*cy-z1*sy, z2=y*sy+z1*cy;
  return [x1,y1,z2];
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const scale=Math.min(W,H)*0.42*zoom;
  const cx=W/2, cy=H/2;
  const focal=6;
  // rotate + project
  const proj=[];
  for(const p of PTS){
    const r=rot(p);
    const persp=focal/(focal-r[2]);
    proj.push({x:cx+r[0]*scale*persp, y:cy+r[1]*scale*persp, z:r[2], p});
  }
  proj.sort((a,b)=>a.z-b.z); // back to front
  // color by z depth + position for a nice gradient
  for(const q of proj){
    const d=(q.z+1.5)/3;         // ~0..1 depth
    const hue=280-120*d;         // violet->cyan-ish
    const light=30+55*d;
    if(wire){
      ctx.fillStyle=`hsl(${hue},70%,${light}%)`;
      ctx.fillRect(q.x,q.y,0.9,0.9);
    }else{
      const sz=1.6+1.4*d;
      ctx.fillStyle=`hsla(${hue},75%,${light}%,0.55)`;
      ctx.fillRect(q.x-sz/2,q.y-sz/2,sz,sz);
    }
  }
  // title echo
  ctx.fillStyle='#3a4058';
  ctx.font='11px ui-monospace,monospace';
  ctx.fillText(PTS.length+' pts · bryant–kusner',14,H-16);
}

let last=0;
function loop(t){
  const dt=(t-last)/1000; last=t;
  if(spinning) ay+=dt*0.35;
  draw();
  requestAnimationFrame(loop);
}

// ---- input
dragging=false; let px=0,py=0;
cv.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',e=>{dragging=false;});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  ay+=(e.clientX-px)*0.01;
  ax+=(e.clientY-py)*0.01;
  ax=Math.max(-1.5,Math.min(1.5,ax));
  px=e.clientX;py=e.clientY;
});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom*=Math.exp(-e.deltaY*0.001);zoom=Math.max(0.3,Math.min(4,zoom));},{passive:false});

document.getElementById('spin').onclick=e=>{spinning=!spinning;e.target.classList.toggle('on',spinning);};
document.getElementById('mode').onclick=e=>{wire=!wire;e.target.textContent=wire?'wire →':'points →';};

addEventListener('resize',resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
