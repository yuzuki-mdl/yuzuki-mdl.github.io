<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>differential line</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0c;overflow:hidden;font-family:ui-monospace,monospace;color:#cfd8e8}
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;left:12px;bottom:12px;font-size:12px;opacity:.7;line-height:1.7}
  #ui b{color:#7ad0ff}
  #ui label{display:inline-block;min-width:88px}
  input[type=range]{width:120px;vertical-align:middle;accent-color:#7ad0ff}
  #ui button{background:#1a1d24;color:#cfd8e8;border:1px solid #333a48;border-radius:6px;padding:3px 9px;font-family:inherit;font-size:12px;cursor:pointer}
  #ui button:hover{border-color:#7ad0ff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <b id="n">0</b> nodes · <button id="reset">reset</button><br>
  <label>repel</label><input id="repel" type="range" min="0" max="2" step="0.05" value="1"><br>
  <label>attract</label><input id="attract" type="range" min="0.02" max="0.5" step="0.01" value="0.18">
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,DPR;

// ---- params ----
const REST=7;        // rest length of edge between neighbors
const MAXLEN=REST*2.6; // split edge when longer than this
const REP_R=15;      // repulsion radius
let REPEL=0.35;      // repulsion strength
let ATTRACT=0.10;    // neighbor spring strength
const DAMP=0.80;
const MAXN=1600;     // hard cap so it never runs away

let nodes=[];

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

function seed(){
  nodes=[];
  const cx=W/2, cy=H/2, r=Math.min(W,H)*0.12;
  const N=90;
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2;
    nodes.push({x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r, vx:0, vy:0});
  }
}

function step(){
  const n=nodes.length;
  // forces
  for(let i=0;i<n;i++){
    const a=nodes[i];
    let fx=0, fy=0;
    // repulsion from nearby nodes (skip immediate neighbors to allow spacing)
    for(let j=0;j<n;j++){
      if(j===i) continue;
      const b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y;
      let d2=dx*dx+dy*dy;
      if(d2>REP_R*REP_R || d2<0.0001) continue;
      const d=Math.sqrt(d2);
      const f=(1-d/REP_R)*REPEL;
      fx+=dx/d*f; fy+=dy/d*f;
    }
    // neighbor springs (prev/next toward REST)
    const prev=nodes[(i-1+n)%n], next=nodes[(i+1)%n];
    for(const nb of [prev,next]){
      let dx=nb.x-a.x, dy=nb.y-a.y;
      const d=Math.hypot(dx,dy)||1;
      const f=(d-REST)*ATTRACT;
      fx+=dx/d*f; fy+=dy/d*f;
    }
    a.vx=(a.vx+fx)*DAMP;
    a.vy=(a.vy+fy)*DAMP;
  }
  for(const a of nodes){
    a.vx=Math.max(-3,Math.min(3,a.vx));
    a.vy=Math.max(-3,Math.min(3,a.vy));
    a.x+=a.vx; a.y+=a.vy;
  }

  // split long edges (respect the cap)
  const out=[];
  for(let i=0;i<n;i++){
    const a=nodes[i], b=nodes[(i+1)%n];
    out.push(a);
    if(out.length<MAXN){
      const d=Math.hypot(a.x-b.x, a.y-b.y);
      if(d>MAXLEN) out.push({x:(a.x+b.x)/2, y:(a.y+b.y)/2, vx:0, vy:0});
    }
  }
  nodes=out;
  document.getElementById('n').textContent=nodes.length;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const n=nodes.length;
  if(n<2) return;
  ctx.lineWidth=1.4;
  ctx.strokeStyle='#7ad0ff';
  ctx.globalAlpha=0.85;
  ctx.beginPath();
  ctx.moveTo(nodes[0].x, nodes[0].y);
  for(let i=1;i<n;i++) ctx.lineTo(nodes[i].x, nodes[i].y);
  ctx.closePath();
  ctx.stroke();
  ctx.globalAlpha=1;
}

let running=true;
function loop(){
  if(running){
    // a few substeps per frame for stability
    for(let s=0;s<2;s++) step();
  }
  draw();
  requestAnimationFrame(loop);
}

addEventListener('resize', ()=>{ resize(); seed(); });
document.getElementById('reset').onclick=seed;
document.getElementById('repel').oninput=e=>REPEL=parseFloat(e.target.value);
document.getElementById('attract').oninput=e=>ATTRACT=parseFloat(e.target.value);

resize(); seed(); loop();
</script>
</body>
</html>
