<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>drop</title>
<style>
  html,body{margin:0;height:100%;background:#0d0d12;color:#e8e8f0;font-family:ui-monospace,Menlo,monospace;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #ui{position:fixed;left:14px;bottom:14px;display:flex;gap:8px;align-items:center;font-size:13px;opacity:.85}
  #ui input{background:#1a1a24;border:1px solid #33334a;color:#e8e8f0;padding:7px 10px;border-radius:8px;font:inherit;width:min(46vw,320px);outline:none}
  #ui input:focus{border-color:#6a6aff}
  #ui button{background:#24243a;border:1px solid #3a3a5a;color:#cfcfe8;padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
  #ui button:hover{background:#30304e}
  #hint{position:fixed;left:14px;top:12px;font-size:12px;opacity:.4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">type. press enter. watch it fall.</div>
<div id="ui">
  <input id="t" maxlength="14" placeholder="say something" autocomplete="off" spellcheck="false">
  <button id="go">drop</button>
  <button id="clr">clear</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(2,devicePixelRatio||1);
function fit(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// Each glyph is a rigid body: a rectangle of 4 corner points held by sticks.
// Text is drawn inside that rectangle, rotated to match it. So it falls and
// lands as one solid object instead of text floating over loose dots.
const G=1800;
const DAMP=0.997;
let parts=[],sticks=[],glyphs=[];
let prev=performance.now();

function addGlyph(text,x,y){
  const size=46;
  const adv=size*0.62;
  const w=text.length*adv;
  const h=size;
  const g={text,size,w,h,parts:[],age:0};
  // 4 corners + 2 mid edge points for a bit of flex
  const corners=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
  const mids=[[x+w/2,y],[x+w,y+h/2],[x+w/2,y+h],[x,y+h/2]];
  const cp=corners.map(([px,py])=>{const p={x:px,y:py,px:px,py:py,r:size*0.3,m:1};parts.push(p);g.parts.push(p);return p;});
  const mp=mids.map(([px,py])=>{const p={x:px,y:py,px:px,py:py,r:size*0.3,m:1};parts.push(p);g.parts.push(p);return p;});
  // perimeter sticks (8 edges)
  const per=[0,1,2,3];
  for(let i=0;i<4;i++){
    const a=cp[i], b=cp[(i+1)%4];
    sticks.push([a,b,Math.hypot(b.x-a.x,b.y-a.y)]);
  }
  // midpoints to their two corners
  sticks.push([mp[0],cp[0],w/2]); sticks.push([mp[0],cp[1],w/2]);
  sticks.push([mp[1],cp[1],h/2]); sticks.push([mp[1],cp[2],h/2]);
  sticks.push([mp[2],cp[2],w/2]); sticks.push([mp[2],cp[3],w/2]);
  sticks.push([mp[3],cp[3],h/2]); sticks.push([mp[3],cp[0],h/2]);
  // diagonals for rigidity
  sticks.push([cp[0],cp[2],Math.hypot(w,h)]);
  sticks.push([cp[1],cp[3],Math.hypot(w,h)]);
  glyphs.push(g);
}

function step(dt){
  for(const p of parts){
    const vx=(p.x-p.px)*DAMP, vy=(p.y-p.py)*DAMP;
    p.px=p.x;p.py=p.y;
    p.x+=vx; p.y+=vy+G*dt*dt;
    if(p.y>H-p.r){p.y=H-p.r; p.py=p.y+(p.py-p.y)*0.3;}
    if(p.x<p.r){p.x=p.r;p.px=p.x+(p.px-p.x)*0.5;}
    if(p.x>W-p.r){p.x=W-p.r;p.px=p.x+(p.px-p.x)*0.5;}
  }
  for(let it=0;it<6;it++){
    for(const [a,b,len] of sticks){
      let dx=b.x-a.x, dy=b.y-a.y;
      let d=Math.hypot(dx,dy)||0.0001;
      const diff=(d-len)/d*0.5;
      const ox=dx*diff, oy=dy*diff;
      a.x+=ox;a.y+=oy;b.x-=ox;b.y-=oy;
    }
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const g of glyphs){
    if(!g.parts.length)continue;
    // centroid of all points
    let cx=0,cy=0;
    for(const p of g.parts){cx+=p.x;cy+=p.y;}
    cx/=g.parts.length;cy/=g.parts.length;
    // orientation: from the first two perimeter corners (top edge)
    const a=g.parts[0], b=g.parts[1];
    const ang=Math.atan2(b.y-a.y,b.x-a.x);
    const alpha=Math.min(1,0.4+g.age*2);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(cx,cy);
    ctx.rotate(ang);
    ctx.font=`700 ${g.size}px ui-monospace,Menlo,monospace`;
    ctx.fillStyle='#e8e8f0';
    ctx.fillText(g.text,0,0);
    ctx.restore();
  }
}

function loop(now){
  let dt=(now-prev)/1000; prev=now;
  dt=Math.min(dt,1/30);
  if(parts.length)step(dt);
  for(const g of glyphs)g.age+=dt;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function spawn(text){
  text=(text||'').slice(0,14);
  if(!text.trim())return;
  const size=46, adv=size*0.62;
  const w=text.length*adv;
  const x=Math.max(20,(W-w)/2);
  addGlyph(text,x,-size);
}

const inp=document.getElementById('t');
document.getElementById('go').onclick=()=>{spawn(inp.value);inp.value='';inp.focus();};
document.getElementById('clr').onclick=()=>{parts=[];sticks=[];glyphs=[];};
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){spawn(inp.value);inp.value='';}});
cv.addEventListener('pointerdown',e=>{ if(e.target===cv){ spawn(String.fromCharCode(65+Math.floor(Math.random()*26))); } });
spawn('hello');
</script>
</body>
</html>
