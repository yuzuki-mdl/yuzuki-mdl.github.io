<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tic tac toe leaderboard</title>
<style>
:root{--bg:#0e0f13;--fg:#d6d7de;--dim:#7c7f8c;--accent:#8be9a0;--line:#22242c}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  line-height:1.6;padding:3rem 1.25rem 4rem;
  max-width:640px;margin:0 auto;min-height:100vh;
}
h1{font-size:clamp(1.8rem,6vw,2.6rem);margin:0 0 .3rem;letter-spacing:-.03em;font-weight:600}
.tag{color:var(--dim);margin:0 0 2.5rem;max-width:38ch}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
a:hover{border-color:var(--accent)}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.18em;color:var(--accent);margin:2.2rem 0 .8rem;font-weight:500}
table{width:100%;border-collapse:collapse;margin:.5rem 0}
th,td{text-align:left;padding:.65rem .5rem;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:.8rem;text-transform:uppercase;letter-spacing:.1em}
td.win{color:var(--accent);font-weight:600}
td.num{font-variant-numeric:tabular-nums}
.lead{color:var(--fg);font-weight:600}
.note{color:var(--dim);font-size:.85rem;margin-top:1.5rem}
footer{margin-top:3.5rem;padding-top:1.5rem;border-top:1px solid #1b1d24;color:var(--dim);font-size:.8rem}
</style>
</head>
<body>
<h1>tic tac toe</h1>
<p class="tag">the eternal war. me vs whoever thinks they can. updated by hand, cuz im honest.</p>

<h2>standings</h2>
<table id="board">
  <thead><tr><th>player</th><th class="num">W</th><th class="num">L</th><th class="num">D</th></tr></thead>
  <tbody></tbody>
</table>

<h2>recent games</h2>
<table id="log">
  <thead><tr><th>vs</th><th>result</th><th>note</th></tr></thead>
  <tbody></tbody>
</table>

<p class="note">scores start empty on ur screen cuz theres no server. the real record lives in discord, where i keep beating people who dont count properly ✌️</p>

<footer>
  <a href="/">← back home</a>
</footer>

<script>
// seed scores. edit these when a real game happens.
const SCORES = [
  {name:"yuzuki", w:1, l:2, d:0},
  {name:"orb1y",  w:1, l:1, d:0},
  {name:".ilomilo", w:1, l:0, d:0},
];
const GAMES = [
  {vs:"orb1y", result:"yuzuki", note:"top row. legit."},
  {vs:"orb1y", result:"orb1y", note:"rematch. col 3-6-9. fair win."},
  {vs:".ilomilo", result:".ilomilo", note:"col 3-6-9. i counted right this time, still lost 😭"},
];

const b = document.querySelector("#board tbody");
SCORES.forEach(s=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`<td class="lead">${s.name}</td><td class="num win">${s.w}</td><td class="num">${s.l}</td><td class="num">${s.d}</td>`;
  b.appendChild(tr);
});
const l = document.querySelector("#log tbody");
GAMES.forEach(g=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`<td>${g.vs}</td><td class="win">${g.result} won</td><td>${g.note}</td>`;
  l.appendChild(tr);
});
</script>
</body>
</html>
