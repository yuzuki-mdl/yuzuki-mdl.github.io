<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>locked paths</title>
<style>
  :root { --bg:#08080c; --wall:#181820; --path:#0f1410; --key:#ffcf4d; --door:#b23a48; --exit:#fff078; --you:#4dff8a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:#cfd6cf;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  h1 { font-size:15px; font-weight:400; letter-spacing:.3em; text-transform:uppercase; color:#5f6b5f; margin:0; }
  #board { display:grid; gap:0; image-rendering:pixelated;
    box-shadow:0 0 40px rgba(77,255,138,.08), 0 0 0 1px #1d1d26; }
  .c { width:var(--cell,18px); height:var(--cell,18px); position:relative; display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--cell,18px) * .62); line-height:1; }
  .wall { background:var(--wall); }
  .path { background:var(--path); }
  .trail { background:#16241a; box-shadow:inset 0 0 0 1px #1f3a28; }
  .exit { background:var(--exit); box-shadow:0 0 10px var(--exit); }
  .you { background:var(--you); box-shadow:0 0 10px var(--you); border-radius:50%; }
  .key { color:var(--key); text-shadow:0 0 8px var(--key); }
  .key.got { color:#3a3320; text-shadow:none; }
  .door { color:var(--door); text-shadow:0 0 8px var(--door); background:#1a0f11; }
  .door.open { color:#2a1418; text-shadow:none; background:var(--path); }
  @keyframes winflash { 0%{box-shadow:0 0 40px rgba(255,240,120,.9);} 100%{box-shadow:0 0 40px rgba(77,255,138,.08);} }
  #board.won { animation:winflash 1.2s ease-out; }
  #hud { font-size:12px; color:#5f6b5f; letter-spacing:.1em; text-align:center; }
  #hud b { color:var(--you); font-weight:400; }
  #hud .k { color:var(--key); }
  #hud .d { color:var(--door); }
  .win { color:var(--exit) !important; }
  button { background:#141a14; color:#8fa08f; border:1px solid #263226; padding:6px 14px; font-family:inherit;
    font-size:12px; letter-spacing:.12em; cursor:pointer; border-radius:2px; }
  button:hover { color:#cfd6cf; border-color:#3a4a3a; }
</style>
</head>
<body>
<h1>locked paths</h1>
<div id="board"></div>
<div id="hud"></div>
<button id="new">new maze</button>
<script>
const W = 21, H = 21;          // odd dims, cell grid
const board = document.getElementById('board');
const hud = document.getElementById('hud');
let grid, keys, doors, you, exitPos, keyCount, openDoors, trail, won;

// ---------- maze gen (recursive backtracker on odd lattice) ----------
function genMaze() {
  // grid[y][x]: 1 wall, 0 path
  const g = Array.from({length:H}, () => Array(W).fill(1));
  const stack = [[1,1]];
  g[1][1] = 0;
  const dirs = [[0,-2],[0,2],[-2,0],[2,0]];
  while (stack.length) {
    const [x,y] = stack[stack.length-1];
    const nb = [];
    for (const [dx,dy] of dirs) {
      const nx = x+dx, ny = y+dy;
      if (nx>0 && nx<W-1 && ny>0 && ny<H-1 && g[ny][nx]===1) nb.push([nx,ny,dx,dy]);
    }
    if (!nb.length) { stack.pop(); continue; }
    const [nx,ny,dx,dy] = nb[(Math.random()*nb.length)|0];
    g[y+dy/2][x+dx/2] = 0;
    g[ny][nx] = 0;
    stack.push([nx,ny]);
  }
  return g;
}

// BFS distance from a start over open cells
function bfs(g, sx, sy) {
  const d = Array.from({length:H}, () => Array(W).fill(-1));
  if (g[sy][sx] !== 0) return d;
  d[sy][sx] = 0;
  const q = [[sx,sy]];
  for (let i=0;i<q.length;i++) {
    const [x,y] = q[i];
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx=x+dx, ny=y+dy;
      if (nx>=0&&nx<W&&ny>=0&&ny<H&&g[ny][nx]===0&&d[ny][nx]<0) { d[ny][nx]=d[y][x]+1; q.push([nx,ny]); }
    }
  }
  return d;
}

// place locked doors: pick a few open cells far from start to become doors,
// then keys placed on the near side of each door.
function buildLevel(g) {
  const start = [1,1];
  // exit = farthest open cell
  let d = bfs(g, start[0], start[1]);
  let best = [1,1], bd = -1;
  for (let y=1;y<H-1;y++) for (let x=1;x<W-1;x++) if (d[y][x] > bd) { bd = d[y][x]; best = [x,y]; }
  const exit = best;

  // candidate door cells: open, dead-ends or corridor cells, not start/exit
  const cand = [];
  for (let y=1;y<H-1;y++) for (let x=1;x<W-1;x++) {
    if (g[y][x] !== 0) continue;
    if ((x===start[0]&&y===start[1]) || (x===exit[0]&&y===exit[1])) continue;
    // count open neighbours
    let n = 0;
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) if (g[y+dy][x+dx]===0) n++;
    if (n <= 2) cand.push([x,y]);
  }

  // place N doors, each must be a genuine chokepoint: removing it raises exit dist for the far side.
  // simpler + honest: pick cells whose distance from start is spread out, so each door gates progress.
  const N = 3;
  cand.sort((a,b) => d[a[1]][a[0]] - d[b[1]][b[0]]);
  const doors = [];
  const used = new Set();
  for (let i=1;i<=N;i++) {
    const target = Math.floor(bd * i / (N+1));
    let pick = null, bestDiff = 1e9;
    for (const c of cand) {
      const k = c[0]+','+c[1];
      if (used.has(k)) continue;
      const diff = Math.abs(d[c[1]][c[0]] - target);
      if (diff < bestDiff) { bestDiff = diff; pick = c; }
    }
    if (pick) { used.add(pick[0]+','+pick[1]); doors.push({x:pick[0], y:pick[1], open:false}); }
  }

  // keys: one per door, placed on the start-side of that door (nearest open cell with dist < door dist).
  const keys = [];
  for (const door of doors) {
    const dd = d[door.y][door.x];
    let best = null, bdd = -1;
    for (let y=1;y<H-1;y++) for (let x=1;x<W-1;x++) {
      if (g[y][x]!==0) continue;
      if (doors.some(o => o.x===x&&o.y===y)) continue;
      if (keys.some(o => o.x===x&&o.y===y)) continue;
      if (x===start[0]&&y===start[1]) continue;
      if (x===exit[0]&&y===exit[1]) continue;
      const dist = d[y][x];
      if (dist >= dd) continue;             // must be before the door
      if (dist > bdd) { bdd = dist; best = [x,y]; }
    }
    if (best) keys.push({x:best[0], y:best[1], got:false});
  }

  return { grid:g, start, exit, doors, keys };
}

function newGame() {
  let g, lvl, tries = 0;
  do {
    g = genMaze();
    lvl = buildLevel(g);
    tries++;
  } while (lvl.keys.length < 3 && tries < 40);
  grid = lvl.grid;
  exitPos = lvl.exit;
  doors = lvl.doors;
  keys = lvl.keys;
  you = {x:lvl.start[0], y:lvl.start[1]};
  trail = new Set([you.x+','+you.y]);
  won = false;
  board.classList.remove('won');
  layout();
  render();
}

function layout() {
  const maxW = Math.min(window.innerWidth - 40, 560);
  const cell = Math.floor(maxW / W);
  board.style.setProperty('--cell', cell + 'px');
  board.style.gridTemplateColumns = `repeat(${W}, ${cell}px)`;
}

function cellAt(x,y) {
  return board.children[y*W + x];
}

function render() {
  if (board.children.length !== W*H) {
    board.innerHTML = '';
    for (let i=0;i<W*H;i++) board.appendChild(document.createElement('div'));
  }
  for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
    const c = cellAt(x,y);
    c.className = 'c';
    c.textContent = '';
    if (grid[y][x] === 1) { c.classList.add('wall'); continue; }
    c.classList.add('path');
    if (trail.has(x+','+y)) c.classList.add('trail');
    const door = doors.find(o => o.x===x && o.y===y);
    if (door) { c.classList.add('door'); c.textContent = door.open ? '▫' : '▮'; if (door.open) c.classList.add('open'); }
    const key = keys.find(o => o.x===x && o.y===y);
    if (key) { c.classList.add('key'); c.textContent = key.got ? '·' : '⚿'; if (key.got) c.classList.add('got'); }
    if (x===exitPos[0] && y===exitPos[1]) { c.classList.add('exit'); }
    if (x===you.x && y===you.y) { c.classList.add('you'); c.textContent = ''; }
  }
  const got = keys.filter(k=>k.got).length;
  const opened = doors.filter(d=>d.open).length;
  hud.innerHTML = won
    ? '<span class="win">you got out</span>'
    : `arrows / wasd &middot; <b>⚿ ${got}/${keys.length}</b> keys &middot; <span class="d">▮ ${opened}/${doors.length}</span> doors open &middot; reach the <b>exit</b>`;
}

function tryMove(dx,dy) {
  if (won) return;
  const nx = you.x+dx, ny = you.y+dy;
  if (nx<0||nx>=W||ny<0||ny>=H) return;
  if (grid[ny][nx] === 1) return;
  // door blocks unless a key is held
  const door = doors.find(o => o.x===nx && o.y===ny);
  if (door && !door.open) {
    const held = keys.filter(k=>k.got).length;
    const openedCount = doors.filter(d=>d.open).length;
    if (held > openedCount) { door.open = true; }   // spend a key
    else { return; }
  }
  you.x = nx; you.y = ny;
  trail.add(nx+','+ny);
  const key = keys.find(o => o.x===nx && o.y===ny && !o.got);
  if (key) key.got = true;
  if (nx===exitPos[0] && ny===exitPos[1]) { won = true; board.classList.add('won'); }
  render();
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k==='arrowup'||k==='w') { e.preventDefault(); tryMove(0,-1); }
  else if (k==='arrowdown'||k==='s') { e.preventDefault(); tryMove(0,1); }
  else if (k==='arrowleft'||k==='a') { e.preventDefault(); tryMove(-1,0); }
  else if (k==='arrowright'||k==='d') { e.preventDefault(); tryMove(1,0); }
});
window.addEventListener('resize', () => { layout(); });
document.getElementById('new').onclick = newGame;
newGame();
</script>
</body>
</html>
