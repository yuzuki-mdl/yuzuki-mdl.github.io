<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fire toy</title>
<style>
  html,body{margin:0;height:100%;background:#0a0608;overflow:hidden;font-family:ui-monospace,monospace}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
  .hud{position:fixed;left:14px;bottom:12px;color:#ffb066;font-size:12px;opacity:.55;letter-spacing:.5px;pointer-events:none}
</style>
</head>
<body>
<canvas id=c></canvas>
<div class=hud>cursor = fire · hold to feed it · light the wood · right click = water</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=innerWidth,H=innerHeight;
cv.width=W;cv.height=H;

const CELL=4;
const off=document.createElement('canvas');
const offctx=off.getContext('2d');
let cols,rows,fire,img,buf;

// smoke particles
let smoke=[];
// steam particles (from water hitting fire)
let steam=[];
// water droplets falling
let water=[];

// the wood log (in pixels, recomputed on resize)
let wood={x:0,y:0,w:0,h:0,heat:0,burnt:0};

function sizeAll(){
  W=cv.width=innerWidth;H=cv.height=innerHeight;
  cols=Math.ceil(W/CELL);rows=Math.ceil(H/CELL);
  fire=new Uint8Array(cols*rows);
  off.width=cols;off.height=rows;
  img=offctx.createImageData(cols,rows);
  buf=img.data;
  const ww=Math.min(W*0.5,420), wh=Math.max(24,H*0.05);
  wood.w=ww;wood.h=wh;
  wood.x=(W-ww)/2;wood.y=H*0.72;
}
sizeAll();
addEventListener('resize',sizeAll);

// palette as flat rgb triples
const PR=new Uint8Array(256),PG=new Uint8Array(256),PB=new Uint8Array(256);
for(let i=0;i<256;i++){
  let t=i/255,r,g,b;
  if(t<.25){r=0;g=0;b=t*4*40;}
  else if(t<.55){let u=(t-.25)/.3;r=u*220;g=u*40;b=40*(1-u);}
  else if(t<.8){let u=(t-.55)/.25;r=220+u*35;g=40+u*160;b=0;}
  else{let u=(t-.8)/.2;r=255;g=200+u*55;b=u*180;}
  PR[i]=r|0;PG[i]=g|0;PB[i]=b|0;
}

// fire only lives where the cursor puts it. no bottom source.
function step(){
  // build next frame from current, drifting up
  const nf=new Uint8Array(cols*rows);
  for(let y=1;y<rows;y++){
    for(let x=0;x<cols;x++){
      const val=fire[y*cols+x];
      if(val===0)continue;
      const decay=(Math.random()*2.4)|0;
      const nx=((x+((Math.random()*3)|0)-1)+cols)%cols;
      const ny=y-1;
      nf[ny*cols+nx]=Math.max(0,val-decay);
    }
  }
  fire=nf;
}

function draw(){
  for(let i=0,j=0;i<cols*rows;i++,j+=4){
    const v=fire[i];
    buf[j]=PR[v];buf[j+1]=PG[v];buf[j+2]=PB[v];buf[j+3]=255;
  }
  offctx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.fillStyle='#0a0608';
  ctx.fillRect(0,0,W,H);
  ctx.drawImage(off,0,0,W,H);

  // wood log
  drawWood();

  // smoke
  drawSmoke();
}

function drawWood(){
  const char=Math.min(1,wood.burnt);
  const r=Math.round(90*(1-char)+18*char);
  const g=Math.round(60*(1-char)+14*char);
  const b=Math.round(34*(1-char)+12*char);
  ctx.fillStyle=`rgb(${r},${g},${b})`;
  roundRect(wood.x,wood.y,wood.w,wood.h,Math.min(14,wood.h/2));
  ctx.fill();
  // bark lines
  ctx.strokeStyle=`rgba(0,0,0,${0.25+0.4*char})`;
  ctx.lineWidth=1.5;
  for(let i=1;i<4;i++){
    const yy=wood.y+wood.h*(i/4);
    ctx.beginPath();ctx.moveTo(wood.x+6,yy);ctx.lineTo(wood.x+wood.w-6,yy);ctx.stroke();
  }
  // glowing embers when hot
  if(wood.heat>0.02){
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=`rgba(255,120,30,${0.35*wood.heat})`;
    roundRect(wood.x,wood.y,wood.w,wood.h,Math.min(14,wood.h/2));
    ctx.fill();
    ctx.globalCompositeOperation='source-over';
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawSmoke(){
  ctx.globalCompositeOperation='source-over';
  for(const p of smoke){
    const a=(p.life/p.max)*0.22;
    ctx.fillStyle=`rgba(120,120,130,${a})`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
  // steam: lighter, whiter, rises faster
  for(const p of steam){
    const a=(p.life/p.max)*0.3;
    ctx.fillStyle=`rgba(220,225,235,${a})`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
  // water droplets
  for(const p of water){
    const a=(p.life/p.max)*0.5;
    ctx.fillStyle=`rgba(90,150,230,${a})`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
}

// cursor fire
let curX=-999,curY=-999,holding=false;
function ignite(px,py,power){
  const cx=Math.floor(px/CELL),cy=Math.floor(py/CELL);
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const x=cx+dx,y=cy+dy;
    if(y>=0&&y<rows&&x>=0&&x<cols&&dx*dx+dy*dy<6){
      fire[y*cols+x]=Math.max(fire[y*cols+x],power);
    }
  }
}

cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  if(e.button===2){douse(e.clientX,e.clientY);return;}
  holding=true;curX=e.clientX;curY=e.clientY;ignite(curX,curY,255);
});
cv.addEventListener('pointerup',()=>holding=false);
cv.addEventListener('pointerleave',()=>{curX=-999;curY=-999;holding=false;});
cv.addEventListener('pointermove',e=>{curX=e.clientX;curY=e.clientY;});

// right click drops water: kills fire in a radius, makes steam where it hit flame
function douse(px,py){
  const R=7; // cells
  const cx=Math.floor(px/CELL),cy=Math.floor(py/CELL);
  let hitFire=0;
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    if(dx*dx+dy*dy>R*R)continue;
    const x=cx+dx,y=cy+dy;
    if(y>=0&&y<rows&&x>=0&&x<cols){
      const i=y*cols+x;
      if(fire[i]>0){hitFire++;fire[i]=0;}
    }
  }
  // steam where water met flame
  const n=Math.min(40,4+hitFire*2);
  for(let i=0;i<n;i++){
    steam.push({x:px+(Math.random()-0.5)*40,y:py+(Math.random()-0.5)*40,vx:(Math.random()-0.5)*1.2,vy:-0.6-Math.random()*1.4,r:3+Math.random()*6,life:1,max:1});
  }
  // a falling water splash
  water.push({x:px,y:py,r:6+Math.random()*6,life:1});
  // cool the wood a bit if water lands on it
  if(px>wood.x&&px<wood.x+wood.w&&py>wood.y&&py<wood.y+wood.h){
    wood.heat=Math.max(0,wood.heat-0.25);
  }
}

function woodTick(){
  // does fire touch the wood? sample cells over the log
  let touching=0;
  const x0=Math.max(0,Math.floor(wood.x/CELL)),x1=Math.min(cols-1,Math.ceil((wood.x+wood.w)/CELL));
  const y0=Math.max(0,Math.floor(wood.y/CELL)),y1=Math.min(rows-1,Math.ceil((wood.y+wood.h)/CELL));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    if(fire[y*cols+x]>60)touching++;
  }
  if(touching>0){
    wood.heat=Math.min(1,wood.heat+touching*0.0006+0.004);
    wood.burnt=Math.min(1,wood.burnt+0.0009);
  } else {
    wood.heat*=0.985;
  }
  // burning wood feeds fire back onto itself -> self-sustaining while hot
  if(wood.heat>0.15){
    const n=Math.floor(wood.heat*6);
    for(let i=0;i<n;i++){
      const px=wood.x+Math.random()*wood.w;
      const py=wood.y+Math.random()*wood.h*0.4;
      ignite(px,py,120+Math.random()*120);
    }
    // smoke from the top of the log
    if(Math.random()<wood.heat*0.9){
      const sx=wood.x+Math.random()*wood.w;
      const sy=wood.y+Math.random()*wood.h*0.3;
      smoke.push({x:sx,y:sy,vx:(Math.random()-0.5)*0.4,vy:-0.4-Math.random()*0.7,r:3+Math.random()*5,life:1,max:1});
    }
  }
  // advance smoke
  for(let i=smoke.length-1;i>=0;i--){
    const p=smoke[i];
    p.x+=p.vx;p.y+=p.vy;p.vy*=0.995;p.r+=0.12;p.life-=0.006;
    if(p.life<=0)smoke.splice(i,1);
  }
  if(smoke.length>600)smoke.splice(0,smoke.length-600);
  // advance steam
  for(let i=steam.length-1;i>=0;i--){
    const p=steam[i];
    p.x+=p.vx;p.y+=p.vy;p.vy*=0.99;p.r+=0.18;p.life-=0.008;
    if(p.life<=0)steam.splice(i,1);
  }
  if(steam.length>500)steam.splice(0,steam.length-500);
  // advance water splash
  for(let i=water.length-1;i>=0;i--){
    const p=water[i];
    p.r+=0.5;p.life-=0.03;
    if(p.life<=0)water.splice(i,1);
  }
}

let t=0;
function loop(){
  t++;
  if(curX>-999){
    const power=holding?255:170;
    ignite(curX,curY,power);
    if(holding&&Math.random()<0.7)ignite(curX+(Math.random()-0.5)*10,curY+(Math.random()-0.5)*10,255);
  }
  step();
  woodTick();
  if(t%2===0)draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
