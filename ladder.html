<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>the crossing ladders</title>
<style>
  :root{--bg:#0d0f12;--fg:#e8e6e1;--dim:#8a8f98;--acc:#e0b34c;--acc2:#6fb3c9;--wall:#3a3f47}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:20px;font-weight:600;letter-spacing:.5px;margin:0 0 6px}
  p.sub{color:var(--dim);font-size:13px;line-height:1.5;margin:0 0 22px}
  canvas{width:100%;height:auto;display:block;border-radius:8px;background:#0a0c0f}
  .ctrls{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;margin:22px 0 8px}
  .row{display:flex;flex-direction:column;gap:4px}
  .row label{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
  .row label b{color:var(--fg);font-weight:600}
  input[type=range]{width:100%;accent-color:var(--acc)}
  .out{font-size:13px;line-height:1.6;margin-top:18px;color:var(--dim);border-top:1px solid #22262c;padding-top:16px}
  .out b{color:var(--acc2);font-weight:600}
  .eq{font-size:13px;color:var(--fg);background:#14171c;padding:12px 14px;border-radius:8px;margin:14px 0;overflow-x:auto;white-space:nowrap}
  a{color:var(--acc2)}
</style>
</head>
<body>
<div class="wrap">
  <h1>the crossing ladders</h1>
  <p class="sub">two ladders lean against opposite walls. lengths a and b. they cross at height h above the floor. what's the distance w between the walls? you get a quartic and no closed form in radicals. slide the ladders and watch w fall out of a bisection.</p>
  <canvas id="c" width="760" height="420"></canvas>
  <div class="ctrls">
    <div class="row"><label>ladder a <b id="la">5.0</b></label><input id="ra" type="range" min="2" max="9" step="0.1" value="5"></div>
    <div class="row"><label>ladder b <b id="lb">4.0</b></label><input id="rb" type="range" min="2" max="9" step="0.1" value="4"></div>
    <div class="row"><label>crossing height h <b id="lh">1.5</b></label><input id="rh" type="range" min="0.3" max="3.5" step="0.05" value="1.5"></div>
  </div>
  <div class="eq" id="eq"></div>
  <div class="out" id="out"></div>
</div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
const ra=document.getElementById('ra'),rb=document.getElementById('rb'),rh=document.getElementById('rh');
const la=document.getElementById('la'),lb=document.getElementById('lb'),lh=document.getElementById('lh');
const eq=document.getElementById('eq'),out=document.getElementById('out');

// given a,b,h find w by bisection on f(w)=1/sqrt(a^2-w^2)+1/sqrt(b^2-w^2)-1/h
function solveW(a,b,h){
  // w must be < min(a,b). at w=0, lhs=1/a+1/b. as w->min, blows up.
  const lo0=0, hi0=Math.min(a,b)-1e-6;
  const f=w=>1/Math.sqrt(a*a-w*w)+1/Math.sqrt(b*b-w*w)-1/h;
  let lo=lo0,hi=hi0;
  if(f(lo)*f(hi)>0) return null; // no solution in range
  for(let i=0;i<80;i++){const m=(lo+hi)/2; if(f(lo)*f(m)<=0) hi=m; else lo=m;}
  return (lo+hi)/2;
}

function draw(){
  const a=+ra.value,b=+rb.value,h=+rh.value;
  la.textContent=a.toFixed(1);lb.textContent=b.toFixed(1);lh.textContent=h.toFixed(2);
  const w=solveW(a,b,h);
  g.clearRect(0,0,c.width,c.height);
  const pad=50, floorY=c.height-50, W=c.width-2*pad;
  // scale so max(a,b) fits height
  const maxH=Math.max(a,b);
  const sc=Math.min(W/ (w||1), (floorY-30)/maxH);
  const wpx=(w||0)*sc;
  const cx=pad+(W-wpx)/2;
  const leftX=cx, rightX=cx+wpx;
  // walls
  g.strokeStyle='#3a3f47';g.lineWidth=6;
  g.beginPath();g.moveTo(leftX,30);g.lineTo(leftX,floorY);g.stroke();
  g.beginPath();g.moveTo(rightX,30);g.lineTo(rightX,floorY);g.stroke();
  // floor
  g.strokeStyle='#2a2e35';g.lineWidth=3;
  g.beginPath();g.moveTo(leftX-20,floorY);g.lineTo(rightX+20,floorY);g.stroke();
  if(!w){ out.innerHTML='no solution for these values — the crossing is too high for the ladders'; eq.textContent=''; return; }
  const ha=Math.sqrt(a*a-w*w), hb=Math.sqrt(b*b-w*w);
  // ladder a: from left floor to right wall top at height ha... actually ladder a length a: base at left floor, top on right wall at height sqrt(a^2-w^2)
  const topAY=floorY-ha*sc, topBY=floorY-hb*sc;
  // ladder a: left floor -> right wall
  g.strokeStyle='#e0b34c';g.lineWidth=3;
  g.beginPath();g.moveTo(leftX,floorY);g.lineTo(rightX,topAY);g.stroke();
  // ladder b: right floor -> left wall
  g.strokeStyle='#6fb3c9';g.lineWidth=3;
  g.beginPath();g.moveTo(rightX,floorY);g.lineTo(leftX,topBY);g.stroke();
  // crossing point: where the two lines cross. x from left, y from floor
  // line a: y = (floorY - topAY)*(x-leftX)/wpx ... in px. solve intersection
  // param in px: line a from (leftX,floorY) to (rightX,topAY). line b from (rightX,floorY) to (leftX,topBY)
  // crossing x fraction t where heights equal
  // height of a at fraction t: floorY - t*ha*sc (t from 0 at left to 1 at right)
  // height of b at fraction t: floorY - (1-t)*hb*sc (t=0 left is top of b at topBY, t=1 right floor)
  // set equal: t*ha = (1-t)*hb -> t=hb/(ha+hb)
  const t=hb/(ha+hb);
  const crossX=leftX+t*wpx;
  const crossY=floorY-h*sc;
  g.fillStyle='#fff';g.beginPath();g.arc(crossX,crossY,4,0,7);g.fill();
  // dashed height line
  g.strokeStyle='#5a6068';g.lineWidth=1;g.setLineDash([4,4]);
  g.beginPath();g.moveTo(crossX,crossY);g.lineTo(crossX,floorY);g.stroke();g.setLineDash([]);
  // labels
  g.fillStyle='#8a8f98';g.font='12px ui-monospace,monospace';
  g.fillText('h='+h.toFixed(2),crossX+6,crossY-6);
  g.fillText('a='+a.toFixed(1),leftX+4,floorY-6);
  g.fillText('b='+b.toFixed(1),rightX-40,floorY-6);
  g.fillStyle='#e0b34c';g.fillText('a',leftX+6,floorY-22);
  g.fillStyle='#6fb3c9';g.fillText('b',rightX-16,floorY-22);
  // w label
  g.fillStyle='#e8e6e1';g.font='13px ui-monospace,monospace';
  g.fillText('w = '+w.toFixed(4),leftX+wpx/2-28,floorY+26);
  eq.textContent='1/h = 1/sqrt(a^2 - w^2) + 1/sqrt(b^2 - w^2)';
  out.innerHTML='for a=<b>'+a.toFixed(1)+'</b>, b=<b>'+b.toFixed(1)+'</b>, h=<b>'+h.toFixed(2)+'</b>: w = <b>'+w.toFixed(6)+'</b><br>ladder a tops out at '+(ha).toFixed(3)+', ladder b at '+(hb).toFixed(3)+'. the quartic in w has no closed form in radicals — the number is real, just not writable that way.';
}

[ra,rb,rh].forEach(r=>r.addEventListener('input',draw));
draw();
</script>
</body>
</html>
