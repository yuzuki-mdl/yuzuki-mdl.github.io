<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>langton's ant</title>
<style>
  :root { --bg:#0b0e14; --fg:#d8dee9; --dim:#5a6478; --acc:#7cc4ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; overflow:hidden; }
  canvas { display:block; touch-action:none; }
  #hud { position:fixed; top:10px; left:12px; font-size:12px; line-height:1.6;
    color:var(--dim); pointer-events:none; text-shadow:0 1px 2px #000; }
  #hud b { color:var(--fg); font-weight:600; }
  #panel { position:fixed; bottom:10px; left:12px; right:12px; display:flex;
    flex-wrap:wrap; gap:8px; align-items:center; font-size:12px; }
  #panel input[type=text] { width:110px; background:#151a24; color:var(--fg);
    border:1px solid #2a3242; border-radius:6px; padding:5px 7px; font:inherit; }
  #panel button { background:#151a24; color:var(--fg); border:1px solid #2a3242;
    border-radius:6px; padding:5px 10px; font:inherit; cursor:pointer; }
  #panel button:hover { border-color:var(--acc); color:var(--acc); }
  #panel .lab { color:var(--dim); }
  @media (max-width:520px){ #panel { font-size:11px; } #panel input[type=text]{ width:80px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><b>langton's ant</b></div>
  <div>steps <b id="steps">0</b> · ants <b id="ants">1</b></div>
</div>
<div id="panel">
  <span class="lab">rule</span>
  <input id="rule" type="text" value="RL" spellcheck="false">
  <span class="lab">ants</span>
  <input id="nant" type="text" value="1" inputmode="numeric" style="width:44px">
  <button id="reset">reset</button>
  <button id="pause">pause</button>
  <button id="slow">slow</button>
</div>
<script>
(() => {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const stepsEl = document.getElementById('steps');
  const antsEl = document.getElementById('ants');
  const ruleEl = document.getElementById('rule');
  const nantEl = document.getElementById('nant');

  let W = 0, H = 0, dpr = 1;
  let cell = 4, cols = 0, rows = 0;
  let grid = null;        // Uint8Array of cell states
  let ants = [];
  let steps = 0;
  let rule = ['R','L'];
  let paused = false;
  let speed = 400;        // steps per frame-ish budget
  let img = null, imgData = null;

  const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // up right down left

  function parseRule(s) {
    const seq = s.toUpperCase().replace(/[^RLN]/g,'').split('');
    return seq.length ? seq : ['R','L'];
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = Math.floor(W * dpr); c.height = Math.floor(H * dpr);
    c.style.width = W + 'px'; c.style.height = H + 'px';
    cell = W < 560 ? 4 : 5;
    cols = Math.ceil(W / cell); rows = Math.ceil(H / cell);
    img = ctx.createImageData(cols, rows);
    imgData = img.data;
    initGrid();
  }

  function initGrid() {
    grid = new Uint8Array(cols * rows);
    steps = 0;
    rule = parseRule(ruleEl.value);
    const n = Math.max(1, Math.min(200, parseInt(nantEl.value) || 1));
    ants = [];
    for (let i = 0; i < n; i++) {
      ants.push({
        x: (cols/2 + (Math.random()-0.5)*cols*0.3) | 0,
        y: (rows/2 + (Math.random()-0.5)*rows*0.3) | 0,
        d: (Math.random()*4) | 0
      });
    }
    antsEl.textContent = n;
    stepsEl.textContent = '0';
    paintAll();
  }

  function step() {
    const nStates = rule.length;
    for (const a of ants) {
      let x = a.x, y = a.y;
      if (x < 0) x = cols-1; else if (x >= cols) x = 0;
      if (y < 0) y = rows-1; else if (y >= rows) y = 0;
      const idx = y * cols + x;
      const st = grid[idx] % nStates;
      const turn = rule[st];
      if (turn === 'R') a.d = (a.d + 1) & 3;
      else if (turn === 'L') a.d = (a.d + 3) & 3;
      // 'N' = no turn
      grid[idx] = (st + 1) % nStates;
      const [dx,dy] = DIRS[a.d];
      a.x = x + dx; a.y = y + dy;
    }
    steps++;
  }

  // color per state
  function stateColor(s, out) {
    if (s === 0) { out[0]=13; out[1]=16; out[2]=22; }
    else if (s === 1) { out[0]=124; out[1]=196; out[2]=255; }
    else if (s === 2) { out[0]=255; out[1]=138; out[2]=180; }
    else if (s === 3) { out[0]=180; out[1]=255; out[2]=160; }
    else { const h = (s*57)%360; const [r,g,b]=hsl(h,70,60); out[0]=r; out[1]=g; out[2]=b; }
  }
  function hsl(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12; const a=s*Math.min(l,1-l);
    const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
    return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)]; }

  const tmp = [0,0,0];
  function paintAll() {
    for (let i = 0; i < cols*rows; i++) {
      stateColor(grid[i], tmp);
      const p = i*4;
      imgData[p]=tmp[0]; imgData[p+1]=tmp[1]; imgData[p+2]=tmp[2]; imgData[p+3]=255;
    }
    ctx.putImageData(img, 0, 0);
    // ant dots
    ctx.fillStyle = '#fff';
    for (const a of ants) {
      let x = a.x, y = a.y;
      if (x<0) x=cols-1; else if (x>=cols) x=0;
      if (y<0) y=rows-1; else if (y>=rows) y=0;
      ctx.fillRect(x*cell, y*cell, cell, cell);
    }
  }

  // incremental repaint of only touched cells
  let touched = [];
  function paintDirty() {
    for (const idx of touched) {
      stateColor(grid[idx], tmp);
      const p = idx*4;
      imgData[p]=tmp[0]; imgData[p+1]=tmp[1]; imgData[p+2]=tmp[2]; imgData[p+3]=255;
    }
    touched.length = 0;
    ctx.putImageData(img, 0, 0);
    ctx.fillStyle = '#fff';
    for (const a of ants) {
      let x = a.x, y = a.y;
      if (x<0) x=cols-1; else if (x>=cols) x=0;
      if (y<0) y=rows-1; else if (y>=rows) y=0;
      ctx.fillRect(x*cell, y*cell, cell, cell);
    }
  }

  function stepTracked() {
    const nStates = rule.length;
    for (const a of ants) {
      let x = a.x, y = a.y;
      if (x < 0) x = cols-1; else if (x >= cols) x = 0;
      if (y < 0) y = rows-1; else if (y >= rows) y = 0;
      const idx = y * cols + x;
      const st = grid[idx] % nStates;
      const turn = rule[st];
      if (turn === 'R') a.d = (a.d + 1) & 3;
      else if (turn === 'L') a.d = (a.d + 3) & 3;
      grid[idx] = (st + 1) % nStates;
      touched.push(idx);
      const [dx,dy] = DIRS[a.d];
      a.x = x + dx; a.y = y + dy;
    }
    steps++;
  }

  let acc = 0;
  function frame() {
    if (!paused) {
      const budget = speed;
      for (let i = 0; i < budget; i++) stepTracked();
      paintDirty();
      stepsEl.textContent = steps.toLocaleString();
    }
    requestAnimationFrame(frame);
  }

  document.getElementById('reset').onclick = () => { initGrid(); };
  document.getElementById('pause').onclick = (e) => {
    paused = !paused; e.target.textContent = paused ? 'play' : 'pause';
  };
  document.getElementById('slow').onclick = (e) => {
    speed = speed === 400 ? 30 : (speed === 30 ? 2000 : 400);
    e.target.textContent = 'speed ' + speed;
  };
  ruleEl.onchange = () => { rule = parseRule(ruleEl.value); initGrid(); };
  nantEl.onchange = () => { initGrid(); };

  window.addEventListener('resize', resize);
  resize();
  speed = 400;
  document.getElementById('slow').textContent = 'speed 400';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
