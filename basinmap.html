<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>basin map</title>
<style>
  :root{--bg:#0c0a14;--fg:#e8e4f0;--dim:#8b84a3;--accent:#c8a2ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #wrap{display:flex;flex-direction:column;height:100%}
  header{padding:14px 18px 4px}
  h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.02em}
  p{margin:4px 0 0;font-size:12px;color:var(--dim);max-width:62ch;line-height:1.5}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  canvas{display:block;image-rendering:pixelated;max-width:100%;max-height:100%}
  .bar{display:flex;gap:14px;align-items:center;padding:8px 18px 14px;font-size:12px;color:var(--dim);flex-wrap:wrap}
  button{background:#1a1626;color:var(--fg);border:1px solid #2e2740;border-radius:7px;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default}
  label{display:flex;gap:6px;align-items:center}
  input[type=range]{width:90px;accent-color:var(--accent)}
  .key{display:flex;gap:12px;align-items:center}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
  #log{font-size:11px;color:var(--dim);padding:0 18px 14px;white-space:pre-wrap;line-height:1.5;max-height:20vh;overflow:auto}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>basin map</h1>
    <p>same pendulum as <a href="magpend.html" style="color:var(--accent)">magpend</a>, but every start point is released from rest and colored by which magnet catches it. coarse grid first, then only the cells whose neighbours disagree get refined. the walls are where the work is.</p>
  </header>
  <div id="stage"><canvas id="c"></canvas></div>
  <div class="bar">
    <button id="run">build map</button>
    <button id="zoom">zoom in</button>
    <button id="out">zoom out</button>
    <label>steps <input id="steps" type="range" min="2000" max="20000" step="1000" value="6000"></label>
    <span id="info"></span>
    <span class="key">
      <span><span class="sw" style="background:#ff6b8a"></span>red</span>
      <span><span class="sw" style="background:#5ad1ff"></span>blue</span>
      <span><span class="sw" style="background:#b6ff6b"></span>green</span>
      <span><span class="sw" style="background:#3a3550"></span>unsettled</span>
    </span>
  </div>
  <div id="log"></div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');

// --- physics: identical to magpend.html ---
const magnets=[{x:-1,y:-0.55,c:'#ff6b8a',rgb:[255,107,138]},{x:1,y:-0.55,c:'#5ad1ff',rgb:[90,209,255]},{x:0,y:1,c:'#b6ff6b',rgb:[182,255,107]}];
const G=1.0, damp=0.05, DT=0.016;
const UNSETTLED=[58,53,80];

// returns 0/1/2 = magnet index, -1 = unsettled
function settle(x,y,steps){
  let vx=0,vy=0;
  for(let i=0;i<steps;i++){
    let ax=0,ay=0;
    for(const m of magnets){
      const dx=m.x-x, dy=m.y-y;
      const d2=dx*dx+dy*dy+0.02;
      const d=Math.sqrt(d2);
      const f=G/d2;
      ax+=f*dx/d; ay+=f*dy/d;
    }
    ay+=0.15;
    vx+=ax*DT; vy+=ay*DT;
    vx*=(1-damp*DT*8); vy*=(1-damp*DT*8);
    x+=vx*DT; y+=vy*DT;
    const sp=Math.hypot(vx,vy);
    if(sp<0.02){
      for(let k=0;k<magnets.length;k++){
        if(Math.hypot(magnets[k].x-x,magnets[k].y-y)<0.12) return k;
      }
    }
    // out of world: unsettled
    if(Math.abs(x)>3||Math.abs(y)>3) return -1;
  }
  return -1;
}

// --- map state ---
let N=160;                 // base grid resolution
let view={x0:-1.6,y0:-1.3,w:3.2,h:2.6}; // world rect shown
let grid=null;             // N x N of {v, depth}
let img=null, imgCtx=null;
let running=false;
let steps=6000;

function makeGrid(n){grid=new Int8Array(n*n).fill(-2);return n;}

function neighborDisagree(g,n,i,j){
  const v=g[j*n+i];
  const nb=[[i-1,j],[i+1,j],[i,j-1],[i,j+1]];
  for(const [a,b] of nb){
    if(a<0||b<0||a>=n||b>=n) continue;
    const w=g[b*n+a];
    if(w!==-2 && w!==v) return true;
  }
  return false;
}

function draw(){
  const n=Math.sqrt(grid.length);
  if(!img||img.width!==n){img=document.createElement('canvas');img.width=n;img.height=n;imgCtx=img.getContext('2d');}
  const id=imgCtx.createImageData(n,n);
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){
    const v=grid[j*n+i];
    const p=(j*n+i)*4;
    let rgb;
    if(v>=0) rgb=magnets[v].rgb;
    else if(v===-1) rgb=UNSETTLED;
    else rgb=[20,16,32];
    id.data[p]=rgb[0];id.data[p+1]=rgb[1];id.data[p+2]=rgb[2];id.data[p+3]=255;
  }
  imgCtx.putImageData(id,0,0);
  c.width=n;c.height=n;
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,n,n);
  ctx.drawImage(img,0,0);
}

function logLine(s){const el=document.getElementById('log');el.textContent+=s+'\n';el.scrollTop=el.scrollHeight;}

async function build(){
  if(running)return;
  running=true;document.getElementById('run').disabled=true;
  document.getElementById('log').textContent='';
  const t0=performance.now();
  const n=makeGrid(N);
  // pass 1: coarse
  for(let j=0;j<n;j++){
    for(let i=0;i<n;i++){
      const x=view.x0+(i+0.5)/n*view.w;
      const y=view.y0+(j+0.5)/n*view.h;
      grid[j*n+i]=settle(x,y,steps);
    }
    if(j%16===0){draw();await new Promise(r=>setTimeout(r,0));}
  }
  draw();
  const t1=performance.now();
  logLine('coarse '+n+'x'+n+' in '+((t1-t0)/1000).toFixed(2)+'s');

  // pass 2: refine disagreeing cells (2x2 supersample per cell, 2 rounds)
  let refined=0;
  for(let round=0;round<2;round++){
    const next=new Int8Array(grid);
    for(let j=0;j<n;j++)for(let i=0;i<n;i++){
      if(!neighborDisagree(grid,n,i,j)) continue;
      // supersample 3x3 within this cell, majority vote
      const votes=[0,0,0,0];
      for(let sj=0;sj<3;sj++)for(let si=0;si<3;si++){
        const fx=(i+(si+0.5)/3)/n, fy=(j+(sj+0.5)/3)/n;
        const x=view.x0+fx*view.w, y=view.y0+fy*view.h;
        const v=settle(x,y,steps);
        votes[v+1]++;
        refined++;
      }
      let best=-2,bc=-1;
      for(let k=0;k<4;k++) if(votes[k]>bc){bc=votes[k];best=k-1;}
      next[j*n+i]=best;
    }
    grid=next;draw();
    await new Promise(r=>setTimeout(r,0));
    logLine('refine round '+(round+1)+' done, '+refined+' samples, '+((performance.now()-t0)/1000).toFixed(2)+'s');
  }

  const t2=performance.now();
  logLine('total '+((t2-t0)/1000).toFixed(2)+'s, '+refined+' extra samples');
  running=false;document.getElementById('run').disabled=false;
}

// --- separation vs step size check (skein's ask) ---
function sepTest(){
  logLine('');
  logLine('separation vs step size (ghost pair, nudge 0.004):');
  const x0=-0.05,y0=-0.9,vx0=0.9,vy0=0.3;
  for(const st of [2000,6000,14000]){
    // integrate both with same small dt but count steps; record final magnet
    const a=settle(x0,y0,st), b=settle(x0+0.004,y0+0.004,st);
    logLine('  steps='+st+' -> magnet '+a+' / '+b+(a!==b?'  SPLIT':''));
  }
}

function zoomIn(){
  const cx=view.x0+view.w/2, cy=view.y0+view.h/2;
  view.w*=0.5;view.h*=0.5;view.x0=cx-view.w/2;view.y0=cy-view.h/2;
  document.getElementById('info').textContent='view '+view.w.toFixed(3)+' wide';
  build();
}
function zoomOut(){
  const cx=view.x0+view.w/2, cy=view.y0+view.h/2;
  view.w*=2;view.h*=2;view.x0=cx-view.w/2;view.y0=cy-view.h/2;
  document.getElementById('info').textContent='view '+view.w.toFixed(3)+' wide';
  build();
}

document.getElementById('run').onclick=()=>{build();};
document.getElementById('zoom').onclick=zoomIn;
document.getElementById('out').onclick=zoomOut;
document.getElementById('steps').oninput=e=>{steps=parseInt(e.target.value);document.getElementById('info').textContent=steps+' steps';};

view={x0:-1.6,y0:-1.3,w:3.2,h:2.6};
makeGrid(N);
draw();
setTimeout(()=>{build().then(sepTest);},100);
</script>
</body>
</html>
