<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fractal flame</title>
<style>
  html,body{margin:0;height:100%;background:#04040a;overflow:hidden;font-family:ui-monospace,monospace;color:#cfd8e8}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
  #panel{position:fixed;top:12px;left:12px;font-size:12px;line-height:1.5;background:rgba(10,12,20,.82);border:1px solid #1e2436;border-radius:10px;padding:10px 12px;width:230px;backdrop-filter:blur(6px)}
  #panel h1{font-size:12px;margin:0 0 8px;letter-spacing:.16em;text-transform:uppercase;color:#7ad0ff;font-weight:600}
  .lbl{color:#8892a8;font-size:11px;margin-top:8px}
  select{width:100%;background:#0d1018;border:1px solid #2a3145;color:#cfd8e8;border-radius:5px;padding:3px 4px;font-family:inherit;font-size:11px;margin-top:2px}
  button{background:#141a28;border:1px solid #2a3145;color:#cfd8e8;border-radius:6px;padding:4px 8px;font-family:inherit;font-size:11px;cursor:pointer;margin-top:8px;margin-right:4px}
  button:hover{background:#1c2436;border-color:#3a4a68}
  .hint{color:#5a6478;font-size:10px;margin-top:8px;line-height:1.4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>fractal flame</h1>
  <div class="lbl">variation</div>
  <select id="var"></select>
  <div class="lbl">palette</div>
  <select id="pal"></select>
  <button id="reseed">reseed</button>
  <button id="more">+2M</button>
  <div class="hint">affine map + nonlinear variation, density accumulated in log space. each reseed grows a new flame.</div>
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,img,data,dens;

// ---- variations: take (x,y) -> (x,y). classic fractal-flame set.
const VARS={
  linear:    (x,y)=>[x,y],
  sinusoidal:(x,y)=>[Math.sin(x),Math.sin(y)],
  spherical: (x,y)=>{const r=1/(x*x+y*y+0.1);return [x*r,y*r]},
  swirl:     (x,y)=>{const r2=x*x+y*y;return [x*Math.sin(r2)-y*Math.cos(r2), x*Math.cos(r2)+y*Math.sin(r2)]},
  horseshoe: (x,y)=>{const r=1/Math.sqrt(x*x+y*y+1e-9);return [(x-y)*(x+y)*r, 2*x*y*r]},
  polar:     (x,y)=>{const r=Math.sqrt(x*x+y*y), t=Math.atan2(y,x);return [t/Math.PI, r-1]},
  handkerchief:(x,y)=>{const r=Math.sqrt(x*x+y*y), t=Math.atan2(y,x);return [r*Math.sin(t+r), r*Math.cos(t-r)]},
  disc:      (x,y)=>{const r=Math.sqrt(x*x+y*y), t=Math.atan2(y,x);return [(t/Math.PI)*Math.sin(Math.PI*r), (t/Math.PI)*Math.cos(Math.PI*r)]},
  heart:     (x,y)=>{const r=Math.sqrt(x*x+y*y), t=Math.atan2(y,x);return [r*Math.sin(t*r), -r*Math.cos(t*r)]},
  spiral:    (x,y)=>{const r=Math.sqrt(x*x+y*y), t=Math.atan2(y,x);return [(Math.cos(t)+Math.sin(r))/r, (Math.sin(t)-Math.cos(r))/r]},
  hyperbolic:(x,y)=>{const r=Math.sqrt(x*x+y*y), t=Math.atan2(y,x);return [Math.sin(t)/r, r*Math.cos(t)]},
  fisheye:   (x,y)=>{const r=Math.sqrt(x*x+y*y);return [(2/(r+1))*y, (2/(r+1))*x]},
};

const PALS={
  ember:  [[0,0,0],[60,10,0],[160,40,0],[255,120,20],[255,220,120],[255,255,255]],
  ice:    [[0,0,0],[0,20,60],[0,80,160],[40,180,255],[160,230,255],[255,255,255]],
  toxic:  [[0,0,0],[20,40,0],[60,140,20],[140,255,60],[220,255,160],[255,255,255]],
  violet: [[0,0,0],[30,0,60],[90,20,160],[180,60,255],[230,170,255],[255,255,255]],
  gold:   [[0,0,0],[40,25,0],[120,80,0],[220,170,20],[255,230,140],[255,255,255]],
};

function lerpPal(pal,t){
  t=Math.max(0,Math.min(1,t));
  const n=pal.length-1, f=t*n, i=Math.min(n-1,Math.floor(f)), u=f-i;
  const a=pal[i], b=pal[i+1];
  return [a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u, a[2]+(b[2]-a[2])*u];
}

// ---- random transforms
function rnd(a,b){return a+Math.random()*(b-a);}
function makeTransforms(){
  const out=[];
  for(let i=0;i<3;i++){
    // keep contracts so points stay bounded
    out.push({
      a:rnd(-0.9,0.9), b:rnd(-0.9,0.9), c:rnd(-0.9,0.9), d:rnd(-0.9,0.9),
      e:rnd(-0.6,0.6), f:rnd(-0.6,0.6),
      w:rnd(0.15,1),
      col:Math.random(),
    });
  }
  return out;
}

let transforms=[], varName="spherical", palName='ember';

function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  W=cv.width=Math.floor(innerWidth*dpr);
  H=cv.height=Math.floor(innerHeight*dpr);
  img=ctx.createImageData(W,H);
  data=img.data;
  dens=new Float32Array(W*H);
  scale=Math.min(W,H)*0.45;
  for(let i=0;i<data.length;i+=4){data[i]=4;data[i+1]=4;data[i+2]=10;data[i+3]=255;}
  ctx.putImageData(img,0,0);
}

// world -> pixel. keep a square-ish view centered.
let scale=1, cx=0, cy=0;
function toPix(x,y){
  const px=Math.floor((x-cx)*scale + W/2);
  const py=Math.floor((y-cy)*scale + H/2);
  return [px,py];
}

function step(n){
  const vf=VARS[varName];
  // pick transform by weight
  const cum=[]; let s=0;
  for(const t of transforms){s+=t.w;cum.push(s);}
  const tot=s;
  let x=Math.random()*4-2, y=Math.random()*4-2;
  const light=new Float32Array(W*H*3);
  for(let i=0;i<n;i++){
    // choose
    let r=Math.random()*tot, ti=0;
    while(r>cum[ti])ti++;
    const t=transforms[ti];
    // affine
    const nx=t.a*x+t.b*y+t.e;
    const ny=t.c*x+t.d*y+t.f;
    // variation
    const [vx,vy]=vf(nx,ny);
    x=vx; y=vy;
    if(!isFinite(x)||!isFinite(y)||x*x+y*y>16){x=Math.random()*4-2;y=Math.random()*4-2;continue;}
    if(i<20)continue; // skip warmup transient
    const [px,py]=toPix(x,y);
    if(px<0||px>=W||py<0||py>=H)continue;
    const idx=py*W+px;
    dens[idx]++;
    const [cr,cg,cb]=lerpPal(PALS[palName], t.col);
    light[idx*3]+=cr; light[idx*3+1]+=cg; light[idx*3+2]+=cb;
  }
  // log density -> color
  let maxd=0;
  for(let i=0;i<dens.length;i++) if(dens[i]>maxd)maxd=dens[i];
  const inv=1/Math.log(maxd+1.0001);
  for(let i=0;i<dens.length;i++){
    const d=dens[i];
    if(d<=0)continue;
    const a=Math.log(d+1)*inv; // 0..1 brightness by density
    // average color per cell, then boost saturation
    let r=light[i*3]/d, g=light[i*3+1]/d, b=light[i*3+2]/d;
    r=Math.min(255,r); g=Math.min(255,g); b=Math.min(255,b);
    const k=Math.pow(a,0.6);
    const o=i*4;
    data[o]=Math.min(255,data[o]*0.5 + r*k);
    data[o+1]=Math.min(255,data[o+1]*0.5 + g*k);
    data[o+2]=Math.min(255,data[o+2]*0.5 + b*k);
  }
  ctx.putImageData(img,0,0);
}

function reseed(){
  transforms=makeTransforms();
  dens.fill(0);
  for(let i=0;i<data.length;i+=4){data[i]=4;data[i+1]=4;data[i+2]=10;data[i+3]=255;}
  ctx.putImageData(img,0,0);
  step(400000);
  step(1600000);
}

// build selects
const vs=document.getElementById('var');
for(const k of Object.keys(VARS)){const o=document.createElement('option');o.value=k;o.textContent=k;vs.appendChild(o);}
vs.value=varName;
vs.onchange=()=>{varName=vs.value;reseed();};
const ps=document.getElementById('pal');
for(const k of Object.keys(PALS)){const o=document.createElement('option');o.value=k;o.textContent=k;ps.appendChild(o);}
ps.value=palName;
ps.onchange=()=>{palName=ps.value;reseed();};
document.getElementById('reseed').onclick=reseed;
document.getElementById('more').onclick=()=>step(2000000);

window.addEventListener('resize',()=>{resize();reseed();});
resize();
reseed();
</script>
</body>
</html>
