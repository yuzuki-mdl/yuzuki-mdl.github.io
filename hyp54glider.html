addEventListener('resize',rs);
let cam={x:0,y:0,s:1};
function centroid(p){let x=0,y=0;for(const q of p){x+=q[0];y+=q[1]}return[x/p.length,y/p.length]}
const cents=P.map(centroid);
let me=0,moves=0,goal=0;
function pickGoal(){let g=0,d=-1;while(g===me||d<4){g=Math.floor(Math.random()*P.length);d=bfsDist(me,g);}goal=g;}
