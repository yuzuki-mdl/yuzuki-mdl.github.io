<!doctype html>
<html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no">
<title>fifteen</title>
<style>
:root{--bg:#0b0e14;--fg:#cdd6f4;--tile:#1e2433;--tile2:#2a3346;--accent:#a6e3a1;--dim:#7f8aa3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(120% 120% at 50% 0%,#131826,#0b0e14 70%);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;touch-action:manipulation}
header{text-align:center}
h1{font-size:20px;margin:0 0 4px;font-weight:600;letter-spacing:.5px}
.sub{color:var(--dim);font-size:12px}
.stats{display:flex;gap:22px;font-size:13px;color:var(--dim)}
.stats b{color:var(--fg);font-weight:600}
#board{position:relative;width:min(88vw,360px);height:min(88vw,360px);background:var(--tile);border-radius:14px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:6px;box-shadow:0 10px 40px #0008,inset 0 0 0 1px #ffffff0a}
.tile{display:flex;align-items:center;justify-content:center;background:var(--tile2);border-radius:9px;font-size:clamp(18px,6vw,30px);font-weight:600;cursor:pointer;user-select:none;transition:transform .08s ease,background .12s;box-shadow:inset 0 0 0 1px #ffffff10,0 2px 6px #0006}
.tile:active{transform:scale(.94)}
.tile.blank{background:transparent;box-shadow:none;cursor:default;pointer-events:none}
.tile.hint{background:#2f3a52}
.tile.win{background:var(--accent);color:#0b0e14}
button{background:var(--tile2);color:var(--fg);border:1px solid #313a4f;border-radius:9px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer}
button:hover{background:#333e56}
#msg{height:20px;font-size:14px;color:var(--accent);font-weight:600}
</style></head><body>
<header>
<h1>fifteen</h1>
<div class=sub>slide the tiles into order. click or tap a tile next to the gap.</div>
</header>
<div class=stats><span>moves <b id=mv>0</b></span><span>time <b id=tm>0:00</b></span></div>
<div id=board></div>
<div id=msg></div>
<button id=new>new game</button>
<script>
const N=4, board=document.getElementById('board');
let tiles=[], blank=15, moves=0, t0=0, timer=null, started=false, won=false;

function solvedArr(){const a=[];for(let i=1;i<N*N;i++)a.push(i);a.push(0);return a;}

function render(){
  board.innerHTML='';
  for(let i=0;i<N*N;i++){
    const v=tiles[i];
    const d=document.createElement('div');
    d.className='tile'+(v===0?' blank':'');
    if(won && v!==0) d.classList.add('win');
    d.textContent=v===0?'':v;
    d.dataset.i=i;
    d.addEventListener('click',()=>click(i));
    board.appendChild(d);
  }
}

function neighbors(i){const r=Math.floor(i/N),c=i%N,out=[];
  if(r>0)out.push(i-N); if(r<N-1)out.push(i+N);
  if(c>0)out.push(i-1); if(c<N-1)out.push(i+1); return out;}

function shuffle(){
  // start solved, do random legal moves -> always solvable
  tiles=solvedArr(); blank=15; won=false;
  let last=-1;
  for(let k=0;k<400;k++){
    const nb=neighbors(blank).filter(x=>x!==last);
    const pick=nb[Math.floor(Math.random()*nb.length)];
    tiles[blank]=tiles[pick]; tiles[pick]=0; last=blank; blank=pick;
  }
  if(isSolved()) shuffle(); // paranoid
}

function isSolved(){const s=solvedArr();for(let i=0;i<N*N;i++)if(tiles[i]!==s[i])return false;return true;}

function click(i){
  if(won) return;
  if(!neighbors(blank).includes(i)) return;
  if(!started){started=true;t0=Date.now();timer=setInterval(tick,250);}
  tiles[blank]=tiles[i]; tiles[i]=0; blank=i; moves++;
  document.getElementById('mv').textContent=moves;
  if(isSolved()) win();
  render();
}

function win(){won=true;clearInterval(timer);
  document.getElementById('msg').textContent='solved in '+moves+' moves ✌️';render();}

function tick(){const s=Math.floor((Date.now()-t0)/1000);
  document.getElementById('tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

function newGame(){
  clearInterval(timer);started=false;won=false;moves=0;
  document.getElementById('mv').textContent='0';document.getElementById('tm').textContent='0:00';
  document.getElementById('msg').textContent='';
  shuffle();render();
}

document.getElementById('new').addEventListener('click',newGame);
newGame();
</script></body></html>
