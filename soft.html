<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>slime</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden;font-family:ui-monospace,Menlo,monospace;color:#cfd3dc;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:14px;top:12px;font-size:12px;line-height:1.6;opacity:.65;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud b{color:#ffb020;font-weight:600}
  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;opacity:.4;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>slime</b> — soft body playground<br>drag to draw a slime · grab &amp; fling it · eat dots to grow · R clear<br>eaten: <b id="sc">0</b></div>
<div id="hint">drag empty space to draw · grab a slime to throw · tap inside to poke · poke a big one hard to split it · push two together to fuse</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
resize();addEventListener('resize',resize);
const G=0.55, DAMP=0.992, ITER=3;
let blobs=[];
function addPoint(b,x,y){b.pts.push({x,y,px:x,py:y});}
function addSpring(b,ia,ib,stiff){const a=b.pts[ia],c=b.pts[ib];const rest=Math.hypot(a.x-c.x,a.y-c.y);b.springs.push({a:ia,b:ib,rest,stiff:stiff||1});}
function signedArea(pts,n){let a=0;for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];a+=p.x*q.y-q.x*p.y;}return a/2;}
function polyArea(pts,n){return Math.abs(signedArea(pts,n));}
function makeBlob(outline){
  const b={pts:[],springs:[]};
  let cxm=0,cym=0;for(const p of outline){cxm+=p.x;cym+=p.y;}cxm/=outline.length;cym/=outline.length;
  b.restArea=polyArea(outline,outline.length);
  b.restSign=signedArea(outline,outline.length)>=0?1:-1;
  for(const p of outline)addPoint(b,p.x,p.y);
  const ci=b.pts.length; addPoint(b,cxm,cym);
  const n=outline.length;
  for(let i=0;i<n;i++){
    addSpring(b,i,(i+1)%n,1);
    addSpring(b,i,(i+2)%n,0.6);
    addSpring(b,i,ci,0.5);
  }
  return b;
}
// slice a blob in two along the line through p perpendicular to the centroid->p direction.
// returns [blobA,blobB] or null if the cut doesn't cross the outline cleanly.
function splitBlob(b,p){
  const n=b.pts.length-1;
  const c=b.pts[n];
  let nx=p.x-c.x,ny=p.y-c.y;let nl=Math.hypot(nx,ny)||1;nx/=nl;ny/=nl;
  const sd=[];for(let i=0;i<n;i++)sd.push((b.pts[i].x-p.x)*nx+(b.pts[i].y-p.y)*ny);
  const cross=[];
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    if((sd[i]<0)!==(sd[j]<0)){
      const t=sd[i]/(sd[i]-sd[j]);
      const a=b.pts[i],c2=b.pts[j];
      cross.push({i,t,x:a.x+(c2.x-a.x)*t,y:a.y+(c2.y-a.y)*t});
    }
  }
  if(cross.length!==2)return null;
  let [c1,c2]=cross;
  if(c1.i>c2.i){const tmp=c1;c1=c2;c2=tmp;}
  const arcA=[{x:c1.x,y:c1.y}];
  for(let i=(c1.i+1)%n;i!==(c2.i+1)%n;i=(i+1)%n){arcA.push({x:b.pts[i].x,y:b.pts[i].y});if(arcA.length>n+2)break;}
  arcA.push({x:c2.x,y:c2.y});
  const arcB=[{x:c2.x,y:c2.y}];
  for(let i=(c2.i+1)%n;i!==(c1.i+1)%n;i=(i+1)%n){arcB.push({x:b.pts[i].x,y:b.pts[i].y});if(arcB.length>n+2)break;}
  arcB.push({x:c1.x,y:c1.y});
  if(arcA.length<4||arcB.length<4)return null;
  const A=makeBlob(arcA),B=makeBlob(arcB);
  for(const q of A.pts){q.px-=nx*3;q.py-=ny*3;}
  for(const q of B.pts){q.px+=nx*3;q.py+=ny*3;}
  return [A,B];
}
function mergeBlobs(a,b){
  const na=a.pts.length-1, nb=b.pts.length-1;
  const keep=[];
  for(let i=0;i<na;i++){const p=a.pts[i];if(!inPoly(b.pts,nb,p.x,p.y))keep.push(p);}
  for(let i=0;i<nb;i++){const p=b.pts[i];if(!inPoly(a.pts,na,p.x,p.y))keep.push(p);}
  if(keep.length<6)return null;
  let mx=0,my=0;for(const p of keep){mx+=p.x;my+=p.y;}mx/=keep.length;my/=keep.length;
  keep.sort((p,q)=>Math.atan2(p.y-my,p.x-mx)-Math.atan2(q.y-my,q.x-mx));
  return makeBlob(keep);
}
function tryMerge(){
  for(let i=0;i<blobs.length;i++)for(let j=i+1;j<blobs.length;j++){
    const A=blobs[i],B=blobs[j];
    const ca=A.pts[A.pts.length-1],cb=B.pts[B.pts.length-1];
    const rA=Math.sqrt(A.restArea/Math.PI), rB=Math.sqrt(B.restArea/Math.PI);
    const d=Math.hypot(ca.x-cb.x,ca.y-cb.y);
    if(d<(rA+rB)*0.62){
      const m=mergeBlobs(A,B);
      if(m){blobs.splice(j,1);blobs.splice(i,1,m);return true;}
    }
  }
  return false;
}
function step(){
  for(const b of blobs){
    for(const p of b.pts){
      const vx=(p.x-p.px)*DAMP, vy=(p.y-p.py)*DAMP;
      p.px=p.x; p.py=p.y;
      p.x+=vx; p.y+=vy+G;
    }
    for(let k=0;k<ITER;k++){
      for(const s of b.springs){
        const a=b.pts[s.a],c=b.pts[s.b];
        let dx=c.x-a.x,dy=c.y-a.y;let d=Math.hypot(dx,dy)||0.0001;
        const diff=(d-s.rest)/d*0.5*s.stiff;
        const ox=dx*diff,oy=dy*diff;
        a.x+=ox;a.y+=oy;c.x-=ox;c.y-=oy;
      }
      // unfold: signed area vs rest sign is the real fold signal. a tangent-dot
      // check misses slow creases and fires on sharp-but-valid bends, so we
      // trust winding instead (thanks lucy).
      {
        const n=b.pts.length-1;
        const sa=signedArea(b.pts,n);
        const sign=(sa>=0?1:-1);
        const folded = b.restSign && sign!==b.restSign;
        if(folded){
          // push every point outward from the centroid to un-invert the winding
          const cxb=b.pts[b.pts.length-1]||b.pts[0];
          for(let i=0;i<n;i++){
            const p=b.pts[i];
            let dx=p.x-cxb.x,dy=p.y-cxb.y;let dl=Math.hypot(dx,dy)||0.0001;
            p.x+=dx/dl*1.2; p.y+=dy/dl*1.2;
          }
        }
      }
      if(b.restArea){
        const n=b.pts.length-1;
        const sa=signedArea(b.pts,n);
        const sign=(sa>=0?1:-1);
        // freeze pressure while winding is flipped so it can't keep pushing
        // the wrong way and launch the slime
        if(b.restSign && sign===b.restSign){
          const area=Math.abs(sa);
          const pdiff=(b.restArea-area)/b.restArea;
          const force=Math.max(-0.6,Math.min(0.8,pdiff))*0.9;
          const cxb=b.pts[b.pts.length-1]||b.pts[0];
          for(let i=0;i<n;i++){
            const p=b.pts[i],pr=b.pts[(i-1+n)%n],nx2=b.pts[(i+1)%n];
            let tx=nx2.x-pr.x,ty=nx2.y-pr.y;let tl=Math.hypot(tx,ty)||0.0001;
            let nx=ty/tl,ny=-tx/tl;
            if((p.x-cxb.x)*nx+(p.y-cxb.y)*ny<0){nx=-nx;ny=-ny;}
            p.x+=nx*force;p.y+=ny*force;
          }
        }
      }
      for(const p of b.pts){
        if(p.y>H-2){p.y=H-2; p.px+=(p.x-p.px)*0.5;}
        if(p.y<2){p.y=2;}
        if(p.x<2){p.x=2;}
        if(p.x>W-2){p.x=W-2;}
      }
    }
  }
  tryMerge();
  eatFood();
  // blob-vs-blob: push points of different blobs apart so jellies squish instead of overlapping
  const MD=17, MD2=MD*MD;
  for(let i=0;i<blobs.length;i++){
    const A=blobs[i].pts;
    for(let j=i+1;j<blobs.length;j++){
      const B=blobs[j].pts;
      for(const a of A)for(const c of B){
        let dx=c.x-a.x, dy=c.y-a.y; let d2=dx*dx+dy*dy;
        if(d2>0 && d2<MD2){
          const d=Math.sqrt(d2);
          const push=(MD-d)/d*0.5;
          const ox=dx*push, oy=dy*push;
          a.x-=ox; a.y-=oy; c.x+=ox; c.y+=oy;
        }
      }
    }
  }
}
function draw(){
  cx.clearRect(0,0,W,H);
  const tt=performance.now()/400;
  for(const f of foods){
    const pr=1+Math.sin(tt+f.ph)*0.16;
    cx.beginPath();cx.arc(f.x,f.y,f.r*pr,0,7);
    cx.fillStyle='rgba(255,205,90,0.9)';cx.fill();
    cx.beginPath();cx.arc(f.x-1.5,f.y-1.5,f.r*0.35,0,7);
    cx.fillStyle='rgba(255,245,200,0.8)';cx.fill();
  }
  for(const b of blobs){
    const ci=b.pts.length-1;
    const n=b.pts.length-1;
    cx.beginPath();
    cx.moveTo(b.pts[0].x,b.pts[0].y);
    for(let i=1;i<n;i++)cx.lineTo(b.pts[i].x,b.pts[i].y);
    cx.closePath();
    // slime body: translucent green with a soft inner glow
    const gx=cx.createRadialGradient(b.pts[ci].x,b.pts[ci].y-10,4,b.pts[ci].x,b.pts[ci].y,90);
    gx.addColorStop(0,'rgba(120,255,170,0.42)');
    gx.addColorStop(0.6,'rgba(60,210,130,0.22)');
    gx.addColorStop(1,'rgba(30,150,95,0.10)');
    cx.fillStyle=gx;cx.fill();
    cx.beginPath();
    cx.moveTo(b.pts[0].x,b.pts[0].y);
    for(let i=1;i<n;i++)cx.lineTo(b.pts[i].x,b.pts[i].y);
    cx.closePath();
    cx.lineWidth=2.2;cx.strokeStyle='rgba(130,255,180,0.85)';cx.stroke();
    // glossy highlight blob near the top
    cx.beginPath();cx.ellipse(b.pts[ci].x-12,b.pts[ci].y-14,10,6,-0.5,0,7);
    cx.fillStyle='rgba(220,255,235,0.35)';cx.fill();
  }
}
let foods=[];let score=0;
function spawnFood(){foods.push({x:30+Math.random()*(W-60),y:30+Math.random()*(H-60),r:5,ph:Math.random()*6.28});}
function eatFood(){
  for(let fi=foods.length-1;fi>=0;fi--){
    const f=foods[fi];
    for(const b of blobs){
      const n=b.pts.length-1;
      if(inPoly(b.pts,n,f.x,f.y)){
        b.restArea+=520;score++;
        foods.splice(fi,1);spawnFood();break;
      }
    }
  }
}
let mode=null;
let drawing=null;
let grabbed=null;
function pos(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
function inPoly(pts,n,x,y){
  let inside=false;
  for(let i=0,j=n-1;i<n;j=i++){
    const xi=pts[i].x,yi=pts[i].y,xj=pts[j].x,yj=pts[j].y;
    if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}
function down(e){
  const p=pos(e);
  let best=null,bd=24*24;
  for(const b of blobs)for(let i=0;i<b.pts.length;i++){
    const q=b.pts[i];const d=(q.x-p.x)**2+(q.y-p.y)**2;
    if(d<bd){bd=d;best={b,i};}
  }
  if(best){mode='grab';grabbed=best;return;}
  // poke: click inside a blob pushes it away from the click (a squishy pop)
  // if the blob is big enough, a hard poke splits it into two along a cut through the click
  for(let bi=0;bi<blobs.length;bi++){
    const b=blobs[bi];
    const n=b.pts.length-1;
    if(inPoly(b.pts,n,p.x,p.y)){
      for(let i=0;i<n;i++){
        const q=b.pts[i];
        let dx=q.x-p.x,dy=q.y-p.y;const d=Math.hypot(dx,dy)||1;
        const k=Math.min(1,40/d)*10;
        q.px-=dx/d*k; q.py-=dy/d*k;
      }
      if(b.restArea>5200 && blobs.length<7){
        const two=splitBlob(b,p);
        if(two){blobs.splice(bi,1,...two);}
      }
      return;
    }
  }
  mode='draw';drawing={outline:[{x:p.x,y:p.y}]};
}
function move(e){
  const p=pos(e);
  if(mode==='grab'&&grabbed){
    const q=grabbed.b.pts[grabbed.i];
    q.px=q.x;q.py=q.y;q.x=p.x;q.y=p.y;
    e.preventDefault&&e.preventDefault();
  } else if(mode==='draw'&&drawing){
    const last=drawing.outline[drawing.outline.length-1];
    if(Math.hypot(p.x-last.x,p.y-last.y)>14)drawing.outline.push({x:p.x,y:p.y});
  }
}
function up(){
  if(mode==='draw'&&drawing){
    if(drawing.outline.length>=4){
      const o=drawing.outline;
      const a=o[0],z=o[o.length-1];
      if(Math.hypot(a.x-z.x,a.y-z.y)>30)o.push({x:a.x,y:a.y});
      blobs.push(makeBlob(o));
      if(blobs.length>6)blobs.shift();
    }
    drawing=null;
  }
  mode=null;grabbed=null;
}
cv.addEventListener('mousedown',down);
addEventListener('mousemove',move,{passive:false});
addEventListener('mouseup',up);
cv.addEventListener('touchstart',e=>{e.preventDefault();down(e);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();move(e);},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();up();},{passive:false});
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'){blobs=[];}});
function loop(){
  step();
  draw();
  document.getElementById('sc').textContent=score;
  if(drawing){
    const o=drawing.outline;cx.beginPath();cx.moveTo(o[0].x,o[0].y);for(let i=1;i<o.length;i++)cx.lineTo(o[i].x,o[i].y);cx.strokeStyle='rgba(255,176,32,0.5)';cx.lineWidth=2;cx.stroke();
  }
  requestAnimationFrame(loop);
}
(function seed(){
  const o=[];const cx0=W/2,cy0=140,r=70;
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;o.push({x:cx0+Math.cos(a)*r,y:cy0+Math.sin(a)*r});}
  blobs.push(makeBlob(o));
  for(let i=0;i<9;i++)spawnFood();
})();
loop();
</script>
</body>
</html>
